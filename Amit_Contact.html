<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ask Ryan — Amit</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#0f1a2e; --navy2:#16233b; --gold:#c9a84c; --gold-light:#e8c56a;
    --cream:#f0e8d0; --muted:#a9b3c4;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; font-family:Georgia,serif;
    background:linear-gradient(160deg,var(--navy),#0a1220);
    color:var(--cream); padding:40px 20px; display:flex; justify-content:center;
  }
  .wrap{max-width:560px; width:100%;}
  h1{color:var(--gold-light); font-size:1.6em; margin:0 0 6px; letter-spacing:.02em;}
  .sub{color:var(--muted); font-size:.95em; line-height:1.6; margin:0 0 28px;}
  .card{
    background:var(--navy2); border:1px solid rgba(201,168,76,.35);
    border-radius:10px; padding:24px 26px; margin-bottom:22px;
  }
  label{display:block; font-size:.85em; color:var(--gold-light); margin:14px 0 6px;}
  label:first-child{margin-top:0}
  input[type=text], textarea{
    width:100%; background:rgba(255,255,255,.05); border:1px solid rgba(201,168,76,.3);
    border-radius:6px; color:var(--cream); padding:10px 12px; font-family:Georgia,serif;
    font-size:.95em;
  }
  textarea{min-height:110px; resize:vertical;}
  input:focus, textarea:focus{outline:none; border-color:var(--gold);}
  button{
    font-family:Georgia,serif; font-size:.95em; padding:11px 22px; border-radius:6px;
    cursor:pointer; border:1px solid var(--gold); background:var(--gold); color:#1a1206;
    font-weight:700; margin-top:16px;
  }
  button.secondary{background:transparent; color:var(--gold-light);}
  button:disabled{opacity:.5; cursor:default;}
  .status{font-size:.85em; color:var(--gold-light); margin-top:12px; min-height:1.2em;}
  .thread{border-top:1px solid rgba(201,168,76,.25); margin-top:10px; padding-top:10px;}
  .msg{margin-bottom:18px; padding-bottom:18px; border-bottom:1px solid rgba(255,255,255,.08);}
  .msg:last-child{border-bottom:none;}
  .msg .you{color:var(--muted); font-size:.85em; margin-bottom:4px;}
  .msg .text{white-space:pre-wrap; line-height:1.6;}
  .msg .reply-label{color:var(--gold-light); font-size:.85em; margin:10px 0 4px;}
  .msg .reply{background:rgba(201,168,76,.08); border-left:3px solid var(--gold); padding:10px 12px; border-radius:0 6px 6px 0; white-space:pre-wrap; line-height:1.6;}
  .pending{color:var(--muted); font-style:italic; font-size:.9em;}
  .code-note{font-size:.75em; color:var(--muted); margin-top:8px; word-break:break-all;}
  a{color:var(--gold-light);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Ask Ryan</h1>
  <p class="sub">This goes directly to Ryan — the developer behind Amit. There's no account needed. Write your question, submit it, and this same page will remember you (via this browser) so you can come back later and see the reply.</p>

  <div class="card">
    <label for="f-name">Your name (optional)</label>
    <input type="text" id="f-name" placeholder="Optional">
    <label for="f-contact">Email or phone (optional — only if you want Ryan to be able to reach you another way)</label>
    <input type="text" id="f-contact" placeholder="Optional">
    <label for="f-message">Your question or message</label>
    <textarea id="f-message" placeholder="What's on your mind?"></textarea>
    <button id="send-btn" onclick="sendMessage()">Send to Ryan</button>
    <div class="status" id="send-status"></div>
  </div>

  <div class="card" id="thread-card" style="display:none;">
    <div style="color:var(--gold-light); font-size:.95em; font-weight:bold;">Your messages on this browser</div>
    <div class="thread" id="thread"></div>
  </div>

  <p class="code-note" id="code-note"></p>
</div>

<script>
const SUPABASE_URL = 'https://hleqtjqojksurvkyqixt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_0pptfPselXI0V9JmnhXgbA_dAGurCiF';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const CODE_KEY = 'amit_inbox_visitor_code';

function getVisitorCode(){
  let code = localStorage.getItem(CODE_KEY);
  if(!code){
    code = (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+'-'+Math.random().toString(36).slice(2)));
    localStorage.setItem(CODE_KEY, code);
  }
  return code;
}

async function sendMessage(){
  const name = document.getElementById('f-name').value.trim();
  const contact = document.getElementById('f-contact').value.trim();
  const message = document.getElementById('f-message').value.trim();
  const statusEl = document.getElementById('send-status');
  const btn = document.getElementById('send-btn');
  if(!message){ statusEl.textContent = 'Write something first.'; return; }

  btn.disabled = true;
  statusEl.textContent = 'Sending...';

  const { error } = await db.from('amit_inbox').insert({
    visitor_code: getVisitorCode(),
    sender_name: name || null,
    sender_contact: contact || null,
    message: message,
    source: 'Amit_Contact.html',
    status: 'new'
  });

  btn.disabled = false;
  if(error){
    statusEl.textContent = 'Something went wrong sending that — try again in a moment.';
    return;
  }
  document.getElementById('f-message').value = '';
  statusEl.textContent = 'Sent. Ryan will see this and respond — check back here for the reply.';
  loadThread();
}

async function loadThread(){
  const code = getVisitorCode();
  const { data, error } = await db.from('amit_inbox')
    .select('*')
    .eq('visitor_code', code)
    .order('created_at', { ascending: true });

  if(error || !data || !data.length) return;

  const card = document.getElementById('thread-card');
  const thread = document.getElementById('thread');
  card.style.display = 'block';
  thread.innerHTML = '';

  data.forEach(row => {
    const div = document.createElement('div');
    div.className = 'msg';
    let html = `<div class="you">You wrote — ${new Date(row.created_at).toLocaleString()}</div>`;
    html += `<div class="text">${escapeHtml(row.message)}</div>`;
    if(row.status === 'replied' && row.reply_text){
      html += `<div class="reply-label">Amit has a response for you:</div>`;
      html += `<div class="reply">${escapeHtml(row.reply_text)}</div>`;
      if(!row.viewer_seen_reply){
        markSeen(row.id);
      }
    } else {
      html += `<div class="pending">Waiting for a reply...</div>`;
    }
    div.innerHTML = html;
    thread.appendChild(div);
  });

  document.getElementById('code-note').textContent =
    'Your check-back code (only matters if you switch browsers): ' + code;
}

async function markSeen(id){
  await db.from('amit_inbox').update({ viewer_seen_reply: true }).eq('id', id);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

loadThread();
</script>
</body>
</html>
