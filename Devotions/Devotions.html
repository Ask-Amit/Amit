Then each one stood before the priest with the basket still on his shoulder and said words from Deuteronomy twenty-six. A Syrian ready to perish was my father, and he went down into Egypt. Yahweh brought us forth with a mighty hand, and brought us into this place, a land that floweth with milk and honey. And now, behold, I have brought the firstfruits. The basket was set down beside the altar, and he bowed and went out. That declaration is Torah. The ox and the flute are the Mishnah's memory.

You may also hear that Ruth is read at Shavuot. That custom is much later than Yeshua, first hinted at around the eighth century. But you can see why it fits. Ruth is a woman from Moab, an outsider, who gleans at the edges of a field through the barley and wheat harvest, the very edges Leviticus said to leave. She is welcomed into Israel and becomes the great-grandmother of King David. A stranger brought in at harvest time. Keep that picture in your pocket.

Because now it is the morning of the fiftieth day, a few weeks after Yeshua was crucified at Passover, rose on the first day of the week, and then went up into heaven. He had told His disciples to wait in Jerusalem for the promise of the Father. So they are waiting. Acts two, verse one: And when the day of Pentecost was fully come, they were all with one accord in one place.

The city outside is full. Pilgrims from every nation. Baskets of wheat and fruit. Then suddenly there came a sound from heaven as of a rushing mighty wind, and it filled all the house where they were sitting. And there appeared unto them cloven tongues like as of fire, and it sat upon each of them. And they were all filled with the Holy Ghost, and began to speak with other tongues, as the Spirit gave them utterance.

The noise brings a crowd. Every visitor hears these Galileans speaking in his own language, telling the wonderful works of God. Some laugh and say they must be drunk. Then Peter stands up. It is only nine in the morning, he says. This is what the prophet Joel said would happen. And he quotes Joel two: And it shall come to pass afterward, that I will pour out my spirit upon all flesh. Your sons and your daughters shall prophesy. Then Peter tells them about Yeshua, crucified and raised, made both Lord and Christ. The words cut them to the heart. They ask, what shall we do? Repent, he says, and be baptized in the name of Yeshua the Messiah, and you will receive the gift of the Holy Spirit. Acts two, verse forty-one: Then they that gladly received his word were baptized, and the same day there were added unto them about three thousand souls.

Now set the two days side by side. What I am about to say is a parallel I am drawing. Luke does not spell it out in Acts. But look at it. At Sinai, Yahweh came down in fire, with a great sound, to a gathered people. At Pentecost, fire came down again, with a sound from heaven, on a gathered people. At Sinai, about three thousand fell on the day the Law met hard hearts. At Pentecost, about three thousand were brought to life on the day the Spirit came. The first harvest of that day was death. The second was life.

And here is where the prophets stop being a parallel and become a promise. Jeremiah thirty-one, verse thirty-three, says Yahweh will make a new covenant, and in it, I will put my law in their inward parts, and write it in their hearts. Notice what is new. Not a new law. The same Torah. What is new is where it is written. Not on stone this time, but on the heart. And Ezekiel thirty-six tells us how: A new heart also will I give you, and a new spirit will I put within you. And I will put my spirit within you, and cause you to walk in my statutes, and ye shall keep my judgments, and do them. The Spirit is not given to replace the Torah. He is given so that people can finally walk in it.

Paul says it in Second Corinthians three: written not with ink, but with the Spirit of the living God; not in tables of stone, but in fleshy tables of the heart. The story that broke at the foot of Sinai is answered here. Same God. Same Word. A new heart.

And the two loaves come back into view, along with Ruth. If the loaves picture a people, then on this day the first loaf of a new harvest was lifted up. Three thousand people, not perfect, still with leaven in them, yet accepted before Yahweh. A few chapters later the gospel reaches the nations too, strangers brought in from the edges of the field, like Ruth. That is a picture, not a claim the text makes. But the harvest language is Scripture's own. Paul calls the Spirit the firstfruits, and James calls believers a kind of firstfruits.

So how do you keep this feast now? Not as a burden, and not as a test of who belongs. Here is what the Torah actually asks. Count the days, starting from Firstfruits, and let the counting build anticipation, the way the disciples waited. On the fiftieth day, rest from ordinary work. It is a holy gathering. Rejoice before Yahweh, and do it with others, especially the ones who usually get left out: the widow, the fatherless, the stranger. Bring a freewill offering, as Yahweh has blessed you. And leave the corners of your field. Most of us do not have a field, but we all have edges. A bit of money, a meal, a bit of time, set aside on purpose for someone in need.

Then add what helps you remember. Bake two loaves of bread with yeast and share them. Read Exodus nineteen and Acts two in the same sitting, out loud if you can, and let the fire and the wind meet. Read Ruth if you want to. And ask Yahweh plainly to fill you with His Spirit again, so that what you know in your head is written on your heart.

One caution. The Torah commands the counting, the fiftieth day, the rest, the two loaves and the offerings, the joy that includes everyone, and the gleaning left for the poor. The link to Sinai comes from Jewish tradition, attested in Jubilees and the Talmud. The ox with golden horns and the flute come from the Mishnah. The reading of Ruth comes from much later custom. Even the exact day to start the count was argued over in Yeshua's time. Use all of this to understand the feast, not to bind anyone. The commands are the ones in Leviticus and Deuteronomy, and the rest is history worth knowing.

And now the part still ahead. Pentecost was the first great harvest of the Spirit, but Yeshua said the harvest is the end of the age, and the fields are still white. Peter said Joel's promise had begun that very day. But Joel's words reach further, to wonders in the heavens and the great day of Yahweh still to come. Ezekiel thirty-nine says Yahweh will pour out His Spirit on the house of Israel and never again hide His face. Zechariah twelve says He will pour out a spirit of grace on Jerusalem, and they shall look upon me whom they have pierced. My reading is that the outpouring that began at Pentecost is not finished yet. That is an inference, but it rests on the prophets' own words. And Revelation seven shows where the harvest ends: a great multitude, which no man could number, of all nations, and kindreds, and people, and tongues, standing before the throne and before the Lamb. Every language that heard the gospel on that first Pentecost, gathered in at last.

So keep this feast in three tenses, the way you keep the others. It was: a field of wheat, two leavened loaves, a mountain of fire, and a Law on stone that hard hearts could not keep. It is: Yeshua risen, the Spirit poured out, and the same Torah written on the heart of anyone who comes to Him. And it will be: the full harvest gathered, the Spirit on all flesh, and every nation standing before the Lamb. Stand in the middle one. Count the days with expectation. Leave the corners of your field. And ask Him to write His Word on you. This is not a relic. It is still Yahweh's appointed time, and it still points to Yeshua.`;

// LAYOUT IMPORTER — fetches TemplateViews.html at the moment a page needs

let _tvSource=null;
async function _fetchTemplateViewsSource(){
  if(_tvSource) return _tvSource;
  const res=await fetch('TemplateViews.html');
  if(!res.ok) throw new Error('HTTP '+res.status);
  _tvSource=await res.text();
  return _tvSource;
}

let _tvCssInjected=false;
function _injectTemplateViewsCss(src){
  if(_tvCssInjected) return;
  const m=src.match(/<style>([\s\S]*?)<\/style>/);
  if(!m) return;
  const tag=document.createElement('style');
  tag.id='tv-imported-css';
  tag.textContent=m[1];
  document.head.appendChild(tag);
  _tvCssInjected=true;
}

// Cuts the one block whose header comment reads "CANONICAL LAYOUT: <marker>"
// — from that comment line down to wherever the NEXT block's own header
// starts ("// CANONICAL LAYOUT: " or "// CANONICAL DESTINATION: "), or the
// "// ── DEMO" wiring at the file's bottom for the last block. Anchored to
// a real line start (must follow a newline) so a prose MENTION of another
// block's name elsewhere in a comment can't be mistaken for that block's
// actual header. Does not stop at every "// ══" divider — each block's own
// header comment is closed by one of those BEFORE its code even starts, so
// stopping there would cut every block down to nothing but its comment.
function _extractCanonicalBlock(src,markerText){
  const marker='// CANONICAL LAYOUT: '+markerText;
  const mi=src.indexOf('\n'+marker);
  if(mi===-1) return null;
  const lineStart=mi+1;
  let end=src.length;
  for(const stop of ['\n// CANONICAL LAYOUT: ','\n// CANONICAL DESTINATION: ','\n// ── DEMO']){
    const idx=src.indexOf(stop,lineStart+marker.length);
    if(idx!==-1 && idx<end) end=idx;
  }
  return src.slice(lineStart,end);
}

// Loads a layout's block (and any dependency blocks — e.g. Detail View's
// sample data lives inside Row View's own block) exactly once each, ever,
// per page load. A second page using the same layout just calls its
// already-loaded create function again with a new container id — the
// block itself (its `const`s) can only be executed once without a
// "already declared" error, same reason each script tag only runs once.
const _tvLoadedLayouts=new Set();
async function importLayoutFromTemplateViews(layoutKey){
  const manifest=LAYOUT_IMPORT_MANIFEST[layoutKey];
  if(!manifest) return {ok:false,reason:'"'+layoutKey+'" has no import entry yet'};
  let src;
  try{ src=await _fetchTemplateViewsSource(); }
  catch(e){ return {ok:false,reason:'could not fetch TemplateViews.html ('+e.message+') — this page must be served over http(s), not opened as a file:// path'}; }
  _injectTemplateViewsCss(src);
  for(const key of [...manifest.deps,layoutKey]){
    if(_tvLoadedLayouts.has(key)) continue;
    const block=_extractCanonicalBlock(src,LAYOUT_IMPORT_MANIFEST[key].marker);
    if(!block) return {ok:false,reason:'could not find the "'+key+'" block in TemplateViews.html'};
    const tag=document.createElement('script');
    tag.textContent=block;
    document.body.appendChild(tag);
    _tvLoadedLayouts.add(key);
  }
  return {ok:true};
}

// Fetches + runs the layout, then calls its create function against the
// already-rendered mount div. Fire-and-forget from renderAllPages() (the
// mount div itself renders synchronously and instantly; the real content
// pops in a moment later once the fetch resolves).
async function hydrateImportedLayout(detailNum,layoutKey){
  const mountId='tv-mount-'+detailNum;
  const status=await importLayoutFromTemplateViews(layoutKey);
  const mount=document.getElementById(mountId);
  if(!mount) return; // page was re-rendered away (e.g. a newer page replaced it) before the fetch finished
  if(!status.ok){
    mount.outerHTML=`<div class="detail-empty">Could not import "${layoutKey}" from TemplateViews.html — ${status.reason}.</div>`;
    return;
  }
  try{ new Function(LAYOUT_IMPORT_MANIFEST[layoutKey].call(mountId))(); }
  catch(e){ mount.innerHTML=`<div class="detail-empty">"${layoutKey}" loaded but hit an error running it: ${e.message}</div>`; }
}

// DEEP LINKING — added 2026-09-11, Ryan's direct instruction. Switching
// pages is pure in-memory JS (no real navigation), so the address bar never
// changed and there was no way to link straight to a specific page — every
// shared link landed on Introduction. openPage() now updates the URL hash
// (#page=N) on every switch, and a small listener below opens straight to
// whatever page a hash names when the page first loads (or if the hash
// changes, e.g. back/forward). history.replaceState, not pushState — tab
// switches inside one page shouldn't each add a new back-button stop.
function openPage(n){
  document.querySelectorAll('.page-nav').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.detail').forEach(p=>p.classList.remove('active'));
  const page=document.getElementById('page-'+n);
  const detail=document.getElementById('detail-'+n);
  if(page)page.classList.add('active');
  if(detail)detail.classList.add('active');
  if(history.replaceState) history.replaceState(null,'','#page='+n);
  updateHeaderContext(n);
}

// HEADER CONTEXT — added 2026-09-11, Ryan's direct instruction. Keeps the
// top-center header (pageContext/pageContextSub — previously unused
// template placeholder text) in sync with wherever someone actually is:
// the dash line becomes the page name, CONTEXT becomes the open tab's
// name (blank for a page with no tabs, like Introduction). Same data the
// content-area heading already uses (see showChTab), just mirrored up top.
// This is meant to work generically for every future page/tab, not just
// Feasts of the Lord — it reads the page name straight off the sidebar
// nav item and the tab name straight off whichever .ch-tab-btn is active,
// so a new page needs no extra wiring beyond following the same markup
// pattern (a .page-name in its nav item, real .ch-tab-btn buttons if it
// has tabs).
function updateHeaderContext(n){
  const pc=document.getElementById('pageContext');
  const pcs=document.getElementById('pageContextSub');
  if(!pc||!pcs)return;
  const pageName=document.querySelector('#page-'+n+' .page-name')?.textContent||'—';
  const activeTab=document.querySelector('#detail-'+n+' .ch-tab-btn.active')?.textContent;
  pc.textContent=pageName;
  pcs.textContent=activeTab||'';
}
function openPageFromHash(){
  // Reads both #page=N and the optional &tab=N — a link can name just a
  // page (opens to that page's own default/first tab) or a page and a
  // specific tab together. tab is 1-based, matching the tab's left-to-right
  // position, same numbering showChTab already uses everywhere else.
  const m=location.hash.match(/#page=([^&]+)(?:&tab=([^&]+))?/);
  if(!m)return;
  const pageId=isNaN(m[1])?m[1]:Number(m[1]);
  openPage(pageId);
  if(m[2]){
    // Look up by data-tabnum, NOT array position — real bug found testing
    // this: showChTab's own row-reordering (for wrapped multi-row tab
    // strips) physically moves buttons in the DOM the moment any tab gets
    // clicked, so a positional index (tabBtns[N-1]) can silently point at
    // the wrong button on a second pass. data-tabnum is stamped once at
    // creation and never changes, so this stays correct regardless of
    // however many times the row has been reordered.
    const tabBtn=document.querySelector('#ch-tab-nav-'+pageId+' [data-tabnum="'+m[2]+'"]');
    if(tabBtn) tabBtn.click();
  }
}

  document.getElementById('sidebarPages').classList.toggle('collapsed');
}

// ══════════════════════════════════════════════
// CANONICAL DESTINATION: POPUP — NOT a layout type. Generic overlay that
// hosts whatever layout instance (copied in from TemplateViews.html) is
// mounted inside it — content-agnostic, same as a Page or Tab slot.
// ══════════════════════════════════════════════
function popupOpen(innerHtml){
  let modal=document.getElementById('canonicalPopup');
  modal.innerHTML=`<div class="popup-card" id="canonicalPopupCard">
    <div class="popup-close-btn" onclick="popupClose()">CLOSE ✕</div>
    ${innerHtml}
  </div>`;
  modal.addEventListener('click',(e)=>{ if(e.target===modal) popupClose(); });
  modal.style.display='flex';
}
function popupClose(){
  const modal=document.getElementById('canonicalPopup');
  if(modal) modal.style.display='none';
}

// ══════════════════════════════════════════════
// LOGIN CONNECTION — the one live piece of this template. Supabase auth
// only: knows who is signed in. No data reads/writes beyond that.
// ══════════════════════════════════════════════
// Re-enabled 2026-10-02. The 2026-09-11 flicker was a real but unrelated
// CSS bug (an inline style beating the .ch-tab-content{display:none} rule
// on one tab's content div, see Sessions.md), fixed and confirmed that
// same night (commit 078fd23). This listener was disabled while that was
// being isolated and was never actually the cause — safe to run.
if(db){
  db.auth.onAuthStateChange(async (event,session)=>{
    currentUser=session?session.user:null;
    _updateSyncUI();
    if(typeof amitAppearanceSync==='function') setTimeout(()=>{amitAppearanceSync(db);},0);
    // re-pull this project's pages under the now-current owner, so a
    // signed-in user's real Supabase page list replaces whatever the
    // signed-out localStorage cache was showing
    customPages=await loadCustomPages();
    renderAllPages();
  });
}

// Drives the Sign In/Out + Sync rail item.
function _updateSyncUI(){
  const item=document.getElementById('rail-sync');if(!item)return;
  const icon=document.getElementById('rail-sync-icon');
  const name=document.getElementById('rail-sync-name');
  const sub=document.getElementById('rail-sync-sub');
  icon.classList.add('plug-badge');
  if(currentUser){
    icon.innerHTML='<span class="plug-icon-glyph">🔓</span>';name.textContent='Sign Out';sub.textContent='Synced';
    item.dataset.tip='Sign Out — Synced';item.title='Signed in · '+currentUser.email;
    item.classList.add('active');
    icon.classList.add('connected');icon.classList.remove('disconnected');
  } else {
    icon.innerHTML='<span class="plug-icon-glyph">🔒</span>';name.textContent='Sign In';sub.textContent='Not Synced';
    item.dataset.tip='Sign In — Not Synced';item.title='';
    item.classList.remove('active');
    icon.classList.add('disconnected');icon.classList.remove('connected');
  }
}

async function signOutAmit(){
  if(!db)return;
  await db.auth.signOut();
  currentUser=null;
  _updateSyncUI();
}

// Drives the Demo rail item and flips the toggle.
function toggleDemoMode(){
  demoMode=!demoMode;
  localStorage.setItem('amit_demo_mode',demoMode?'on':'off');
  _updateDemoUI();
  // A real project's own views should re-fetch their demo-scoped data
  // here too, the same way Calendar View/Day View do in TemplateViews.html
  // (cvActiveContainers.forEach(...), dayViewInstances.forEach(...)) —
  // add that wiring once real layouts using fetchDemoRows exist on this
  // page.
}

function _updateDemoUI(){
  const icon=document.getElementById('rail-demo-icon');
  const item=document.getElementById('rail-demo');
  const name=document.getElementById('rail-demo-name');
  const sub=document.getElementById('rail-demo-sub');
  if(!item)return;
  if(demoMode){
    icon.style.opacity='1';name.textContent='Demo On';sub.textContent="Amit's Data Shown";
    item.dataset.tip='Demo On';item.title="Showing Amit's demo data — click to use your own";
    item.classList.add('active');
  } else {
    icon.style.opacity='.4';name.textContent='Demo Off';sub.textContent='Your Data Only';
    item.dataset.tip='Demo Off';item.title='Demo mode off — showing your own data';
    item.classList.remove('active');
  }
}

async function sendMagicLink(email){
  if(!db)return'Database not available';
  const{error}=await db.auth.signInWithOtp({email});
  return error?error.message:null;
}

function openSyncModal(){
  if(currentUser){if(confirm('Signed in as '+currentUser.email+'\n\nSign out?'))signOutAmit();return;}
  const m=document.getElementById('syncModal');if(!m)return;
  m.style.display='flex';
}
function closeSyncModal(){const m=document.getElementById('syncModal');if(m)m.style.display='none';}
async function submitSyncEmail(){
  const email=document.getElementById('syncEmailInput').value.trim();if(!email)return;
  const btn=document.getElementById('syncSubmitBtn');btn.textContent='Sending…';btn.disabled=true;
  const err=await sendMagicLink(email);
  if(err){btn.textContent='Try again';btn.disabled=false;}
  else{
    document.querySelector('#syncModal .sync-modal-card').innerHTML=`
      <div style="color:rgba(var(--amit-accent-rgb,201,168,76),.9);font-family:var(--amit-font-heading,'Cinzel',serif);font-size:17px;margin-bottom:14px">Link sent</div>
      <div style="color:rgba(var(--amit-text-rgb,240,232,208),.7);font-size:13px;line-height:1.7">Check your email.<br>Click the link to sign in.</div>
      <div onclick="closeSyncModal()" style="margin-top:20px;font-size:10px;color:rgba(var(--amit-text-rgb,240,232,208),.35);cursor:pointer;letter-spacing:.08em">CLOSE</div>`;
  }
}

// ══════════════════════════════════════════════
// CLOCK / GREETING — visual only, no data behind it
// ══════════════════════════════════════════════
const AMIT_NAME_KEY='amit_user_name';
function getUserName(){return localStorage.getItem(AMIT_NAME_KEY)||'';}

function updateClock(){
  const d=new Date();
  const h=d.getHours();
  const sal=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const name=getUserName();
  const g=document.getElementById('greeting');if(g)g.textContent=name?sal+', '+name:sal;
  const dt=document.getElementById('datetime');
  if(dt)dt.textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
updateClock();
setInterval(updateClock,30000);
</script>
