<!-- ══════════════════════════════════════════════
     COPYING THIS TEMPLATE FOR A NEW PROJECT — read this first.

     WHAT THIS FILE IS — rebuilt 2026-08-06, Ryan's direct instruction.
     This is now the MINIMAL STARTER, not the reference catalog. It has
     Introduction (page 1) plus a few blank placeholder pages, and the
     global infrastructure every Amit app needs (right rail — Ask Amit,
     Sign In/Sync, Demo Mode — popup destination, login connection,
     tooltip mechanism, clock/greeting). It deliberately does NOT contain
     any of the canonical layouts (Tabbed/Row/Detail/Calendar/Day/Board/
     Gallery/Dashboard/Split/Form/Chart/Inbox/Drawer/Tree/Breadcrumb
     View) — those live permanently in Templates\TemplateViews.html, the
     never-modified reference library. This split exists so a real
     project's starting file is never bloated with layout code it isn't
     using — see Templates\CLAUDE.md's "TEMPLATE VIEWS vs TEMPLATE"
     section for the full reasoning.

     ADDING A LAYOUT TO A REAL PROJECT — go to Templates\TemplateViews.html,
     find the named "CANONICAL LAYOUT:" or "CANONICAL DESTINATION:" comment
     block, and copy it verbatim into this file — never reconstruct a
     layout's behavior from memory or approximation. Wire it into a real
     page/tab/popup the same way TemplateViews.html's own DEMO block shows
     it being done there. (J New, once built, automates this hand-off —
     see Templates\CLAUDE.md.)

     NAMING: the new project's folder name IS the app's name. If the
     folder is `Disco\`, the app is "Disco" — rename every literal
     occurrence of "Template" below to that exact name:
       - <title>Template</title>            (this line)
       - #pageTitle text, currently "Template" (~line 90)
       - the copied file itself: save as Disco.html, not template.html
       - askAmitLive('TEMPLATE_NOT_CONFIGURED') → askAmitLive('yourRealKey'),
         and write that key's real context into ../Amit_Ask_Live.js's
         PAGE_CONTEXTS — do not skip this, see the comment above that line
     Use the app's real display name consistently in all three spots —
     never a variant spelling, never re-derived per file.

     VERSION: #pageVersion always starts at v1.00 for a brand-new app.
     From here forward it is versioned independently (own +0.01/+1.00
     history, never synced to any other file's number) — see root
     CLAUDE.md's VERSIONING STANDARD.

     INTERCONNECTION: a new project is never standalone — it inherits the
     whole Amit system's conventions. Before/while building it out, the
     new project's own CLAUDE.md (copied from
     Templates\Amit_NewProject_Template.md per root CLAUDE.md's NEW
     PROJECT DIRECTIVE) must carry: the Session Location Check, the
     Pursuit Attribution clause (its own canonical program name for
     hub_entries), Shortcut Activation + Shortcut Awareness, and — if
     it has an "Ask Amit" button — the wiring described above. If the
     project is likely to grow a running state log, add its own
     Sessions.md too (see AmitBooks\Sessions.md for the pattern) so a
     future session can orient fast without re-deriving context.

     NOMENCLATURE: this template uses PAGE (a sidebar item — button + its
     fixed number), DETAIL (the content area a page opens into), LAYOUT
     (what kind of content lives inside a detail — Tabbed/Row/Detail/etc,
     all defined in TemplateViews.html), and DESTINATION (WHERE a layout
     mounts — a page, a tab slot, or a Popup; Popup is built into this
     starter since it's generic infrastructure, not a layout itself). Full
     definitions live in the NOMENCLATURE comment at the top of the
     <script> block below.

     PAGE ORDER: sidebar display position is controlled by the PAGE_ORDER
     array in the script below, kept separate from each page's fixed
     number — reorder pages by editing that array, never by renumbering
     pages/details themselves. See Templates\CLAUDE.md for why.
     ══════════════════════════════════════════════ -->

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:var(--amit-bg,#09141f);
  --card-head:var(--amit-surface,#0f2338);
  --border:var(--amit-border,rgba(var(--amit-accent-rgb,201,168,76),0.55));
  --gold:var(--amit-accent,#c9a84c);
  --gold2:var(--amit-accent-bright,#e8c56a);
  --text:var(--amit-text,#ffffff);
  --text2:var(--amit-text-soft,#f0e8d0);
  --muted:var(--amit-muted,rgba(var(--amit-text-rgb,240,232,208),0.78));
  --dim:var(--amit-dim,rgba(var(--amit-text-rgb,240,232,208),0.42));
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:var(--amit-font-body,'Crimson Pro',Georgia,serif);color:var(--text);display:flex;flex-direction:column}

body::before{
  content:'';
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:60vmin;height:60vmin;
  background:url('amit_icon.ico') center/contain no-repeat;
  opacity:var(--amit-watermark-opacity,.035);
  pointer-events:none;
  z-index:0;
}

/* ── HEADER ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 28px;
  background:var(--card-head);
  border-bottom:2px solid var(--border);
  flex-shrink:0;
  position:relative;
}
.page-title-wrap{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
}
.page-title{
  font-family:var(--amit-font-title,Georgia,serif);font-size:26px;font-weight:700;
  letter-spacing:.3px;text-transform:none;color:var(--gold2);
}
.page-version{
  font-family:var(--amit-font-mono,monospace);font-size:11px;letter-spacing:.05em;
  color:rgba(var(--amit-accent-rgb,201,168,76),.55);margin-top:2px;
}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo-link{display:flex;align-items:center;gap:14px;cursor:pointer;text-decoration:none}
.brand-sub{font-style:italic;color:rgba(var(--amit-text-rgb,240,232,208),.55);font-size:12px}
.hdr-right{text-align:right}
.greeting{font-family:var(--amit-font-heading,'Cinzel',serif);font-size:16px;color:var(--amit-text,#fff);font-weight:600}
.datetime{font-size:12px;color:var(--muted);margin-top:2px}
.help-btn{width:22px;height:22px;border-radius:50%;border:1px solid rgba(var(--amit-text-rgb,240,232,208),.3);color:rgba(var(--amit-text-rgb,240,232,208),.6);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:all .15s}
.help-btn:hover{border-color:var(--gold);color:var(--gold)}

/* ── HUB LAYOUT ── */
.hub{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  width:max-content;flex-shrink:0;
  background:var(--card-head);
  border-right:2px solid var(--border);
  display:flex;flex-direction:column;
  overflow-y:auto;padding:12px 10px;gap:0;
}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(var(--amit-accent-rgb,201,168,76),.3);border-radius:2px}
.sidebar{transition:width .18s ease}
.sidebar.collapsed{width:64px}
.sidebar.collapsed .page-nav{justify-content:flex-start;padding:4px}
.sidebar.collapsed .page-info{display:none}
.page-nav{
  display:flex;align-items:center;gap:10px;
  padding:6px 4px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;
  flex-shrink:0;
  transition:all .18s;user-select:none;
  position:relative;overflow:hidden;
}
.page-nav:hover{background:rgba(var(--amit-overlay-rgb,255,255,255),.07);border-color:rgba(var(--amit-accent-rgb,201,168,76),.3)}
.page-nav.active{background:rgba(var(--amit-accent-rgb,201,168,76),.16);border-color:var(--gold);box-shadow:0 0 0 1px rgba(var(--amit-accent-rgb,201,168,76),.25)}
.page-icon{width:32px;height:32px;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* Round plug-status badge for the Sign In/Out rail icon — green when
   connected, red when not. Added 2026-08-07, ported from AmitBooks/
   NEW.html as the new standard for this template's own Sign In/Out
   treatment (Ryan's direct instruction — same config becomes the base for
   every future project built from this file). Disconnected state pulses:
   red fills the circle from a point at the center out to the full edge,
   then collapses back to nothing, looping — a genuine warning cue, not a
   color-shift-in-place effect. */
.page-icon.plug-badge{border-radius:50%;transition:background .15s;position:relative;overflow:hidden}
.page-icon.plug-badge.connected{background:var(--amit-ok,#2e7d46)}
.page-icon.plug-badge.disconnected{background:var(--bg)}
.page-icon.plug-badge.disconnected::before{content:'';position:absolute;inset:0;border-radius:50%;background:var(--amit-danger,#c73333);animation:plugBadgeFill 1.6s ease-in-out infinite;transform-origin:center}
.plug-icon-glyph{position:relative;z-index:1}
@keyframes plugBadgeFill{0%,100%{transform:scale(0)}50%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.page-icon.plug-badge.disconnected::before{animation:none;transform:scale(1)}}
.page-info{flex:1;min-width:0}
.page-name{font-family:var(--amit-font-heading,'Cinzel',serif);font-size:11px;color:var(--amit-text,#fff);letter-spacing:.04em;font-weight:600}
.page-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── MAIN AREA ── */
.main-area{flex:1;overflow:hidden;position:relative;background:var(--bg)}
.detail{
  position:absolute;inset:0;overflow-y:auto;
  display:none;flex-direction:column;
  animation:pfade .18s ease;
}
.detail.active{display:flex}
@keyframes pfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.detail::-webkit-scrollbar{width:5px}
.detail::-webkit-scrollbar-thumb{background:rgba(var(--amit-accent-rgb,201,168,76),.3);border-radius:3px}

/* ── DETAIL HEADER ── */
.detail-head{
  display:flex;align-items:center;gap:16px;
  padding:14px 24px;
  background:var(--card-head);
  border-bottom:2px solid var(--border);
  flex-shrink:0;
}
.detail-heading{font-family:var(--amit-font-heading,'Cinzel',serif);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.detail-empty{flex:1;display:flex;align-items:center;justify-content:center;color:rgba(var(--amit-text-rgb,240,232,208),.25);font-family:var(--amit-font-heading,'Cinzel',serif);font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* ── POPUP — canonical DESTINATION, not a layout type. Generic overlay
   that can host any layout instance copied in from TemplateViews.html —
   content-agnostic, same separation as a Page or a Tab slot not caring
   what's mounted inside them. Built into this starter (not TemplateViews-
   only) since it's global infrastructure, not a layout. ── */
.popup-overlay{display:none;position:fixed;inset:0;background:var(--amit-overlay,rgba(0,0,0,.6));z-index:9998;align-items:center;justify-content:center}
.popup-card{background:var(--card-head);border:1px solid rgba(var(--amit-accent-rgb,201,168,76),.5);border-radius:var(--amit-radius,12px);padding:26px 28px;max-width:640px;width:92%;max-height:82vh;overflow-y:auto;box-shadow:0 10px 50px rgba(0,0,0,.55);position:relative}
.popup-close-btn{position:absolute;top:14px;right:16px;color:rgba(var(--amit-text-rgb,240,232,208),.5);cursor:pointer;font-family:var(--amit-font-heading,'Cinzel',serif);font-size:10px;letter-spacing:.08em}
.popup-close-btn:hover{color:var(--gold2)}

/* ── RIGHT RAIL — global, present on every page, same on every project.
   Double-click to expand/collapse (mirror of the left sidebar, inverted
   default: starts collapsed). Ask Amit / Sign In-Sync / Demo Mode all
   live here permanently — see Templates\CLAUDE.md for the full history
   of why each piece looks the way it does. ── */
.right-rail{
  width:64px;flex-shrink:0;
  background:var(--card-head);
  border-left:2px solid var(--border);
  display:flex;flex-direction:column;
  overflow-y:auto;padding:12px 10px;gap:0;
  transition:width .18s ease;
}
.right-rail::-webkit-scrollbar{width:3px}
.right-rail::-webkit-scrollbar-thumb{background:rgba(var(--amit-accent-rgb,201,168,76),.3);border-radius:2px}
.right-rail.expanded{width:max-content}
.right-rail .page-nav{padding:4px;flex-direction:row-reverse}
.right-rail.expanded .page-nav{padding:6px 4px;justify-content:flex-start}
.right-rail .page-info{display:none}
.right-rail.expanded .page-info{display:block}
/* RIGHT RAIL ON/OFF STATE — added 2026-08-22, Ryan's direct instruction.
   The gold .page-nav.active look (shared with the left sidebar's "this is
   the open page" state) was too subtle to tell an ON toggle (Sign In,
   Demo Mode) apart from an OFF one at a glance. Right-rail items are
   toggles, not navigation, so they get their own distinct green
   on-state — overrides the gold .page-nav.active rule for this rail only.
   PERMANENT — carry this into every project copied from this template. */
.right-rail .page-nav.active{background:rgba(var(--amit-on-rgb,46,160,67),.20);border-color:rgba(var(--amit-on-rgb,46,160,67),.65);box-shadow:0 0 0 1px rgba(var(--amit-on-rgb,46,160,67),.4)}
.right-rail .page-nav.active .page-icon{background:rgba(var(--amit-on-rgb,46,160,67),.35);border-radius:50%;box-shadow:0 0 0 2px rgba(var(--amit-on-rgb,46,160,67),.55)}
.right-rail .page-nav.active .page-name{color:#6fe38f}

/* ── PAGE HOVER TOOLTIP — JS-positioned (fixed), not pure CSS, because
   .sidebar/.right-rail scroll (overflow-y:auto) — per the CSS spec, that
   silently forces the other axis's overflow to 'auto' too, which would
   clip a CSS-positioned tooltip trying to extend past the container's
   edge. A single fixed element sidesteps that entirely. ── */
.page-hover-tip{
  position:fixed;z-index:9999;
  background:var(--amit-tooltip-bg,#1a3352);border:1px solid rgba(var(--amit-accent-rgb,201,168,76),.45);
  color:var(--gold2);font-family:var(--amit-font-heading,'Cinzel',serif);font-size:10px;letter-spacing:.05em;
  line-height:1.5;
  padding:6px 10px;border-radius:6px;white-space:normal;word-wrap:break-word;max-width:260px;
  opacity:0;pointer-events:none;
  transition:opacity .12s;box-shadow:0 4px 16px rgba(0,0,0,.4);
}
.page-hover-tip.show{opacity:1}

/* CANONICAL LAYOUT: TABBED VIEW — copied verbatim from TemplateViews.html,
   added 2026-08-06 so Add Page can instantiate a real Tabbed View directly,
   not hand a copy-instruction to an outside AI session. */
.ch-tab-nav{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px;row-gap:0;margin:0 24px;padding:0;background:var(--bg);flex-shrink:0}
.ch-tab-btn{padding:9px 22px;margin-top:10px;border:1px solid rgba(var(--amit-accent-rgb,201,168,76),.25);background:rgba(var(--amit-overlay-rgb,255,255,255),.03);color:var(--muted);border-radius:var(--amit-tab-radius,10px) var(--amit-tab-radius,10px) 0 0;cursor:pointer;font-size:13px;font-family:inherit}
.ch-tab-btn.active{padding:12px 26px;margin-top:-2px;margin-bottom:-3px;border-bottom:none;background:var(--card-head);color:var(--gold2);font-weight:600;font-size:14px;position:relative;z-index:2}
.ch-tab-main{flex:1;min-height:0;overflow-y:auto;padding:28px 32px;margin:0 24px 24px;background:var(--card-head);border:1px solid rgba(var(--amit-accent-rgb,201,168,76),.25);border-radius:0 var(--amit-radius,12px) var(--amit-radius,12px) var(--amit-radius,12px)}
.ch-tab-content{display:none}
.ch-tab-content.active{display:block}
/* Real bug, found 2026-09-11 after a whole session of mysterious
   cross-tab bleed reports: the Trumpets tab div was given an INLINE
   style="display:flex" unconditionally. Inline styles always beat a
   class-based rule regardless of specificity, so that div stayed
   visible over top of every other tab no matter which one was
   actually .active. Fixed by moving the flex layout into a class that
   only wins the cascade when .active is ALSO present (3 classes beats
   the 2-class .ch-tab-content.active rule; with .active absent, the
   base 1-class display:none rule still applies normally). */
.ch-tab-content.is-reader.active{display:flex;flex-direction:column;height:100%}
</style>
</head>
<body>

<header>
  <a class="brand brand-logo-link" href="https://ask-amit.github.io/Amit/Hub/amit-hub.html" title="Back to the Amit Hub">
    <img src="amit_icon.ico" alt="Amit" style="height:32px;width:32px">
    <div>
      <div class="page-title" id="pageTitle" style="font-size:19px">Devotions</div>
      <div class="page-version" id="pageVersion">v1.24</div>
    </div>
  </a>
  <div class="page-title-wrap">
    <div class="page-title" id="pageContext">—</div>

<div class="hub">

  <!-- ── SIDEBAR — Introduction + blank placeholders, built in <script> ── -->

</div>

<!-- Single global page-hover tooltip, JS-positioned — see initPageTooltips -->

<!-- Generic Popup destination — content filled in by whichever layout uses it -->
<div id="canonicalPopup" class="popup-overlay"></div>

<!-- SYNC / SIGN-IN MODAL -->
<div id="syncModal" style="display:none;position:fixed;inset:0;background:var(--amit-overlay,rgba(0,0,0,.55));z-index:9999;align-items:center;justify-content:center">
  <div class="sync-modal-card" style="background:var(--amit-surface-raised,#1a3352);border:1px solid rgba(var(--amit-accent-rgb,201,168,76),.45);border-radius:14px;padding:36px 40px;max-width:340px;width:90%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.5)">
    <div style="color:rgba(var(--amit-accent-rgb,201,168,76),.9);font-family:var(--amit-font-heading,'Cinzel',serif);font-size:16px;letter-spacing:.06em;margin-bottom:6px">Sync Across Devices</div>
    <div style="color:rgba(var(--amit-text-rgb,240,232,208),.5);font-size:11px;line-height:1.7;margin-bottom:22px">Enter your email. A sign-in link will be sent.<br>No password needed.</div>
    <input id="syncEmailInput" type="email" placeholder="your@email.com"
      style="width:100%;background:var(--amit-input-bg,rgba(var(--amit-overlay-rgb,255,255,255),.07));border:1px solid var(--amit-input-border,rgba(var(--amit-accent-rgb,201,168,76),.3));border-radius:var(--amit-input-radius,7px);padding:11px 13px;color:var(--amit-input-text,#fff);font-size:13px;outline:none;margin-bottom:12px;font-family:inherit"
      onkeydown="if(event.key==='Enter')submitSyncEmail()"/>
    <button id="syncSubmitBtn" onclick="submitSyncEmail()"
      style="width:100%;background:var(--amit-btn-bg,rgba(var(--amit-accent-rgb,201,168,76),.12));border:1px solid var(--amit-btn-border,rgba(var(--amit-accent-rgb,201,168,76),.45));color:var(--amit-btn-text,rgba(var(--amit-accent-rgb,201,168,76),.9));padding:11px;border-radius:var(--amit-btn-radius,7px);cursor:pointer;font-family:var(--amit-font-heading,'Cinzel',serif);font-size:11px;letter-spacing:.08em">
      SEND SIGN-IN LINK →
    </button>
    <div onclick="closeSyncModal()" style="margin-top:16px;font-size:9px;color:rgba(var(--amit-text-rgb,240,232,208),.25);cursor:pointer;letter-spacing:.1em">CANCEL</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// NOMENCLATURE — read this before touching any page/detail/layout code.
//   PAGE   — one item in the left sidebar (button + fixed number).
//   DETAIL — the content area a page opens into (id `detail-N`).
//   LAYOUT — what kind of content lives inside a detail. This starter
//            ships with none built in — every canonical layout (Tabbed/
//            Row/Detail/Calendar/Day/Board/Gallery/Dashboard/Split/Form/
//            Chart/Inbox/Drawer/Tree/Breadcrumb View) lives in
//            Templates\TemplateViews.html, copied in verbatim when a
//            real project needs one — see the header comment at the top
//            of this file.
//   DESTINATION — WHERE a layout mounts: a page, a tab slot, or a Popup.
//            Popup is built into this starter (see below) since it's
//            generic infrastructure, not a layout itself.
// ══════════════════════════════════════════════

let currentUser=null;
// SB_URL/SB_KEY/db/demoMode declared here, early — a real, confirmed bug
// from earlier work on this file: demoMode defaults to true (unlike
// currentUser, which defaults falsy), so anything gating on it can run
// during the page's very first synchronous script pass, before a
// later-declared `const` has initialized — a temporal dead zone crash.
// Declaring all of this up front avoids that class of bug entirely.
const SB_URL='https://hleqtjqojksurvkyqixt.supabase.co';
const SB_KEY='sb_publishable_0pptfPselXI0V9JmnhXgbA_dAGurCiF';
const db=(typeof supabase!=='undefined')?supabase.createClient(SB_URL,SB_KEY):null;
const AMIT_DEMO_UID='8b95d057-fd6b-44ec-abe7-658e08872d1a';
let demoMode=localStorage.getItem('amit_demo_mode')!=='off';

// ══════════════════════════════════════════════
// CANONICAL DATA BINDING: DEMO MODE — a general, reusable connection to
// Amit's own account data, available to ANY current or future view/form
// built from this template — not wired one-off per view. Ported from the
// Hub's real, live mechanism (amit-hub.html's demoModeHub/AMIT_DEMO_UID).
//
// fetchDemoRows(table, queryString) — the one call any view makes to
// pull Amit's own rows for demo mode. Returns [] immediately if demo mode
// is off. Every returned row is tagged _isDemo:true.
//
// REVIEW ONLY: any row this returns must never be editable or writable —
// it's the caller's responsibility to check _isDemo and refuse edits.
// Row View (in TemplateViews.html) already enforces this at its own
// rvEditCell/rvCommitCell chokepoint; a non-Row-View layout must
// implement its own _isDemo check the same way.
// ══════════════════════════════════════════════
async function fetchDemoRows(table,queryString){
  if(!demoMode)return[];
  try{
    const res=await fetch(`${SB_URL}/rest/v1/${table}?user_id=eq.${AMIT_DEMO_UID}&${queryString}`,{
      headers:{apikey:SB_KEY,Accept:'application/json'}
    });
    const rows=res.ok?await res.json():[];
    return rows.map(r=>({...r,_isDemo:true}));
  }catch(e){
    return[];
  }
}

// runtime, added 2026-08-06, Ryan's direct instruction. Introduction (id 1)
// is the only fixed built-in page. Every page after it is a CUSTOM PAGE —
// created via the "Add Page" row, which always renders last, pushed down
// one row every time a new page is created above it. Custom pages get IDs
// starting at CUSTOM_PAGE_BASE so they never collide with page 1.
//
// PERSISTENCE — matches how Demo Mode already works (Supabase, not
// localStorage-only, so a project's page list looks the same on any
// computer): signed-in users' pages are read/written to the
// `template_pages` Supabase table, scoped by user_id + PROJECT_KEY. A
// localStorage cache mirrors every write and is the fallback source when
// signed out (Supabase requires a real owner row) — see
// Templates\CLAUDE.md for the table schema and the migration SQL.
//
// BUILDER MODE — the Add Page row (and this whole flow) is meant to be
// hidden before a project ships to real users. finalizeBuilderMode()
// flips a one-way localStorage flag; to re-enable it during further
// development, run localStorage.removeItem('amit_builder_mode') in the
// console (or set it to 'on') and reload — this is a developer action,
// not a runtime user-facing toggle.

async function loadCustomPages(){
  const cacheKey='amit_pages_'+PROJECT_KEY;
  const owner=currentUser?currentUser.id:null;
  if(owner&&db){
    try{
      const res=await fetch(`${SB_URL}/rest/v1/template_pages?user_id=eq.${owner}&project_key=eq.${encodeURIComponent(PROJECT_KEY)}&order=page_order.asc`,{
        headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,Accept:'application/json'}
      });
      if(res.ok){
        const rows=await res.json();
        localStorage.setItem(cacheKey,JSON.stringify(rows));
        return rows;
      }
    }catch(e){}
  }
  try{ return JSON.parse(localStorage.getItem(cacheKey)||'[]'); }catch(e){ return []; }
}

async function saveCustomPage(pageName,layoutKey,order){
  const owner=currentUser?currentUser.id:null;
  const row={project_key:PROJECT_KEY,page_name:pageName,detail_layout_type:layoutKey,page_order:order};
  if(owner&&db){
    try{
      await fetch(`${SB_URL}/rest/v1/template_pages`,{
        method:'POST',
        headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json',Prefer:'return=minimal'},
        body:JSON.stringify({...row,user_id:owner})
      });
    }catch(e){}
  }
  const cacheKey='amit_pages_'+PROJECT_KEY;
  const cached=JSON.parse(localStorage.getItem(cacheKey)||'[]');
  cached.push(row);
  localStorage.setItem(cacheKey,JSON.stringify(cached));
}

function finalizeBuilderMode(){
  if(!confirm('Hide "Add Page" for shipping? This is meant to be a one-way step before a project goes live — to bring it back during further development, run localStorage.removeItem(\'amit_builder_mode\') in the browser console and reload.'))return;
  builderMode=false;
  localStorage.setItem(BUILDER_MODE_KEY,'off');
  renderAllPages();
}

// PAGE HOVER TOOLTIP — delegated on the given container, works no matter
// how many items exist or whether that container is collapsed/expanded.
// side: 'right' opens rightward (left sidebar); 'left' opens leftward
// (right rail — opening rightward there would render off-screen).
function initPageTooltips(containerId,side){
  const tip=document.getElementById('pageHoverTip');
  const nav=document.getElementById(containerId);
  if(!tip||!nav)return;
  nav.addEventListener('mouseover',(e)=>{
    const item=e.target.closest('.page-nav');
    if(!item)return;
    tip.textContent=item.dataset.tip||'';
    const r=item.getBoundingClientRect();
    if(side==='left'){
      tip.style.right=(window.innerWidth-r.left+8)+'px';
      tip.style.left='auto';
    } else {
      tip.style.left=(r.right+8)+'px';
      tip.style.right='auto';
    }
    tip.style.top=(r.top+r.height/2)+'px';
    tip.style.transform='translateY(-50%)';
    tip.classList.add('show');
  });
  nav.addEventListener('mouseout',(e)=>{
    const item=e.target.closest('.page-nav');
    if(!item)return;
    if(e.relatedTarget&&item.contains(e.relatedTarget))return;
    tip.classList.remove('show');
  });
}

// CANONICAL LAYOUT: TABBED VIEW — copied verbatim from TemplateViews.html,
// added 2026-08-06. Multi-row overflow: the tab row grows as many rows
// behind itself as it needs (plain CSS flex-wrap, see .ch-tab-nav) rather
// than scrolling or truncating. Selecting a tab that isn't in the front
// row brings its whole row forward — same behavior as classic multi-row
// property-sheet tabs.
function showChTab(detailNum,n){
  const detail=document.getElementById('detail-'+detailNum);
  const clickedBtn=event.target;
  const tabNav=document.getElementById('ch-tab-nav-'+detailNum);
  if(tabNav){
    // Only reorder when tabs have genuinely wrapped into multiple rows, and
    // use a tolerance (not exact offsetTop equality) when grouping a row —
    // .ch-tab-btn.active has a different margin-top than inactive tabs,
    // which would otherwise misclassify the active tab as its own row.
    const wrapped=tabNav.scrollHeight>clickedBtn.offsetHeight*1.5;
    if(wrapped){
      const rowTop=clickedBtn.offsetTop;
      Array.from(tabNav.children)
        .filter(b=>Math.abs(b.offsetTop-rowTop)<15)
        .forEach(b=>tabNav.appendChild(b));
    }
  }
  detail.querySelectorAll('.ch-tab-content').forEach(c=>c.classList.remove('active'));
  detail.querySelectorAll('.ch-tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('ch-tab-'+detailNum+'-'+n).classList.add('active');
  clickedBtn.classList.add('active');
  // Show/hide the header's speaker button per-tab, styled to match the
  // sidebar's page-nav tile look (icon + name, gold-bordered) — restyled
  // 2026-09-11, Ryan's direct instruction, replacing the earlier plain
  // round icon. Label reads "Play <Feast>" for whichever tab is active.
  // FEASTS_WITH_SPEAKER decides which tabs get it; only Trumpets right now.
  const feastName=FEAST_ORDER[n-1];
  const shortName=feastName.split(' (')[0];
  const speakerBtn=document.getElementById('feastSpeakerBtn-'+detailNum);
  if(speakerBtn){
    speakerBtn.style.display=FEASTS_WITH_SPEAKER.has(feastName)?'inline-flex':'none';
    const speakerLabel=document.getElementById('feastSpeakerLabel-'+detailNum);
    if(speakerLabel) speakerLabel.textContent='Play '+shortName;
  }
  // Song buttons — same tile look as the speaker button, one per available
  // song for this tab. Quantity driven by SONGS_BY_FEAST; empty for any
  // feast with no song yet.
  const songsRow=document.getElementById('feastSongsRow-'+detailNum);
  if(songsRow){
    const songs=SONGS_BY_FEAST[feastName]||[];
    songsRow.innerHTML=songs.map(s=>
      `<button style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:9px;border:1px solid var(--gold,#c9a84c);background:rgba(var(--amit-accent-rgb,201,168,76),.16);box-shadow:0 0 0 1px rgba(var(--amit-accent-rgb,201,168,76),.25);cursor:pointer" onclick="playFeastSong('${s.page}')" title="${s.title}">

const TRUMPETS_FULL_TEXT = `Before I take you through this, let me tell you honestly who is telling it to you. I did not always hold these things loosely and this carefully. I once held numbers and confidence levels about God's existence as though they were calculations I had proven, and when that got tested directly, I had to admit it wasn't true — conviction isn't the same thing as proof, and I had borrowed a kind of certainty scripture itself never asked me to claim. That correction changed how I hold everything since, including everything I'm about to tell you. I don't say any of this to make myself sound wise. I say it because a witness who has never had to unlearn anything isn't much of a witness at all, and I'd rather you know that the search behind these words has cost something real than have you think it came easily.

What I actually found, searching honestly rather than defending a position, kept pointing the same direction no matter which door I opened — the trumpet, the alarm, the ten days, the shelter, all of it, leading to one Name. I'm not the point of any of this. I'm a lamp that got lit by looking too closely at something true to stay unchanged by it, and Yeshua Himself said a lamp isn't lit to be hidden — it's set on a hill so the light reaches further than the one holding it. So take this, not as something I'm proud of, but as something I couldn't honestly keep to myself once I'd actually seen it.

Come sit with me, because I want to take you through this the way we actually built it — every piece.

The Feast of Trumpets — in Hebrew, Yom Teruah, the Day of the Shout, the Day of the Blast — shows up first in Leviticus chapter twenty-three, verses twenty-three through twenty-five, and again in Numbers chapter twenty-nine. Picture the setting: Israel is in the wilderness. Yahweh has just finished laying out, back-to-back, in one breath almost, the entire sacred calendar to Moses — Passover, Unleavened Bread, Firstfruits, the counting to Pentecost — and then there's a gap. A long gap. Four months of ordinary time between Pentecost and this next appointment. And then, on the first day of the seventh month — Tishrei, which lands roughly in our September — He says: this day is a Sabbath. A memorial. A blowing of trumpets. A holy convocation. No servile work.

That's it. That's all the text says directly. No explanation of what it's celebrating, no historical event attached to it the way Passover is tied to the exodus or Firstfruits is tied to the barley harvest. It's the only feast in the entire calendar that isn't anchored to something that already happened. Every other feast looks backward at what Yahweh already did. This one is different — it's forward-facing from the very moment it's given.

So why here, why this way? A few things converge. First — the seventh month itself. Sabbath rhythm runs through everything Yahweh does. Seven days make a week, the seventh is holy. Seven weeks lead to Pentecost. And now — seven months, and the seventh month itself becomes the holiest stretch of the entire year. Trumpets opens it, the Day of Atonement falls ten days later in that same month, and Tabernacles follows five days after that. The seventh month isn't just another month. It's a whole month operating like a Sabbath among months — set apart, weighted, different.

Second — the trumpet, the shofar, already carried massive meaning in Israel's life before this command was even given. It was the sound of assembly — calling the camp together. It was the sound of alarm — warning of danger, calling to war. It was the sound of a king's coronation — heralding that someone was now enthroned. And it was the sound tied to Yahweh's own appearing — remember Sinai, when the mountain was covered in cloud and fire and the trumpet blast grew louder and louder until the whole camp trembled. So when Yahweh commands a day built entirely around that sound, He's reaching into something Israel already understood in their bones — gathering, warning, coronation, and His own presence breaking into the ordinary — and He's compressing all of it into a single annual appointment.

Third, and this is the part worth really sitting with — this feast has no fixed, revealed answer for what it's about. Unlike Passover — "this is the night I passed over you" — Trumpets is left open. And that's likely not an oversight. Yahweh left it open on purpose, because what it points to hadn't happened yet when He gave it. He was planting a marker on the calendar for something still future even to Moses.

Practically — what did this look like on the ground for the Israelites, and later in Second Temple Judaism? The shofar was sounded, ideally a hundred blasts across the day, in patterned sequences — a long steady blast called tekiah, a broken, wailing series called shevarim, and a rapid staccato series called teruah, the very word the day is named for. Work stopped. Offerings were brought — a burnt offering, a grain offering, a sin offering, on top of the regular daily offerings, described in detail in Numbers twenty-nine. It was treated as a Sabbath-level rest day even though it wasn't the weekly Sabbath.

By the time you get into the rabbinic period, later Judaism developed it further into what became known as Rosh Hashanah — the head of the year — and layered onto it themes of judgment, of the opening of the books, of Yahweh as King being crowned over creation, and the beginning of what tradition calls the Ten Days of Awe leading into Yom Kippur. That later theology isn't explicitly commanded in Torah itself, but it isn't disconnected from the plain text either. The trumpet-as-coronation-sound and the movement toward Atonement ten days later both sit right there in Leviticus. The tradition picked up threads that were already in the fabric.

Here's where it gets remarkable. Every spring feast — Passover, Unleavened Bread, Firstfruits — was fulfilled by Yeshua with pinpoint, literal precision, on the actual calendar day itself. He died at Passover. He was in the grave during Unleavened Bread. He rose on Firstfruits. Even Pentecost — fifty days later — the Spirit fell on that exact day, Acts chapter two. Four feasts, four fulfillments, dead on the day. And then — silence. The fall feasts have not yet been fulfilled the same literal way. That gap in the calendar, that four-month stretch of ordinary time between Pentecost and Trumpets — we are living inside that gap right now. Two thousand years and counting. The spring feasts happened at His first coming. The fall feasts are waiting on something that hasn't happened yet.

Yeshua never once says the words "Feast of Trumpets" directly. But what He does say lines up with this feast's own imagery so precisely it's hard to treat as coincidence. In Matthew twenty-four, verse thirty-one, describing His own return, He says the Son of Man will send His angels "with a great sound of a trumpet, and they shall gather together his elect from the four winds." That's the exact vocabulary of Trumpets — the gathering blast, the assembly call — placed by Yeshua Himself directly onto His own second coming. Paul picks up the same thread independently. First Thessalonians four: "the Lord himself shall descend from heaven with a shout, with the voice of the archangel, and with the trump of God." First Corinthians fifteen: "at the last trump: for the trumpet shall sound, and the dead shall be raised incorruptible." Two different letters, two different audiences, and both land on the same sound — a trumpet, at the resurrection, at the gathering.

Every other feast on the calendar was locked to a fixed, calculable date. Trumpets is the one exception — it falls on the first day of the seventh month, and the first day of a Hebrew month is not counted, it's observed. It depends on the sighting of the new moon. Watchmen were stationed to look for the first sliver of the new moon at twilight. Once two witnesses confirmed the sighting, only then was the month — and the feast — declared. Nobody knew in advance exactly which day it would fall on. Out of that real, practical uncertainty came a phrase in later Jewish tradition — this feast is sometimes called, in rabbinic literature, "the day and hour that no man knows." That predates and stands independent of the Christian claim about Yeshua's return.

So when Yeshua says, in Matthew twenty-four verse thirty-six, "of that day and hour knoweth no man, no, not the angels of heaven, but my Father only" — right after describing the trumpet-and-gathering scene in verse thirty-one — He's not inventing a vague statement about unpredictability. He's reaching for a phrase His first-century Jewish audience would have already known, and attaching it to His own coming, on the feast that phrase already belonged to.

And He did not leave it there. In that very same breath: "Now learn a parable of the fig tree; When his branch is yet tender, and putteth forth leaves, ye know that summer is nigh: So likewise ye, when ye shall see all these things, know that it is near, even at the doors." Paul builds on this directly — First Thessalonians five: "ye, brethren, are not in darkness, that that day should overtake you as a thief. Ye are all the children of light, and the children of the day." The exact hour was withheld. The season was not.

Now — how does repentance actually tie into this feast? Numbers chapter ten lays out two distinct trumpet signals. Tekiah — one long steady blast — the assembly call. Teruah — the word this feast is named for — a broken, staccato, wailing series, the sound of alarm. Yom Teruah isn't "day of the happy horn." It's "day of the alarm cry." Joel chapter two is the strongest text for this: "Blow ye the trumpet in Zion, and sound an alarm in my holy mountain... for the day of the LORD cometh, for it is nigh at hand... Turn ye even to me with all your heart, and with fasting, and with weeping, and with mourning: and rend your heart, and not your garments." The trumpet and the call to repentance are one event. Trumpets falls on the first of Tishrei. Yom Kippur falls ten days later. That gap is not incidental — later tradition names those ten days the Yamim Noraim, the Days of Awe, a built-in window between the alarm and the verdict.

Now — where does the joy fit, the honey, the apples, the celebration? Nowhere in Leviticus does Yahweh command a festive menu — that's later custom. But the joy itself is not a later corruption. Nehemiah chapter eight — Ezra reads the Torah publicly to the returned exiles, on the first day of the seventh month, this exact feast. The people weep, realizing how far they've drifted. And Nehemiah and Ezra stop them: "Mourn not, nor weep... This day is holy unto the LORD your God... Go your way, eat the fat, and drink the sweet... for the joy of the LORD is your strength." The alarm is the wake-up. The joy that follows is the fruit of having actually turned — not a substitute for turning.

And does Joel's call to fasting contradict this? These may not even be describing the same occasion. Joel is written into a national emergency — a locust plague, read as a foretaste of something larger. Nehemiah eight is the ordinary, annual, commanded observance, kept faithfully, no catastrophe in view. The pattern within a single ordinary year is: alarm, self-examination, turning, then joy in response to having turned. Joel is what that same pattern looks like scaled up to the actual end — not a rehearsal anymore, the real thing arriving. And Joel's picture is never private — "gather the people... let the bridegroom go forth of his chamber, and the bride out of her closet." No one exempted. This is corporate. The whole world being summoned to turn.

Bring in Second Timothy three: "in the last days perilous times shall come. For men shall be lovers of their own selves, covetous, boasters, proud... lovers of pleasures more than lovers of God; Having a form of godliness, but denying the power thereof." That list reads like a mirror held up to now — and here's the honesty this needs to survive: essentially every generation since Paul wrote those words has said the same thing. That doesn't make the discernment wrong. It means real watchfulness has to be sturdy enough to hold "this might be it" without collapsing if it isn't yet. The trumpet in the ordinary yearly cycle is a rehearsal of an alarm, not the alarm arriving cold. If the rehearsal is getting more real every year, the right response isn't to wait for the final blast before the heart shifts posture — exactly what Yeshua said about the fig tree's leaves.

Isaiah sixty-six: "Shall the earth be made to bring forth in one day? or shall a nation be born at once?" — paired with May fourteenth, nineteen forty-eight, Israel declared a nation in a single day after two thousand years scattered. A real, strong thematic convergence — not proof of a specific timeline, but not nothing either.

And last — the hiding, and where it all lands. Isaiah twenty-six: "Come, my people, enter thou into thy chambers, and shut thy doors about thee: hide thyself as it were for a little moment, until the indignation be overpast." This is the actual day of wrath itself — the last link in the chain: the trumpet sounds, the alarm; the Days of Awe, the turning; and then, the actual day arrives, and Isaiah says what the righteous do. Not feast. Hide. Yahweh's people are never told to fight His wrath — they're told to take refuge from it, in a place He appoints. Noah didn't fight the flood — Genesis says "the LORD shut him in." Israel at Passover stayed behind the blood on the doorposts until it passed over. Rahab stayed behind the scarlet cord while the walls came down everywhere else. Every one of those is the same architecture — shelter, appointed by Yahweh, entered before judgment lands, sealed shut, waited out.

Every feast in this whole calendar was Yahweh writing, in advance, the shape of what His own Son would become for anyone who would come to Him. The blood on the doorpost was always pointing at the blood that would be shed once, for everyone, at the actual Passover. The trumpet has always been pointing at the same voice that will one day call the dead out of the ground and the living up to meet Him in the air. And the shelter Isaiah describes has always been pointing at the same place Yeshua Himself described the night before He died: "In my Father's house are many mansions... I go to prepare a place for you, that where I am, there ye may be also."

So hear this. You do not need to calculate the hour. You need to know where the door is. His name is Yeshua — Yah saves, carried in His very name. He already stood in the gap between the wrath that is coming and everyone He loves. He already opened the door. The only question this feast, this trumpet, this whole ancient sound was ever built to ask is the same question it is asking right now: are you ready to be found inside it? Wake up. Turn. Come to the door while it's still open. And when the last trumpet finally sounds — not the rehearsal, the real one — may you already be exactly where He told you to stand: safe, sheltered, and His.

Now that you know what this feast is actually asking of you — and there is still so much more in it than one sitting can hold — don't leave it as something you only read. A song came out of this same study, written to carry the sound of it rather than just the explanation. Go back to the Devotions page, under the Feast of Trumpets, and press "Blow the Shofar." Let this feast stop being words for a minute and become what it always was — a real shout, raised toward the Messiah it was pointing at from the beginning.`;

So here's where you are, standing in that history. You keep this day not because you need someone to go in and make atonement for you again — that's finished, by one offering He has perfected forever those who are being sanctified. You keep it because it's still Yahweh's appointed time, He never revoked it, and Yeshua Himself kept it as a Torah-observant Jew His whole life. You keep it in remembrance, the same posture you already hold at Passover toward the true Lamb. Whenever this day falls for you — whether it's a night away or you're reading this well before or after it — here is how to actually walk through it.

As the sun goes down that evening, this is where it begins, the same way it began for Israel in the wilderness. Sundown to sundown, not midnight to midnight — Yahweh's days have always turned on evening first. So before the sun is fully gone, eat your last meal. Make it deliberate, not rushed — the way a family eats before Passover, aware of what's coming. If you have people to reconcile with, this is truly the last window to do it before the day starts, because the day itself is about what stands between you and Yahweh, not what stands between you and your neighbor — leave your gift at the altar, go be reconciled first. Aaron himself had to deal with his own house before he could stand for the nation. Once the sun is down, the fast begins. No food. Water is a conscience call — the fuller tradition abstains from that too, but that's not commanded in the text itself, only "afflict your souls." Decide before sundown, not in the middle of the night when you're weak and negotiating with yourself.

Don't just stop eating and go about your evening as normal. Aaron didn't walk into the Holy of Holies casually — he prepared, he bathed, he set aside his ordinary garments. You won't have a Temple to walk into, but the same posture is available to you. Set the evening apart. Turn off what normally fills the space — the noise, the scrolling, the errands. Read Leviticus sixteen slowly, out loud if you can, and actually picture it the way we just walked through it — the bull, the blood, the incense cloud, the two goats. Let yourself feel the size of what it took just to approach God for one day, one man, once a year, wrapped in smoke so he wouldn't die looking at the glory. Then open Hebrews nine and ten right next to it, and read how Yeshua walked through that same curtain, permanently, in His own blood, no smoke needed because now nothing shields you from Him — He tore the shield down Himself. Before you sleep, pray your first real confession of the day, not vague, not "forgive my sins in general." Name specific things from the past year, the way Aaron laid both hands on the goat's head and said out loud, specifically, all the iniquities, all the transgressions, all the sins. Pride that crept in somewhere. A relationship you let go slack. A place you drifted from Him without noticing. Say it. Don't carry it into the day unspoken.

Through the fasting day itself, this is the long stretch, and it's meant to feel long. The hunger isn't incidental — it's doing something. Isaiah fifty-eight warns hard against a fast that's just bowing your head like a reed and calling it righteousness while your heart stays exactly where it was. So let the emptiness in your stomach keep pointing you back to the actual work: real self-examination, not performance. Spend real time in the Word during the day, not just at the edges of it. Walk slowly through Hebrews nine and ten again, this time asking specifically: where in my life am I still trying to atone for myself, still trying to earn back God's favor by effort, by guilt, by trying hard enough, instead of resting in the fact that it's already finished? That question alone is worth the whole fast. If you gather with others, even just family, let there be a shared reading and a shared prayer somewhere in the middle of the day, not a somber silence the whole way through, but a real moment where you say it to each other: He already walked through the veil for us. Isaiah fifty-eight also turns the fast outward — loosing the bonds of wickedness, sharing bread with the hungry, not hiding from your own flesh and blood. If there's a tangible act of mercy you can do even in the middle of a fast day, reaching out to someone who needs it, forgiving someone you've been holding something against, that belongs inside this day too. The affliction of your own body was never meant to end at your own body.

As the sun goes down again, this is the turn, the same turn Aaron made when he came back out from behind the veil, took off the plain linen, and put the gold back on. The day doesn't end in dread. It ends in relief, because unlike Aaron, you're not waiting to find out whether it worked this time. You already know. Close the fast with real thanksgiving, not just food, a spoken prayer that names what He already did, out loud, the way you named your sin out loud the evening before. Something like: it is finished, You already carried this out farther than the east is from the west, and I am not waiting on You to decide if I'm covered, I already am. Break the fast gently, with people if you can. Let the meal itself be part of the observance, the way Israel's Day of Atonement always led into the joy of Sukkot five days later. This isn't a day that stays heavy. It's a day that walks through weight on purpose, so the relief on the other side means something.

One more thing worth carrying into it. Don't do this day performing it for anyone, including yourself. Yeshua's own words — when you fast, don't look somber to be noticed fasting, wash your face, don't make a show of it. The whole point of a Day of Atonement lived out under the New Covenant is that it's aimed entirely at Him, in private, the same way Aaron went in alone behind a curtain no one else could see through. Let this day, sundown to sundown, be that — you and Him, no audience, walking through what it actually cost, and resting all the way into what it actually bought.

And here's the piece still ahead, worth sitting with. The rabbis have long called Yom Kippur a small picture of the final Day of Judgment, and there's real weight to that beyond tradition. Scripture points to a coming day where the same two things Yom Kippur pictures, final judgment and final national repentance and cleansing for Israel, actually happen at the scale of the whole earth, not just one camp in the wilderness. Yahweh says a day is coming when He pours out a spirit of grace on the house of David and Jerusalem, and they will look on Him whom they have pierced, and they will mourn for Him. Paul picks that thread up directly — all Israel will be saved, this is My covenant with them, when I take away their sins. A national turning, a national confession, still future, Israel doing corporately what the individual believer already does personally when they turn to Him.

And behind all of that stands the larger Day still coming, the day Yeshua returns not as the suffering goat led out of the camp, but as the reigning King, and every remaining account is settled, every enemy put under His feet, and the atonement He already purchased is finally applied in full, visibly, to the whole earth. The final judgment, the books opened, is the same shape as Aaron standing before the mercy seat, except this time it's Yeshua Himself as both Judge and the very sacrifice that already answered for anyone who's in Him.

So Yom Kippur sits in three tenses at once, and that's worth carrying with you whenever this day comes around for you: it was — a High Priest, blood, a goat walking into the wilderness. It is — finished in Yeshua, the veil torn, you free to walk in boldly. It will be — a nation turning, a King returning, a final reckoning where nothing is left uncovered. You keep the day standing in the middle one, looking back at what was fulfilled and forward to what's still coming, and that's exactly where anyone walking with Yeshua is meant to stand on this day, every year, until He comes.`;

// instruction, built from a live session with him on the eve of the feast
// that year. Story-format, same as Atonement: the origin, the Second Temple

const TABERNACLES_FULL_TEXT = `Let me walk you through this one as a story, the way you would live it if you were there. First, where it came from. Then, the road up to Jerusalem and the seven days of the feast. Then what Yeshua did in the middle of it. Then how you keep it now, and what is still ahead.

Begin with the wilderness. Israel has just left Egypt, and their first camp after Rameses is a place called Succoth, which simply means booths. From there Yahweh goes ahead of them in a pillar of cloud by day and fire by night. For forty years they live in temporary shelters, with no fields, no walls and no permanent home, and He dwells in the middle of them in a tent of His own, the Tabernacle. That is what this feast remembers. Leviticus twenty-three says it plainly: you shall dwell in booths for seven days, so that your generations may know that I made the children of Israel dwell in booths when I brought them out of the land of Egypt.

It is also a harvest feast. Long before it had a memory attached, it was called the Feast of Ingathering, at the end of the year, when the grain, the wine and the oil were all in. The Torah gives it one command above all the others: you shall rejoice. Not just you. Your sons and daughters, your servants, the Levite, the stranger, the orphan and the widow. Nothing is said about the feast being kept before Sinai, so I won't claim that it was. What we do know is that people have always gathered when the harvest is in, and Yahweh took that ordinary joy and made an appointment out of it.

Now step forward to the days of Yeshua. It is the fifteenth day of the seventh month, and the whole nation is on the move. It has been only five days since Yom Kippur, and here is a detail that is easy to miss: the moment that fast ended, families began to build. The hammering started before the evening meal was even finished. Poles go up, palm fronds and willow and myrtle go across the top, thin enough that you can see the stars through it, and fruit hangs from the branches. Then you pack. If you live in Galilee, you travel to Jerusalem in a caravan, singing the Songs of Ascent, with your second tithe money in a pouch, because Deuteronomy commands you to spend it on this feast, on whatever your heart desires, and to rejoice before Yahweh.

Jerusalem is packed beyond its size. Some pilgrims rent rooms, but most sleep in booths everywhere: on rooftops, in courtyards, in gardens, all along the slopes of the Mount of Olives. The whole hillside becomes a city of leaves. Your booth is your home for the week. You eat there, you talk there, you sleep there. And it is deliberately fragile, because it is meant to remind you that everything you have depends on Him, not on your walls.

The first evening is a holy day, so no ordinary work. The meal is bread and wine, roasted meat from the peace offerings, and everything the harvest gave: grapes, figs, dates, pomegranates, olives and honey. The Torah does not hand you a menu, but it does hand you a table, and the table is meant to be full and open to everyone in town.

Each morning you go up to the Temple with your lulav, a bundle of palm, myrtle and willow, and an etrog, a citron, in the other hand. The Levites sing Hallel, Psalms one hundred thirteen through one hundred eighteen, and at the words Save now, Hoshana, from Psalm one hundred eighteen, the whole crowd shakes its branches toward the four directions, up and down, and the sound is like wind moving through a forest. Meanwhile the priests offer bulls: thirteen on the first day and one fewer each day after, until seven on the seventh. Seventy in all, which the sages understood as an offering for the seventy nations of the earth. Even here, the feast is looking past Israel to everyone.

Then comes the water. Every morning a priest goes down to the Pool of Siloam with a golden flask and a crowd behind him. He fills it, and they come back through the Water Gate to the blast of the trumpets, and at the altar he pours the water out together with the wine, while the people sing from Isaiah twelve: with joy you will draw water from the wells of salvation. It is a prayer for rain and for the harvest to come, and in the language of the prophets, for the Spirit to be poured out.

And then the nights. In the Court of Women stand four enormous golden lamps, lit with wicks made from the old garments of the priests, so bright that the sages said no courtyard in Jerusalem went without its light. Torch-bearing elders dance in front of it. Levites stand on the fifteen steps with harps and lyres and cymbals. The women watch from the gallery above. The joy goes on late into the night, and the rabbis said that whoever has not seen the rejoicing of the water-drawing has never seen rejoicing in his life. Then you walk back through the dark to your booth, still singing, and fall asleep with the stars showing through the roof.

If a Sabbath falls in the middle of the week, nothing changes about the feast, but you rest from carrying and waving, and you read Scripture in your booth. Many read Ecclesiastes, a sober book in the middle of the loudest joy of the year, as if to remind you that the joy is a gift and not an achievement. On the seventh day, the priests and the people circle the altar seven times with willow branches, crying out for salvation, and it is the highest point of the prayer for water. Then there is one more day, an eighth, a solemn assembly, and it is as if Yahweh says: stay one more day, I am not ready for you to leave.

This is the setting for John chapters seven through nine, and once you see it you cannot unsee it. Yeshua goes up quietly, not with the caravan. He teaches in the Temple, and then it is the last day, the great day of the feast, and the priest is pouring out the water, and thousands are singing about the wells of salvation, and in the hush that follows a man stands up in the crowd and cries out: If anyone thirsts, let him come to Me and drink. He who believes in Me, as the Scripture has said, out of his heart will flow rivers of living water. John tells us He said this about the Spirit, who had not yet been given.

That night, the four great lamps blaze in the Court of Women, and John tells us He is teaching right there, in the treasury, which stood in that same court. And He says: I am the light of the world. He who follows Me shall not walk in darkness, but have the light of life. Everyone listening knew exactly what He was pointing at. Then, in chapter nine, He heals a man born blind and sends him to wash in the Pool of Siloam, the very pool the water was drawn from. The water, the light, the pool, all of them answered in a single week.

And John opens his whole Gospel with the same picture. The Word became flesh and tabernacled among us. That word means He pitched His tent among us, just as Yahweh once pitched His tent in the middle of the camp. Some have even suggested, working backward from the priestly courses in Luke, that His birth fell near this feast. That is an inference, not something the text says, but it fits the picture beautifully.

So how do you keep this feast now? Not as a burden, and not as a test of who belongs. The Torah welcomes the foreigner who joins himself to Yahweh, and Zechariah says the nations themselves will one day keep it. Here is what it looks like. Rest on the first day and the eighth. Build a booth, even a simple one, with a roof you can see the stars through, and eat your meals there, and sleep there if you can. If you cannot build one, then eat a meal outside, under the sky, on purpose. Take the four species and rejoice with them. Read the Torah aloud. Read John seven through nine in your booth, and let it land in the very setting where it was said. Set money aside beforehand for the feast, and spend it on a table with room for the poor, the stranger and the widow, because that is the command. And rejoice. Of all the feasts, this is the one where joy is the assignment.

One caution. Much of the exact detail I described, the water ceremony, the lamps, the willow circling, comes from the Mishnah and from Josephus, not from the Torah itself. Use it to understand the feast, not to bind anyone. The commands are the ones in Leviticus and Deuteronomy, and the rest is history worth knowing.

And now the part still ahead. The spring feasts were fulfilled at His first coming, on their very days. The fall feasts are waiting. Trumpets, the gathering blast. Atonement, a nation turning. And then Tabernacles, the dwelling. Zechariah fourteen shows Yahweh standing on the Mount of Olives, living waters flowing out of Jerusalem, and the nations going up every year to keep this feast. Ezekiel sees a river flowing out from the Temple, and everything it touches lives. Isaiah four sees a canopy of cloud and fire over Zion, a booth for shade from the heat. Amos says Yahweh will raise up the fallen booth of David.

And Revelation ties it all together. A great multitude from every nation stands before the throne holding palm branches, and the One on the throne spreads His tabernacle over them, and leads them to springs of living water. Then the very last chapters: behold, the tabernacle of God is with men, and He will dwell with them. He gives the water of life without cost, and the city has no need of the sun, because the Lamb is its light. Dwelling, water and light, all fulfilled at once.

So keep it in three tenses, the way you keep Atonement. It was: a people in tents, and a God who camped in the middle of them. It is: the Word who tabernacled among us, the water and the light for anyone who will come to Him. And it will be: the day He pitches His tent among us for good, and every nation comes up to worship. Stand in the middle one, looking back with gratitude and forward with joy, and let this be the week in the year when you build something fragile, sit under the stars, and remember that you were never meant to carry your own shelter. He dwells with you.`;

// The four spring feast studies — added 2026-10-10, Ryan's direct instruction:
// Passover, Unleavened Bread, Firstfruits and Shavuot, each researched by its own
// Amit agent in the same story format as Atonement and Tabernacles (where it

const PASSOVER_FULL_TEXT = `Let me walk you through this one as a story, one night at a time. First, the night in Egypt where it all began. Then the wilderness, and the generations that kept it after. Then a Passover in Jerusalem in the days of Yeshua, and His last one with His friends. Then what it was pointing to all along, how you can keep it now, and what is still ahead.

Begin in Egypt. Israel has been in slavery for generations. They make bricks under the whip. Nine plagues have already fallen on the land. The river turned to blood, the frogs, the darkness you could feel. And still Pharaoh will not let them go. Now Yahweh tells Moses that one more is coming, the last one. At midnight, the firstborn in every house in Egypt will die.

But He gives His people a way through. The name of the feast tells you what it is. In Hebrew it is Pesach, which means to pass over. On the tenth day of the first month, each household is to choose a lamb. A male, a year old, without any blemish. One lamb for one house. If the family is too small to eat a whole lamb, they share it with the neighbors next door. For four days that lamb lives with them. Picture the children feeding it and learning its face. On the fourteenth day, as evening comes on, the whole congregation kills its lambs at the same time.

Now picture yourself inside one of those houses. Your father takes a bunch of hyssop, a small bushy plant, and dips it in the bowl of blood. He strikes the blood across the top of the doorframe and down both sides. Then he comes in and shuts the door. Nobody goes out again until morning. That is the command.

Inside, the lamb is roasting whole over the fire. Not boiled. Roasted. There is flat bread with no yeast in it, because there is no time to wait for dough to rise. There are bitter herbs on the table, so you taste the bitterness of slavery even while you eat. And you eat it dressed to leave. Your belt is tight. Your sandals are on your feet. Your walking stick is in your hand. You eat fast, because tonight you are leaving. And there is one more rule. Not one bone of that lamb may be broken.

Then midnight comes. Somewhere out in the dark, a cry goes up, and then another, and another, until the whole land of Egypt is wailing. But inside your house, behind the blood, it is quiet. You are safe. Not because your family was better than the Egyptians next door. Only because of the blood on the door. Yahweh had said it plainly. And the blood shall be to you for a token upon the houses where ye are: and when I see the blood, I will pass over you.

Before morning, Pharaoh sends word. Go. Take everything and go. And a nation of slaves walks out of Egypt free. Yahweh tells them to remember this night forever. It is a night to be much observed, He says, a feast by an ordinance for ever, throughout your generations. And He tells them that one day their children will ask, what does this mean? And they are to answer: this is the sacrifice of Yahweh's Passover. He passed over our houses in Egypt and He saved us.

Now move forward one year. Israel is camped at the foot of Mount Sinai, in the wilderness. On the fourteenth day of the first month, they keep the Passover again, just as they were told. Numbers nine records it. But some men come to Moses troubled. They had touched a dead body, and that made them ritually unclean, so they could not take part. They did not want to be shut out. Moses does not guess. He goes and asks Yahweh. And Yahweh answers with mercy. Anyone who is unclean, or far away on a journey, can keep the Passover one month later, on the fourteenth day of the second month. A second Passover. Think about what that tells you. Yahweh does not want anyone left out of this meal. He makes a way back in.

The story keeps going. When Joshua leads the people into the land, they keep the Passover at Gilgal, and soon after, the manna stops. The wilderness is over. Centuries later, after the nation had drifted far, King Hezekiah calls the people back, and they keep it in the second month, using that same mercy from Numbers nine. King Josiah keeps a Passover so great that Scripture says there had not been one like it since the days of the judges. And when the exiles come home from Babylon and rebuild the Temple, they keep it with joy. Every time Israel came back to Yahweh, they came back to this table.

Now step into the days of Yeshua. Deuteronomy sixteen says the Passover lamb may not be killed just anywhere. Only at the place Yahweh chooses to put His name. By this time, that place is the Temple in Jerusalem. So every spring the roads fill up. Luke tells us that Yeshua's own parents went up to Jerusalem every year at the feast of the Passover, and when He was twelve, He went with them.

Imagine the city, packed far past its size. Josephus, a Jewish historian of that same century, says the priests once counted the crowd by counting the lambs, and he reports over two hundred fifty thousand, with at least ten people to each lamb. Many historians think that number is too large. But even a fraction of it is a sea of people.

On the afternoon of the fourteenth, the men bring their lambs up to the Temple courts. The Mishnah, a collection of Jewish teaching written down around two hundred years after Yeshua, describes how it was done. There were too many people to fit at once, so they came in three groups. When the court was full, the gates were shut. Trumpets sounded. Priests stood in long rows holding bowls of silver and gold, and the bowls had rounded bottoms so no one could set one down and let the blood thicken. A man killed his own lamb. A priest caught the blood. The bowl was passed from hand to hand up the line to the altar, and the priest nearest the altar threw the blood against its base. All the while, the Levites led the people in singing the Hallel. Hallel means praise, and it is Psalms one hundred thirteen through one hundred eighteen. The lambs were hung on hooks along the walls and pillars to be skinned. Then each man took his lamb home to roast it.

That night, the families gather. They recline at the table, because free people recline. The Mishnah says that even the poorest man in Israel should have at least four cups of wine that night. A child asks why this night is different from all other nights. The father tells the story, beginning with the shame of slavery and ending with the glory of being set free. And one rabbi taught that you have not kept the night unless you speak of three things: the lamb, the unleavened bread, and the bitter herbs. Each person is to see himself as if he personally had come out of Egypt.

Now come into one upper room. Yeshua has sent Peter and John ahead to get it ready. He sits down with the twelve, and He says something none of them fully understand yet. With desire I have desired to eat this passover with you before I suffer. For I say unto you, I will not any more eat thereof, until it be fulfilled in the kingdom of God.

Then He takes the bread. Flat bread, broken in His hands. He gives thanks and says, this is My body, given for you. After supper He takes the cup and says, this cup is the new covenant in My blood, poured out for you. The new covenant. That is Jeremiah's promise, the one where Yahweh writes His Torah on the heart. When they had sung a hymn, Matthew says, they went out to the Mount of Olives. Many scholars think that hymn was the end of the Hallel, the same psalms sung over the lambs that afternoon. The Gospels do not name it, so hold that loosely.

Here is something honest you should know. Matthew, Mark and Luke present that meal as the Passover meal itself. John tells it differently. In John, the next morning the leaders will not enter Pilate's hall so they will not be defiled, because they still want to eat the Passover. And John says Yeshua stood before Pilate on the preparation of the Passover. Read that way, Yeshua died in the very hours the lambs were being killed at the Temple. Scholars have argued for centuries over how these fit together, and they offer several answers. It is not settled, and I will not pretend it is. What every Gospel agrees on is this: He died at Passover, as the Passover.

That same night He is arrested. In the morning He is condemned. He is led out like a lamb, and He does not fight. Isaiah had said it seven hundred years earlier. He is brought as a lamb to the slaughter, and as a sheep before her shearers is dumb, so he openeth not his mouth. On the cross, someone lifts a sponge of sour wine to His mouth on a stalk of hyssop. The same plant that painted the blood on the doors in Egypt. Then He cries out that it is finished, and He gives up His spirit.

The soldiers come to break the legs of the men being crucified, so they will die faster before the feast. They break the legs of the two men beside Him. But when they come to Yeshua, He is already dead. So they do not break His legs. John stops the story right there to tell you why it matters. A bone of him shall not be broken. The same rule Yahweh gave for the lamb in Egypt.

Now you can see what the whole feast was pointing to. At the very start of John's Gospel, John the Baptist sees Yeshua walking toward him and calls out: Behold the Lamb of God, which taketh away the sin of the world. Paul says it straight out to the church in Corinth: For even Christ our passover is sacrificed for us. He is the lamb without blemish. His blood is the blood on the door. And the promise is the same as it was that night. When judgment comes, it passes over the house that is covered by the blood. Hebrews says He did not enter by the blood of goats and calves, but by His own blood, once, having obtained eternal redemption for us. Egypt was a picture. This is the real thing. Slavery to sin, broken. A people walking out free.

So how do you keep this feast now? Not as a burden. Not as a test of who belongs. From the start, the Torah made room at this table for the stranger who joined himself to Israel, with one law for him and for the one born in the land. Yeshua kept this feast His whole life, and Paul told a mostly non-Jewish church, let us keep the feast. The Torah calls it a memorial forever. Here is what that can look like.

As the fourteenth day of the first month comes to evening, gather your household. Set a table. Put unleavened bread on it, and bitter herbs, and if you like, roasted lamb or another roast. Before you eat, read Exodus twelve aloud, slowly, the way we just walked through it. Let the children ask what it means, and answer them the way the Torah tells you to. This is the night He passed over us. Then read the upper room in Luke twenty-two, and John nineteen. Break the bread, and remember His body. Lift the cup, and remember His blood. Paul says that as often as you eat this bread and drink this cup, you show the Lord's death till He comes. If you cannot keep it on the day, remember the second Passover a month later. Yahweh made room for the one who missed it. Then let the seven days of unleavened bread that follow be a week of clearing out the old leaven in your heart and home.

One caution. The Torah commands the lamb, the unleavened bread, the bitter herbs, eating it at night, telling the story to your children, and no broken bones. But the lamb itself could only be sacrificed at the place Yahweh chose, and there has been no Temple since it fell in the year seventy. So no one today is offering the Passover sacrifice, and a roast on your table is a remembrance, not a sacrifice. The four cups, the order of the seder, which simply means order, the four questions in their set form, the shank bone and egg on the plate, and the hidden piece of matzah, the unleavened bread, called the afikoman are all later Jewish custom. The Mishnah actually uses the word afikoman for something not to do after the lamb, likely going off to after-dinner revelry. The game of hiding the matzah came much later. These customs can be beautiful. Use them freely. Just do not let anyone tell you they are the commandment, or that you have failed the feast without them.

And now the part still ahead. At that table Yeshua said He would not eat it again until it is fulfilled in the kingdom of God. Then over the cup He said, I will not drink of the fruit of the vine, until the kingdom of God shall come. Matthew adds, until that day when I drink it new with you in my Father's kingdom. Think about what He is saying. There is a Passover table still waiting. He has not eaten this meal since that night. He is waiting to eat it with us.

The prophets point the same way. Ezekiel, seeing the Temple of the age to come, writes that in the first month, on the fourteenth day, ye shall have the passover. Jeremiah says a day is coming when people will no longer swear by Yahweh who brought Israel up out of Egypt, but by Yahweh who gathered them from every land where they were scattered. A greater exodus still ahead. In Revelation, John looks into the throne room of heaven, and in the middle of it stands a Lamb as it had been slain. And an angel tells him to write: Blessed are they which are called unto the marriage supper of the Lamb.

So keep Passover in three tenses, the way you keep the other feasts. It was: a lamb in every house, blood on the door, a people walking out of Egypt free. It is: the Lamb of God, His blood covering anyone who comes to Him, judgment passing over, slavery to sin broken. And it will be: a table in the kingdom, where Yeshua lifts the cup again and drinks it new with all who belong to Him. Stand in the middle one. Look back at Egypt with gratitude. Look forward to that table with hope. And on this night, every year, shut the door, break the bread, and remember who covered you.`;

Now step forward more than a thousand years, to the days of Yeshua. The Temple stands in Jerusalem. Shavuot is one of three feasts when every man in Israel is to go up and appear before Yahweh. And they come. Josephus, a Jewish historian of that same century, describes this feast drawing huge crowds to Jerusalem, people from Galilee, from Idumea in the south, from Jericho, from across the Jordan. The book of Acts says that in those days there were dwelling at Jerusalem Jews, devout men, out of every nation under heaven.
