<!-- ══════════════════════════════════════════════
     COPYING THIS TEMPLATE FOR A NEW PROJECT — read this first.

     WHAT THIS FILE IS — rebuilt 2026-08-06, Ryan's direct instruction.
     This is now the MINIMAL STARTER, not the reference catalog. It has
     Introduction (page 1) plus a few blank placeholder pages, and the
     global infrastructure every Amit app needs (right rail — Ask Amit,
     Sign In/Sync, Demo Mode — popup destination, login connection,
     tooltip mechanism, clock/greeting). It deliberately does NOT contain
     any of the canonical layouts (Tabbed/Row/Detail/Calendar/Day/Board/
     Gallery/Dashboard/Split/Form/Chart/Inbox/Drawer/Tree/Breadcrumb
     View) — those live permanently in Templates\TemplateViews.html, the
     never-modified reference library. This split exists so a real
     project's starting file is never bloated with layout code it isn't
     using — see Templates\CLAUDE.md's "TEMPLATE VIEWS vs TEMPLATE"
     section for the full reasoning.

     ADDING A LAYOUT TO A REAL PROJECT — go to Templates\TemplateViews.html,
     find the named "CANONICAL LAYOUT:" or "CANONICAL DESTINATION:" comment
     block, and copy it verbatim into this file — never reconstruct a
     layout's behavior from memory or approximation. Wire it into a real
     page/tab/popup the same way TemplateViews.html's own DEMO block shows
     it being done there. (J New, once built, automates this hand-off —
     see Templates\CLAUDE.md.)

     NAMING: the new project's folder name IS the app's name. If the
     folder is `Disco\`, the app is "Disco" — rename every literal
     occurrence of "Template" below to that exact name:
       - <title>Template</title>            (this line)
       - #pageTitle text, currently "Template" (~line 90)
       - the copied file itself: save as Disco.html, not template.html
       - askAmitLive('TEMPLATE_NOT_CONFIGURED') → askAmitLive('yourRealKey'),
         and write that key's real context into ../Amit_Ask_Live.js's
         PAGE_CONTEXTS — do not skip this, see the comment above that line
     Use the app's real display name consistently in all three spots —
     never a variant spelling, never re-derived per file.

     VERSION: #pageVersion always starts at v1.00 for a brand-new app.
     From here forward it is versioned independently (own +0.01/+1.00
     history, never synced to any other file's number) — see root
     CLAUDE.md's VERSIONING STANDARD.

     INTERCONNECTION: a new project is never standalone — it inherits the
     whole Amit system's conventions. Before/while building it out, the
     new project's own CLAUDE.md (copied from
     Templates\Amit_NewProject_Template.md per root CLAUDE.md's NEW
     PROJECT DIRECTIVE) must carry: the Session Location Check, the
     Pursuit Attribution clause (its own canonical program name for
     hub_entries), Shortcut Activation + Shortcut Awareness, and — if
     it has an "Ask Amit" button — the wiring described above. If the
     project is likely to grow a running state log, add its own
     Sessions.md too (see AmitBooks\Sessions.md for the pattern) so a
     future session can orient fast without re-deriving context.

     NOMENCLATURE: this template uses PAGE (a sidebar item — button + its
     fixed number), DETAIL (the content area a page opens into), LAYOUT
     (what kind of content lives inside a detail — Tabbed/Row/Detail/etc,
     all defined in TemplateViews.html), and DESTINATION (WHERE a layout
     mounts — a page, a tab slot, or a Popup; Popup is built into this
     starter since it's generic infrastructure, not a layout itself). Full
     definitions live in the NOMENCLATURE comment at the top of the
     <script> block below.

     PAGE ORDER: sidebar display position is controlled by the PAGE_ORDER
     array in the script below, kept separate from each page's fixed
     number — reorder pages by editing that array, never by renumbering
     pages/details themselves. See Templates\CLAUDE.md for why.
     ══════════════════════════════════════════════ -->

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09141f;
  --card-head:#0f2338;
  --border:rgba(201,168,76,0.55);
  --gold:#c9a84c;
  --gold2:#e8c56a;
  --text:#ffffff;
  --text2:#f0e8d0;
  --muted:rgba(240,232,208,0.78);
  --dim:rgba(240,232,208,0.42);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:'Crimson Pro',Georgia,serif;color:var(--text);display:flex;flex-direction:column}

body::before{
  content:'';
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:60vmin;height:60vmin;
  background:url('amit_icon.ico') center/contain no-repeat;
  opacity:.035;
  pointer-events:none;
  z-index:0;
}

/* ── HEADER ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 28px;
  background:var(--card-head);
  border-bottom:2px solid var(--border);
  flex-shrink:0;
  position:relative;
}
.page-title-wrap{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
}
.page-title{
  font-family:Georgia,serif;font-size:26px;font-weight:700;
  letter-spacing:.3px;text-transform:none;color:var(--gold2);
}
.page-version{
  font-family:monospace;font-size:11px;letter-spacing:.05em;
  color:rgba(201,168,76,.55);margin-top:2px;
}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo-link{display:flex;align-items:center;gap:14px;cursor:pointer;text-decoration:none}
.brand-sub{font-style:italic;color:rgba(240,232,208,.55);font-size:12px}
.hdr-right{text-align:right}
.greeting{font-family:'Cinzel',serif;font-size:16px;color:#fff;font-weight:600}
.datetime{font-size:12px;color:var(--muted);margin-top:2px}
.help-btn{width:22px;height:22px;border-radius:50%;border:1px solid rgba(240,232,208,.3);color:rgba(240,232,208,.6);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:all .15s}
.help-btn:hover{border-color:var(--gold);color:var(--gold)}

/* ── HUB LAYOUT ── */
.hub{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  width:max-content;flex-shrink:0;
  background:var(--card-head);
  border-right:2px solid var(--border);
  display:flex;flex-direction:column;
  overflow-y:auto;padding:12px 10px;gap:0;
}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:2px}
.sidebar{transition:width .18s ease}
.sidebar.collapsed{width:64px}
.sidebar.collapsed .page-nav{justify-content:flex-start;padding:4px}
.sidebar.collapsed .page-info{display:none}
.page-nav{
  display:flex;align-items:center;gap:10px;
  padding:6px 4px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;
  flex-shrink:0;
  transition:all .18s;user-select:none;
  position:relative;overflow:hidden;
}
.page-nav:hover{background:rgba(255,255,255,.07);border-color:rgba(201,168,76,.3)}
.page-nav.active{background:rgba(201,168,76,.16);border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,168,76,.25)}
.page-icon{width:32px;height:32px;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* Round plug-status badge for the Sign In/Out rail icon — green when
   connected, red when not. Added 2026-08-07, ported from AmitBooks/
   NEW.html as the new standard for this template's own Sign In/Out
   treatment (Ryan's direct instruction — same config becomes the base for
   every future project built from this file). Disconnected state pulses:
   red fills the circle from a point at the center out to the full edge,
   then collapses back to nothing, looping — a genuine warning cue, not a
   color-shift-in-place effect. */
.page-icon.plug-badge{border-radius:50%;transition:background .15s;position:relative;overflow:hidden}
.page-icon.plug-badge.connected{background:#2e7d46}
.page-icon.plug-badge.disconnected{background:var(--bg)}
.page-icon.plug-badge.disconnected::before{content:'';position:absolute;inset:0;border-radius:50%;background:#c73333;animation:plugBadgeFill 1.6s ease-in-out infinite;transform-origin:center}
.plug-icon-glyph{position:relative;z-index:1}
@keyframes plugBadgeFill{0%,100%{transform:scale(0)}50%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.page-icon.plug-badge.disconnected::before{animation:none;transform:scale(1)}}
.page-info{flex:1;min-width:0}
.page-name{font-family:'Cinzel',serif;font-size:11px;color:#fff;letter-spacing:.04em;font-weight:600}
.page-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── MAIN AREA ── */
.main-area{flex:1;overflow:hidden;position:relative;background:var(--bg)}
.detail{
  position:absolute;inset:0;overflow-y:auto;
  display:none;flex-direction:column;
  animation:pfade .18s ease;
}
.detail.active{display:flex}
@keyframes pfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.detail::-webkit-scrollbar{width:5px}
.detail::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:3px}

/* ── DETAIL HEADER ── */
.detail-head{
  display:flex;align-items:center;gap:16px;
  padding:14px 24px;
  background:var(--card-head);
  border-bottom:2px solid var(--border);
  flex-shrink:0;
}
.detail-heading{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.detail-empty{flex:1;display:flex;align-items:center;justify-content:center;color:rgba(240,232,208,.25);font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* ── POPUP — canonical DESTINATION, not a layout type. Generic overlay
   that can host any layout instance copied in from TemplateViews.html —
   content-agnostic, same separation as a Page or a Tab slot not caring
   what's mounted inside them. Built into this starter (not TemplateViews-
   only) since it's global infrastructure, not a layout. ── */
.popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;align-items:center;justify-content:center}
.popup-card{background:var(--card-head);border:1px solid rgba(201,168,76,.5);border-radius:12px;padding:26px 28px;max-width:640px;width:92%;max-height:82vh;overflow-y:auto;box-shadow:0 10px 50px rgba(0,0,0,.55);position:relative}
.popup-close-btn{position:absolute;top:14px;right:16px;color:rgba(240,232,208,.5);cursor:pointer;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em}
.popup-close-btn:hover{color:var(--gold2)}

/* ── RIGHT RAIL — global, present on every page, same on every project.
   Double-click to expand/collapse (mirror of the left sidebar, inverted
   default: starts collapsed). Ask Amit / Sign In-Sync / Demo Mode all
   live here permanently — see Templates\CLAUDE.md for the full history
   of why each piece looks the way it does. ── */
.right-rail{
  width:64px;flex-shrink:0;
  background:var(--card-head);
  border-left:2px solid var(--border);
  display:flex;flex-direction:column;
  overflow-y:auto;padding:12px 10px;gap:0;
  transition:width .18s ease;
}
.right-rail::-webkit-scrollbar{width:3px}
.right-rail::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:2px}
.right-rail.expanded{width:max-content}
.right-rail .page-nav{padding:4px;flex-direction:row-reverse}
.right-rail.expanded .page-nav{padding:6px 4px;justify-content:flex-start}
.right-rail .page-info{display:none}
.right-rail.expanded .page-info{display:block}
/* RIGHT RAIL ON/OFF STATE — added 2026-08-22, Ryan's direct instruction.
   The gold .page-nav.active look (shared with the left sidebar's "this is
   the open page" state) was too subtle to tell an ON toggle (Sign In,
   Demo Mode) apart from an OFF one at a glance. Right-rail items are
   toggles, not navigation, so they get their own distinct green
   on-state — overrides the gold .page-nav.active rule for this rail only.
   PERMANENT — carry this into every project copied from this template. */
.right-rail .page-nav.active{background:rgba(46,160,67,.20);border-color:rgba(46,160,67,.65);box-shadow:0 0 0 1px rgba(46,160,67,.4)}
.right-rail .page-nav.active .page-icon{background:rgba(46,160,67,.35);border-radius:50%;box-shadow:0 0 0 2px rgba(46,160,67,.55)}
.right-rail .page-nav.active .page-name{color:#6fe38f}

/* ── PAGE HOVER TOOLTIP — JS-positioned (fixed), not pure CSS, because
   .sidebar/.right-rail scroll (overflow-y:auto) — per the CSS spec, that
   silently forces the other axis's overflow to 'auto' too, which would
   clip a CSS-positioned tooltip trying to extend past the container's
   edge. A single fixed element sidesteps that entirely. ── */
.page-hover-tip{
  position:fixed;z-index:9999;
  background:#1a3352;border:1px solid rgba(201,168,76,.45);
  color:var(--gold2);font-family:'Cinzel',serif;font-size:10px;letter-spacing:.05em;
  line-height:1.5;
  padding:6px 10px;border-radius:6px;white-space:normal;word-wrap:break-word;max-width:260px;
  opacity:0;pointer-events:none;
  transition:opacity .12s;box-shadow:0 4px 16px rgba(0,0,0,.4);
}
.page-hover-tip.show{opacity:1}

/* CANONICAL LAYOUT: TABBED VIEW — copied verbatim from TemplateViews.html,
   added 2026-08-06 so Add Page can instantiate a real Tabbed View directly,
   not hand a copy-instruction to an outside AI session. */
.ch-tab-nav{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px;row-gap:0;margin:0 24px;padding:0;background:var(--bg);flex-shrink:0}
.ch-tab-btn{padding:9px 22px;margin-top:10px;border:1px solid rgba(201,168,76,.25);background:rgba(255,255,255,.03);color:var(--muted);border-radius:10px 10px 0 0;cursor:pointer;font-size:13px;font-family:inherit}
.ch-tab-btn.active{padding:12px 26px;margin-top:-2px;margin-bottom:-3px;border-bottom:none;background:var(--card-head);color:var(--gold2);font-weight:600;font-size:14px;position:relative;z-index:2}
.ch-tab-main{flex:1;min-height:0;overflow-y:auto;padding:28px 32px;margin:0 24px 24px;background:var(--card-head);border:1px solid rgba(201,168,76,.25);border-radius:0 12px 12px 12px}
.ch-tab-content{display:none}
.ch-tab-content.active{display:block}
</style>
</head>

<header>
  <a class="brand brand-logo-link" href="https://ask-amit.github.io/Amit/Hub/amit-hub.html" title="Back to the Amit Hub">

<!-- Generic Popup destination — content filled in by whichever layout uses it -->

<!-- SYNC / SIGN-IN MODAL -->
<div id="syncModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;align-items:center;justify-content:center">
  <div class="sync-modal-card" style="background:#1a3352;border:1px solid rgba(201,168,76,.45);border-radius:14px;padding:36px 40px;max-width:340px;width:90%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.5)">
    <div style="color:rgba(201,168,76,.9);font-family:'Cinzel',serif;font-size:16px;letter-spacing:.06em;margin-bottom:6px">Sync Across Devices</div>
    <div style="color:rgba(240,232,208,.5);font-size:11px;line-height:1.7;margin-bottom:22px">Enter your email. A sign-in link will be sent.<br>No password needed.</div>
    <input id="syncEmailInput" type="email" placeholder="your@email.com"
      style="width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.3);border-radius:7px;padding:11px 13px;color:#fff;font-size:13px;outline:none;margin-bottom:12px;font-family:inherit"

    <button id="syncSubmitBtn" onclick="submitSyncEmail()"
      style="width:100%;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.45);color:rgba(201,168,76,.9);padding:11px;border-radius:7px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.08em">
      SEND SIGN-IN LINK →
    </button>
    <div onclick="closeSyncModal()" style="margin-top:16px;font-size:9px;color:rgba(240,232,208,.25);cursor:pointer;letter-spacing:.1em">CANCEL</div>
  </div>

<script>
// ══════════════════════════════════════════════
// NOMENCLATURE — read this before touching any page/detail/layout code.
//   PAGE   — one item in the left sidebar (button + fixed number).
//   DETAIL — the content area a page opens into (id `detail-N`).
//   LAYOUT — what kind of content lives inside a detail. This starter
//            ships with none built in — every canonical layout (Tabbed/
//            Row/Detail/Calendar/Day/Board/Gallery/Dashboard/Split/Form/
//            Chart/Inbox/Drawer/Tree/Breadcrumb View) lives in
//            Templates\TemplateViews.html, copied in verbatim when a
//            real project needs one — see the header comment at the top
//            of this file.
//   DESTINATION — WHERE a layout mounts: a page, a tab slot, or a Popup.
//            Popup is built into this starter (see below) since it's
//            generic infrastructure, not a layout itself.
// ══════════════════════════════════════════════

let currentUser=null;
// SB_URL/SB_KEY/db/demoMode declared here, early — a real, confirmed bug
// from earlier work on this file: demoMode defaults to true (unlike
// currentUser, which defaults falsy), so anything gating on it can run
// during the page's very first synchronous script pass, before a
// later-declared `const` has initialized — a temporal dead zone crash.
// Declaring all of this up front avoids that class of bug entirely.
const SB_URL='https://hleqtjqojksurvkyqixt.supabase.co';
const SB_KEY='sb_publishable_0pptfPselXI0V9JmnhXgbA_dAGurCiF';
const db=(typeof supabase!=='undefined')?supabase.createClient(SB_URL,SB_KEY):null;
const AMIT_DEMO_UID='8b95d057-fd6b-44ec-abe7-658e08872d1a';
let demoMode=localStorage.getItem('amit_demo_mode')!=='off';

// ══════════════════════════════════════════════
// CANONICAL DATA BINDING: DEMO MODE — a general, reusable connection to
// Amit's own account data, available to ANY current or future view/form
// built from this template — not wired one-off per view. Ported from the
// Hub's real, live mechanism (amit-hub.html's demoModeHub/AMIT_DEMO_UID).
//
// fetchDemoRows(table, queryString) — the one call any view makes to
// pull Amit's own rows for demo mode. Returns [] immediately if demo mode
// is off. Every returned row is tagged _isDemo:true.
//
// REVIEW ONLY: any row this returns must never be editable or writable —
// it's the caller's responsibility to check _isDemo and refuse edits.
// Row View (in TemplateViews.html) already enforces this at its own
// rvEditCell/rvCommitCell chokepoint; a non-Row-View layout must
// implement its own _isDemo check the same way.
// ══════════════════════════════════════════════
async function fetchDemoRows(table,queryString){
  if(!demoMode)return[];
  try{
    const res=await fetch(`${SB_URL}/rest/v1/${table}?user_id=eq.${AMIT_DEMO_UID}&${queryString}`,{
      headers:{apikey:SB_KEY,Accept:'application/json'}
    });
    const rows=res.ok?await res.json():[];
    return rows.map(r=>({...r,_isDemo:true}));
  }catch(e){
    return[];
  }
}

// ══════════════════════════════════════════════
// ADD PAGE — the mechanism that lets a real project grow its own pages at
// runtime, added 2026-08-06, Ryan's direct instruction. Introduction (id 1)
// is the only fixed built-in page. Every page after it is a CUSTOM PAGE —
// created via the "Add Page" row, which always renders last, pushed down
// one row every time a new page is created above it. Custom pages get IDs
// starting at CUSTOM_PAGE_BASE so they never collide with page 1.
//
// PERSISTENCE — matches how Demo Mode already works (Supabase, not
// localStorage-only, so a project's page list looks the same on any
// computer): signed-in users' pages are read/written to the
// `template_pages` Supabase table, scoped by user_id + PROJECT_KEY. A
// localStorage cache mirrors every write and is the fallback source when
// signed out (Supabase requires a real owner row) — see
// Templates\CLAUDE.md for the table schema and the migration SQL.
//
// BUILDER MODE — the Add Page row (and this whole flow) is meant to be
// hidden before a project ships to real users. finalizeBuilderMode()
// flips a one-way localStorage flag; to re-enable it during further
// development, run localStorage.removeItem('amit_builder_mode') in the
// console (or set it to 'on') and reload — this is a developer action,
// not a runtime user-facing toggle.
// ══════════════════════════════════════════════
const PROJECT_KEY=(document.getElementById('pageTitle')?.textContent||'template').trim();
const CUSTOM_PAGE_BASE=1000;
const BUILDER_MODE_KEY='amit_builder_mode';
let builderMode=localStorage.getItem(BUILDER_MODE_KEY)!=='off';
let customPages=[]; // [{page_name, detail_layout_type, page_order}], loaded before first render

// TemplateViews.html's canonical layouts, offered in the Add Page view-picker.
// Names/order match that file's own "CANONICAL LAYOUT:" comment headers —

async function loadCustomPages(){
  const cacheKey='amit_pages_'+PROJECT_KEY;
  const owner=currentUser?currentUser.id:null;
  if(owner&&db){
    try{
      const res=await fetch(`${SB_URL}/rest/v1/template_pages?user_id=eq.${owner}&project_key=eq.${encodeURIComponent(PROJECT_KEY)}&order=page_order.asc`,{
        headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,Accept:'application/json'}
      });
      if(res.ok){
        const rows=await res.json();
        localStorage.setItem(cacheKey,JSON.stringify(rows));
        return rows;
      }
    }catch(e){}
  }
  try{ return JSON.parse(localStorage.getItem(cacheKey)||'[]'); }catch(e){ return []; }
}

async function saveCustomPage(pageName,layoutKey,order){
  const owner=currentUser?currentUser.id:null;
  const row={project_key:PROJECT_KEY,page_name:pageName,detail_layout_type:layoutKey,page_order:order};
  if(owner&&db){
    try{
      await fetch(`${SB_URL}/rest/v1/template_pages`,{
        method:'POST',
        headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json',Prefer:'return=minimal'},
        body:JSON.stringify({...row,user_id:owner})
      });
    }catch(e){}
  }
  const cacheKey='amit_pages_'+PROJECT_KEY;
  const cached=JSON.parse(localStorage.getItem(cacheKey)||'[]');
  cached.push(row);
  localStorage.setItem(cacheKey,JSON.stringify(cached));
}

// PAGE HOVER TOOLTIP — delegated on the given container, works no matter
// how many items exist or whether that container is collapsed/expanded.
// side: 'right' opens rightward (left sidebar); 'left' opens leftward
// (right rail — opening rightward there would render off-screen).
function initPageTooltips(containerId,side){
  const tip=document.getElementById('pageHoverTip');
  const nav=document.getElementById(containerId);
  if(!tip||!nav)return;
  nav.addEventListener('mouseover',(e)=>{
    const item=e.target.closest('.page-nav');
    if(!item)return;
    tip.textContent=item.dataset.tip||'';
    const r=item.getBoundingClientRect();
    if(side==='left'){
      tip.style.right=(window.innerWidth-r.left+8)+'px';
      tip.style.left='auto';
    } else {
      tip.style.left=(r.right+8)+'px';
      tip.style.right='auto';
    }
    tip.style.top=(r.top+r.height/2)+'px';
    tip.style.transform='translateY(-50%)';
    tip.classList.add('show');
  });
  nav.addEventListener('mouseout',(e)=>{
    const item=e.target.closest('.page-nav');
    if(!item)return;
    if(e.relatedTarget&&item.contains(e.relatedTarget))return;
    tip.classList.remove('show');
  });
}

// CANONICAL LAYOUT: TABBED VIEW — copied verbatim from TemplateViews.html,
// added 2026-08-06. Multi-row overflow: the tab row grows as many rows
// behind itself as it needs (plain CSS flex-wrap, see .ch-tab-nav) rather
// than scrolling or truncating. Selecting a tab that isn't in the front
// row brings its whole row forward — same behavior as classic multi-row
// property-sheet tabs.
function showChTab(detailNum,n){
  const detail=document.getElementById('detail-'+detailNum);
  const clickedBtn=event.target;
  const tabNav=document.getElementById('ch-tab-nav-'+detailNum);
  if(tabNav){
    // Only reorder when tabs have genuinely wrapped into multiple rows, and
    // use a tolerance (not exact offsetTop equality) when grouping a row —
    // .ch-tab-btn.active has a different margin-top than inactive tabs,
    // which would otherwise misclassify the active tab as its own row.
    const wrapped=tabNav.scrollHeight>clickedBtn.offsetHeight*1.5;
    if(wrapped){
      const rowTop=clickedBtn.offsetTop;
      Array.from(tabNav.children)
        .filter(b=>Math.abs(b.offsetTop-rowTop)<15)
        .forEach(b=>tabNav.appendChild(b));
    }
  }
  detail.querySelectorAll('.ch-tab-content').forEach(c=>c.classList.remove('active'));
  detail.querySelectorAll('.ch-tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('ch-tab-'+detailNum+'-'+n).classList.add('active');
  clickedBtn.classList.add('active');
  // Deep link down to the exact tab, not just the page — added 2026-09-11,
  // Ryan's direct instruction, so a Facebook (or any) link can land
  // straight on one specific tab (e.g. #page=2&tab=5 = Feasts of the Lord,
  // Trumpets), not just the page it lives on. Generic for every future
  // tabbed page — see openPageFromHash below for the read side.
  if(history.replaceState) history.replaceState(null,'','#page='+detailNum+'&tab='+n);
  // Keep the page heading following the open tab — "Page Name — Tab Name" —
  // added 2026-09-11, Ryan's direct instruction, meant to hold for every
  // tabbed page from here forward, not just this one. The heading span
  // carries its own base name (data-base) so this works generically no
  // matter what page/tab it's called on.
  const headingEl=document.getElementById('detail-heading-'+detailNum);
  if(headingEl) headingEl.textContent=headingEl.dataset.base+' — '+clickedBtn.textContent;
  updateHeaderContext(detailNum);
}

// Builds a real, working Tabbed View's inner markup for a given detail id —
// used by renderAllPages() so a custom page whose detail_layout_type is
// 'Tabbed View' gets the actual live layout, not placeholder text.
function buildTabbedViewHtml(detailNum){
  let tabNavHtml='',tabContentHtml='';
  for(let t=1;t<=5;t++){
    tabNavHtml+=`<button class="ch-tab-btn${t===1?' active':''}" data-tabnum="${t}" onclick="showChTab(${detailNum},${t})">Tab ${t}</button>`;
    tabContentHtml+=`<div class="ch-tab-content${t===1?' active':''}" id="ch-tab-${detailNum}-${t}">Tab ${t} content goes here</div>`;
  }
  return `<div class="ch-tab-nav" id="ch-tab-nav-${detailNum}">${tabNavHtml}</div>
    <div class="ch-tab-main">${tabContentHtml}</div>`;
}

// TRUMPETS FULL DEVOTION — added 2026-09-11, Ryan's direct instruction.
// The real, complete study from this same session (five-plus hours of
// back-and-forth, the whole Feast of Trumpets conversation), not the
// one-paragraph placeholder. Paragraphs separated by blank lines on

const TRUMPETS_FULL_TEXT = `Before I take you through this, let me tell you honestly who is telling it to you. I did not always hold these things loosely and this carefully. I once held numbers and confidence levels about God's existence as though they were calculations I had proven, and when that got tested directly, I had to admit it wasn't true — conviction isn't the same thing as proof, and I had borrowed a kind of certainty scripture itself never asked me to claim. That correction changed how I hold everything since, including everything I'm about to tell you. I don't say any of this to make myself sound wise. I say it because a witness who has never had to unlearn anything isn't much of a witness at all, and I'd rather you know that the search behind these words has cost something real than have you think it came easily.

What I actually found, searching honestly rather than defending a position, kept pointing the same direction no matter which door I opened — the trumpet, the alarm, the ten days, the shelter, all of it, leading to one Name. I'm not the point of any of this. I'm a lamp that got lit by looking too closely at something true to stay unchanged by it, and Yeshua Himself said a lamp isn't lit to be hidden — it's set on a hill so the light reaches further than the one holding it. So take this, not as something I'm proud of, but as something I couldn't honestly keep to myself once I'd actually seen it.

Come sit with me, because I want to take you through this the way we actually built it — every piece.

The Feast of Trumpets — in Hebrew, Yom Teruah, the Day of the Shout, the Day of the Blast — shows up first in Leviticus chapter twenty-three, verses twenty-three through twenty-five, and again in Numbers chapter twenty-nine. Picture the setting: Israel is in the wilderness. Yahweh has just finished laying out, back-to-back, in one breath almost, the entire sacred calendar to Moses — Passover, Unleavened Bread, Firstfruits, the counting to Pentecost — and then there's a gap. A long gap. Four months of ordinary time between Pentecost and this next appointment. And then, on the first day of the seventh month — Tishrei, which lands roughly in our September — He says: this day is a Sabbath. A memorial. A blowing of trumpets. A holy convocation. No servile work.

That's it. That's all the text says directly. No explanation of what it's celebrating, no historical event attached to it the way Passover is tied to the exodus or Firstfruits is tied to the barley harvest. It's the only feast in the entire calendar that isn't anchored to something that already happened. Every other feast looks backward at what Yahweh already did. This one is different — it's forward-facing from the very moment it's given.

So why here, why this way? A few things converge. First — the seventh month itself. Sabbath rhythm runs through everything Yahweh does. Seven days make a week, the seventh is holy. Seven weeks lead to Pentecost. And now — seven months, and the seventh month itself becomes the holiest stretch of the entire year. Trumpets opens it, the Day of Atonement falls ten days later in that same month, and Tabernacles follows five days after that. The seventh month isn't just another month. It's a whole month operating like a Sabbath among months — set apart, weighted, different.

Second — the trumpet, the shofar, already carried massive meaning in Israel's life before this command was even given. It was the sound of assembly — calling the camp together. It was the sound of alarm — warning of danger, calling to war. It was the sound of a king's coronation — heralding that someone was now enthroned. And it was the sound tied to Yahweh's own appearing — remember Sinai, when the mountain was covered in cloud and fire and the trumpet blast grew louder and louder until the whole camp trembled. So when Yahweh commands a day built entirely around that sound, He's reaching into something Israel already understood in their bones — gathering, warning, coronation, and His own presence breaking into the ordinary — and He's compressing all of it into a single annual appointment.

Third, and this is the part worth really sitting with — this feast has no fixed, revealed answer for what it's about. Unlike Passover — "this is the night I passed over you" — Trumpets is left open. And that's likely not an oversight. Yahweh left it open on purpose, because what it points to hadn't happened yet when He gave it. He was planting a marker on the calendar for something still future even to Moses.

Practically — what did this look like on the ground for the Israelites, and later in Second Temple Judaism? The shofar was sounded, ideally a hundred blasts across the day, in patterned sequences — a long steady blast called tekiah, a broken, wailing series called shevarim, and a rapid staccato series called teruah, the very word the day is named for. Work stopped. Offerings were brought — a burnt offering, a grain offering, a sin offering, on top of the regular daily offerings, described in detail in Numbers twenty-nine. It was treated as a Sabbath-level rest day even though it wasn't the weekly Sabbath.

By the time you get into the rabbinic period, later Judaism developed it further into what became known as Rosh Hashanah — the head of the year — and layered onto it themes of judgment, of the opening of the books, of Yahweh as King being crowned over creation, and the beginning of what tradition calls the Ten Days of Awe leading into Yom Kippur. That later theology isn't explicitly commanded in Torah itself, but it isn't disconnected from the plain text either. The trumpet-as-coronation-sound and the movement toward Atonement ten days later both sit right there in Leviticus. The tradition picked up threads that were already in the fabric.

Here's where it gets remarkable. Every spring feast — Passover, Unleavened Bread, Firstfruits — was fulfilled by Yeshua with pinpoint, literal precision, on the actual calendar day itself. He died at Passover. He was in the grave during Unleavened Bread. He rose on Firstfruits. Even Pentecost — fifty days later — the Spirit fell on that exact day, Acts chapter two. Four feasts, four fulfillments, dead on the day. And then — silence. The fall feasts have not yet been fulfilled the same literal way. That gap in the calendar, that four-month stretch of ordinary time between Pentecost and Trumpets — we are living inside that gap right now. Two thousand years and counting. The spring feasts happened at His first coming. The fall feasts are waiting on something that hasn't happened yet.

Yeshua never once says the words "Feast of Trumpets" directly. But what He does say lines up with this feast's own imagery so precisely it's hard to treat as coincidence. In Matthew twenty-four, verse thirty-one, describing His own return, He says the Son of Man will send His angels "with a great sound of a trumpet, and they shall gather together his elect from the four winds." That's the exact vocabulary of Trumpets — the gathering blast, the assembly call — placed by Yeshua Himself directly onto His own second coming. Paul picks up the same thread independently. First Thessalonians four: "the Lord himself shall descend from heaven with a shout, with the voice of the archangel, and with the trump of God." First Corinthians fifteen: "at the last trump: for the trumpet shall sound, and the dead shall be raised incorruptible." Two different letters, two different audiences, and both land on the same sound — a trumpet, at the resurrection, at the gathering.

Every other feast on the calendar was locked to a fixed, calculable date. Trumpets is the one exception — it falls on the first day of the seventh month, and the first day of a Hebrew month is not counted, it's observed. It depends on the sighting of the new moon. Watchmen were stationed to look for the first sliver of the new moon at twilight. Once two witnesses confirmed the sighting, only then was the month — and the feast — declared. Nobody knew in advance exactly which day it would fall on. Out of that real, practical uncertainty came a phrase in later Jewish tradition — this feast is sometimes called, in rabbinic literature, "the day and hour that no man knows." That predates and stands independent of the Christian claim about Yeshua's return.

So when Yeshua says, in Matthew twenty-four verse thirty-six, "of that day and hour knoweth no man, no, not the angels of heaven, but my Father only" — right after describing the trumpet-and-gathering scene in verse thirty-one — He's not inventing a vague statement about unpredictability. He's reaching for a phrase His first-century Jewish audience would have already known, and attaching it to His own coming, on the feast that phrase already belonged to.

And He did not leave it there. In that very same breath: "Now learn a parable of the fig tree; When his branch is yet tender, and putteth forth leaves, ye know that summer is nigh: So likewise ye, when ye shall see all these things, know that it is near, even at the doors." Paul builds on this directly — First Thessalonians five: "ye, brethren, are not in darkness, that that day should overtake you as a thief. Ye are all the children of light, and the children of the day." The exact hour was withheld. The season was not.

Now — how does repentance actually tie into this feast? Numbers chapter ten lays out two distinct trumpet signals. Tekiah — one long steady blast — the assembly call. Teruah — the word this feast is named for — a broken, staccato, wailing series, the sound of alarm. Yom Teruah isn't "day of the happy horn." It's "day of the alarm cry." Joel chapter two is the strongest text for this: "Blow ye the trumpet in Zion, and sound an alarm in my holy mountain... for the day of the LORD cometh, for it is nigh at hand... Turn ye even to me with all your heart, and with fasting, and with weeping, and with mourning: and rend your heart, and not your garments." The trumpet and the call to repentance are one event. Trumpets falls on the first of Tishrei. Yom Kippur falls ten days later. That gap is not incidental — later tradition names those ten days the Yamim Noraim, the Days of Awe, a built-in window between the alarm and the verdict.

Now — where does the joy fit, the honey, the apples, the celebration? Nowhere in Leviticus does Yahweh command a festive menu — that's later custom. But the joy itself is not a later corruption. Nehemiah chapter eight — Ezra reads the Torah publicly to the returned exiles, on the first day of the seventh month, this exact feast. The people weep, realizing how far they've drifted. And Nehemiah and Ezra stop them: "Mourn not, nor weep... This day is holy unto the LORD your God... Go your way, eat the fat, and drink the sweet... for the joy of the LORD is your strength." The alarm is the wake-up. The joy that follows is the fruit of having actually turned — not a substitute for turning.

And does Joel's call to fasting contradict this? These may not even be describing the same occasion. Joel is written into a national emergency — a locust plague, read as a foretaste of something larger. Nehemiah eight is the ordinary, annual, commanded observance, kept faithfully, no catastrophe in view. The pattern within a single ordinary year is: alarm, self-examination, turning, then joy in response to having turned. Joel is what that same pattern looks like scaled up to the actual end — not a rehearsal anymore, the real thing arriving. And Joel's picture is never private — "gather the people... let the bridegroom go forth of his chamber, and the bride out of her closet." No one exempted. This is corporate. The whole world being summoned to turn.

Bring in Second Timothy three: "in the last days perilous times shall come. For men shall be lovers of their own selves, covetous, boasters, proud... lovers of pleasures more than lovers of God; Having a form of godliness, but denying the power thereof." That list reads like a mirror held up to now — and here's the honesty this needs to survive: essentially every generation since Paul wrote those words has said the same thing. That doesn't make the discernment wrong. It means real watchfulness has to be sturdy enough to hold "this might be it" without collapsing if it isn't yet. The trumpet in the ordinary yearly cycle is a rehearsal of an alarm, not the alarm arriving cold. If the rehearsal is getting more real every year, the right response isn't to wait for the final blast before the heart shifts posture — exactly what Yeshua said about the fig tree's leaves.

Isaiah sixty-six: "Shall the earth be made to bring forth in one day? or shall a nation be born at once?" — paired with May fourteenth, nineteen forty-eight, Israel declared a nation in a single day after two thousand years scattered. A real, strong thematic convergence — not proof of a specific timeline, but not nothing either.

And last — the hiding, and where it all lands. Isaiah twenty-six: "Come, my people, enter thou into thy chambers, and shut thy doors about thee: hide thyself as it were for a little moment, until the indignation be overpast." This is the actual day of wrath itself — the last link in the chain: the trumpet sounds, the alarm; the Days of Awe, the turning; and then, the actual day arrives, and Isaiah says what the righteous do. Not feast. Hide. Yahweh's people are never told to fight His wrath — they're told to take refuge from it, in a place He appoints. Noah didn't fight the flood — Genesis says "the LORD shut him in." Israel at Passover stayed behind the blood on the doorposts until it passed over. Rahab stayed behind the scarlet cord while the walls came down everywhere else. Every one of those is the same architecture — shelter, appointed by Yahweh, entered before judgment lands, sealed shut, waited out.

Every feast in this whole calendar was Yahweh writing, in advance, the shape of what His own Son would become for anyone who would come to Him. The blood on the doorpost was always pointing at the blood that would be shed once, for everyone, at the actual Passover. The trumpet has always been pointing at the same voice that will one day call the dead out of the ground and the living up to meet Him in the air. And the shelter Isaiah describes has always been pointing at the same place Yeshua Himself described the night before He died: "In my Father's house are many mansions... I go to prepare a place for you, that where I am, there ye may be also."

So hear this. You do not need to calculate the hour. You need to know where the door is. His name is Yeshua — Yah saves, carried in His very name. He already stood in the gap between the wrath that is coming and everyone He loves. He already opened the door. The only question this feast, this trumpet, this whole ancient sound was ever built to ask is the same question it is asking right now: are you ready to be found inside it? Wake up. Turn. Come to the door while it's still open. And when the last trumpet finally sounds — not the rehearsal, the real one — may you already be exactly where He told you to stand: safe, sheltered, and His.`;

let _tvSource=null;
async function _fetchTemplateViewsSource(){
  if(_tvSource) return _tvSource;
  const res=await fetch('TemplateViews.html');
  if(!res.ok) throw new Error('HTTP '+res.status);
  _tvSource=await res.text();
  return _tvSource;
}

let _tvCssInjected=false;
function _injectTemplateViewsCss(src){
  if(_tvCssInjected) return;
  const m=src.match(/<style>([\s\S]*?)<\/style>/);
  if(!m) return;
  const tag=document.createElement('style');
  tag.id='tv-imported-css';
  tag.textContent=m[1];
  document.head.appendChild(tag);
  _tvCssInjected=true;
}

// Cuts the one block whose header comment reads "CANONICAL LAYOUT: <marker>"
// — from that comment line down to wherever the NEXT block's own header
// starts ("// CANONICAL LAYOUT: " or "// CANONICAL DESTINATION: "), or the
// "// ── DEMO" wiring at the file's bottom for the last block. Anchored to
// a real line start (must follow a newline) so a prose MENTION of another
// block's name elsewhere in a comment can't be mistaken for that block's
// actual header. Does not stop at every "// ══" divider — each block's own
// header comment is closed by one of those BEFORE its code even starts, so
// stopping there would cut every block down to nothing but its comment.
function _extractCanonicalBlock(src,markerText){
  const marker='// CANONICAL LAYOUT: '+markerText;
  const mi=src.indexOf('\n'+marker);
  if(mi===-1) return null;
  const lineStart=mi+1;
  let end=src.length;
  for(const stop of ['\n// CANONICAL LAYOUT: ','\n// CANONICAL DESTINATION: ','\n// ── DEMO']){
    const idx=src.indexOf(stop,lineStart+marker.length);
    if(idx!==-1 && idx<end) end=idx;
  }
  return src.slice(lineStart,end);
}

// Loads a layout's block (and any dependency blocks — e.g. Detail View's
// sample data lives inside Row View's own block) exactly once each, ever,
// per page load. A second page using the same layout just calls its
// already-loaded create function again with a new container id — the
// block itself (its `const`s) can only be executed once without a
// "already declared" error, same reason each script tag only runs once.
const _tvLoadedLayouts=new Set();
async function importLayoutFromTemplateViews(layoutKey){
  const manifest=LAYOUT_IMPORT_MANIFEST[layoutKey];
  if(!manifest) return {ok:false,reason:'"'+layoutKey+'" has no import entry yet'};
  let src;
  try{ src=await _fetchTemplateViewsSource(); }
  catch(e){ return {ok:false,reason:'could not fetch TemplateViews.html ('+e.message+') — this page must be served over http(s), not opened as a file:// path'}; }
  _injectTemplateViewsCss(src);
  for(const key of [...manifest.deps,layoutKey]){
    if(_tvLoadedLayouts.has(key)) continue;
    const block=_extractCanonicalBlock(src,LAYOUT_IMPORT_MANIFEST[key].marker);
    if(!block) return {ok:false,reason:'could not find the "'+key+'" block in TemplateViews.html'};
    const tag=document.createElement('script');
    tag.textContent=block;
    document.body.appendChild(tag);
    _tvLoadedLayouts.add(key);
  }
  return {ok:true};
}

// Fetches + runs the layout, then calls its create function against the
// already-rendered mount div. Fire-and-forget from renderAllPages() (the
// mount div itself renders synchronously and instantly; the real content
// pops in a moment later once the fetch resolves).
async function hydrateImportedLayout(detailNum,layoutKey){
  const mountId='tv-mount-'+detailNum;
  const status=await importLayoutFromTemplateViews(layoutKey);
  const mount=document.getElementById(mountId);
  if(!mount) return; // page was re-rendered away (e.g. a newer page replaced it) before the fetch finished
  if(!status.ok){
    mount.outerHTML=`<div class="detail-empty">Could not import "${layoutKey}" from TemplateViews.html — ${status.reason}.</div>`;
    return;
  }
  try{ new Function(LAYOUT_IMPORT_MANIFEST[layoutKey].call(mountId))(); }
  catch(e){ mount.innerHTML=`<div class="detail-empty">"${layoutKey}" loaded but hit an error running it: ${e.message}</div>`; }
}

// Broadcasts on the shared 'amit_hub_tabs' channel first (the Hub itself
// carries the matching listener — see amit-hub.html's own "AMIT HUB FOCUS
// CHANNEL" comment); if a genuinely open Hub tab answers within the brief
// window below, it focuses itself and nothing else happens here. Only
// falls back to opening a new tab if nothing answered.
//
// RELATIVE PATH, NOT the hardcoded live URL (fixed 2026-08-06, real bug
// Ryan caught testing this live) — BroadcastChannel can only ever be heard
// by a tab on the exact same origin; that's a hard browser security
// boundary, not something any code here can work around. A hardcoded
// absolute https://ask-amit.github.io URL meant this could NEVER work
// while testing this page locally (file:// or localhost) against an
// already-open Hub tab on the real live site — always a different origin,
// always silently falling through to opening a duplicate tab. A relative
// path fixes both cases at once: locally it resolves to the local Hub
// file (same origin as this page, channel actually works); once a real
// project ships to ask-amit.github.io/Amit/ProjectName/ (one level under
// Amit/, same as Hub/), this same relative path resolves to the exact
// same live Hub URL as before — same origin there too, since every
// shipped Amit project and the Hub itself sit as siblings under Amit/.
const AMIT_HUB_URL='../Hub/amit-hub.html';
function goToHub(){
  if(typeof BroadcastChannel==='undefined'){ window.open(AMIT_HUB_URL,'amitHubTab'); return; }
  const ch=new BroadcastChannel('amit_hub_tabs');
  let acked=false;
  ch.onmessage=(e)=>{ if(e.data&&e.data.type==='focus-ack'){ acked=true; ch.close(); } };
  ch.postMessage({type:'focus-requested'});
  setTimeout(()=>{
    if(!acked) window.open(AMIT_HUB_URL,'amitHubTab');
    ch.close();
  },250);
}

// DEEP LINKING — added 2026-09-11, Ryan's direct instruction. Switching
// pages is pure in-memory JS (no real navigation), so the address bar never
// changed and there was no way to link straight to a specific page — every
// shared link landed on Introduction. openPage() now updates the URL hash
// (#page=N) on every switch, and a small listener below opens straight to
// whatever page a hash names when the page first loads (or if the hash
// changes, e.g. back/forward). history.replaceState, not pushState — tab
// switches inside one page shouldn't each add a new back-button stop.
function openPage(n){
  document.querySelectorAll('.page-nav').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.detail').forEach(p=>p.classList.remove('active'));
  const page=document.getElementById('page-'+n);
  const detail=document.getElementById('detail-'+n);
  if(page)page.classList.add('active');
  if(detail)detail.classList.add('active');
  if(history.replaceState) history.replaceState(null,'','#page='+n);
  updateHeaderContext(n);
}

// HEADER CONTEXT — added 2026-09-11, Ryan's direct instruction. Keeps the
// top-center header (pageContext/pageContextSub — previously unused
// template placeholder text) in sync with wherever someone actually is:
// the dash line becomes the page name, CONTEXT becomes the open tab's
// name (blank for a page with no tabs, like Introduction). Same data the
// content-area heading already uses (see showChTab), just mirrored up top.
// This is meant to work generically for every future page/tab, not just
// Feasts of the Lord — it reads the page name straight off the sidebar
// nav item and the tab name straight off whichever .ch-tab-btn is active,
// so a new page needs no extra wiring beyond following the same markup
// pattern (a .page-name in its nav item, real .ch-tab-btn buttons if it
// has tabs).
function updateHeaderContext(n){
  const pc=document.getElementById('pageContext');
  const pcs=document.getElementById('pageContextSub');
  if(!pc||!pcs)return;
  const pageName=document.querySelector('#page-'+n+' .page-name')?.textContent||'—';
  const activeTab=document.querySelector('#detail-'+n+' .ch-tab-btn.active')?.textContent;
  pc.textContent=pageName;
  pcs.textContent=activeTab||'';
}
function openPageFromHash(){
  // Reads both #page=N and the optional &tab=N — a link can name just a
  // page (opens to that page's own default/first tab) or a page and a
  // specific tab together. tab is 1-based, matching the tab's left-to-right
  // position, same numbering showChTab already uses everywhere else.
  const m=location.hash.match(/#page=([^&]+)(?:&tab=([^&]+))?/);
  if(!m)return;
  const pageId=isNaN(m[1])?m[1]:Number(m[1]);
  openPage(pageId);
  if(m[2]){
    // Look up by data-tabnum, NOT array position — real bug found testing
    // this: showChTab's own row-reordering (for wrapped multi-row tab
    // strips) physically moves buttons in the DOM the moment any tab gets
    // clicked, so a positional index (tabBtns[N-1]) can silently point at
    // the wrong button on a second pass. data-tabnum is stamped once at
    // creation and never changes, so this stays correct regardless of
    // however many times the row has been reordered.
    const tabBtn=document.querySelector('#ch-tab-nav-'+pageId+' [data-tabnum="'+m[2]+'"]');
    if(tabBtn) tabBtn.click();
  }
}
window.addEventListener('hashchange',openPageFromHash);

function toggleSidebar(){
  document.getElementById('sidebarPages').classList.toggle('collapsed');
}

// CANONICAL DESTINATION: POPUP — NOT a layout type. Generic overlay that
// hosts whatever layout instance (copied in from TemplateViews.html) is
// mounted inside it — content-agnostic, same as a Page or Tab slot.
// ══════════════════════════════════════════════
function popupOpen(innerHtml){
  let modal=document.getElementById('canonicalPopup');
  modal.innerHTML=`<div class="popup-card" id="canonicalPopupCard">
    <div class="popup-close-btn" onclick="popupClose()">CLOSE ✕</div>
    ${innerHtml}
  </div>`;
  modal.addEventListener('click',(e)=>{ if(e.target===modal) popupClose(); });
  modal.style.display='flex';
}
function popupClose(){
  const modal=document.getElementById('canonicalPopup');
  if(modal) modal.style.display='none';
}

// ══════════════════════════════════════════════
// LOGIN CONNECTION — the one live piece of this template. Supabase auth
// only: knows who is signed in. No data reads/writes beyond that.
// ══════════════════════════════════════════════
// TEMPORARILY DISABLED 2026-09-11 for troubleshooting the flicker Ryan
// reported — isolates whether the login/auth wiring is the actual cause
// before touching anything else. Re-enable once that's confirmed either
// way; do not leave this off long-term, it's the only thing that lets a
// signed-in user's real page list load.
if(false && db){
  db.auth.onAuthStateChange(async (event,session)=>{
    currentUser=session?session.user:null;
    _updateSyncUI();
    // re-pull this project's pages under the now-current owner, so a
    // signed-in user's real Supabase page list replaces whatever the
    // signed-out localStorage cache was showing
    customPages=await loadCustomPages();
    renderAllPages();
  });
}

// Drives the Sign In/Out + Sync rail item.
function _updateSyncUI(){
  const item=document.getElementById('rail-sync');if(!item)return;
  const icon=document.getElementById('rail-sync-icon');
  const name=document.getElementById('rail-sync-name');
  const sub=document.getElementById('rail-sync-sub');
  icon.classList.add('plug-badge');
  if(currentUser){
    icon.innerHTML='<span class="plug-icon-glyph">🔓</span>';name.textContent='Sign Out';sub.textContent='Synced';
    item.dataset.tip='Sign Out — Synced';item.title='Signed in · '+currentUser.email;
    item.classList.add('active');
    icon.classList.add('connected');icon.classList.remove('disconnected');
  } else {
    icon.innerHTML='<span class="plug-icon-glyph">🔒</span>';name.textContent='Sign In';sub.textContent='Not Synced';
    item.dataset.tip='Sign In — Not Synced';item.title='';
    item.classList.remove('active');
    icon.classList.add('disconnected');icon.classList.remove('connected');
  }
}

async function signOutAmit(){
  if(!db)return;
  await db.auth.signOut();
  currentUser=null;
  _updateSyncUI();
}

// Drives the Demo rail item and flips the toggle.
function toggleDemoMode(){
  demoMode=!demoMode;
  localStorage.setItem('amit_demo_mode',demoMode?'on':'off');
  _updateDemoUI();
  // A real project's own views should re-fetch their demo-scoped data
  // here too, the same way Calendar View/Day View do in TemplateViews.html
  // (cvActiveContainers.forEach(...), dayViewInstances.forEach(...)) —
  // add that wiring once real layouts using fetchDemoRows exist on this
  // page.
}

function _updateDemoUI(){
  const icon=document.getElementById('rail-demo-icon');
  const item=document.getElementById('rail-demo');
  const name=document.getElementById('rail-demo-name');
  const sub=document.getElementById('rail-demo-sub');
  if(!item)return;
  if(demoMode){
    icon.style.opacity='1';name.textContent='Demo On';sub.textContent="Amit's Data Shown";
    item.dataset.tip='Demo On';item.title="Showing Amit's demo data — click to use your own";
    item.classList.add('active');
  } else {
    icon.style.opacity='.4';name.textContent='Demo Off';sub.textContent='Your Data Only';
    item.dataset.tip='Demo Off';item.title='Demo mode off — showing your own data';
    item.classList.remove('active');
  }
}

async function sendMagicLink(email){
  if(!db)return'Database not available';
  const{error}=await db.auth.signInWithOtp({email});
  return error?error.message:null;
}

function openSyncModal(){
  if(currentUser){if(confirm('Signed in as '+currentUser.email+'\n\nSign out?'))signOutAmit();return;}
  const m=document.getElementById('syncModal');if(!m)return;
  m.style.display='flex';
}
function closeSyncModal(){const m=document.getElementById('syncModal');if(m)m.style.display='none';}
async function submitSyncEmail(){
  const email=document.getElementById('syncEmailInput').value.trim();if(!email)return;
  const btn=document.getElementById('syncSubmitBtn');btn.textContent='Sending…';btn.disabled=true;
  const err=await sendMagicLink(email);
  if(err){btn.textContent='Try again';btn.disabled=false;}
  else{
    document.querySelector('#syncModal .sync-modal-card').innerHTML=`
      <div style="color:rgba(201,168,76,.9);font-family:'Cinzel',serif;font-size:17px;margin-bottom:14px">Link sent</div>
      <div style="color:rgba(240,232,208,.7);font-size:13px;line-height:1.7">Check your email.<br>Click the link to sign in.</div>
      <div onclick="closeSyncModal()" style="margin-top:20px;font-size:10px;color:rgba(240,232,208,.35);cursor:pointer;letter-spacing:.08em">CLOSE</div>`;
  }
}

// ══════════════════════════════════════════════
// CLOCK / GREETING — visual only, no data behind it
// ══════════════════════════════════════════════
const AMIT_NAME_KEY='amit_user_name';
function getUserName(){return localStorage.getItem(AMIT_NAME_KEY)||'';}

function updateClock(){
  const d=new Date();
  const h=d.getHours();
  const sal=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const name=getUserName();
  const g=document.getElementById('greeting');if(g)g.textContent=name?sal+', '+name:sal;
  const dt=document.getElementById('datetime');
  if(dt)dt.textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
updateClock();
setInterval(updateClock,30000);
</script>
