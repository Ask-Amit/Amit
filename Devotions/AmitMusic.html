<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amit Music</title>
<link rel="icon" type="image/x-icon" href="amit_icon.ico">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09141f;
  --card-head:#0f2338;
  --border:rgba(201,168,76,0.55);
  --gold:#c9a84c;
  --gold2:#e8c56a;
  --text2:#f0e8d0;
  --muted:rgba(240,232,208,0.78);
  --dim:rgba(240,232,208,0.42);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  font-family:'Crimson Pro',Georgia,serif;
  color:var(--text2);
  display:flex;flex-direction:column;
  min-height:100vh;
}
header{
  display:flex;align-items:center;gap:12px;
  padding:14px 24px;
  background:var(--card-head);
  border-bottom:2px solid var(--border);
  flex-shrink:0;
}
header img{height:30px;width:30px}
header .title{font-family:'Cinzel',serif;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold2);font-weight:700}
header .sub{font-size:11px;color:var(--dim);margin-top:2px}

.stage{
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:24px;
  position:relative;
}
video{
  max-width:100%;max-height:100%;
  width:100%;height:auto;
  border-radius:10px;
  border:1px solid var(--border);
  background:#000;
  box-shadow:0 0 0 1px rgba(201,168,76,.15), 0 20px 60px rgba(0,0,0,.5);
}
.not-found{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}

.controls{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  padding:16px 24px 24px;
  flex-shrink:0;
}
.ctl-btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 20px;border-radius:9px;
  border:1px solid var(--gold);
  background:rgba(201,168,76,.16);
  color:var(--gold2);
  font-family:'Cinzel',serif;font-size:12px;letter-spacing:.06em;font-weight:600;
  cursor:pointer;
  box-shadow:0 0 0 1px rgba(201,168,76,.25);
}
.ctl-btn:hover{background:rgba(201,168,76,.26)}
.ctl-btn.close{border-color:rgba(201,168,76,.3);background:rgba(255,255,255,.03);color:var(--muted)}

.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--card-head);border:1px solid var(--gold);color:var(--gold2);
  padding:10px 20px;border-radius:9px;font-family:'Cinzel',serif;font-size:12px;
  letter-spacing:.04em;opacity:0;transition:opacity .25s,transform .25s;
  pointer-events:none;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════
     AMIT MUSIC — ONE shared player for every song, driven entirely by
     ?song=<slug> in the URL. Added 2026-09-11, Ryan's direct instruction,
     replacing an earlier "one HTML file per song" approach once it became
     clear the actual player never needed to be duplicated — only the
     Facebook/Open-Graph preview info does (that piece genuinely can't be
     dynamic on static hosting, since Facebook's crawler never runs this
     page's JavaScript and can't see the query string). See each song's own
     tiny "stub" file (e.g. BlowTheShofar.html) for that other half: real,
     hardcoded preview tags + an instant redirect to THIS page with the
     right ?song=. Adding a new song from here forward means: drop in its
     video/cover files, add one entry to SONGS below, write one small stub
     file from the same template — never build a whole new player page.
     ══════════════════════════════════════════════ -->
<script>
const SONGS={
  'blow-the-shofar':{
    title:'Blow the Shofar',
    sub:'Feast of Trumpets — Yom Teruah',
    video:'Blow_the_Shofar.mp4',
    poster:'Blow_the_Shofar_Cover.png',
    stub:'BlowTheShofar.html',
    closeUrl:'Devotions.html#page=2&tab=5',
    lyrics:`[Verse 1]
In the seventh month, the first new moon thin
No one knows the hour it shall begin
Watchmen on the wall, watching for the moon
No comfort in the air — it's an alarm, not a tune

[Pre-Chorus]
Wake up, sleeper, the leaves are on the tree
Summer's at the door, can't you feel it, can't you see
The King is calling His people home

[Chorus]
Blow the shofar, let it cry, let it roar
Sound the alarm at heaven's door
Gather the bride, here comes the Son
This is the sound of the Kingdom come
Blow the shofar, wake the dead
Every promise that was ever said
Rides on this blast, rides on this cry
Yeshua's coming on the clouds of the sky

[Verse 2]
Noah heard the rain and shut the door
Yahweh sealed him in before the flood could roar
Blood on the post, and the angel passed by
Rahab tied her cord, and she did not die

[Pre-Chorus]
Hide me, Father, in the shadow of Your wing
Let the wrath pass over while the remnant sings
You've always made a shelter for Your own

[Chorus]
Blow the shofar, let it cry, let it roar
Sound the alarm at heaven's door
Gather the bride, here comes the Son
This is the sound of the Kingdom come
Blow the shofar, wake the dead
Every promise that was ever said
Rides on this blast, rides on this cry
Yeshua's coming on the clouds of the sky

[Bridge]
I don't know the day, I don't know the hour
But I know the Name, I know the power
So I'll turn tonight, I'll rend my heart
Not my garments — let the healing start
Joy in the morning, then it turns to song
Because the door is open, and He won't wait long

[Chorus]
Blow the shofar, let it cry, let it roar
Sound the alarm at heaven's door
Gather the bride, here comes the Son
This is the sound of the Kingdom come
Blow the shofar, wake the dead
Every promise that was ever said
Rides on this blast, rides on this cry
Yeshua's coming — lift your eyes to the sky

Blow the shofar, wake the dead
Every promise that was ever said
Rides on this blast, rides on this cry
Yeshua's coming — lift your eyes to the sky

[Final Chorus]
Blow the shofar, let it cry, let it roar
Sound the alarm at heaven's door
Gather the bride, here comes the Son
This is the sound of the Kingdom come
Blow the shofar, wake the dead
Every promise that was ever said
Rides on this blast, rides on this cry
Yeshua's coming — lift your eyes to the sky`
  }
};
</script>

<header>
  <img src="amit_icon.ico" alt="Amit">
  <div>
    <div class="title" id="songTitle">Amit Music</div>
    <div class="sub" id="songSub">—</div>
  </div>
</header>

<div class="stage" id="stage"></div>

<div class="controls" id="controls" style="display:none">
  <button class="ctl-btn" id="playPauseBtn" onclick="togglePlayPause()">▶ Play</button>
  <button class="ctl-btn" onclick="replaySong()">⟲ Replay</button>
  <button class="ctl-btn" id="lyricsBtn" onclick="openLyrics()" style="display:none">📜 Lyrics</button>
  <button class="ctl-btn" onclick="shareSong()">🔗 Share</button>
  <button class="ctl-btn" id="devotionBtn" style="display:none;font-size:11px;padding:8px 14px" onclick="closeSong()" title="This song lives at the top of its own devotion page">📖 Read the Study</button>
  <button class="ctl-btn close" onclick="closeSong()">✕ Close</button>
</div>

<!-- LYRICS POPUP — a small card, not a full-screen takeover, so the video
     keeps playing underneath it. Added 2026-09-11, Ryan's direct
     instruction: people should be able to open this while the song plays,
     read along, and print it, without losing the video. -->
<div id="lyricsOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--card-head);border:1px solid var(--gold);border-radius:12px;max-width:520px;width:100%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)">
      <div style="font-family:'Cinzel',serif;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2)" id="lyricsTitle">Lyrics</div>
      <button class="ctl-btn close" style="padding:4px 12px" onclick="closeLyrics()">✕</button>
    </div>
    <div id="lyricsBody" style="padding:18px 22px;overflow-y:auto;white-space:pre-line;line-height:1.7;font-size:14px"></div>
    <div style="padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:flex-end">
      <button class="ctl-btn" onclick="printLyrics()">🖨 Print Lyrics</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">Link copied</div>

<script>
const params=new URLSearchParams(window.location.search);
const slug=params.get('song');
const song=slug?SONGS[slug]:null;
let video=null;

if(!song){
  document.getElementById('stage').innerHTML='<div class="not-found">No song selected.</div>';
} else {
  document.getElementById('songTitle').textContent=song.title;
  document.getElementById('songSub').textContent=song.sub;
  document.title=song.title+' — Amit';
  document.getElementById('stage').innerHTML=
    `<video id="songVideo" src="${song.video}" poster="${song.poster}" playsinline autoplay></video>`;
  document.getElementById('controls').style.display='flex';
  video=document.getElementById('songVideo');
  const playPauseBtn=document.getElementById('playPauseBtn');
  video.addEventListener('play',()=>playPauseBtn.textContent='⏸ Pause');
  video.addEventListener('pause',()=>playPauseBtn.textContent='▶ Play');
  video.addEventListener('ended',()=>{ video.pause(); setTimeout(closeSong,600); });
  // Autoplay — added 2026-09-11, Ryan's direct instruction: land on this
  // page and it just starts. video.play() is called explicitly (not just
  // the autoplay attribute) because some browsers only honor autoplay
  // silently-fail rather than throw if the browser's autoplay policy
  // blocks it (varies by browser/profile — nothing app code can force
  // past) — the person can still just press Play themselves in that case.
  video.play().catch(()=>{});
  if(song.lyrics) document.getElementById('lyricsBtn').style.display='inline-flex';
  if(song.closeUrl) document.getElementById('devotionBtn').style.display='inline-flex';
}

function openLyrics(){
  if(!song||!song.lyrics)return;
  document.getElementById('lyricsTitle').textContent=song.title+' — Lyrics';
  document.getElementById('lyricsBody').textContent=song.lyrics;
  document.getElementById('lyricsOverlay').style.display='flex';
}
function closeLyrics(){
  document.getElementById('lyricsOverlay').style.display='none';
}
// Prints just the lyrics, in their own window — printing the live app
// page directly would also try to print the video/controls/whole layout.
function printLyrics(){
  if(!song||!song.lyrics)return;
  const w=window.open('','_blank');
  w.document.write(`<!DOCTYPE html><html><head><title>${song.title} — Lyrics</title>
    <style>body{font-family:Georgia,serif;white-space:pre-line;line-height:1.7;padding:40px;max-width:600px;margin:0 auto}
    h1{font-size:20px;margin-bottom:24px}</style></head>
    <body><h1>${song.title}</h1>${song.lyrics.replace(/</g,'&lt;')}</body></html>`);
  w.document.close();
  w.focus();
  w.print();
}

function togglePlayPause(){
  if(!video)return;
  if(video.paused){ video.play(); } else { video.pause(); }
}
function replaySong(){
  if(!video)return;
  video.currentTime=0;
  video.play();
}
// Shares the song's own STUB page, not this player's own URL — the stub
// is what carries the real, distinct Open Graph preview for that song.
function shareSong(){
  if(!song)return;
  const url=window.location.origin+window.location.pathname.replace(/[^/]*$/,'')+song.stub;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(showToast).catch(()=>{ prompt('Copy this link:',url); });
  } else {
    prompt('Copy this link:',url);
  }
}
function showToast(){
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
function closeSong(){
  window.location.href=song?song.closeUrl:'Devotions.html';
}
</script>

</body>
</html>
