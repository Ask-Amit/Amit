<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shoshone Honda Yamaha — Scan to Open</title>
<style>
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#14171c;color:#e8e8ea;font-family:-apple-system,Segoe UI,Roboto,sans-serif;gap:16px;padding:20px;text-align:center}
  h1{font-size:18px;color:#e0bd6a;margin:0}
  #qr{background:#fff;padding:16px;border-radius:12px}
  .url{font-size:12px;color:#8b909a;word-break:break-all;max-width:320px}
</style>
</head>
<body>
<h1>Scan to open Recon Capture</h1>
<div id="qr"></div>
<div class="url">https://ask-amit.github.io/Amit/ShoshoneHondaYamaha/capture.html</div>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
  const qr = qrcode(0, 'M');
  qr.addData('https://ask-amit.github.io/Amit/ShoshoneHondaYamaha/capture.html');
  qr.make();
  document.getElementById('qr').innerHTML = qr.createImgTag(8, 8);
</script>
</body>
</html>
