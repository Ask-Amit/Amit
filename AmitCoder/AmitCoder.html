<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmitCoder</title>
<link rel="icon" type="image/png" href="../amit_icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../Amit_Ask_Live.js?v=6.02"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09141f;
  --card-head:#0f2338;
  --border:rgba(201,168,76,0.55);
  --gold:#c9a84c;
  --gold2:#e8c56a;
  --text:#ffffff;
  --text2:#f0e8d0;
  --muted:rgba(240,232,208,0.78);
  --dim:rgba(240,232,208,0.42);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:'Crimson Pro',Georgia,serif;color:var(--text);display:flex;flex-direction:column}

body::before{
  content:'';
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:60vmin;height:60vmin;
  background:url('../amit_icon.png') center/contain no-repeat;
  opacity:.035;
  pointer-events:none;
  z-index:0;
}

/* ── HEADER ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 28px;
  background:var(--card-head);
  border-bottom:2px solid var(--border);
  flex-shrink:0;
  position:relative;
}
.page-title-wrap{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
}
.page-title{
  font-family:Georgia,serif;font-size:26px;font-weight:700;
  letter-spacing:.3px;text-transform:none;color:var(--gold2);
}
.page-version{
  font-family:monospace;font-size:11px;letter-spacing:.05em;
  color:rgba(201,168,76,.55);margin-top:2px;
}
.brand{display:flex;align-items:baseline;gap:14px}
.brand-sub{font-style:italic;color:rgba(240,232,208,.55);font-size:12px}
.hdr-right{text-align:right}
.greeting{font-family:'Cinzel',serif;font-size:16px;color:#fff;font-weight:600}
.datetime{font-size:12px;color:var(--muted);margin-top:2px}
.help-btn{width:22px;height:22px;border-radius:50%;border:1px solid rgba(240,232,208,.3);color:rgba(240,232,208,.6);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:all .15s}
.help-btn:hover{border-color:var(--gold);color:var(--gold)}

/* ── HUB LAYOUT ── */
.hub{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  width:230px;flex-shrink:0;
  background:var(--card-head);
  border-right:2px solid var(--border);
  display:flex;flex-direction:column;
  overflow-y:auto;padding:12px 10px;gap:5px;
}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:2px}
.sidebar{transition:width .18s ease}
.sidebar.collapsed{width:60px}
.sidebar.collapsed .tile{justify-content:center;padding:10px 0}
.sidebar.collapsed .tile-info{display:none}
.tile{
  display:flex;align-items:center;gap:10px;
  padding:10px 11px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;
  transition:all .18s;user-select:none;
  position:relative;overflow:hidden;
}
.tile:hover{background:rgba(255,255,255,.07);border-color:rgba(201,168,76,.3)}
.tile.active{background:rgba(201,168,76,.16);border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,168,76,.25)}
.tile-icon{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.tile-info{flex:1;min-width:0}
.tile-name{font-family:'Cinzel',serif;font-size:11px;color:#fff;letter-spacing:.04em;font-weight:600}
.tile-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ── ASK AMIT SIDEBAR — matches Hub/Council exactly ── */
.ask-amit-wrap{margin-top:auto;padding:12px 0 4px;border-top:1px solid var(--border);flex-shrink:0}
.ask-amit-tile{
  display:flex;align-items:center;gap:10px;width:100%;
  background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.45);
  border-radius:9px;padding:11px 12px;cursor:pointer;
  transition:all .18s;
}
.ask-amit-tile:hover{background:rgba(201,168,76,.22);border-color:var(--gold);box-shadow:0 0 8px rgba(201,168,76,.2)}
.ask-amit-icon{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.ask-amit-name{font-family:'Cinzel',serif;font-size:11px;color:var(--gold2);letter-spacing:.04em;font-weight:600}
.ask-amit-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* ── MAIN AREA ── */
.main-area{flex:1;overflow:hidden;position:relative;background:var(--bg)}
.panel{
  position:absolute;inset:0;overflow-y:auto;
  display:none;flex-direction:column;
  animation:pfade .18s ease;
}
.panel.active{display:flex}
@keyframes pfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel::-webkit-scrollbar{width:5px}
.panel::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:3px}

/* ── PANEL HEADER ── */
.panel-head{
  display:flex;align-items:center;gap:16px;
  padding:14px 24px;
  background:var(--card-head);
  border-bottom:2px solid var(--border);
  flex-shrink:0;
}
.panel-heading{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.panel-empty{flex:1;display:flex;align-items:center;justify-content:center;color:rgba(240,232,208,.25);font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* ── TABBED LAYOUT (copied structure from Computer Health's folder-tab UI) ── */
.ch-tab-nav{display:flex;align-items:flex-end;gap:6px;margin:0 24px;padding:0;background:var(--bg);flex-shrink:0}
.ch-tab-btn{padding:9px 22px;margin-top:10px;border:1px solid rgba(201,168,76,.25);background:rgba(255,255,255,.03);color:var(--muted);border-radius:10px 10px 0 0;cursor:pointer;font-size:13px;font-family:inherit}
.ch-tab-btn.active{padding:12px 26px;margin-top:-2px;margin-bottom:-3px;border-bottom:none;background:var(--card-head);color:var(--gold2);font-weight:600;font-size:14px;position:relative;z-index:2}
.ch-tab-main{flex:1;min-height:0;overflow-y:auto;padding:28px 32px;margin:0 24px 24px;background:var(--card-head);border:1px solid rgba(201,168,76,.25);border-radius:0 12px 12px 12px}
.ch-tab-content{display:none}
.ch-tab-content.active{display:block}

/* ── AMITCODER-SPECIFIC CONTENT STYLES (additive only — nothing above this line is touched) ── */
.panel-body p{margin-bottom:12px;line-height:1.8}
.panel-body h3{color:var(--gold2);font-size:15px;margin:20px 0 8px;font-family:'Cinzel',serif}
.panel-body ul{margin:6px 0 14px 22px;line-height:1.8}
.panel-body li{margin-bottom:6px}
.panel-body code{background:rgba(255,255,255,.08);padding:1px 6px;border-radius:3px;color:var(--gold2);font-size:13px}
.badge{display:inline-block;margin-top:14px;padding:5px 12px;border:1px solid var(--border);border-radius:3px;color:var(--gold);font-size:11px;letter-spacing:.05em}
.finding{border-left:2px solid var(--gold);padding:6px 0 6px 14px;margin:10px 0;color:var(--muted);font-size:13px;line-height:1.7}
.finding b{color:var(--text2)}
.btn{font-family:'Cinzel',serif;font-size:11px;cursor:pointer;border-radius:6px;padding:8px 16px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text2)}
.btn:hover{background:rgba(255,255,255,.09)}
.btn-gold{border-color:rgba(201,168,76,.5);color:var(--gold2);background:rgba(201,168,76,.1)}
.btn-gold:hover{background:rgba(201,168,76,.18)}
.btn-sm{padding:5px 11px;font-size:10.5px}
.trigger-tag{display:inline-block;background:rgba(201,168,76,.14);color:var(--gold2);border:1px solid rgba(201,168,76,.4);border-radius:4px;padding:2px 9px;font-weight:600;font-size:12px}
.trigger-tag.builtin-tag{background:rgba(120,170,220,.14);color:#9fc2ea;border-color:rgba(120,170,220,.4)}
.sc-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.sc-filters{display:flex;gap:6px}
.sc-filter{font-size:11px;padding:5px 13px;border-radius:12px;border:1px solid var(--border);cursor:pointer;color:var(--muted);font-family:'Cinzel',serif}
.sc-filter.active{border-color:var(--gold);color:var(--gold2);background:rgba(201,168,76,.12)}
.sc-card{border:1px solid var(--border);border-radius:8px;margin-bottom:10px;background:rgba(255,255,255,.02);overflow:hidden}
.sc-card.builtin{border-color:rgba(120,170,220,.35)}
.sc-card-head{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer}
.sc-card-head:hover{background:rgba(255,255,255,.03)}
.sc-type{font-size:10px;color:var(--dim);border:1px solid var(--border);border-radius:4px;padding:1px 7px;letter-spacing:.03em;text-transform:uppercase}
.sc-instruction{flex:1;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-origin{font-size:10px;letter-spacing:.05em;color:var(--dim)}
.sc-caret{color:var(--dim);font-size:10px;transition:transform .12s}
.sc-card.expanded .sc-caret{transform:rotate(90deg)}
.sc-subs{display:none;border-top:1px solid var(--border);background:rgba(0,0,0,.15)}
.sc-card.expanded .sc-subs{display:block}
.sc-sub-row{display:flex;align-items:center;gap:10px;padding:9px 14px 9px 34px;font-size:12.5px;border-top:1px solid rgba(255,255,255,.04)}
.sc-sub-row:first-child{border-top:none}
.sc-sub-row::before{content:'└─';color:var(--dim);margin-right:2px}
.sc-sub-instruction{flex:1;color:var(--muted)}
.toggle{position:relative;width:32px;height:17px;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0}
.toggle-track{position:absolute;inset:0;background:var(--border);border-radius:9px;cursor:pointer;transition:.15s}
.toggle-track::before{content:'';position:absolute;width:13px;height:13px;left:2px;top:2px;background:var(--muted);border-radius:50%;transition:.15s}
.toggle input:checked + .toggle-track{background:rgba(201,168,76,.4)}
.toggle input:checked + .toggle-track::before{transform:translateX(15px);background:var(--gold)}
.toggle input:disabled + .toggle-track{opacity:.35;cursor:not-allowed}
.shortcuts-empty{padding:36px 20px;text-align:center;color:var(--dim);font-size:13px;border:1px dashed var(--border);border-radius:6px;margin-top:12px}
.sc-form{display:none;border:1px solid rgba(201,168,76,.4);border-radius:8px;background:rgba(201,168,76,.05);padding:18px;margin-bottom:18px}
.sc-form.open{display:block}
.sc-form label{display:block;font-size:10.5px;color:var(--gold2);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px;margin-top:12px;font-family:'Cinzel',serif}
.sc-form label:first-child{margin-top:0}
.sc-form input[type=text],.sc-form textarea,.sc-form select{
  width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:6px;
  padding:9px 11px;color:#fff;font-size:13px;font-family:'Crimson Pro',serif;outline:none;
}
.sc-form textarea{min-height:56px;resize:vertical}
.sc-subtask-row{display:flex;gap:8px;margin-top:8px;align-items:flex-start}
.sc-subtask-row input{flex:1}
.sc-form-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.check-step{display:flex;align-items:flex-start;gap:14px;padding:16px 0;border-bottom:1px solid var(--border)}
.check-step:last-child{border-bottom:none}
.check-box{width:22px;height:22px;border:1px solid var(--border);border-radius:6px;flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--gold)}
.check-box.done{background:rgba(201,168,76,.2);border-color:var(--gold)}
.check-title{color:var(--text2);font-size:14px;font-weight:600;font-family:'Cinzel',serif}
.check-title.done{text-decoration:line-through;color:var(--dim)}
.check-desc{color:var(--muted);font-size:12.5px;margin-top:4px;line-height:1.7}
.check-link{color:var(--gold2);text-decoration:none;border-bottom:1px dotted var(--gold)}
.check-progress{height:7px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:22px}
.check-progress-fill{height:100%;background:var(--gold);transition:width .2s}
.history-day{border:1px solid var(--border);border-radius:8px;margin-bottom:10px;padding:13px 17px;opacity:.55}
.history-day-date{color:var(--gold2);font-size:12.5px;font-weight:600;margin-bottom:4px;font-family:'Cinzel',serif}
.history-day-summary{color:var(--muted);font-size:13px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--border)}
.settings-label{color:var(--text2);font-size:13.5px}
.settings-sub{color:var(--dim);font-size:11.5px;margin-top:2px}
</style>
</head>
<body>

<header>
  <div class="page-title-wrap">
    <div class="page-title" id="pageTitle">AmitCoder</div>
    <div class="page-version" id="pageVersion">v1.50</div>
  </div>
  <div class="brand">
    <img src="../amit_icon.png" alt="Amit" style="height:32px;width:32px">
    <span class="brand-sub">Walk alongside. Sharpen without cutting. Encourage always.</span>
  </div>
  <div class="hdr-right" style="display:flex;align-items:center;gap:14px">
    <div style="text-align:right">
      <div class="greeting" id="greeting">Good morning</div>
      <div class="datetime" id="datetime"></div>
      <div style="display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:3px">
        <div id="syncIndicator" onclick="openSyncModal()" style="font-size:9px;letter-spacing:.07em;color:rgba(240,232,208,.28);cursor:pointer;font-family:'Cinzel',serif">☁ SYNC</div>
        <div id="signInBtn" onclick="openSyncModal()" title="Sign in to sync your data" style="font-size:9px;letter-spacing:.1em;color:rgba(201,168,76,.8);cursor:pointer;font-family:'Cinzel',serif;border:1px solid rgba(201,168,76,.3);padding:3px 9px;border-radius:4px;background:rgba(201,168,76,.07)">SIGN IN</div>
        <div id="logoutBtn" onclick="signOutAmit()" title="Sign out" style="display:none;font-size:10px;letter-spacing:.08em;color:rgba(201,168,76,.9);cursor:pointer;font-family:'Cinzel',serif;font-weight:600;border-left:1px solid rgba(240,232,208,.2);padding-left:8px">SIGN OUT</div>
      </div>
    </div>
  </div>
</header>

<div class="hub">

  <!-- ── SIDEBAR — filled in by buildPlaceholders(), same as the template ── -->
  <nav class="sidebar" id="sidebarTiles" ondblclick="toggleSidebar()"></nav>

  <!-- ── MAIN CONTENT AREA — filled in by buildPlaceholders(), same as the template ── -->
  <div class="main-area" id="mainArea"></div>

</div>

<!-- SYNC / SIGN-IN MODAL -->
<div id="syncModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;align-items:center;justify-content:center">
  <div class="sync-modal-card" style="background:#1a3352;border:1px solid rgba(201,168,76,.45);border-radius:14px;padding:36px 40px;max-width:340px;width:90%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.5)">
    <div style="color:rgba(201,168,76,.9);font-family:'Cinzel',serif;font-size:16px;letter-spacing:.06em;margin-bottom:6px">Sync Across Devices</div>
    <div style="color:rgba(240,232,208,.5);font-size:11px;line-height:1.7;margin-bottom:22px">Enter your email. A sign-in link will be sent.<br>No password needed.</div>
    <input id="syncEmailInput" type="email" placeholder="your@email.com"
      style="width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.3);border-radius:7px;padding:11px 13px;color:#fff;font-size:13px;outline:none;margin-bottom:12px;font-family:inherit"
      onkeydown="if(event.key==='Enter')submitSyncEmail()"/>
    <button id="syncSubmitBtn" onclick="submitSyncEmail()"
      style="width:100%;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.45);color:rgba(201,168,76,.9);padding:11px;border-radius:7px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.08em">
      SEND SIGN-IN LINK →
    </button>
    <div onclick="closeSyncModal()" style="margin-top:16px;font-size:9px;color:rgba(240,232,208,.25);cursor:pointer;letter-spacing:.1em">CANCEL</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// AMITCODER — built from Templates/template.html. The placeholder-generation
// mechanism below (buildPlaceholders, showChTab, openPanel, toggleSidebar,
// login, clock) is COPIED UNCHANGED from the template. Only the CONTENT
// strings inside buildPlaceholders (tile 1 = Get Started, tile 2 = Overview
// with 5 real tabs) were replaced — the mechanism itself was not touched.
// ══════════════════════════════════════════════

const PLACEHOLDER_COUNT=2;
(function buildPlaceholders(){
  const nav=document.getElementById('sidebarTiles');
  const main=document.getElementById('mainArea');
  let navHtml='',panelHtml='';
  for(let i=1;i<=PLACEHOLDER_COUNT;i++){
    const label=i===1?'Get Started':'Overview';
    navHtml+=`<div class="tile${i===1?' active':''}" id="tile-${i}" onclick="openPanel(${i})">
      <div class="tile-icon">▢</div>
      <div class="tile-info">
        <div class="tile-name">${label}</div>
        <div class="tile-sub">${i===1?'Setup checklist':'Overview · Shortcuts · History · Docs · Settings'}</div>
      </div>
    </div>`;
    if(i===2){
      // Tab labels and real content, in place of the template's generic "Tab N"
      const tabNames=['Overview','Shortcuts','History','Docs','Dev Practices','Settings'];
      let tabNavHtml='',tabContentHtml='';
      for(let t=1;t<=6;t++){
        tabNavHtml+=`<button class="ch-tab-btn${t===1?' active':''}" onclick="showChTab(${i},${t})${t===2?';loadShortcuts()':t===3?';loadCoderSessions()':''}">${tabNames[t-1]}</button>`;
        tabContentHtml+=`<div class="ch-tab-content${t===1?' active':''}" id="ch-tab-${i}-${t}">${tabRealContent(t)}</div>`;
      }
      panelHtml+=`<div class="panel${i===1?' active':''}" id="panel-${i}" style="flex-direction:column">
        <div class="panel-head"><span class="panel-heading">${label}</span></div>
        <div class="ch-tab-nav" id="ch-tab-nav-${i}">${tabNavHtml}</div>
        <div class="ch-tab-main">${tabContentHtml}</div>
      </div>`;
    } else {
      panelHtml+=`<div class="panel${i===1?' active':''}" id="panel-${i}">
        <div class="panel-head"><span class="panel-heading">${label}</span></div>
        <div class="panel-body" style="padding:28px 32px;max-width:640px">
          <p style="color:var(--muted);font-size:13px;margin-bottom:16px">Everything Ryan had to learn by trial and error, in order. Check each off as you go — your progress is saved.</p>
          <div class="check-progress"><div class="check-progress-fill" id="checkProgressFill" style="width:0%"></div></div>
          <div id="checklistSteps"></div>
        </div>
      </div>`;
    }
  }
  navHtml+=`<div class="ask-amit-wrap">
    <div class="ask-amit-tile" id="tile-ask-amit" onclick="askAmitLive('amitcoder')">
      <div class="ask-amit-icon">💛</div>
      <div class="tile-info">
        <div class="ask-amit-name">Ask Amit</div>
        <div class="ask-amit-sub">Walk alongside</div>
      </div>
    </div>
  </div>`;
  nav.innerHTML=navHtml;
  main.innerHTML=panelHtml;
  renderChecklist();
})();

// Real content for each of the 5 Overview tabs. Kept as a plain function
// (not inline in the loop above) only so the content itself is easy to
// find and edit later without touching the generation mechanism.
function tabRealContent(t){
  if(t===1){
    return `<p>This is the space where your coding history will live.</p>
      <p>Session logs, version milestones, and the full back-and-forth of every build session — searchable, reviewable, and linked to your daily experience entries.</p>
      <p>When complete, it will pull from Claude Code session files so you can open any day and see exactly what was built and what Amit said during that session.</p>
      <div class="badge">In Development</div>
      <h3>What's real right now</h3>
      <ul>
        <li>Same login as the Hub — sign in once, recognized everywhere.</li>
        <li>Get Started checklist — walks a new person through the exact setup Ryan had to learn by hand.</li>
        <li>Shortcuts tab — create, view, and toggle voice/keyboard command shortcuts.</li>
      </ul>
      <h3>What's still a placeholder</h3>
      <ul>
        <li><code>History</code> — the actual session-log pull from Claude Code's JSONL files.</li>
        <li>Wiring a shortcut so it actually fires <em>inside</em> a live Claude Code session, rather than living here as a reference.</li>
      </ul>`;
  }
  if(t===2){
    return `<div style="display:flex;justify-content:flex-end;margin-bottom:12px">
        <button class="btn btn-gold btn-sm" onclick="toggleCreateForm()">+ new shortcut</button>
      </div>
      <div class="sc-form" id="scForm">
        <label>Trigger phrase</label>
        <input type="text" id="scTrigger" placeholder="e.g. F copy, F Charlie, J search">
        <label>Type</label>
        <select id="scType" onchange="onTypeChange()">
          <option value="inline_instruction">Simple — one instruction</option>
          <option value="master">Master — bundles subtasks together</option>
        </select>
        <label>Instruction</label>
        <textarea id="scInstruction" placeholder="What should happen when this trigger is said or typed?"></textarea>

  }
  if(t===4){
    return `<h3>Why F and J</h3>
      <p>This convention came out of live testing against Ryan's actual microphone, not guesswork.</p>
      <div class="finding"><b>Single unstressed words don't get misheard — they disappear.</b> A candidate activation word lost its trailing sound entirely on repeat tries.</div>
      <div class="finding"><b>Two-letter combos spoken together are unreliable.</b> Saying "FJ" repeatedly produced completely different results each time — never the same thing twice.</div>
      <div class="finding"><b>Single letters, said in isolation or embedded in a full sentence, held up.</b> F, J, X, Q, Z, and H all transcribed cleanly and consistently once tested properly.</div>
      <h3>The working convention</h3>
      <p><span class="trigger-tag builtin-tag">F</span> / <span class="trigger-tag builtin-tag">J</span> — the magic words themselves. Say or type F or J directly, followed by the command. Right and left index fingers, home-row keys, for anyone typing instead of speaking.</p>
      <h3>What a shortcut actually does right now</h3>
      <p>A <b>simple</b> shortcut is a stored instruction — when triggered, Amit treats it as if you'd typed that instruction directly.</p>
      <p>A <b>master</b> shortcut bundles subtasks — triggering it runs each subtask's instruction in sequence.</p>
      <p style="color:var(--dim);font-size:12px;margin-top:16px">Open question, not yet resolved: whether a shortcut fires automatically inside a live Claude Code session versus staying a reference panel. See AmitCoder/CLAUDE.md.</p>`;
  }
  if(t===5){
    return `<p>Things a more experienced coder typically already has in place that a self-taught, Claude-Code-first workflow can easily miss. Each one below is marked by what's actually true right now — not aspirational.</p>
      <h3>Local dev server <span class="badge" style="margin:0 0 0 8px;vertical-align:middle">Built into Starter Kit</span></h3>

      <p>Committing every change directly to <code>main</code> means a risky change is live the moment it's pushed. <code>New_Feature_Branch.ps1</code> creates a branch to test in first — merge to main only once it's confirmed working.</p>
      <h3>A real migrations folder <span class="badge" style="margin:0 0 0 8px;vertical-align:middle">Built into Starter Kit</span></h3>
      <p>Database changes as numbered files in <code>migrations/</code>, tracked in git — so your database's history is versioned alongside your code, not scattered across chat sessions.</p>
      <h3>Basic CI (a robot that checks your work) <span class="badge" style="margin:0 0 0 8px;vertical-align:middle">Scaffolded</span></h3>
      <p><code>.github/workflows/basic-check.yml</code> runs automatically on every push once this folder is a real GitHub repo — catches a broken file before a real visitor ever sees it.</p>
      <h3>Automated tests <span class="badge" style="margin:0 0 0 8px;vertical-align:middle">Not built — bigger lift</span></h3>
      <p>Small scripts that automatically re-check old features still work as new ones get added. Genuinely valuable at scale, but a real investment to set up — not included yet.</p>
      <h3>Secrets kept out of git <span class="badge" style="margin:0 0 0 8px;vertical-align:middle">Already good practice</span></h3>
      <p>Config files holding real credentials should never be committed. This is already the right instinct if you keep a local-only config file — formalizing it as a <code>.env</code> + <code>.gitignore</code> pair is the standard shape of the same idea.</p>`;
  }
  return `<div class="settings-row">
      <div><div class="settings-label">Your Account ID</div><div class="settings-sub">Paste this into the Starter Kit to link your local hooks (shortcuts + session history) to this account</div></div>

      <span style="color:var(--dim);font-size:11.5px">not yet built</span>
    </div>`;
}

// ── GET STARTED CHECKLIST — self-reported, saved to localStorage ──
const CHECKLIST_KEY='amit_coder_checklist';
const CHECKLIST_STEPS=[
  {id:'proaccount',title:'Get a Claude Pro or Max account',desc:'Sign up at <a class="check-link" href="https://claude.ai" target="_blank">claude.ai</a>. This is separate from an API key — Pro/Max works directly with Claude Code, no billing setup needed.'},
  {id:'vscode',title:'Install VS Code',desc:'Download from <a class="check-link" href="https://code.visualstudio.com" target="_blank">code.visualstudio.com</a>. This is the editor Claude Code runs inside.'},
  {id:'extension',title:'Install the Claude Code extension',desc:'Inside VS Code, open Extensions and search "Claude Code," or follow the install link from claude.ai. Sign in with the Pro/Max account from step 1.'},
  {id:'starterkit',title:'Download and run the Amit Starter Kit',desc:'<a class="check-link" href="./Amit_Coder_Starter_Kit.ps1" download>Amit_Coder_Starter_Kit.ps1</a> — right-click → Run with PowerShell. Creates your project folder, a starter CLAUDE.md, and connects your session backup automatically.'},
  {id:'confirm',title:'Confirm your folder and backup are set up',desc:'Open the folder the starter kit created in VS Code and say "good morning" to Claude Code. If it responds and the folder has a CLAUDE.md file in it, you are set up.'}
];
function renderChecklist(){
  const wrap=document.getElementById('checklistSteps');
  if(!wrap)return;
  let done={};
  try{done=JSON.parse(localStorage.getItem(CHECKLIST_KEY)||'{}')}catch(e){}
  let html='';
  CHECKLIST_STEPS.forEach(s=>{
    const isDone=!!done[s.id];
    html+=`<div class="check-step">
      <div class="check-box${isDone?' done':''}" onclick="toggleCheck('${s.id}')">${isDone?'✓':''}</div>
      <div>
        <div class="check-title${isDone?' done':''}">${s.title}</div>
        <div class="check-desc">${s.desc}</div>
      </div>
    </div>`;
  });
  wrap.innerHTML=html;
  const doneCount=CHECKLIST_STEPS.filter(s=>done[s.id]).length;
  document.getElementById('checkProgressFill').style.width=Math.round(doneCount/CHECKLIST_STEPS.length*100)+'%';
}
function toggleCheck(id){
  let done={};
  try{done=JSON.parse(localStorage.getItem(CHECKLIST_KEY)||'{}')}catch(e){}
  done[id]=!done[id];
  localStorage.setItem(CHECKLIST_KEY,JSON.stringify(done));
  renderChecklist();
}

// ── HISTORY — backed by amit_coder_sessions (Supabase), falls back to the
// static mockup rows already in the HTML if the table doesn't exist yet or
// the signed-in user has no real sessions synced. ──
async function loadCoderSessions(){
  const statusLine=document.getElementById('historyStatusLine');
  const list=document.getElementById('historyList');
  if(!db||!statusLine||!list)return;
  if(!currentUser){
    statusLine.textContent='Sign in to see your real session history.';
    return;
  }
  const{data,error}=await db.from('amit_coder_sessions').select('*')
    .eq('user_id',currentUser.id).order('created_at',{ascending:false});
  if(error){
    statusLine.textContent='Showing example data — real sync sets up once the amit_coder_sessions table exists and your local hooks are linked (see Settings tab).';
    return;
  }
  if(!data||!data.length){
    statusLine.textContent='No synced sessions yet — showing example data. Run hooks/Amit_Coder_SessionEnd.ps1 after a session to start building real history.';
    return;
  }
  statusLine.textContent='Your real session history:';
  list.innerHTML=data.map(s=>`<div class="history-day">
    <div class="history-day-date">${new Date(s.created_at).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'})}</div>
    <div class="history-day-summary">${escapeHtml(s.summary||'')}</div>
  </div>`).join('');
}

// ── SHORTCUTS — backed by amit_shortcuts (Supabase) ──
let scAllRows=[];
let scFilter='all';
let scShowBuiltins=true;

function setFilter(f){
  scFilter=f;
  document.querySelectorAll('.sc-filter').forEach(el=>el.classList.toggle('active',el.dataset.f===f));
  renderShortcuts();
}
function onShowBuiltinsChange(){
  scShowBuiltins=document.getElementById('settingShowBuiltins').checked;
  renderShortcuts();
}
async function loadShortcuts(){
  const empty=document.getElementById('shortcutsEmpty');
  const signedOut=document.getElementById('shortcutsSignedOut');
  if(!db||!empty||!signedOut)return;
  if(!currentUser){
    signedOut.style.display='block';empty.style.display='none';
    document.getElementById('shortcutsList').innerHTML='';
    return;
  }
  signedOut.style.display='none';
  const{data,error}=await db.from('amit_shortcuts').select('*')
    .or('user_id.is.null,user_id.eq.'+currentUser.id)
    .order('created_at',{ascending:true});
  if(error){console.error(error);scAllRows=[];}
  else scAllRows=data||[];
  renderShortcuts();
}
function renderShortcuts(){
  const list=document.getElementById('shortcutsList');
  const empty=document.getElementById('shortcutsEmpty');
  if(!currentUser||!list)return;
  let rows=scAllRows;
  if(scFilter==='builtin')rows=rows.filter(r=>r.is_builtin);
  if(scFilter==='custom')rows=rows.filter(r=>!r.is_builtin);
  if(!scShowBuiltins)rows=rows.filter(r=>!r.is_builtin);
  const masters=rows.filter(r=>!r.parent_shortcut_id);
  if(!masters.length){empty.style.display='block';list.innerHTML='';return;}
  empty.style.display='none';
  let html='';
  masters.forEach(m=>{
    const subs=rows.filter(r=>r.parent_shortcut_id===m.id);
    const tagClass=m.is_builtin?'trigger-tag builtin-tag':'trigger-tag';
    html+=`<div class="sc-card${m.is_builtin?' builtin':''}" id="sc-card-${m.id}">
      <div class="sc-card-head" onclick="toggleCard('${m.id}')">
        <span class="sc-caret">▶</span>
        <span class="${tagClass}">${escapeHtml(m.trigger_phrase)}</span>
        <span class="sc-type">${m.shortcut_type.replace('_',' ')}</span>
        <span class="sc-instruction">${escapeHtml(m.instruction_text||'')}</span>
        <span class="sc-origin">${m.is_builtin?'builtin':'custom'}</span>
        <label class="toggle" onclick="event.stopPropagation()">
          <input type="checkbox" ${m.is_active?'checked':''} ${m.is_builtin?'disabled':''} onchange="toggleActive('${m.id}',this.checked)">
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="sc-subs">
        ${subs.length?subs.map(s=>`<div class="sc-sub-row">
          <span class="trigger-tag${s.is_builtin?' builtin-tag':''}">${escapeHtml(s.trigger_phrase)}</span>
          <span class="sc-sub-instruction">${escapeHtml(s.instruction_text||'')}</span>
        </div>`).join(''):'<div class="sc-sub-row" style="color:var(--dim)">no subtasks</div>'}
      </div>
    </div>`;
  });
  list.innerHTML=html;
}
function toggleCard(id){document.getElementById('sc-card-'+id).classList.toggle('expanded');}
async function toggleActive(id,val){
  if(!db)return;
  await db.from('amit_shortcuts').update({is_active:val}).eq('id',id);
  const row=scAllRows.find(r=>r.id===id);if(row)row.is_active=val;
}
function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toggleCreateForm(){
  const f=document.getElementById('scForm');
  f.classList.toggle('open');
  if(f.classList.contains('open')){
    document.getElementById('scTrigger').value='';
    document.getElementById('scInstruction').value='';
    document.getElementById('scType').value='inline_instruction';
    document.getElementById('scSubtaskRows').innerHTML='';
    onTypeChange();
  }
}
function onTypeChange(){
  document.getElementById('scSubtasksWrap').style.display=document.getElementById('scType').value==='master'?'block':'none';
}
function addSubtaskRow(){
  const wrap=document.getElementById('scSubtaskRows');
  const row=document.createElement('div');
  row.className='sc-subtask-row';
  row.innerHTML=`<input type="text" class="sub-trigger" placeholder="subtask trigger (optional label)">
    <input type="text" class="sub-instruction" placeholder="subtask instruction">
    <button class="btn btn-sm" onclick="this.parentElement.remove()">×</button>`;
  wrap.appendChild(row);
}
async function saveShortcut(){
  if(!db||!currentUser){alert('Sign in first.');return;}
  const trigger=document.getElementById('scTrigger').value.trim();
  const type=document.getElementById('scType').value;
  const instruction=document.getElementById('scInstruction').value.trim();
  if(!trigger){alert('Trigger phrase is required.');return;}
  const{data:master,error}=await db.from('amit_shortcuts').insert({
    user_id:currentUser.id,trigger_phrase:trigger,shortcut_type:type,
    instruction_text:instruction,is_builtin:false,is_active:true
  }).select().single();
  if(error){alert('Could not save: '+error.message);return;}
  if(type==='master'){
    const rows=[...document.querySelectorAll('#scSubtaskRows .sc-subtask-row')];
    for(const row of rows){
      const subTrigger=row.querySelector('.sub-trigger').value.trim()||trigger+' →';
      const subInstruction=row.querySelector('.sub-instruction').value.trim();
      if(!subInstruction)continue;
      await db.from('amit_shortcuts').insert({
        user_id:currentUser.id,trigger_phrase:subTrigger,shortcut_type:'inline_instruction',
        instruction_text:subInstruction,parent_shortcut_id:master.id,is_builtin:false,is_active:true
      });
    }
  }
  toggleCreateForm();
  loadShortcuts();
}
</script>
