header{display:flex;align-items:center;justify-content:space-between;padding:10px 22px;background:var(--card-head);border-bottom:2px solid var(--border);flex-shrink:0;position:relative}
.page-title-wrap{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}
.page-title{font-family:var(--amit-font-title,Georgia,serif);font-size:24px;font-weight:700;letter-spacing:.3px;color:var(--gold2)}
.page-version{font-family:var(--amit-font-mono,monospace);font-size:11px;letter-spacing:.05em;color:rgba(var(--amit-accent-rgb,201,168,76),.55);margin-top:2px}
.brand{display:flex;align-items:baseline;gap:14px}
.brand-sub{font-style:italic;color:rgba(var(--amit-text-rgb,240,232,208),.55);font-size:12px}
.hdr-right{text-align:right}
.greeting{font-family:var(--amit-font-heading,'Cinzel',serif);font-size:15px;color:var(--amit-text,#fff);font-weight:600}
.datetime{font-size:12px;color:var(--muted);margin-top:2px}

.btn{font-family:var(--amit-font-heading,'Cinzel',serif);font-size:11px;cursor:pointer;border-radius:6px;padding:8px 16px;border:1px solid var(--border);background:rgba(var(--amit-overlay-rgb,255,255,255),.05);color:var(--text2)}
.btn:hover{background:rgba(var(--amit-overlay-rgb,255,255,255),.09)}
.btn-gold{border-color:rgba(var(--amit-accent-rgb,201,168,76),.5);color:var(--gold2);background:rgba(var(--amit-accent-rgb,201,168,76),.1)}
.btn-gold:hover{background:rgba(var(--amit-accent-rgb,201,168,76),.18)}
.btn-sm{padding:5px 11px;font-size:10.5px}

/* the whole window below the header: narrow code box on the left, the preview takes the rest */
main{flex:1;min-height:0;display:flex;gap:14px;padding:14px 18px 18px;position:relative;z-index:1}
main.wide .pv-code{display:none}
.pv-code{flex:0 0 28%;min-width:220px;display:flex;flex-direction:column;gap:8px}
.pv-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pv-hint{font-size:11.5px;color:var(--dim);margin-left:auto}
.pv-code textarea{flex:1;resize:none;background:rgba(var(--amit-overlay-rgb,255,255,255),.06);border:1px solid var(--border);border-radius:6px;padding:10px 11px;color:var(--amit-text,#fff);font-family:var(--amit-font-mono,monospace);font-size:12px;line-height:1.45}
.pv-code textarea:focus{outline:1px solid var(--gold)}
.pv-view{flex:1;min-width:0;background:#fff;border:1px solid var(--border);border-radius:8px}
@media (max-width:900px){main{flex-direction:column}.pv-code{flex:0 0 34%}.brand-sub{display:none}}
</style>
</head>

<main id="main">
  <div class="pv-code">
    <div class="pv-bar">
      <button class="btn btn-gold btn-sm" onclick="pvShow()">show it</button>
      <button class="btn btn-sm" onclick="pvClear()">clear</button>
      <button class="btn btn-sm" id="pvWideBtn" onclick="pvWide()">full width</button>
    </div>
    <textarea id="pvCode" spellcheck="false" oninput="pvQueue()" placeholder="Paste HTML code here. The picture shows on the right as you paste."></textarea>
  </div>
  <!-- sandboxed with no allow-same-origin: pasted code cannot reach Amit's sign-in or data -->
  <iframe class="pv-view" id="pvFrame" sandbox="allow-scripts allow-pointer-lock" title="Preview"></iframe>
</main>

<script>
var pvTimer=null;
function pvClean(s){return s.replace(/^\s*```[a-zA-Z]*\s*\n/,'').replace(/\n\s*```\s*$/,'');}
function pvShow(){
  var box=document.getElementById('pvCode'),frame=document.getElementById('pvFrame');
  var s=pvClean(box.value);
  frame.srcdoc=s.trim()?s:'<body style="font-family:Georgia,serif;color:#776;padding:30px">Nothing to show yet. Paste HTML in the box on the left.</body>';
  try{localStorage.setItem('amit_previewer_last',box.value);}catch(e){}
}
function pvQueue(){clearTimeout(pvTimer);pvTimer=setTimeout(pvShow,350);}
function pvClear(){var b=document.getElementById('pvCode');b.value='';pvShow();b.focus();}
function pvWide(){
  var on=document.getElementById('main').classList.toggle('wide');
  document.getElementById('pvWideBtn').textContent=on?'show code':'full width';
}
function tick(){
  var d=new Date(),h=d.getHours();
  document.getElementById('greeting').textContent=h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  document.getElementById('datetime').textContent=d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})+' · '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
}
(function(){
  try{var last=localStorage.getItem('amit_previewer_last');if(last)document.getElementById('pvCode').value=last;}catch(e){}
  pvShow();tick();setInterval(tick,30000);
  document.getElementById('pvCode').focus();
})();
</script>
