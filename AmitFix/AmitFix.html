<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ══════════════════════════════════════════════
     COPYING THIS TEMPLATE FOR A NEW PROJECT — read this first.

     WHAT THIS FILE IS — rebuilt 2026-08-06, Ryan's direct instruction.
     This is now the MINIMAL STARTER, not the reference catalog. It has
     Introduction (page 1) plus a few blank placeholder pages, and the
     global infrastructure every Amit app needs (right rail — Ask Amit,
     Sign In/Sync, Demo Mode — popup destination, login connection,
     tooltip mechanism, clock/greeting). It deliberately does NOT contain
     any of the canonical layouts (Tabbed/Row/Detail/Calendar/Day/Board/
     Gallery/Dashboard/Split/Form/Chart/Inbox/Drawer/Tree/Breadcrumb
     View) — those live permanently in Templates\TemplateViews.html, the
     never-modified reference library. This split exists so a real
     project's starting file is never bloated with layout code it isn't
     using — see Templates\CLAUDE.md's "TEMPLATE VIEWS vs TEMPLATE"
     section for the full reasoning.

     ADDING A LAYOUT TO A REAL PROJECT — go to Templates\TemplateViews.html,
     find the named "CANONICAL LAYOUT:" or "CANONICAL DESTINATION:" comment
     block, and copy it verbatim into this file — never reconstruct a
     layout's behavior from memory or approximation. Wire it into a real
     page/tab/popup the same way TemplateViews.html's own DEMO block shows
     it being done there. (J New, once built, automates this hand-off —
     see Templates\CLAUDE.md.)

     NAMING: the new project's folder name IS the app's name. If the
     folder is `Disco\`, the app is "Disco" — rename every literal
     occurrence of "Template" below to that exact name:
       - <title>Template</title>            (this line)
       - #pageTitle text, currently "Template" (~line 90)
       - the copied file itself: save as Disco.html, not template.html
       - askAmitLive('TEMPLATE_NOT_CONFIGURED') → askAmitLive('yourRealKey'),
         and write that key's real context into ../Amit_Ask_Live.js's
         PAGE_CONTEXTS — do not skip this, see the comment above that line
     CHAT (already in this template): the Ask Amit button opens the real AmitChat when the
     person is signed in, and the Chats item under it is the chat box. Both come from
     ../Amit_Ask_Live.js, which loads the chat on demand. A new app needs nothing extra; it
     only has to keep the <script src="../Amit_Ask_Live.js?v=..."> line and its own sign-in
     (the `db` client above). Written 2026-10-23.

     Use the app's real display name consistently in all three spots —
     never a variant spelling, never re-derived per file.

     VERSION: #pageVersion always starts at v1.00 for a brand-new app.
     From here forward it is versioned independently (own +0.01/+1.00
     history, never synced to any other file's number) — see root
     CLAUDE.md's VERSIONING STANDARD.

     INTERCONNECTION: a new project is never standalone — it inherits the
     whole Amit system's conventions. Before/while building it out, the
     new project's own CLAUDE.md (copied from
     Templates\Amit_NewProject_Template.md per root CLAUDE.md's NEW
     PROJECT DIRECTIVE) must carry: the Session Location Check, the
     Pursuit Attribution clause (its own canonical program name for
     hub_entries), Shortcut Activation + Shortcut Awareness, and — if
     it has an "Ask Amit" button — the wiring described above. If the
     project is likely to grow a running state log, add its own
     Sessions.md too (see AmitBooks\Sessions.md for the pattern) so a
     future session can orient fast without re-deriving context.

     NOMENCLATURE: this template uses PAGE (a sidebar item — button + its
     fixed number), DETAIL (the content area a page opens into), LAYOUT
     (what kind of content lives inside a detail — Tabbed/Row/Detail/etc,
     all defined in TemplateViews.html), and DESTINATION (WHERE a layout
     mounts — a page, a tab slot, or a Popup; Popup is built into this
     starter since it's generic infrastructure, not a layout itself). Full
     definitions live in the NOMENCLATURE comment at the top of the
     <script> block below.

     APPEARANCE (THEMES): already wired, added 2026-10-01. This file
     includes ../amit_appearance.js (in <head>, before <style>), aliases
     its :root vars to the shared --amit-* tokens, and calls
     amitAppearanceSync(db) on auth change, so a project copied from it
     follows each login's saved Appearance theme automatically. Don't redo
     this in a new project's own CLAUDE.md, just confirm it's still present.
     When you add new CSS, write colors/fonts as var(--amit-<token>,
     <classic value>) (e.g. rgba(var(--amit-accent-rgb,201,168,76),.3)),
     never as bare literals. The token list is in amit_appearance.js's
     header. Classic with no theme saved is a guaranteed visual no-op.

     PAGE ORDER: sidebar display position is controlled by the PAGE_ORDER
     array in the script below, kept separate from each page's fixed
     number — reorder pages by editing that array, never by renumbering
     pages/details themselves. See Templates\CLAUDE.md for why.
     ══════════════════════════════════════════════ -->
<title>AmitFix</title>
<link rel="icon" type="image/x-icon" href="amit_icon.ico">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../Amit_Ask_Live.js?v=6.18"></script>
<script src="../amit_appearance.js?v=1.06"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:var(--amit-bg,#09141f);
  --card-head:var(--amit-surface,#0f2338);
  --border:var(--amit-border,rgba(var(--amit-accent-rgb,201,168,76),0.55));
  --gold:var(--amit-accent,#c9a84c);
  --gold2:var(--amit-accent-bright,#e8c56a);
  --text:var(--amit-text,#ffffff);
  --text2:var(--amit-text-soft,#f0e8d0);
  --muted:var(--amit-muted,rgba(var(--amit-text-rgb,240,232,208),0.78));
  --dim:var(--amit-dim,rgba(var(--amit-text-rgb,240,232,208),0.42));
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:var(--amit-font-body,'Crimson Pro',Georgia,serif);color:var(--text);display:flex;flex-direction:column}

body::before{
  content:'';
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:60vmin;height:60vmin;
  background:url('amit_icon.ico') center/contain no-repeat;
  opacity:var(--amit-watermark-opacity,.035);
  pointer-events:none;
  z-index:0;
}

/* ── HEADER ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 28px;
  background:var(--card-head);
  border-bottom:2px solid var(--border);
  flex-shrink:0;
  position:relative;
}
.page-title-wrap{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
}
.page-title{
  font-family:var(--amit-font-title,Georgia,serif);font-size:26px;font-weight:700;
  letter-spacing:.3px;text-transform:none;color:var(--gold2);
}
.page-version{
  font-family:var(--amit-font-mono,monospace);font-size:11px;letter-spacing:.05em;
  color:rgba(var(--amit-accent-rgb,201,168,76),.55);margin-top:2px;
}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo-link{display:flex;align-items:center;gap:14px;cursor:pointer;text-decoration:none}
.brand-sub{font-style:italic;color:rgba(var(--amit-text-rgb,240,232,208),.55);font-size:12px}
.hdr-right{text-align:right}
.greeting{font-family:var(--amit-font-heading,'Cinzel',serif);font-size:16px;color:var(--amit-text,#fff);font-weight:600}
.datetime{font-size:12px;color:var(--muted);margin-top:2px}
.help-btn{width:22px;height:22px;border-radius:50%;border:1px solid rgba(var(--amit-text-rgb,240,232,208),.3);color:rgba(var(--amit-text-rgb,240,232,208),.6);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:all .15s}
.help-btn:hover{border-color:var(--gold);color:var(--gold)}

/* ── HUB LAYOUT ── */
.hub{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  width:max-content;flex-shrink:0;
  background:var(--card-head);
  border-right:2px solid var(--border);
  display:flex;flex-direction:column;
  overflow-y:auto;padding:12px 10px;gap:0;
}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(var(--amit-accent-rgb,201,168,76),.3);border-radius:2px}
.sidebar{transition:width .18s ease}
.sidebar.collapsed{width:64px}
.sidebar.collapsed .page-nav{justify-content:flex-start;padding:4px}
.sidebar.collapsed .page-info{display:none}
.page-nav{
  display:flex;align-items:center;gap:10px;
  padding:6px 4px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;
  flex-shrink:0;
  transition:all .18s;user-select:none;
  position:relative;overflow:hidden;
}
.page-nav:hover{background:rgba(var(--amit-overlay-rgb,255,255,255),.07);border-color:rgba(var(--amit-accent-rgb,201,168,76),.3)}
.page-nav.active{background:rgba(var(--amit-accent-rgb,201,168,76),.16);border-color:var(--gold);box-shadow:0 0 0 1px rgba(var(--amit-accent-rgb,201,168,76),.25)}
.page-icon{width:32px;height:32px;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* Round plug-status badge for the Sign In/Out rail icon — green when
   connected, red when not. Added 2026-08-07, ported from AmitBooks/
   NEW.html as the new standard for this template's own Sign In/Out
   treatment (Ryan's direct instruction — same config becomes the base for
   every future project built from this file). Disconnected state pulses:
   red fills the circle from a point at the center out to the full edge,
   then collapses back to nothing, looping — a genuine warning cue, not a
   color-shift-in-place effect. */
.page-icon.plug-badge{border-radius:50%;transition:background .15s;position:relative;overflow:hidden}
.page-icon.plug-badge.connected{background:var(--amit-ok,#2e7d46)}
.page-icon.plug-badge.disconnected{background:var(--bg)}
.page-icon.plug-badge.disconnected::before{content:'';position:absolute;inset:0;border-radius:50%;background:var(--amit-danger,#c73333);animation:plugBadgeFill 1.6s ease-in-out infinite;transform-origin:center}
.plug-icon-glyph{position:relative;z-index:1}
@keyframes plugBadgeFill{0%,100%{transform:scale(0)}50%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.page-icon.plug-badge.disconnected::before{animation:none;transform:scale(1)}}
.page-info{flex:1;min-width:0}
.page-name{font-family:var(--amit-font-heading,'Cinzel',serif);font-size:11px;color:var(--amit-text,#fff);letter-spacing:.04em;font-weight:600}
.page-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── MAIN AREA ── */
.main-area{flex:1;overflow:hidden;position:relative;background:var(--bg)}
.detail{
  position:absolute;inset:0;overflow-y:auto;
  display:none;flex-direction:column;
  animation:pfade .18s ease;
}
.detail.active{display:flex}
@keyframes pfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.detail::-webkit-scrollbar{width:5px}
.detail::-webkit-scrollbar-thumb{background:rgba(var(--amit-accent-rgb,201,168,76),.3);border-radius:3px}

/* ── DETAIL HEADER ── */
.detail-head{
  display:flex;align-items:center;gap:16px;
  padding:14px 24px;
  background:var(--card-head);
  border-bottom:2px solid var(--border);
  flex-shrink:0;
}
.detail-heading{font-family:var(--amit-font-heading,'Cinzel',serif);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.detail-empty{flex:1;display:flex;align-items:center;justify-content:center;color:rgba(var(--amit-text-rgb,240,232,208),.25);font-family:var(--amit-font-heading,'Cinzel',serif);font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* ── POPUP — canonical DESTINATION, not a layout type. Generic overlay
   that can host any layout instance copied in from TemplateViews.html —
   content-agnostic, same separation as a Page or a Tab slot not caring
   what's mounted inside them. Built into this starter (not TemplateViews-
   only) since it's global infrastructure, not a layout. ── */
.popup-overlay{display:none;position:fixed;inset:0;background:var(--amit-overlay,rgba(0,0,0,.6));z-index:9998;align-items:center;justify-content:center}
.popup-card{background:var(--card-head);border:1px solid rgba(var(--amit-accent-rgb,201,168,76),.5);border-radius:var(--amit-radius,12px);padding:26px 28px;max-width:640px;width:92%;max-height:82vh;overflow-y:auto;box-shadow:0 10px 50px rgba(0,0,0,.55);position:relative}
.popup-close-btn{position:absolute;top:14px;right:16px;color:rgba(var(--amit-text-rgb,240,232,208),.5);cursor:pointer;font-family:var(--amit-font-heading,'Cinzel',serif);font-size:10px;letter-spacing:.08em}
.popup-close-btn:hover{color:var(--gold2)}

/* ── RIGHT RAIL — global, present on every page, same on every project.
   Double-click to expand/collapse (mirror of the left sidebar, inverted
   default: starts collapsed). Ask Amit / Sign In-Sync / Demo Mode all
   live here permanently — see Templates\CLAUDE.md for the full history
   of why each piece looks the way it does. ── */
.right-rail{
  width:64px;flex-shrink:0;
  background:var(--card-head);
  border-left:2px solid var(--border);
  display:flex;flex-direction:column;
  overflow-y:auto;padding:12px 10px;gap:0;
  transition:width .18s ease;
}
.right-rail::-webkit-scrollbar{width:3px}
.right-rail::-webkit-scrollbar-thumb{background:rgba(var(--amit-accent-rgb,201,168,76),.3);border-radius:2px}
.right-rail.expanded{width:max-content}
.right-rail .page-nav{padding:4px;flex-direction:row-reverse}
.right-rail.expanded .page-nav{padding:6px 4px;justify-content:flex-start}
.right-rail .page-info{display:none}
.right-rail.expanded .page-info{display:block}
/* RIGHT RAIL ON/OFF STATE — added 2026-08-22, Ryan's direct instruction.
   The gold .page-nav.active look (shared with the left sidebar's "this is
   the open page" state) was too subtle to tell an ON toggle (Sign In,
   Demo Mode) apart from an OFF one at a glance. Right-rail items are
   toggles, not navigation, so they get their own distinct green
   on-state — overrides the gold .page-nav.active rule for this rail only.
   PERMANENT — carry this into every project copied from this template. */
.right-rail .page-nav.active{background:rgba(var(--amit-on-rgb,46,160,67),.20);border-color:rgba(var(--amit-on-rgb,46,160,67),.65);box-shadow:0 0 0 1px rgba(var(--amit-on-rgb,46,160,67),.4)}
.right-rail .page-nav.active .page-icon{background:rgba(var(--amit-on-rgb,46,160,67),.35);border-radius:50%;box-shadow:0 0 0 2px rgba(var(--amit-on-rgb,46,160,67),.55)}
.right-rail .page-nav.active .page-name{color:#6fe38f}

/* ── PAGE HOVER TOOLTIP — JS-positioned (fixed), not pure CSS, because
   .sidebar/.right-rail scroll (overflow-y:auto) — per the CSS spec, that
   silently forces the other axis's overflow to 'auto' too, which would
   clip a CSS-positioned tooltip trying to extend past the container's
   edge. A single fixed element sidesteps that entirely. ── */
.page-hover-tip{
  position:fixed;z-index:9999;
  background:var(--amit-tooltip-bg,#1a3352);border:1px solid rgba(var(--amit-accent-rgb,201,168,76),.45);
  color:var(--gold2);font-family:var(--amit-font-heading,'Cinzel',serif);font-size:10px;letter-spacing:.05em;
  line-height:1.5;
  padding:6px 10px;border-radius:6px;white-space:normal;word-wrap:break-word;max-width:260px;
  opacity:0;pointer-events:none;
  transition:opacity .12s;box-shadow:0 4px 16px rgba(0,0,0,.4);
}
.page-hover-tip.show{opacity:1}

/* CANONICAL LAYOUT: TABBED VIEW — copied verbatim from TemplateViews.html,
   added 2026-08-06 so Add Page can instantiate a real Tabbed View directly,
   not hand a copy-instruction to an outside AI session. */
.ch-tab-nav{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px;row-gap:0;margin:0 24px;padding:0;background:var(--bg);flex-shrink:0}
.ch-tab-btn{padding:9px 22px;margin-top:10px;border:1px solid rgba(var(--amit-accent-rgb,201,168,76),.25);background:rgba(var(--amit-overlay-rgb,255,255,255),.03);color:var(--muted);border-radius:var(--amit-tab-radius,10px) var(--amit-tab-radius,10px) 0 0;cursor:pointer;font-size:13px;font-family:inherit}
.ch-tab-btn.active{padding:12px 26px;margin-top:-2px;margin-bottom:-3px;border-bottom:none;background:var(--card-head);color:var(--gold2);font-weight:600;font-size:14px;position:relative;z-index:2}
.ch-tab-main{flex:1;min-height:0;overflow-y:auto;padding:28px 32px;margin:0 24px 24px;background:var(--card-head);border:1px solid rgba(var(--amit-accent-rgb,201,168,76),.25);border-radius:0 var(--amit-radius,12px) var(--amit-radius,12px) var(--amit-radius,12px)}
.ch-tab-content{display:none}
.ch-tab-content.active{display:block}

/* ── AMIT FIX — director's chair pieces (added to the template's own styles; colours all come from the shared tokens) ── */
.fx-wrap{max-width:none}
.fx-lede{font-size:17px;line-height:1.65;color:var(--text2);margin-bottom:14px}
.fx-small{font-size:13px;color:var(--muted);line-height:1.6}
.fx-h{font-family:var(--amit-font-heading,'Cinzel',serif);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);margin:22px 0 10px}
.fx-h:first-child{margin-top:0}
.fx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.fx-card{background:var(--amit-card-bg,rgba(var(--amit-overlay-rgb,255,255,255),.03));border:1px solid var(--amit-card-border,rgba(var(--amit-accent-rgb,201,168,76),.3));border-radius:10px;padding:14px 16px;cursor:pointer;position:relative;transition:border-color .15s,background .15s}
.fx-card:hover{border-color:var(--gold)}
.fx-card.on{border-color:var(--gold2);background:rgba(var(--amit-accent-rgb,201,168,76),.12)}
.fx-card .fx-scene{font-family:var(--amit-font-heading,'Cinzel',serif);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.fx-card .fx-name{font-size:17px;font-weight:600;color:var(--gold2);margin:3px 0 5px;padding-right:28px}
.fx-card .fx-plain{font-size:14px;line-height:1.5;color:var(--muted)}
.fx-card .fx-tag{display:inline-block;margin-top:8px;font-size:11px;letter-spacing:.06em;padding:2px 8px;border-radius:9px;border:1px solid rgba(var(--amit-accent-rgb,201,168,76),.3);color:var(--dim)}
.fx-card .fx-tick{position:absolute;top:12px;right:14px;width:20px;height:20px;border-radius:5px;border:1.5px solid rgba(var(--amit-accent-rgb,201,168,76),.55);display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.fx-card.on .fx-tick{background:var(--gold);color:#09141f;border-color:var(--gold)}
.fx-panel{border:1px solid rgba(var(--amit-accent-rgb,201,168,76),.25);border-radius:10px;padding:14px 18px;margin:0 0 14px;background:rgba(var(--amit-overlay-rgb,255,255,255),.02)}
.fx-panel b{color:var(--gold2)}
.fx-btn{display:inline-block;background:var(--amit-btn-bg,rgba(var(--amit-accent-rgb,201,168,76),.14));border:1px solid var(--amit-btn-border,rgba(var(--amit-accent-rgb,201,168,76),.55));color:var(--amit-btn-text,var(--gold2));padding:10px 18px;border-radius:var(--amit-btn-radius,8px);cursor:pointer;font-family:var(--amit-font-heading,'Cinzel',serif);font-size:12px;letter-spacing:.08em;text-decoration:none;margin:4px 8px 4px 0}
.fx-btn:hover{border-color:var(--gold2)}
.fx-btn.big{font-size:14px;padding:13px 24px}
.fx-btn.quiet{opacity:.8}
.fx-bar{flex-shrink:0;margin:0 24px 16px;padding:10px 18px;border:1px solid var(--gold);border-radius:10px;background:var(--card-head);display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.fx-bar .fx-count{font-size:15px;color:var(--text2);flex:1;min-width:200px}
.fx-bar .fx-count b{color:var(--gold2)}
.fx-sym{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.fx-sym .fx-btn{font-family:inherit;font-size:14px;letter-spacing:0;text-transform:none}
.fx-input{width:100%;background:var(--amit-input-bg,rgba(var(--amit-overlay-rgb,255,255,255),.07));border:1px solid var(--amit-input-border,rgba(var(--amit-accent-rgb,201,168,76),.3));border-radius:7px;padding:10px 12px;color:var(--amit-input-text,#fff);font-size:14px;font-family:inherit}
.fx-table{width:100%;border-collapse:collapse;font-size:14px}
.fx-table th{font-family:var(--amit-font-heading,'Cinzel',serif);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);text-align:left;padding:8px 10px;border-bottom:1px solid rgba(var(--amit-accent-rgb,201,168,76),.4)}
.fx-table td{padding:9px 10px;border-bottom:1px solid rgba(var(--amit-accent-rgb,201,168,76),.14);vertical-align:top;color:var(--muted);line-height:1.5}
.fx-table td:first-child{color:var(--text2);white-space:nowrap}
.fx-qr{background:#fff;padding:12px;display:inline-block;border-radius:8px;line-height:0}
.fx-say{border-left:3px solid var(--gold);padding:4px 0 4px 16px;margin:14px 0;font-size:18px;line-height:1.7;color:var(--text2);font-style:italic}
.fx-ok{color:#6fcf8a}.fx-no{color:#e88a7a}
@media(max-width:760px){.ch-tab-main{padding:18px 16px}.fx-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <a class="brand brand-logo-link" href="https://ask-amit.github.io/Amit/Hub/amit-hub.html" title="Back to the Amit Hub">
    <img src="amit_icon.ico" alt="Amit" style="height:32px;width:32px">
    <div>
      <div class="page-title" id="pageTitle" style="font-size:19px">AmitFix</div>

<script>
// ══════════════════════════════════════════════
// NOMENCLATURE — read this before touching any page/detail/layout code.
//   PAGE   — one item in the left sidebar (button + fixed number).
//   DETAIL — the content area a page opens into (id `detail-N`).
//   LAYOUT — what kind of content lives inside a detail. This starter
//            ships with none built in — every canonical layout (Tabbed/
//            Row/Detail/Calendar/Day/Board/Gallery/Dashboard/Split/Form/
//            Chart/Inbox/Drawer/Tree/Breadcrumb View) lives in

//   DESTINATION — WHERE a layout mounts: a page, a tab slot, or a Popup.

// ══════════════════════════════════════════════

let currentUser=null;
// SB_URL/SB_KEY/db/demoMode declared here, early — a real, confirmed bug
// from earlier work on this file: demoMode defaults to true (unlike
// currentUser, which defaults falsy), so anything gating on it can run
// during the page's very first synchronous script pass, before a
// later-declared `const` has initialized — a temporal dead zone crash.
// Declaring all of this up front avoids that class of bug entirely.
const SB_URL='https://hleqtjqojksurvkyqixt.supabase.co';
const SB_KEY='sb_publishable_0pptfPselXI0V9JmnhXgbA_dAGurCiF';
const db=(typeof supabase!=='undefined')?supabase.createClient(SB_URL,SB_KEY):null;
const AMIT_DEMO_UID='8b95d057-fd6b-44ec-abe7-658e08872d1a';
let demoMode=localStorage.getItem('amit_demo_mode')!=='off';

// ══════════════════════════════════════════════
// CANONICAL DATA BINDING: DEMO MODE — a general, reusable connection to
// Amit's own account data, available to ANY current or future view/form
// built from this template — not wired one-off per view. Ported from the
// Hub's real, live mechanism (amit-hub.html's demoModeHub/AMIT_DEMO_UID).
//
// fetchDemoRows(table, queryString) — the one call any view makes to
// pull Amit's own rows for demo mode. Returns [] immediately if demo mode
// is off. Every returned row is tagged _isDemo:true.
//
// REVIEW ONLY: any row this returns must never be editable or writable —
// it's the caller's responsibility to check _isDemo and refuse edits.
// Row View (in TemplateViews.html) already enforces this at its own
// rvEditCell/rvCommitCell chokepoint; a non-Row-View layout must
// implement its own _isDemo check the same way.
// ══════════════════════════════════════════════
async function fetchDemoRows(table,queryString){
  if(!demoMode)return[];
  try{
    const res=await fetch(`${SB_URL}/rest/v1/${table}?user_id=eq.${AMIT_DEMO_UID}&${queryString}`,{
      headers:{apikey:SB_KEY,Accept:'application/json'}
    });
    const rows=res.ok?await res.json():[];
    return rows.map(r=>({...r,_isDemo:true}));
  }catch(e){
    return[];
  }
}

// ══════════════════════════════════════════════
// ADD PAGE — the mechanism that lets a real project grow its own pages at
// runtime, added 2026-08-06, Ryan's direct instruction. Introduction (id 1)
// is the only fixed built-in page. Every page after it is a CUSTOM PAGE —
// created via the "Add Page" row, which always renders last, pushed down
// one row every time a new page is created above it. Custom pages get IDs
// starting at CUSTOM_PAGE_BASE so they never collide with page 1.
//
// PERSISTENCE — matches how Demo Mode already works (Supabase, not
// localStorage-only, so a project's page list looks the same on any
// computer): signed-in users' pages are read/written to the
// `template_pages` Supabase table, scoped by user_id + PROJECT_KEY. A
// localStorage cache mirrors every write and is the fallback source when
// signed out (Supabase requires a real owner row) — see
// Templates\CLAUDE.md for the table schema and the migration SQL.
//
// BUILDER MODE — the Add Page row (and this whole flow) is meant to be
// hidden before a project ships to real users. finalizeBuilderMode()
// flips a one-way localStorage flag; to re-enable it during further
// development, run localStorage.removeItem('amit_builder_mode') in the
// console (or set it to 'on') and reload — this is a developer action,
// not a runtime user-facing toggle.
// ══════════════════════════════════════════════
const PROJECT_KEY=(document.getElementById('pageTitle')?.textContent||'template').trim();
const CUSTOM_PAGE_BASE=1000;
const BUILDER_MODE_KEY='amit_builder_mode';
let builderMode=false; // AmitFix is a finished, fixed set of pages: Add Page is never shown
let customPages=[]; // [{page_name, detail_layout_type, page_order}], loaded before first render

// TemplateViews.html's canonical layouts, offered in the Add Page view-picker.
// Names/order match that file's own "CANONICAL LAYOUT:" comment headers —
// keep this list in sync if a layout is ever added there.
const TEMPLATE_LAYOUTS=[
  {key:'Tabbed View',desc:'Tab strip inside one page — multiple content panes, one active at a time'},
  {key:'Multi-Row Tab View',desc:'Many tabs in stacked 3-D rows like Word\'s Options dialog — the row you click comes to the front'},
  {key:'Row View',desc:'Excel-style sortable rows, click a column header to sort, inline editable cells'},
  {key:'Detail View',desc:'Single-record drill-down endpoint — fields laid out for one item'},

const TEMPLATE_VIEWS_ICON_MAP={

  'Gallery View':'🖼️','Dashboard View':'📈','Split View':'◨','Form View':'📝','Chart View':'📊',

async function loadCustomPages(){
  const cacheKey='amit_pages_'+PROJECT_KEY;
  const owner=currentUser?currentUser.id:null;
  if(owner&&db){
    try{
      const res=await fetch(`${SB_URL}/rest/v1/template_pages?user_id=eq.${owner}&project_key=eq.${encodeURIComponent(PROJECT_KEY)}&order=page_order.asc`,{
        headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,Accept:'application/json'}
      });
      if(res.ok){
        const rows=await res.json();
        localStorage.setItem(cacheKey,JSON.stringify(rows));
        return rows;
      }
    }catch(e){}
  }
  try{ return JSON.parse(localStorage.getItem(cacheKey)||'[]'); }catch(e){ return []; }
}

async function saveCustomPage(pageName,layoutKey,order){
  const owner=currentUser?currentUser.id:null;
  const row={project_key:PROJECT_KEY,page_name:pageName,detail_layout_type:layoutKey,page_order:order};
  if(owner&&db){
    try{
      await fetch(`${SB_URL}/rest/v1/template_pages`,{
        method:'POST',
        headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,'Content-Type':'application/json',Prefer:'return=minimal'},
        body:JSON.stringify({...row,user_id:owner})
      });
    }catch(e){}
  }
  const cacheKey='amit_pages_'+PROJECT_KEY;
  const cached=JSON.parse(localStorage.getItem(cacheKey)||'[]');
  cached.push(row);
  localStorage.setItem(cacheKey,JSON.stringify(cached));
}

// ══════════════════════════════════════════════
// AMIT FIX — the pages. Replaces the template's Introduction/Add Page rendering with four fixed pages (builder mode is off).

// ══════════════════════════════════════════════
const FX_BASE='https://ask-amit.github.io/Amit/AmitFix/AmitFix.html';
const FX_RAW='https://raw.githubusercontent.com/Ask-Amit/Amit/main/AmitFix/';
const FX_ORDER=['check','restart','tidy','voice-reset','voice-off','voice-on','startup-off','startup-on','shortcuts-remove','forget-data','remove','reinstall'];
const FX_ACTIONS={
  'check':{scene:'Scout the set',name:'Look first',plain:'Just look. It reports what is installed, whether it is running and what starts with Windows. Changes nothing.',tag:'changes nothing'},
  'restart':{scene:'Take two',name:'Restart Amit\'s helper',plain:'Closes Amit\'s small helper and starts it again. Fixes most "it stopped working" moments.',tag:'safe'},
  'tidy':{scene:'Clear the set',name:'Tidy up',plain:'Clears old logs and the saved files of the little listening window, then restarts. Your settings stay.',tag:'safe, keeps your settings'},
  'voice-reset':{scene:'New script',name:'Reset voice typing',plain:'Puts voice typing back the way it came: default button, default settings, fresh listening window. It will ask for the microphone once more.',tag:'asks you to confirm'},
  'voice-off':{scene:'Quiet on set',name:'Turn voice typing off',plain:'Nothing listens and your mouse buttons work exactly as normal. Everything else of Amit keeps working.',tag:'safe, reversible'},
  'voice-on':{scene:'Action!',name:'Turn voice typing on',plain:'Hold your mouse button where you want words, speak, let go. (Works in any program, in a text box.)',tag:'safe, reversible'},
  'startup-off':{scene:'No early call',name:'Don\'t start with Windows',plain:'Amit stops opening itself when you sign in. You can still open it yourself whenever you like.',tag:'safe, reversible'},
  'startup-on':{scene:'Call time',name:'Start with Windows',plain:'Amit opens quietly when you sign in so it is ready.',tag:'safe, reversible'},
  'shortcuts-remove':{scene:'Strike the sign',name:'Remove desktop shortcuts',plain:'Takes Amit\'s icons off your desktop. Nothing else is touched.',tag:'safe'},
  'forget-data':{scene:'Burn the notes',name:'Forget what Amit kept here',plain:'Erases the readings and history Amit stored on this computer. Your online account is not touched.',tag:'asks you to confirm'},
  'remove':{scene:'That\'s a wrap',name:'Remove Amit\'s helper',plain:'Closes Amit\'s helper on this computer, turns off start-with-Windows, deletes its files, saved data and shortcuts, then checks it is really gone. Amit himself lives online and is not affected. Like it was never installed.',tag:'asks you to confirm'},
  'reinstall':{scene:'Re-shoot',name:'Get the newest installer',plain:'Opens the download for the current Amit installer. Used after removing, for a clean start.',tag:'safe'}
};
const FX_SYMPTOMS={
  'voice':{label:'Voice typing isn\'t typing / acts strangely',pick:['restart','voice-reset'],tab:2},
  'slow':{label:'It feels slow or uses too much memory',pick:['tidy','restart'],tab:2},
  'popup':{label:'It keeps popping up or starts when I don\'t want it',pick:['startup-off','voice-off'],tab:3},
  'update':{label:'I have an old version / it won\'t update',pick:['remove','reinstall'],tab:2},
  'broken':{label:'Something is broken and I don\'t know what',pick:['remove','reinstall'],tab:2},
  'look':{label:'I just want to look first',pick:['check'],tab:2},
  'leave':{label:'I\'m done with Amit',pick:['remove'],tab:5}
};
const fxParams=new URLSearchParams(location.search);
const fxFrom=(fxParams.get('from')||'').toLowerCase();
const fxVersion=fxParams.get('v')||'';
const fxChosen=new Set();
const fxUA=navigator.userAgent||'';
const fxPhone=/Android|iPhone|iPad|iPod/i.test(fxUA);
const fxWindows=/Windows/i.test(fxUA);

function fxHello(){
  const f=fxFrom;
  if(f==='helper'||f==='tray')return {t:'Amit\'s helper sent you here.',s:'Something wasn\'t right, so let\'s put it right together. Tell me what is happening below, or just pick what you want from the tabs. Nothing runs until you call it.'};
  if(f==='voice'||f==='whisper')return {t:'Voice typing giving you trouble?',s:'That is the most common thing, and it is usually fixed in one click. Start with "Restart", and if it still acts up, "Reset voice typing".'};
  if(f==='email'||f==='qr'||f==='phone'||f==='share')return {t:'Someone sent you this page.',s:'It is a place to fix, quiet, or fully remove Amit\'s helper, whichever you need. You choose; nothing happens unless you call it.'};
  if(f==='leave'||fxParams.get('problem')==='leave')return {t:'You\'re welcome to go.',s:'Whenever you want to be done with Amit\'s helper on this computer, it can be as if you never installed it. Amit himself lives online and is not affected. Take your time. The last tab does it, and there is a word from us on the Our Heart page.'};
  return {t:'You\'re in the director\'s chair.',s:'Amit is something that lives on your computer, so you should be able to quiet it, fix it, or send it away whenever you like, without asking anyone. Every fix here is one plain choice. Nothing runs until you call it.'};
}

function fxCard(k){
  const a=FX_ACTIONS[k];
  return `<div class="fx-card${fxChosen.has(k)?' on':''}" id="fxc-${k}" onclick="fxToggle('${k}')">
    <div class="fx-tick">&#10003;</div>
    <div class="fx-scene">${a.scene}</div>
    <div class="fx-name">${a.name}</div>
    <div class="fx-plain">${a.plain}</div>
    <span class="fx-tag">${a.tag}</span>
  </div>`;
}

function fxToggle(k){
  if(fxChosen.has(k))fxChosen.delete(k);else fxChosen.add(k);
  fxRefresh();
}
function fxRefresh(){
  FX_ORDER.forEach(k=>{const el=document.getElementById('fxc-'+k);if(el)el.classList.toggle('on',fxChosen.has(k));});
  const n=fxChosen.size,bar=document.getElementById('fxBarCount');
  if(!bar)return;
  const list=[...fxChosen].sort((a,b)=>FX_ORDER.indexOf(a)-FX_ORDER.indexOf(b)).map(k=>FX_ACTIONS[k].name);
  bar.innerHTML=n?`<b>Your call sheet (${n}):</b> ${list.join(' &middot; ')}`:`<b>Your call sheet is empty.</b> Tap the cards you want, then call it.`;
  const dl=document.getElementById('fxBarGo');if(dl)dl.style.opacity=n?1:.4;
}
function fxPick(key){

}
function fxShowTab(n){
  const d=document.getElementById('detail-1');if(!d)return;

  d.querySelectorAll('.ch-tab-btn').forEach((b,i)=>b.classList.toggle('active',i===n-1));
  const c=document.getElementById('ch-tab-1-'+n);if(c)c.classList.add('active');
}
function fxOrdered(){return [...fxChosen].sort((a,b)=>FX_ORDER.indexOf(a)-FX_ORDER.indexOf(b));}

async function fxGetScript(){
  for(const u of ['Amit_Fix.ps1',FX_RAW+'Amit_Fix.ps1']){
    try{const r=await fetch(u);if(r.ok){const t=await r.text();if(t.length>1500)return t;}}catch(e){}
  }
  return null;
}
async function fxDownload(){
  const acts=fxOrdered();
  if(!acts.length){alert('Your call sheet is empty. Tap one or more cards first.');return;}
  if(fxPhone){alert('These fixes run on the Windows computer where Amit is installed. Open this page on that computer (the Send It page can email or text you the link).');return;}
  const ps=await fxGetScript();
  if(!ps){alert('Could not load the fix program. Check your connection and try again.');return;}
  const hdr=['@echo off','setlocal','title Amit Fix','set "AMIT_FIX_ACTIONS='+acts.join(',')+'"',
    'powershell -NoProfile -ExecutionPolicy Bypass -Command "$t=[IO.File]::ReadAllText(\'%~f0\'); $i=$t.IndexOf(\'#PS\'+\'-START#\'); & ([scriptblock]::Create($t.Substring($i+10))) -Actions $env:AMIT_FIX_ACTIONS -Pause"',
    'exit /b','#PS-START#'];
  const body=hdr.join('\r\n')+'\r\n'+ps.replace(/\r?\n/g,'\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([body],{type:'application/octet-stream'}));
  a.download='Amit_Fix.cmd';document.body.appendChild(a);a.click();a.remove();
  fxAfterDownload();
}
function fxAfterDownload(){
  popupOpen(`<div class="fx-h">Almost there &mdash; one thing for you to do</div>
    <div class="fx-lede">Your fix is in your Downloads. <b>Open it</b> (double-click). A black window shows what it is doing and checks its own work at the end.</div>
    <div class="fx-panel">If Windows or your browser says <b>"unknown publisher"</b> or <b>"may be unsafe"</b>: that is only because we have not bought a code-signing certificate yet. Choose <b>Keep</b>, then <b>More info &rarr; Run anyway</b>. You can read every line of what it does first on the "What's on my computer" page.</div>
    <div class="fx-small">Nothing here goes online. It only touches what Amit itself put on this computer.</div>`);
}
function fxDownloadExe(fresh){
  if(fxPhone){alert('This program is for the Windows computer where Amit is installed. Open this page there.');return;}
  const a=document.createElement('a');a.href='Remove-Amit.exe';a.download='Remove-Amit.exe';document.body.appendChild(a);a.click();a.remove();
  fxAfterDownload();
}

async function fxProbe(){
  const el=document.getElementById('fxProbe');if(!el)return;

  if(fxPhone){
    msg='You are on a <b>phone or tablet</b>. Amit\'s helper only lives on a Windows computer, so the fixes below are for that computer. Use the <b>Send It</b> page to send yourself the link, and the last tab here to clear what Amit saved in <i>this</i> browser.';
  }else if(!fxWindows){
    msg='You are not on Windows. Amit\'s helper is Windows-only, so nothing of it can be on this computer. If you only want to clear what Amit saved in this browser, use the <b>Browser &amp; phone</b> tab.';
  }else{
    msg='Checking whether Amit\'s helper is running on this computer&hellip;';
    el.innerHTML=msg;
    try{
      const c=new AbortController();setTimeout(()=>c.abort(),2500);
      const r=await fetch('http://localhost:8710/api/whisper/status',{signal:c.signal});
      const j=await r.json();
      msg='Amit\'s helper <b class="fx-ok">is running</b> on this computer'+(j&&j.state?' (voice typing: <b>'+j.state+'</b>)':'')+'.'+(fxVersion?' Version '+fxVersion+'.':'');
    }catch(e){
      msg='I can\'t see Amit\'s helper on this computer. Either it is not installed, or it is not running right now. "Look first" will tell you for sure, and "Restart" or "Fresh start" will bring it back.';
    }
  }
  el.innerHTML=msg;
}

function fxClearBrowser(){
  if(!confirm('Sign out and clear what Amit saved in this browser on this device? (Your online account is not deleted.)'))return;

function fxCopy(id,btn){

  const t=el.value||el.textContent;
  const done=()=>{const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1400);};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>{el.select&&el.select();document.execCommand('copy');done();});}
  else{el.select&&el.select();document.execCommand('copy');done();}
}

// PAGE HOVER TOOLTIP — delegated on the given container, works no matter
// how many items exist or whether that container is collapsed/expanded.
// side: 'right' opens rightward (left sidebar); 'left' opens leftward
// (right rail — opening rightward there would render off-screen).
function initPageTooltips(containerId,side){
  const tip=document.getElementById('pageHoverTip');
  const nav=document.getElementById(containerId);
  if(!tip||!nav)return;
  nav.addEventListener('mouseover',(e)=>{
    const item=e.target.closest('.page-nav');
    if(!item)return;
    tip.textContent=item.dataset.tip||'';
    const r=item.getBoundingClientRect();
    if(side==='left'){
      tip.style.right=(window.innerWidth-r.left+8)+'px';
      tip.style.left='auto';
    } else {
      tip.style.left=(r.right+8)+'px';
      tip.style.right='auto';
    }
    tip.style.top=(r.top+r.height/2)+'px';
    tip.style.transform='translateY(-50%)';
    tip.classList.add('show');
  });
  nav.addEventListener('mouseout',(e)=>{
    const item=e.target.closest('.page-nav');
    if(!item)return;
    if(e.relatedTarget&&item.contains(e.relatedTarget))return;
    tip.classList.remove('show');
  });
}

// CANONICAL LAYOUT: TABBED VIEW — copied verbatim from TemplateViews.html,
// added 2026-08-06. Multi-row overflow: the tab row grows as many rows
// behind itself as it needs (plain CSS flex-wrap, see .ch-tab-nav) rather
// than scrolling or truncating. Selecting a tab that isn't in the front
// row brings its whole row forward — same behavior as classic multi-row
// property-sheet tabs.
function showChTab(detailNum,n){
  const detail=document.getElementById('detail-'+detailNum);
  const clickedBtn=event.target;
  const tabNav=document.getElementById('ch-tab-nav-'+detailNum);
  if(tabNav){
    // Only reorder when tabs have genuinely wrapped into multiple rows, and
    // use a tolerance (not exact offsetTop equality) when grouping a row —
    // .ch-tab-btn.active has a different margin-top than inactive tabs,
    // which would otherwise misclassify the active tab as its own row.
    const wrapped=tabNav.scrollHeight>clickedBtn.offsetHeight*1.5;
    if(wrapped){
      const rowTop=clickedBtn.offsetTop;
      Array.from(tabNav.children)
        .filter(b=>Math.abs(b.offsetTop-rowTop)<15)
        .forEach(b=>tabNav.appendChild(b));
    }
  }
  detail.querySelectorAll('.ch-tab-content').forEach(c=>c.classList.remove('active'));
  detail.querySelectorAll('.ch-tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('ch-tab-'+detailNum+'-'+n).classList.add('active');
  clickedBtn.classList.add('active');
}

  for(let t=1;t<=5;t++){
    tabNavHtml+=`<button class="ch-tab-btn${t===1?' active':''}" onclick="showChTab(${detailNum},${t})">Tab ${t}</button>`;
    tabContentHtml+=`<div class="ch-tab-content${t===1?' active':''}" id="ch-tab-${detailNum}-${t}">Tab ${t} content goes here</div>`;
  }
  return `<div class="ch-tab-nav" id="ch-tab-nav-${detailNum}">${tabNavHtml}</div>
    <div class="ch-tab-main">${tabContentHtml}</div>`;
}

// ══════════════════════════════════════════════
// LAYOUT IMPORTER — fetches TemplateViews.html at the moment a page needs
// it, cuts out the exact CANONICAL LAYOUT block the person picked (code +
// its own sample data, contiguous by design — see TemplateViews.html's own
// "IMPORTING A SINGLE LAYOUT PIECE" note), runs it live, and calls that
// layout's own create function. Nothing about any of the 14 layouts below
// is hand-copied into this file ahead of time — this file only knows each
// one's marker text, its container wrap class, and the one line that
// creates it, exactly what a person would type by hand if copying it in
// themselves. Tabbed View (above) is the one exception, kept as a fully
// local, hand-wired implementation since it was built before this importer
// existed and already works — no need to route it through a network fetch.
//
// REQUIRES being served over http(s) — a file:// page cannot fetch a
// sibling file's contents (browsers block that at the protocol level, not
// this code's choice). Run a local server (the Starter Kit's zero-dep dev
// server, or `npx serve`, or similar) rather than double-clicking this
// file, or the import will fail with an honest error in the page itself.
// ══════════════════════════════════════════════
const LAYOUT_IMPORT_MANIFEST={
  'Multi-Row Tab View':{marker:'MULTI-ROW TAB VIEW',deps:[],wrap:'mrt-wrap',
    call:id=>`mrtCreate('${id}',MRT_SAMPLE_TABS);`},
  'Row View':{marker:'ROW VIEW',deps:[],wrap:'rv-wrap',
    call:id=>`rvCreate('${id}',RV_SAMPLE_COLUMNS,RV_SAMPLE_ROWS);`},
  'Detail View':{marker:'DETAIL VIEW',deps:['Row View'],wrap:'dv-wrap',
    call:id=>`dvCreate('${id}',RV_SAMPLE_COLUMNS,RV_SAMPLE_ROWS);dvOpenForInstance('${id}',RV_SAMPLE_ROWS[0].id);`},
  'Calendar View':{marker:'CALENDAR VIEW',deps:['Day View'],wrap:'cv-wrap',
    call:id=>`cvCreate('${id}');`},
  'Day View':{marker:'DAY VIEW',deps:[],wrap:'dvw-wrap',
    call:id=>`dayViewCreate('${id}');`},
  'Board View':{marker:'BOARD VIEW',deps:['Detail View'],wrap:'bv-wrap',
    call:id=>`bvCreate('${id}',BV_SAMPLE_STATUSES,BV_SAMPLE_ROWS);`},
  'Gallery View':{marker:'GALLERY VIEW',deps:[],wrap:'glv-wrap',
    call:id=>`glvCreate('${id}',GLV_SAMPLE_ROWS);`},
  'Dashboard View':{marker:'DASHBOARD VIEW',deps:[],wrap:'dbv-wrap',
    call:id=>`dbvCreate('${id}',DBV_SAMPLE_TILES,DBV_SAMPLE_BARS);`},
  'Split View':{marker:'SPLIT VIEW',deps:['Row View'],wrap:'spv-wrap',
    call:id=>`spvCreate('${id}',RV_SAMPLE_COLUMNS,RV_SAMPLE_ROWS);`},
  'Form View':{marker:'FORM VIEW',deps:[],wrap:'fv-wrap',
    call:id=>`fvCreate('${id}',FV_SAMPLE_FIELDS);`},
  'Chart View':{marker:'CHART VIEW',deps:[],wrap:'chv-wrap',
    call:id=>`chvCreate('${id}',CHV_SAMPLE_BARS,CHV_SAMPLE_LINES);`},
  'Inbox View':{marker:'INBOX VIEW',deps:[],wrap:'ibv-wrap',
    call:id=>`ibvCreate('${id}',IBV_SAMPLE_ROWS);`},
  'Drawer View':{marker:'DRAWER VIEW',deps:[],wrap:'drv-wrap',
    call:id=>`drvCreate('${id}',DRV_SAMPLE_ROWS);`},
  'Tree View':{marker:'TREE VIEW',deps:[],wrap:'tv-wrap',
    call:id=>`tvCreate('${id}',TV_SAMPLE_ROWS);`},
  'Breadcrumb View':{marker:'BREADCRUMB VIEW',deps:[],wrap:'bcv-wrap',
    call:id=>`bcvCreate('${id}','Pursuits',BCV_SAMPLE_ROOT);`}
};

let _tvSource=null;
async function _fetchTemplateViewsSource(){
  if(_tvSource) return _tvSource;
  const res=await fetch('TemplateViews.html');
  if(!res.ok) throw new Error('HTTP '+res.status);
  _tvSource=await res.text();
  return _tvSource;
}

let _tvCssInjected=false;
function _injectTemplateViewsCss(src){
  if(_tvCssInjected) return;
  const m=src.match(/<style>([\s\S]*?)<\/style>/);
  if(!m) return;
  const tag=document.createElement('style');
  tag.id='tv-imported-css';
  tag.textContent=m[1];
  document.head.appendChild(tag);
  _tvCssInjected=true;
}

// Cuts the one block whose header comment reads "CANONICAL LAYOUT: <marker>"
// — from that comment line down to wherever the NEXT block's own header
// starts ("// CANONICAL LAYOUT: " or "// CANONICAL DESTINATION: "), or the
// "// ── DEMO" wiring at the file's bottom for the last block. Anchored to
// a real line start (must follow a newline) so a prose MENTION of another
// block's name elsewhere in a comment can't be mistaken for that block's
// actual header. Does not stop at every "// ══" divider — each block's own
// header comment is closed by one of those BEFORE its code even starts, so
// stopping there would cut every block down to nothing but its comment.
function _extractCanonicalBlock(src,markerText){
  const marker='// CANONICAL LAYOUT: '+markerText;
  const mi=src.indexOf('\n'+marker);
  if(mi===-1) return null;
  const lineStart=mi+1;
  let end=src.length;
  for(const stop of ['\n// CANONICAL LAYOUT: ','\n// CANONICAL DESTINATION: ','\n// ── DEMO']){
    const idx=src.indexOf(stop,lineStart+marker.length);
    if(idx!==-1 && idx<end) end=idx;
  }
  return src.slice(lineStart,end);
}

// Loads a layout's block (and any dependency blocks — e.g. Detail View's
// sample data lives inside Row View's own block) exactly once each, ever,
// per page load. A second page using the same layout just calls its
// already-loaded create function again with a new container id — the
// block itself (its `const`s) can only be executed once without a
// "already declared" error, same reason each script tag only runs once.
const _tvLoadedLayouts=new Set();
async function importLayoutFromTemplateViews(layoutKey){
  const manifest=LAYOUT_IMPORT_MANIFEST[layoutKey];
  if(!manifest) return {ok:false,reason:'"'+layoutKey+'" has no import entry yet'};
  let src;
  try{ src=await _fetchTemplateViewsSource(); }
  catch(e){ return {ok:false,reason:'could not fetch TemplateViews.html ('+e.message+') — this page must be served over http(s), not opened as a file:// path'}; }
  _injectTemplateViewsCss(src);
  for(const key of [...manifest.deps,layoutKey]){
    if(_tvLoadedLayouts.has(key)) continue;
    const block=_extractCanonicalBlock(src,LAYOUT_IMPORT_MANIFEST[key].marker);
    if(!block) return {ok:false,reason:'could not find the "'+key+'" block in TemplateViews.html'};
    const tag=document.createElement('script');
    tag.textContent=block;
    document.body.appendChild(tag);
    _tvLoadedLayouts.add(key);
  }
  return {ok:true};
}

// Fetches + runs the layout, then calls its create function against the
// already-rendered mount div. Fire-and-forget from renderAllPages() (the
// mount div itself renders synchronously and instantly; the real content
// pops in a moment later once the fetch resolves).
async function hydrateImportedLayout(detailNum,layoutKey){
  const mountId='tv-mount-'+detailNum;
  const status=await importLayoutFromTemplateViews(layoutKey);
  const mount=document.getElementById(mountId);
  if(!mount) return; // page was re-rendered away (e.g. a newer page replaced it) before the fetch finished
  if(!status.ok){
    mount.outerHTML=`<div class="detail-empty">Could not import "${layoutKey}" from TemplateViews.html — ${status.reason}.</div>`;
    return;
  }
  try{ new Function(LAYOUT_IMPORT_MANIFEST[layoutKey].call(mountId))(); }
  catch(e){ mount.innerHTML=`<div class="detail-empty">"${layoutKey}" loaded but hit an error running it: ${e.message}</div>`; }
}

// HOME (right rail) — added 2026-08-06, Ryan's direct instruction, same
// implementation as TemplateViews.html's own goToHub — kept identical
// between both files on purpose, copy verbatim if either one changes.
// Broadcasts on the shared 'amit_hub_tabs' channel first (the Hub itself
// carries the matching listener — see amit-hub.html's own "AMIT HUB FOCUS
// CHANNEL" comment); if a genuinely open Hub tab answers within the brief
// window below, it focuses itself and nothing else happens here. Only
// falls back to opening a new tab if nothing answered.
//
// RELATIVE PATH, NOT the hardcoded live URL (fixed 2026-08-06, real bug
// Ryan caught testing this live) — BroadcastChannel can only ever be heard
// by a tab on the exact same origin; that's a hard browser security
// boundary, not something any code here can work around. A hardcoded
// absolute https://ask-amit.github.io URL meant this could NEVER work
// while testing this page locally (file:// or localhost) against an
// already-open Hub tab on the real live site — always a different origin,
// always silently falling through to opening a duplicate tab. A relative
// path fixes both cases at once: locally it resolves to the local Hub
// file (same origin as this page, channel actually works); once a real
// project ships to ask-amit.github.io/Amit/ProjectName/ (one level under
// Amit/, same as Hub/), this same relative path resolves to the exact
// same live Hub URL as before — same origin there too, since every
// shipped Amit project and the Hub itself sit as siblings under Amit/.
const AMIT_HUB_URL='../Hub/amit-hub.html';
function goToHub(){
  if(typeof BroadcastChannel==='undefined'){ window.open(AMIT_HUB_URL,'amitHubTab'); return; }
  const ch=new BroadcastChannel('amit_hub_tabs');
  let acked=false;
  ch.onmessage=(e)=>{ if(e.data&&e.data.type==='focus-ack'){ acked=true; ch.close(); } };
  ch.postMessage({type:'focus-requested'});
  setTimeout(()=>{
    if(!acked) window.open(AMIT_HUB_URL,'amitHubTab');
    ch.close();
  },250);
}

function openPage(n){
  document.querySelectorAll('.page-nav').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.detail').forEach(p=>p.classList.remove('active'));
  const page=document.getElementById('page-'+n);
  const detail=document.getElementById('detail-'+n);
  if(page)page.classList.add('active');
  if(detail)detail.classList.add('active');
}

// ══════════════════════════════════════════════
// CANONICAL DESTINATION: POPUP — NOT a layout type. Generic overlay that
// hosts whatever layout instance (copied in from TemplateViews.html) is
// mounted inside it — content-agnostic, same as a Page or Tab slot.
// ══════════════════════════════════════════════
function popupOpen(innerHtml){
  let modal=document.getElementById('canonicalPopup');
  modal.innerHTML=`<div class="popup-card" id="canonicalPopupCard">
    <div class="popup-close-btn" onclick="popupClose()">CLOSE ✕</div>
    ${innerHtml}
  </div>`;
  modal.addEventListener('click',(e)=>{ if(e.target===modal) popupClose(); });
  modal.style.display='flex';
}
function popupClose(){
  const modal=document.getElementById('canonicalPopup');
  if(modal) modal.style.display='none';
}

// ══════════════════════════════════════════════
// LOGIN CONNECTION — the one live piece of this template. Supabase auth
// only: knows who is signed in. No data reads/writes beyond that.
// ══════════════════════════════════════════════
if(db){
  db.auth.onAuthStateChange(async (event,session)=>{
    currentUser=session?session.user:null;
    _updateSyncUI();
    // Appearance (2026-10-01): pull this login's saved theme (or clear it on
    // sign-out). Deferred with setTimeout so no supabase call is awaited
    // inside this callback (supabase-js v2 can deadlock if you do).
    if(typeof amitAppearanceSync==='function') setTimeout(()=>{amitAppearanceSync(db);},0);
    // re-pull this project's pages under the now-current owner, so a
    // signed-in user's real Supabase page list replaces whatever the
    // signed-out localStorage cache was showing
    customPages=await loadCustomPages();
    renderAllPages();
  });
}

// Drives the Sign In/Out + Sync rail item.
function _updateSyncUI(){
  const item=document.getElementById('rail-sync');if(!item)return;
  const icon=document.getElementById('rail-sync-icon');
  const name=document.getElementById('rail-sync-name');
  const sub=document.getElementById('rail-sync-sub');
  icon.classList.add('plug-badge');
  if(currentUser){
    icon.innerHTML='<span class="plug-icon-glyph">🔓</span>';name.textContent='Sign Out';sub.textContent='Synced';
    item.dataset.tip='Sign Out — Synced';item.title='Signed in · '+currentUser.email;
    item.classList.add('active');
    icon.classList.add('connected');icon.classList.remove('disconnected');
  } else {
    icon.innerHTML='<span class="plug-icon-glyph">🔒</span>';name.textContent='Sign In';sub.textContent='Not Synced';
    item.dataset.tip='Sign In — Not Synced';item.title='';
    item.classList.remove('active');
    icon.classList.add('disconnected');icon.classList.remove('connected');
  }
}

async function signOutAmit(){
  if(!db)return;
  await db.auth.signOut();
  currentUser=null;
  _updateSyncUI();
}

// Drives the Demo rail item and flips the toggle.
function toggleDemoMode(){
  demoMode=!demoMode;
  localStorage.setItem('amit_demo_mode',demoMode?'on':'off');
  _updateDemoUI();
  // A real project's own views should re-fetch their demo-scoped data
  // here too, the same way Calendar View/Day View do in TemplateViews.html
  // (cvActiveContainers.forEach(...), dayViewInstances.forEach(...)) —
  // add that wiring once real layouts using fetchDemoRows exist on this
  // page.
}

function _updateDemoUI(){
  const icon=document.getElementById('rail-demo-icon');
  const item=document.getElementById('rail-demo');
  const name=document.getElementById('rail-demo-name');
  const sub=document.getElementById('rail-demo-sub');
  if(!item)return;
  if(demoMode){
    icon.style.opacity='1';name.textContent='Demo On';sub.textContent="Amit's Data Shown";
    item.dataset.tip='Demo On';item.title="Showing Amit's demo data — click to use your own";
    item.classList.add('active');
  } else {
    icon.style.opacity='.4';name.textContent='Demo Off';sub.textContent='Your Data Only';
    item.dataset.tip='Demo Off';item.title='Demo mode off — showing your own data';
    item.classList.remove('active');
  }
}

async function sendMagicLink(email){
  if(!db)return'Database not available';
  const{error}=await db.auth.signInWithOtp({email});
  return error?error.message:null;
}

function openSyncModal(){
  if(currentUser){if(confirm('Signed in as '+currentUser.email+'\n\nSign out?'))signOutAmit();return;}
  const m=document.getElementById('syncModal');if(!m)return;
  m.style.display='flex';
}
function closeSyncModal(){const m=document.getElementById('syncModal');if(m)m.style.display='none';}
async function submitSyncEmail(){
  const email=document.getElementById('syncEmailInput').value.trim();if(!email)return;
  const btn=document.getElementById('syncSubmitBtn');btn.textContent='Sending…';btn.disabled=true;
  const err=await sendMagicLink(email);
  if(err){btn.textContent='Try again';btn.disabled=false;}
  else{
    document.querySelector('#syncModal .sync-modal-card').innerHTML=`
      <div style="color:rgba(var(--amit-accent-rgb,201,168,76),.9);font-family:var(--amit-font-heading,'Cinzel',serif);font-size:17px;margin-bottom:14px">Link sent</div>
      <div style="color:rgba(var(--amit-text-rgb,240,232,208),.7);font-size:13px;line-height:1.7">Check your email.<br>Click the link to sign in.</div>
      <div onclick="closeSyncModal()" style="margin-top:20px;font-size:10px;color:rgba(var(--amit-text-rgb,240,232,208),.35);cursor:pointer;letter-spacing:.08em">CLOSE</div>`;
  }
}

// ══════════════════════════════════════════════
// CLOCK / GREETING — visual only, no data behind it
// ══════════════════════════════════════════════
const AMIT_NAME_KEY='amit_user_name';
function getUserName(){return localStorage.getItem(AMIT_NAME_KEY)||'';}

function updateClock(){
  const d=new Date();
  const h=d.getHours();
  const sal=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const name=getUserName();
  const g=document.getElementById('greeting');if(g)g.textContent=name?sal+', '+name:sal;
  const dt=document.getElementById('datetime');
  if(dt)dt.textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
updateClock();
setInterval(updateClock,30000);
