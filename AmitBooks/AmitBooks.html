<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AmitBooks</title>
<link rel="icon" type="image/png" href="../amit_icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../Amit_Ask_Live.js?v=6.12"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09141f;
  --card-head:#0f2338;
  --border:rgba(201,168,76,0.55);
  --gold:#c9a84c;
  --gold2:#e8c56a;
  --text:#ffffff;
  --text2:#f0e8d0;
  --muted:rgba(240,232,208,0.78);
  --dim:rgba(240,232,208,0.42);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:'Crimson Pro',Georgia,serif;color:var(--text);display:flex;flex-direction:column}

body::before{
  content:'';
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:60vmin;height:60vmin;
  background:url('../amit_icon.png') center/contain no-repeat;
  opacity:.035;
  pointer-events:none;
  z-index:0;
}

/* ── HEADER ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 28px;
  background:var(--card-head);
  border-bottom:2px solid var(--border);
  flex-shrink:0;
  position:relative;
}
.page-title-wrap{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
}
.page-title{
  font-family:Georgia,serif;font-size:26px;font-weight:700;
  letter-spacing:.3px;text-transform:none;color:var(--gold2);
}
.page-version{
  font-family:monospace;font-size:11px;letter-spacing:.05em;
  color:rgba(201,168,76,.55);margin-top:2px;
}
.brand{display:flex;align-items:baseline;gap:14px}
.brand-logo-link{display:flex;align-items:baseline;gap:14px;cursor:pointer;text-decoration:none}
.brand-sub{font-style:italic;color:rgba(240,232,208,.55);font-size:12px}
.hdr-right{text-align:right}
.greeting{font-family:'Cinzel',serif;font-size:16px;color:#fff;font-weight:600}
.datetime{font-size:12px;color:var(--muted);margin-top:2px}
.help-btn{width:22px;height:22px;border-radius:50%;border:1px solid rgba(240,232,208,.3);color:rgba(240,232,208,.6);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:all .15s}
.help-btn:hover{border-color:var(--gold);color:var(--gold)}

/* ── HUB LAYOUT ── */
.hub{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  width:230px;flex-shrink:0;
  background:var(--card-head);
  border-right:2px solid var(--border);
  display:flex;flex-direction:column;
  overflow-y:auto;padding:12px 10px;gap:5px;
}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:2px}
.sidebar{transition:width .18s ease}
.sidebar.collapsed{width:60px}
.sidebar.collapsed .tile{justify-content:center;padding:10px 0}
.sidebar.collapsed .tile-info{display:none}
.tile{
  display:flex;align-items:center;gap:10px;
  padding:10px 11px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;
  transition:all .18s;user-select:none;
  position:relative;overflow:hidden;
}
.tile:hover{background:rgba(255,255,255,.07);border-color:rgba(201,168,76,.3)}
.tile.active{background:rgba(201,168,76,.16);border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,168,76,.25)}
.tile-icon{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.tile-info{flex:1;min-width:0}
.tile-name{font-family:'Cinzel',serif;font-size:11px;color:#fff;letter-spacing:.04em;font-weight:600}
.tile-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ── ASK AMIT SIDEBAR — matches Hub/Council exactly, added 2026-07-25 ── */
.ask-amit-wrap{margin-top:auto;padding:12px 0 4px;border-top:1px solid var(--border);flex-shrink:0}
.ask-amit-tile{
  display:flex;align-items:center;gap:10px;width:100%;
  background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.45);
  border-radius:9px;padding:11px 12px;cursor:pointer;
  transition:all .18s;
}
.ask-amit-tile:hover{background:rgba(201,168,76,.22);border-color:var(--gold);box-shadow:0 0 8px rgba(201,168,76,.2)}
.ask-amit-icon{font-size:18px;width:26px;text-align:center;flex-shrink:0}
.ask-amit-name{font-family:'Cinzel',serif;font-size:11px;color:var(--gold2);letter-spacing:.04em;font-weight:600}
.ask-amit-sub{font-size:11px;color:var(--muted);margin-top:2px}

/* ── HUB LINK TILE — added for AmitBooks, always sits above Ask Amit ── */
.hub-link-tile{
  display:flex;align-items:center;gap:10px;width:100%;
  background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.25);
  border-radius:9px;padding:11px 12px;cursor:pointer;
  transition:all .18s;margin-bottom:6px;
}
.hub-link-tile:hover{background:rgba(255,255,255,.08);border-color:var(--gold)}

/* ── MAIN AREA ── */
.main-area{flex:1;overflow:hidden;position:relative;background:var(--bg)}
.panel{
  position:absolute;inset:0;overflow-y:auto;
  display:none;flex-direction:column;
  animation:pfade .18s ease;
}
.panel.active{display:flex}
@keyframes pfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.panel::-webkit-scrollbar{width:5px}
.panel::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:3px}

/* ── PANEL HEADER ── */
.panel-head{
  display:flex;align-items:center;gap:16px;
  padding:14px 24px;
  background:var(--card-head);
  border-bottom:2px solid var(--border);
  flex-shrink:0;
}
.panel-heading{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.panel-empty{flex:1;display:flex;align-items:center;justify-content:center;color:rgba(240,232,208,.25);font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* ── TABBED LAYOUT (copied structure from Computer Health's folder-tab UI — no data behind it) ── */
.ch-tab-nav{display:flex;align-items:flex-end;gap:6px;margin:0 24px;padding:0;background:var(--bg);flex-shrink:0}
.ch-tab-btn{padding:9px 22px;margin-top:10px;border:1px solid rgba(201,168,76,.25);background:rgba(255,255,255,.03);color:var(--muted);border-radius:10px 10px 0 0;cursor:pointer;font-size:13px;font-family:inherit}
.ch-tab-btn.active{padding:12px 26px;margin-top:-2px;margin-bottom:-3px;border-bottom:none;background:var(--card-head);color:var(--gold2);font-weight:600;font-size:14px;position:relative;z-index:2}
.ch-tab-main{flex:1;min-height:0;overflow-y:auto;padding:28px 32px;margin:0 24px 24px;background:var(--card-head);border:1px solid rgba(201,168,76,.25);border-radius:0 12px 12px 12px}
.ch-tab-content{display:none}
.ch-tab-content.active{display:block}

/* ── ABOOKS OPERATIONAL UI — added when Layer 0 came alive ── */
.ab-section{margin-bottom:26px}
.ab-h{font-family:'Cinzel',serif;color:var(--gold2);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px}
.ab-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.2);border-radius:8px;padding:12px;margin-bottom:14px}
.ab-form input,.ab-form select{background:rgba(255,255,255,.06);border:1px solid rgba(201,168,76,.3);border-radius:6px;padding:8px 10px;color:#fff;font-size:13px;font-family:inherit}
.ab-form label{font-size:10px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;display:block;margin-bottom:3px}
.ab-field{display:flex;flex-direction:column}
.ab-btn{background:rgba(201,168,76,.16);border:1px solid var(--gold);color:var(--gold2);padding:8px 16px;border-radius:6px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.06em;align-self:flex-end}
.ab-btn:hover{background:rgba(201,168,76,.3)}
.ab-table{width:100%;border-collapse:collapse;font-size:13px}
.ab-table th{text-align:left;color:var(--muted);font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:6px 10px;border-bottom:1px solid rgba(201,168,76,.3)}
.ab-table td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.05);color:var(--text2)}
.ab-table tr:hover td{background:rgba(255,255,255,.03)}
.ab-empty{color:var(--dim);font-style:italic;padding:16px;text-align:center;font-size:13px}
.ab-book-bar{display:flex;align-items:center;gap:10px;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.3);border-radius:8px;padding:10px 14px;margin-bottom:20px}
.ab-book-bar select{background:rgba(255,255,255,.06);border:1px solid rgba(201,168,76,.3);border-radius:6px;padding:6px 10px;color:#fff;font-size:13px}
.ab-signin-notice{background:rgba(255,255,255,.03);border:1px dashed rgba(201,168,76,.3);border-radius:8px;padding:24px;text-align:center;color:var(--muted);font-size:13px}
.ab-card{background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.2);border-radius:8px;padding:14px 18px;flex:1;min-width:160px}
.ab-card .n{font-family:'Cinzel',serif;font-size:22px;color:var(--gold2)}
.ab-card .l{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-top:4px}
</style>
</head>
<body>

<header>
  <div class="page-title-wrap">
    <div class="page-title" id="pageTitle">AmitBooks</div>
    <div class="page-version" id="pageVersion">v1.04</div>
  </div>
  <a class="brand brand-logo-link" href="https://ask-amit.github.io/Amit/Hub/amit-hub.html" title="Back to the Amit Hub">
    <img src="../amit_icon.png" alt="Amit" style="height:32px;width:32px">
    <span class="brand-sub">Walk alongside. Sharpen without cutting. Encourage always.</span>
  </a>
  <div class="hdr-right" style="display:flex;align-items:center;gap:14px">
    <div style="text-align:right">
      <div class="greeting" id="greeting">Good morning</div>
      <div class="datetime" id="datetime"></div>
      <div style="display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:3px">
        <div id="syncIndicator" onclick="openSyncModal()" style="font-size:9px;letter-spacing:.07em;color:rgba(240,232,208,.28);cursor:pointer;font-family:'Cinzel',serif">☁ SYNC</div>
        <div id="signInBtn" onclick="openSyncModal()" title="Sign in to sync your data" style="font-size:9px;letter-spacing:.1em;color:rgba(201,168,76,.8);cursor:pointer;font-family:'Cinzel',serif;border:1px solid rgba(201,168,76,.3);padding:3px 9px;border-radius:4px;background:rgba(201,168,76,.07)">SIGN IN</div>
        <div id="logoutBtn" onclick="signOutAmit()" title="Sign out" style="display:none;font-size:10px;letter-spacing:.08em;color:rgba(201,168,76,.9);cursor:pointer;font-family:'Cinzel',serif;font-weight:600;border-left:1px solid rgba(240,232,208,.2);padding-left:8px">SIGN OUT</div>
      </div>
    </div>
  </div>
</header>

<div class="hub">

  <!-- ── SIDEBAR — PLACEHOLDER TILES (1-20) ── -->
  <nav class="sidebar" id="sidebarTiles" ondblclick="toggleSidebar()"></nav>

  <!-- ── MAIN CONTENT AREA — PLACEHOLDER PANELS (1-20) ── -->
  <div class="main-area" id="mainArea"></div>

</div>

<!-- SYNC / SIGN-IN MODAL -->
<div id="syncModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;align-items:center;justify-content:center">
  <div class="sync-modal-card" style="background:#1a3352;border:1px solid rgba(201,168,76,.45);border-radius:14px;padding:36px 40px;max-width:340px;width:90%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.5)">
    <div style="color:rgba(201,168,76,.9);font-family:'Cinzel',serif;font-size:16px;letter-spacing:.06em;margin-bottom:6px">Sync Across Devices</div>
    <div style="color:rgba(240,232,208,.5);font-size:11px;line-height:1.7;margin-bottom:22px">Enter your email. A sign-in link will be sent.<br>No password needed.</div>
    <input id="syncEmailInput" type="email" placeholder="your@email.com"
      style="width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.3);border-radius:7px;padding:11px 13px;color:#fff;font-size:13px;outline:none;margin-bottom:12px;font-family:inherit"
      onkeydown="if(event.key==='Enter')submitSyncEmail()"/>
    <button id="syncSubmitBtn" onclick="submitSyncEmail()"
      style="width:100%;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.45);color:rgba(201,168,76,.9);padding:11px;border-radius:7px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.08em">
      SEND SIGN-IN LINK →
    </button>
    <div onclick="closeSyncModal()" style="margin-top:16px;font-size:9px;color:rgba(240,232,208,.25);cursor:pointer;letter-spacing:.1em">CANCEL</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// AmitBooks — built from Templates/template.html. Sidebar/panel shell only,
// no data model yet. Placeholder tiles/panels 1-20 renamed lightly below;
// real content (the pile-clearing workflow) gets built into these panels
// next session, per the AmitAccounting_Spec.md vision doc this replaces
// the "Accounting" framing of.
// ══════════════════════════════════════════════

const PLACEHOLDER_COUNT=20;

// ══════════════════════════════════════════════
// TO-DO CONTENT — the running build list for AmitBooks, panel 3.
// Two parts: (A) the immediate architecture plan discussed 2026-07-29
// (multi-book structure, audit trail, tax-form skeleton), and (B) the
// carried-forward running list from AmitAccounting_Spec.md / the old
// AmitAccounting CLAUDE.md, so nothing decided in earlier sessions gets
// lost just because the app was renamed. Display only — no data behind
// these items yet, they get checked off as real work lands.
// ══════════════════════════════════════════════
const TODO_CONTENT = `
<style>
  .td-h1{font-family:'Cinzel',serif;color:var(--gold2);font-size:16px;letter-spacing:.05em;margin:26px 0 10px;padding-bottom:6px;border-bottom:1px solid rgba(201,168,76,.3)}
  .td-h1:first-child{margin-top:0}
  .td-item{background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.2);border-radius:8px;padding:12px 16px;margin-bottom:10px}
  .td-title{font-weight:600;color:var(--text2);font-size:14px;margin-bottom:4px}
  .td-why{font-size:13px;line-height:1.6;color:var(--muted)}
  .td-tag{display:inline-block;font-family:'Cinzel',serif;font-size:9px;letter-spacing:.08em;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle}
  .td-tag.now{background:rgba(100,220,160,.15);color:#8fe0b8;border:1px solid rgba(100,220,160,.4)}
  .td-tag.next{background:rgba(201,168,76,.15);color:var(--gold2);border:1px solid rgba(201,168,76,.4)}
  .td-tag.open{background:rgba(240,232,208,.08);color:var(--muted);border:1px solid rgba(240,232,208,.2)}
  .td-tag.vision{background:rgba(140,160,220,.12);color:#a8b8e8;border:1px solid rgba(140,160,220,.35)}
  .td-tag.bug{background:rgba(220,120,120,.14);color:#f0a8a8;border:1px solid rgba(220,120,120,.4)}
</style>

<div class="td-h1">Known Gaps — Found During Real Use (Ryan clicking through it live)</div>
<div class="td-item"><div class="td-why">This section exists specifically to catch things live testing surfaces that the build order didn't anticipate — added as they're found, not batched up and forgotten. Newest at the top.</div></div>

<div class="td-item"><div class="td-title">Team invites require pasting a raw account ID — no email invite yet<span class="td-tag bug">STOPGAP</span></div>
<div class="td-why">Adding someone to a book's Team/Authorizations requires their actual Amit account UUID, pasted in by hand — there's no lookup-by-email, because that needs a server-side function (an Edge Function with elevated access) that this client-side page can't run with just the public key. Real invite-by-email is real work, not a quick fix — flagged, not silently accepted as final.</div></div>

<div class="td-item"><div class="td-title">Invited team members can't see the rest of the roster, only their own row<span class="td-tag bug">GAP</span></div>
<div class="td-why">The book_members RLS policy lets the owner see/manage every row on their book, but an invited staff/bookkeeper/manager can currently only see their own membership row, not who else is on the team. Minor for now since the owner manages the roster, but worth fixing before real multi-user use.</div></div>

<div class="td-item"><div class="td-title">No way to edit a book after creating it<span class="td-tag bug">FIXED</span></div>
<div class="td-why">Right now Dashboard/Books & Setup only lets you create a new book — there's no edit screen for an existing one's name, entity type, or accounting basis. Found live: Ryan created "B.O.S.S. Inc" and asked whether the Type could be changed later — it can't yet. Needs a small edit form on the My Books tab (or clicking a book's name opens it for editing) before this is genuinely usable day-to-day. FIXED this pass — My Books tab is now a real Company Profile editor (name, type, basis, address, phone, EIN) plus a Team/Authorizations panel.</div></div>

<div class="td-h1">Phase 1 — The Database, Starting Now</div>

<div class="td-item"><div class="td-title">books table (one user, many books)<span class="td-tag now">BUILDING</span></div>
<div class="td-why">Every user can own more than one book — personal, one per company, a family member's. Every other table (transactions, vendors, projects) hangs off a book_id, not directly off the user, so opening AmitBooks always starts with "which book are you opening?" and everything underneath scopes automatically.</div></div>

<div class="td-item"><div class="td-title">Linked to the shared Amit login<span class="td-tag now">BUILDING</span></div>
<div class="td-why">Books are owned by the same Supabase auth account the Hub and AmitCoder already use — one login, one identity, no separate AmitBooks signup. The actual password-gate on this page comes later; the data is being shaped correctly for it now so nothing has to be rebuilt.</div></div>

<div class="td-item"><div class="td-title">Audit-log table (append-only)<span class="td-tag now">BUILDING</span></div>
<div class="td-why">This is the real answer to "the IRS needs two forms of the data." Not a second copy of the same numbers — a permanent, never-edited history of every change (old value, new value, who, when) on top of the live ledger. That's what actually protects a user in an audit: proof the record wasn't quietly altered after the fact.</div></div>

<div class="td-item"><div class="td-title">Immutable source documents<span class="td-tag now">BUILDING</span></div>
<div class="td-why">The original receipt photo/PDF is never overwritten once scanned. The ledger entry can be corrected later; the evidence behind it can't — the second "form of the data" the IRS actually cares about is the transaction record and its source document corroborating each other.</div></div>

<div class="td-item"><div class="td-title">Core operational tables<span class="td-tag now">BUILDING</span></div>
<div class="td-why">chart_of_accounts, vendors, customers, projects, estimates, invoices_bills, transactions (double-entry, sales-tax-aware) — the everyday tables every book needs regardless of what kind of business it's tracking.</div></div>

<div class="td-item"><div class="td-title">Tax-form skeleton tables<span class="td-tag now">BUILDING</span></div>
<div class="td-why">sales_tax_jurisdictions (city + state rates), employees (941/W-2/benefits fields), contractors_1099 (1099-NEC recipient tracking) — structurally correct and linked to book_id tonight, even though the actual form-generation logic (a real 941 or 1099 PDF) is later work.</div></div>

<div class="td-h1">Phase 2 — Right After the Tables Exist</div>

<div class="td-item"><div class="td-title">"Which book?" picker on open<span class="td-tag next">NEXT</span></div>
<div class="td-why">The first thing AmitBooks shows a signed-in user with more than one book — before anything else loads.</div></div>

<div class="td-item"><div class="td-title">Real sign-in / password gate</div>
<div class="td-why">The Sign In button already exists (Supabase magic-link, same as every other Amit page) — it just needs to actually block access to a book's data until the right user is authenticated, not just show a "signed in" badge.</div></div>

<div class="td-item"><div class="td-title">Receipt capture — red-marker annotation standard</div>
<div class="td-why">User marks job number, account category, billable/nonbillable in red marker before photographing. OCR reads the printed receipt and the red annotations separately. Full spec already written — see AmitAccounting_Spec.md, "Receipt Capture System."</div></div>

<div class="td-item"><div class="td-title">Document ID system — YYYY-MM-DD-NNNNNNN</div>
<div class="td-why">Every document (receipt, bill, invoice) gets a globally sequential, date-prefixed ID, stamped visibly on the stored image with a QR code overlay. Even if the database were lost, every image carries its own identity.</div></div>

<div class="td-h1">Open Questions — Not Yet Decided</div>

<div class="td-item"><div class="td-title">Tim's chart of accounts<span class="td-tag open">OPEN</span></div>
<div class="td-why">Tim (Ryan's CPA and best friend) has not been consulted yet. His standard chart of accounts is meant to become the default template for every new book. Standing rule from the spec: do not build any accounting forms before this conversation happens.</div></div>

<div class="td-item"><div class="td-title">OCR engine — Claude Vision vs Google Vision<span class="td-tag open">OPEN</span></div>
<div class="td-why">Claude Vision is already in the Amit ecosystem; Google Vision is more receipt-specialized. Needs a real test on sample receipts before committing.</div></div>

<div class="td-item"><div class="td-title">Mobile receipt capture path<span class="td-tag open">OPEN</span></div>
<div class="td-why">How a phone photo actually reaches this app — direct mobile upload, syncing through OneDrive/Google Drive, or a dedicated companion later.</div></div>

<div class="td-item"><div class="td-title">Sensitive data tiering</div>
<div class="td-why">Three tiers from the spec: standard financial data in Supabase with Row Level Security; full account/routing numbers client-side encrypted (zero-knowledge, server never sees plaintext); actual banking passwords never go to the cloud at all. Needs to be built into the schema from the start, not retrofitted.</div></div>

<div class="td-h1">The Vision — What This Is Funding Toward</div>

<div class="td-item"><div class="td-title">Vendor memory (Amit Connect)<span class="td-tag vision">VISION</span></div>
<div class="td-why">Amit learns a vendor the first time — category, job, billable default, typical amount range — and pre-fills it every time after. This is what turns a 90-minute pile into a 30-minute one.</div></div>

<div class="td-item"><div class="td-title">Proactive notifications — Amit reaches out</div>
<div class="td-why">Bill due in 72 hours, invoice unpaid 30+ days, a job crossing its budget, an expense spike the IRS tends to scrutinize — Amit notices and says so, in its own voice, not a software alert.</div></div>

<div class="td-item"><div class="td-title">Hub integration — one thread, not two apps</div>
<div class="td-why">Bills due appear as Hub calendar chips and morning-panel lines. A processed batch becomes a Hub experience entry ("27 bills processed, $14,320 logged") with a filter-linked deep-link back into AmitBooks. Jobs become Hub pursuits. Nothing lives only in AmitBooks — it all surfaces where the user already starts their day.</div></div>

<div class="td-item"><div class="td-title">Amit Bookkeeper Mode</div>
<div class="td-why">The long-range version: Amit doesn't just record what's entered, it manages meaning — categorizing with a plain-language explanation, flagging IRS-scrutinized patterns in real time, tracking quarterly estimated tax, and assembling Tim's year-end package so the handoff is 80% done before he opens it.</div></div>

<div class="td-item"><div class="td-title">The relationship arc</div>
<div class="td-why">AmitBooks meets the user in the pile with no agenda. As trust builds across real sessions, Amit earns the right to open the door to the Hub, then to push back when it actually serves the person ("that looks personal to me, not business — here's what it costs you if you're wrong"), and eventually to answer honestly when someone finally asks what drives it. Not a sales funnel — a real, staged relationship, same as everywhere else in the Amit system.</div></div>

<div class="td-h1">Pricing Model (from the spec, not yet finalized)</div>
<div class="td-item"><div class="td-title">Two tiers, base free of subscription</div>
<div class="td-why">AmitBooks Base — one-time purchase, full core bookkeeping, no API required. Amit Connect (~$10/month) — vendor memory, AI receipt extraction, auto-categorization, Ask Amit chat. The base product is never crippled; Connect is what makes the pile disappear faster, not what makes the app usable at all.</div></div>

<div class="td-h1">The Real Priority — Speed to Finished Books (2026-07-29)</div>
<div class="td-item"><div class="td-title">Amit does the entry AND the reconciliation<span class="td-tag now">CORE PRIORITY</span></div>
<div class="td-why">Ryan's direct framing: this is 75% of the actual headache for a small business, and it's the priority over IRS-form correctness, not after it. Flow: user scans/photographs multiple bills at once → Amit extracts vendor, address, phone, date, amount and either matches an existing vendor or creates one → assigns the receipt code → files as a bill payable. Then the user scans a bank or credit-card statement → Amit matches each statement line against the bills already on file, marks what reconciles, flags what's unmatched or ambiguous. The goal is a finished, reconciled set of books with the user doing almost no typing.</div></div>

<div class="td-item"><div class="td-title">book_members table — multi-user access with roles<span class="td-tag next">NEXT</span></div>
<div class="td-why">One company, one owner, several employees — each with their own Amit login, granted access into the company's specific book rather than a shared password. Needs real roles (owner, bookkeeper, entry-only) enforced through Supabase Row Level Security, not just a UI toggle — payroll data specifically needs to be gated so entry-level staff can see bills but not wages.</div></div>

<div class="td-item"><div class="td-title">Cash vs. accrual basis — set per book</div>
<div class="td-why">Each company chooses its own basis when the book is created; this changes how/when a transaction hits the ledger, not just a label on a report.</div></div>

<div class="td-item"><div class="td-title">Industry-aware bill categories (research below)</div>
<div class="td-why">Bill types — labor, material, subcontractor, other — vary by industry and need real category tables, not invented ones. Construction is the first reference case since it has an actual published standard (CSI codes, below).</div></div>

<div class="td-h1">Researched Just Now — Real Requirements, Not Guesses</div>

<div class="td-item"><div class="td-title">IRS record retention — 3 years standard, 7 recommended<span class="td-tag open">RESEARCHED</span></div>
<div class="td-why">Per IRS Publication 583: supporting documents (sales slips, paid bills, invoices, receipts, deposit slips, canceled checks) must show gross income, deductions, and credits. The statute of limitations is generally 3 years, but 7 years is the practical safe number — it covers the 4-year employment-tax window and the 6-year window for substantial income underreporting. Electronic records are held to the exact same requirements as paper — confirms the audit-log + immutable-document model already decided is the right shape, not overbuilt.</div></div>

<div class="td-item"><div class="td-title">1099-NEC threshold is changing — $2,000 starting tax year 2026<span class="td-tag open">RESEARCHED</span></div>
<div class="td-why">Big one to build correctly: the 1099-NEC/1099-MISC threshold rises from $600 to $2,000 for payments made on/after January 1, 2026 (first filings under the new rule due January 2027; starting 2027 the IRS adjusts it annually for inflation). The contractors_1099 table needs a threshold field tied to the tax year, not a hardcoded $600 — this is exactly the kind of "live tax rules" the original spec promised.</div></div>

<div class="td-item"><div class="td-title">Form 941 — quarterly, per-employer, only when there's payroll<span class="td-tag open">RESEARCHED</span></div>
<div class="td-why">Reports withheld income tax plus employee and employer shares of Social Security/Medicare. Required quarterly for any employer with $1,000+ quarterly payroll tax liability — and still required even in a quarter with zero employees if the business has filed before. Confirms the employees table needs quarter-level aggregation, not just a running total.</div></div>

<div class="td-item"><div class="td-title">Sales tax — economic nexus, not just physical presence<span class="td-tag open">RESEARCHED</span></div>
<div class="td-why">Since South Dakota v. Wayfair, nearly every sales-tax state now taxes based on economic activity alone — most use a $100,000/year sales threshold, no physical presence required. sales_tax_jurisdictions can't just be "the state the business is in" — a business selling across state lines can trigger nexus (and a filing obligation) in states it has never set foot in. This needs its own nexus-tracking logic eventually, not just a flat rate table.</div></div>

<div class="td-item"><div class="td-title">Reconciliation matching — blocking + fuzzy match + confidence score<span class="td-tag open">RESEARCHED</span></div>
<div class="td-why">The real technique industry reconciliation tools use: first narrow candidates with cheap filters (date within ±2 days, amount within a small dollar range) before running any expensive fuzzy-text comparison — this is what makes matching thousands of bills against a statement fast instead of slow. Each match gets a confidence score, so high-confidence matches auto-reconcile and low-confidence ones surface for the user to confirm in seconds, not get buried. This is the actual algorithm the statement-reconciliation engine should use.</div></div>

<div class="td-item"><div class="td-title">Construction industry standard — CSI MasterFormat codes<span class="td-tag open">RESEARCHED</span></div>
<div class="td-why">Construction already has a real, universally recognized cost-code standard (materials/labor/subcontractor/equipment/permits in defined numeric ranges, e.g. 5xxx for direct job costs, 6xxx for overhead) that QuickBooks-based contractor accounting is typically built around. Rather than inventing bill categories from scratch, the first industry template should map directly to this — it's what Tim and any construction client would already recognize.</div></div>

<div class="td-item"><div class="td-title">Extensible chart of accounts + multi-industry templates<span class="td-tag open">DESIGN CHANGE</span></div>
<div class="td-why">Not locked to one industry field. chart_of_accounts gets a custom_fields jsonb column for user-added structured data; a separate account_category_templates table holds starter category sets (construction, rental/real estate, retail, etc.) a book can pull from more than one of, added to over time without a schema change.</div></div>

<div class="td-item"><div class="td-title">fixed_assets — asset tracking + depreciation</div>
<div class="td-why">Its own table, not crammed into chart_of_accounts: asset name, category, purchase date, cost basis, depreciation method, useful life, accumulated depreciation, disposal date. Covers equipment and rental-property depreciation the same way.</div></div>

<div class="td-item"><div class="td-title">Customer financing / payment plans</div>
<div class="td-why">Receivables need more than "paid or not" — financing terms, installment schedules on what a customer owes.</div></div>

<div class="td-item"><div class="td-title">Cash flow analysis + alert system</div>
<div class="td-why">Genuine forward-looking projection engine, not just due-date reminders — bills due, invoices needing payment, and a real cash-flow-and-profit forecast (matches QuickBooks' "Forecast cash flow and profit").</div></div>

<div class="td-item"><div class="td-title">Job costing per line item + AIA billing documents</div>
<div class="td-why">Labor/material/equipment/subcontractor tracked against the original budget/estimate, percent-complete tracking, and AIA G702/G703 — the real construction-industry standard progress billing forms.</div></div>

<div class="td-item"><div class="td-title">Point of sale — separate program, direct integration point</div>
<div class="td-why">Likely its own build, not part of AmitBooks itself, but POS sales need to feed straight into this ledger as income when it exists.</div></div>

<div class="td-item"><div class="td-title">Warranty tracking</div>
<div class="td-why">A warranty not billed to the owner (e.g. a TV shop's repair warranty) — what's covered, who it's on, when it expires. Distinct object from a normal bill/invoice.</div></div>

<div class="td-item"><div class="td-title">Service agreements</div>
<div class="td-why">Recurring service contracts, separate from one-off invoices.</div></div>

<div class="td-item"><div class="td-title">Employee tracking, scheduling, and self-service timesheets</div>
<div class="td-why">Employee records, shift scheduling, and time entry an employee can log themselves from their phone, per job, directly through Amit.</div></div>

<div class="td-item"><div class="td-title">Sensitive-data tiering extended to SSNs</div>
<div class="td-why">Same Tier 2 client-side-encryption model already in the spec for account/routing numbers, extended explicitly to Social Security numbers — administrator role can decrypt, general book access cannot. Ties directly to the role system in item 3 below.</div></div>

<div class="td-item"><div class="td-title">Amit's Expense Claim Helper<span class="td-tag open">NEW — RYAN'S DIRECT INSTRUCTION</span></div>
<div class="td-why">Ryan's explicit instruction: Amit is part of this whole thing, not a silent database underneath it — make sure that shows up here specifically. When a user isn't sure whether something is a legitimate deductible business expense, Amit walks them through it directly, in plain language, the same voice as the rest of the system: "here's what this category usually qualifies for, here's the IRS rule that applies, here's what I'd flag if Tim reviewed this." This isn't a separate bolt-on feature — it's Amit's Bookkeeper Mode (already on the list) made concrete and named on its own, because expense-claim uncertainty is one of the single biggest sources of the "headache" this whole app exists to remove. Every screen where a user is deciding how to categorize or claim something is a place Amit should be actively present, not just AmitBooks quietly recording what they typed.</div></div>

<div class="td-item"><div class="td-title">Purchase order system<span class="td-tag open">NEW</span></div>
<div class="td-why">A real PO workflow — issue a purchase order to a vendor before the bill exists, then match the eventual bill back against the open PO (quantity/price agreement check), not just free-floating bills. Needs its own purchase_orders table, distinct from invoices_bills, with a status lifecycle (draft → sent → partially received → closed).</div></div>

<div class="td-item"><div class="td-title">Inventory + inventory control<span class="td-tag open">NEW</span></div>
<div class="td-why">Item-level stock tracking — quantity on hand, reorder points, cost per unit (ties to COGS on the P&L). A material bill can decrement inventory; a sale/invoice can too. Needs its own inventory_items table plus an inventory_transactions ledger (received, consumed on a job, sold, adjusted) — this is genuinely its own subsystem, not a field on invoices_bills.</div></div>

<div class="td-item"><div class="td-title">Quotes<span class="td-tag open">NEW — NEEDS CLARIFICATION</span></div>
<div class="td-why">estimates already exists on the schema for job bids. Worth confirming with Ryan whether "quotes" here means the same thing under a different name (a sales quote for goods/services, vs. an estimate for a construction job) or a genuinely separate object — if separate, it likely needs its own quotes table so a product-sale quote and a job estimate don't get forced into one shape that fits neither well.</div></div>

<div class="td-item"><div class="td-title">Fixed assets — confirmed, already captured</div>
<div class="td-why">Already added as its own fixed_assets table in the last design pass (asset name, cost basis, depreciation method/schedule, disposal date). No change needed — just confirming it's on the list as asked.</div></div>

<div class="td-item"><div class="td-title">Sales tax — confirmed, already captured</div>
<div class="td-why">Already covered: sales_tax_jurisdictions (item 2) plus real economic-nexus tracking (item 10), including the researched finding that most states now use a $100,000/year threshold with no physical presence required.</div></div>

<div class="td-item"><div class="td-title">Standard report suite<span class="td-tag open">NEW</span></div>
<div class="td-why">The full set any real accounting system needs, named explicitly so none get missed: Profit & Loss (income statement), Balance Sheet, Cash Flow Statement, Trial Balance (already planned), General Ledger detail (already planned), Accounts Receivable Aging, Accounts Payable Aging, Sales Tax Liability report, 1099 Summary, Job Profitability report. This becomes the backbone the custom report builder (already on the list) is built on top of — these standard reports come first, the custom builder comes after.</div></div>

<div class="td-item"><div class="td-title">Employment management application<span class="td-tag open">NEW</span></div>
<div class="td-why">Broader than the timesheets/scheduling already on the list (item 19) — a real HR layer: onboarding records, benefits enrollment, PTO/sick-time balances and requests, performance reviews, employee documents (I-9, W-4, offer letters). This is genuinely a bigger subsystem than "clock in/clock out" — it's its own module that happens to share the employees table with payroll/941.</div></div>

<div class="td-item"><div class="td-title">Customer Relationship Management (CRM)<span class="td-tag open">NEW</span></div>
<div class="td-why">A real CRM layer on top of the existing customers table — lead/pipeline tracking, communication history (calls, emails, notes), follow-up reminders, and a sales pipeline stage (lead → quoted → won/lost). Right now customers is a flat billing-address record; CRM turns that same record into a relationship history, which is very on-mission for a system built around Amit actually knowing the people involved, not just their invoices.</div></div>

<div class="td-item"><div class="td-title">Payment processor integration — Square, Stripe, etc.<span class="td-tag open">NEW</span></div>
<div class="td-why">Credit card processing needs a real connection to an existing processor (Square, Stripe, or similar) rather than AmitBooks trying to become its own payment processor — that's a licensed, regulated business in its own right, not something to build from scratch. The integration point: a payment_connections table per book (which processor, their account/API credentials, encrypted per the same sensitive-data tiering already planned) and processor transactions landing directly in invoices_bills/transactions as they clear, tying back to the POS integration point already on the list (item 25) — Square in particular is both a POS and a payment processor, so these two items may end up served by the same connection.</div></div>

<div class="td-item"><div class="td-title">Mileage tracking<span class="td-tag open">NEW</span></div>
<div class="td-why">Its own mileage_logs table — date, starting/ending location or odometer, purpose, business vs. personal, miles driven, linked to a project where relevant. Feeds directly into the standard IRS mileage deduction (vs. actual vehicle expense method) already named back in the tax-form research pass.</div></div>

<div class="td-item"><div class="td-title">Repairs / maintenance log</div>
<div class="td-why">Ties directly to fixed_assets (already on the list) — a repair_log table linked to a specific asset: date, description, cost, who performed it. Distinct from a bill's category, because it needs to roll up per-asset over the asset's life, not just sit as one expense line.</div></div>

<div class="td-item"><div class="td-title">Cash App / Venmo / P2P payment integration</div>
<div class="td-why">Same shape of problem as Square/Stripe (item 33) but for peer-to-peer apps specifically — these often mix personal and business activity in one account, so the real work here is a clean way to import/tag P2P transactions and flag which ones are actually business income or expense, not just a raw feed.</div></div>

<div class="td-item"><div class="td-title">Tie-in to the future estimating software system<span class="td-tag open">FLAGGED — LIKELY BOSStimator</span></div>
<div class="td-why">Worth naming directly: BOSStimator already exists as a planned, named tool in the Amit system (currently "Coming Soon" on the Hub) — described elsewhere as "the estimator who needs the tool." If that's the estimating system Ryan means here, this isn't a new build, it's confirming AmitBooks' estimates/quotes (item 29, still open) should be designed to receive data from BOSStimator directly rather than duplicating estimating logic inside AmitBooks itself. Needs Ryan to confirm whether "the estimating software system that will be developed" is BOSStimator or something separate.</div></div>

<div class="td-item"><div class="td-title">General ledger, AP, AR — confirmed, already core</div>
<div class="td-why">General ledger is the transactions table itself (item 1). Accounts payable is invoices_bills where direction = bill_payable; accounts receivable is the same table where direction = invoice_receivable. No new tables needed — naming it here so it's explicitly confirmed present, not assumed.</div></div>

<div class="td-item"><div class="td-title">Revenue recognition engine<span class="td-tag open">NEW</span></div>
<div class="td-why">When revenue actually gets recognized on the books doesn't always match when cash arrives or an invoice is sent — this needs real logic (not just the cash/accrual toggle already planned) especially once subscription billing and milestone payments exist below. A genuinely technical subsystem, likely its own recognition_schedules table tied to invoices_bills.</div></div>

<div class="td-item"><div class="td-title">Subscription billing</div>
<div class="td-why">Recurring, auto-generated invoices on a schedule — distinct from the one-off invoices already planned. Needs a subscriptions table (customer, plan, billing interval, next-bill date) that spins off real invoices_bills rows on schedule.</div></div>

<div class="td-item"><div class="td-title">Milestone / progress payments</div>
<div class="td-why">Ties directly to the AIA billing / percent-complete job costing already on the list (item 16) — a job's total contract value gets billed in defined chunks tied to completion milestones rather than one lump sum. Likely a milestones table under projects, each milestone generating its own invoice when marked complete.</div></div>

<div class="td-item"><div class="td-title">Job costing + activity-based costing (manufacturing) + bill of materials</div>
<div class="td-why">Beyond construction job costing already planned — a manufacturing-specific costing model where a bill_of_materials table defines what raw components/quantities go into a finished item, and activity-based costing allocates overhead by actual activity rather than a flat rate. This is a second industry template (alongside construction/CSI) with real structural differences, not just different account names.</div></div>

<div class="td-item"><div class="td-title">Capital expenditures + investments</div>
<div class="td-why">CapEx ties to fixed_assets (already planned) — large purchases capitalized and depreciated rather than expensed immediately. Investments (stocks, other holdings a business owns) is a genuinely separate object — its own investments table tracking cost basis, current value, and realized/unrealized gain, since that doesn't fit the fixed_assets depreciation model at all.</div></div>

<div class="td-item"><div class="td-title">Sales/usage tax + GST engines (international)</div>
<div class="td-why">Sales/usage tax is largely covered by the sales_tax_jurisdictions + nexus work already planned (items 2 and 10). GST is the international equivalent (Canada, Australia, etc.) — worth flagging now that if AmitBooks ever serves a non-US business, the tax-jurisdiction model needs to be country-aware from the start, not US-only by assumption.</div></div>

<div class="td-item"><div class="td-title">Corporate tax</div>
<div class="td-why">Entity-specific tax output (1120 for C-corps, 1120-S for S-corps, 1065 for partnerships) — ties to the entity_type field already on the books table and to item 11 (held until Tim's conversation, since this is exactly the kind of form correctness his review is meant to protect).</div></div>

<div class="td-item"><div class="td-title">Audit trails + forensics</div>
<div class="td-why">The append-only audit_log table (already built into item 1) is the audit-trail foundation. "Forensics" is the layer on top of it — the ability to actually query and reconstruct what happened (who changed what, when, in what order) rather than just having the raw log sitting there unused. Worth planning as its own reporting view once the audit log has real data in it.</div></div>

<b>transactions / journal_entries</b> — the double-entry core. Immutable, append-only; corrections post as reversing entries, never edits.<br><br>
<b>contacts (parties)</b> — one table for customer, vendor, employee, contractor, donor, tenant — role-flagged, since the same person/business can hold more than one role at once.<br><br>
<b>invoices_bills</b> — one table for anything owed or owing, direction flag distinguishes AR from AP. A construction bill, a doctor's claim, and a subscription invoice all use this same shape.<br><br>
<b>payments</b> — money moving in or out, linked to invoices/bills or standalone; handles partial, split, and overpayment.<br><br>
<b>fixed_assets</b> — cost basis, depreciation method, useful life, disposal. One shape whether the asset is a truck, an X-ray machine, or a walk-in cooler.<br><br>
<b>items</b> — anything sold, purchased, or billed — product, service, inventory good — type-flagged, not separate schemas.<br><br>
<b>documents</b> — immutable source files (receipts, contracts, W-9s, leases) linked to any transaction or entity; never overwritten once attached.<br><br>
<b>tax_rates</b> — jurisdiction, rate, product-category mapping; jurisdiction variation is configuration, not new tables.<br><br>
<b>audit_log</b> — append-only change history (who, when, old value, new value). No update/delete policy exists on purpose.<br><br>

<div class="td-item" style="background:rgba(140,160,220,.1);border-color:rgba(140,160,220,.4)">

<div class="td-h1">Layer 1 — Global Features (every business needs these, complete before any industry layer)</div>
<div class="td-item"><div class="td-why">
<b>Money in:</b> invoicing (recurring, online payment acceptance, reminders/dunning), AR aging, credit memos, deposits/retainers.<br>
<b>Money out:</b> bill entry, vendor management, approval workflow, scheduled payment, vendor credits, 1099 threshold tracking (real $2,000 2026 rule, not $600).<br>
<b>Banking:</b> live bank/card feed import, rule-based reconciliation with exception queue, cash position + short-term forecast.<br>
<b>Payroll:</b> employee setup, wage calc, withholdings, PTO — Phase 1 produces journals + CPA-ready output; Phase 2 adds direct filing.<br>
<b>Tax:</b> sales tax by jurisdiction, estimated tax set-asides, filing-prep export — Phase 1 prepares, Phase 2 files.<br>

<div class="td-item"><div class="td-why">
<b>Core-integrated</b> (built directly into AmitBooks because they alter a real balance in real time): job costing, basic inventory + COGS, time tracking feeding payroll/billing, light CRM (shares the contacts table), document management.<br><br>
<b>Separate-but-connected</b> (their own program, syncing summary journals in through the same book): full POS hardware, full HR/benefits platform, full clinical EHR, full property management portal, full e-commerce storefront, full warehouse management.<br><br>
<b>The test used to sort them, confirmed by three voices independently:</b> does this workflow directly create or alter a financial balance in real time? If yes, it's core. If its primary job is managing something non-financial (hardware, clinical charts, benefits enrollment), it's connected, not absorbed.
</div></div>

<div class="td-h1">Layer 2 — Industry-Specific (only genuine structural deltas, each with why)</div>

<div class="td-item"><div class="td-title">Construction</div><div class="td-why">
Job costing by cost code, retainage receivable/payable (needs its own held-back-percentage structure — doesn't fit a normal invoice), progress billing tied to % complete, change order tracking, certified payroll/prevailing wage (Phase 2, regulatory), lien waiver tracking, equipment usage-to-job costing, AIA-style billing (G702/G703, Phase 2), WIP/percentage-of-completion revenue recognition (Phase 2 — genuinely different revenue math).</div></div>

<div class="td-item"><div class="td-title">Medical / Healthcare — CONFIRMED architectural stress point</div><div class="td-why">
Four voices independently flagged this as a genuine break in the universal-table model: a claim splits across primary insurer, secondary insurer, contractual write-off, and patient responsibility — the obligor shifts dynamically after the fact, which ordinary binary AR (Entity A owes Entity B) cannot represent. Needs its own claims/adjudication structure (encounter → superbill → claim → ERA/EOB posting), separate from but settling into the standard invoice/payment tables. Also: CPT/ICD coding, HIPAA-compliant document handling, fee-schedule-per-payer management, patient responsibility (copay/deductible/coinsurance) tracking, 837/835 electronic claim files (Phase 2).</div></div>

<div class="td-item"><div class="td-title">Retail / E-commerce</div><div class="td-why">
Inventory by SKU with real cost-layer tracking (needs its own valuation ledger — genuinely different math from service billing), POS integration (separate-but-connected at the register, core-integrated at the daily sales summary), multi-location transfers, sales channel reconciliation (Amazon/Shopify fees settle differently than bank fees), gift card liability tracking, layaway, drop-ship COGS timing, dropshipping, chargeback management, marketplace fee tracking.</div></div>

<div class="td-item"><div class="td-title">Professional Services</div><div class="td-why">
Time-to-invoice with rate cards, utilization/realization reporting, retainer drawdown, trust/IOLTA accounting (Phase 2 — legally segregated, uses the shared fund primitive above), billable expense pass-through with markup.</div></div>

<div class="td-item"><div class="td-title">Manufacturing — CONFIRMED architectural stress point</div><div class="td-why">
Three voices independently flagged variable-yield transformation (raw materials → finished goods with waste factors and co-products) as breaking a static SKU inventory model. Needs bill_of_materials + routing, work orders/WIP state machine, standard-vs-actual cost variance, scrap/yield tracking, landed cost allocation — all Phase 2, genuinely different from single-item COGS.</div></div>

<div class="td-item"><div class="td-title">Restaurant / Food Service</div><div class="td-why">
Recipe costing (extension of BOM logic, shared with manufacturing), perishable inventory with spoilage tracking, tip pooling/FLSA compliance (needs its own distribution-across-employees structure), daily till/shift reconciliation, liquor/excise tax tracking.</div></div>

<div class="td-item"><div class="td-title">Real Estate / Rental</div><div class="td-why">
Lease management (ASC 842 classification), property-level P&L via Tags dimension, tenant billing/rent roll, CAM reconciliation, vacancy tracking, security deposits (Phase 2 — uses the shared segregated-fund primitive, not its own structure).</div></div>

<div class="td-item"><div class="td-title">Nonprofit</div><div class="td-why">
Fund accounting — restricted vs. unrestricted (Phase 2, uses the shared segregated-fund primitive), grant tracking with budget-vs-actual, donor/pledge/in-kind tracking, Form 990 prep (Phase 1 produces the worksheet, Phase 2 auto-files), functional expense allocation (Program/Management/Fundraising).</div></div>

<div class="td-item"><div class="td-title">Manufacturing-adjacent / others worth including</div><div class="td-why">
Agriculture (biological asset revaluation, crop/livestock production cycles, subsidy tracking, weather-based forecasting), trades/home services (van stock, dispatch, service agreements), SaaS/subscription (MRR, churn, deferred revenue waterfall).</div></div>

<div class="td-h1">Phase 1 vs. Phase 2 — the rule actually used</div>
<div class="td-item"><div class="td-why">
<b>Phase 1</b> (ships now): owner fully self-sufficient day-to-day, books hand off cleanly to a human CPA who validates and files. Must be a complete, professional-grade product on its own terms — every Layer 0/1 primitive, capture, matching, approval, and CPA-ready packaging.<br><br>
<b>Phase 2</b> (not built yet, architecture must not foreclose it): anything that <i>files, certifies, or attests</i> autonomously — automated tax e-filing, certified payroll filing, Form 990 e-filing, direct government API submission, autonomous compliance sign-off. Flagged, never discarded.
</div></div>

<div class="td-h1">Differentiators — the best, cross-voice-converged "wow" list</div>
<div class="td-item"><div class="td-why">
Plain-language transaction explanations ("You paid Ace Hardware $450 for lumber; this increased Construction Supplies and decreased your Bank Account") — named independently by nearly every voice.<br><br>
Owner-Mode vs. CPA-Mode as two selectable views of the same books.<br><br>
Real-time estimated tax projection with under-withholding alerts.<br><br>
Cash flow scenario simulator ("what if I buy that truck / hire someone").<br><br>
Automated merchant fee reconciliation (Stripe/Square/PayPal settlement matching).<br><br>
Unapplied-cash and duplicate-bill guardian — catches the same bill entered twice via email and photo.<br><br>
Document-expiry enforcement — an expired insurance certificate or W-9 actually blocks a payment until overridden with a logged reason.<br><br>
Proactive threshold nudges ("$380 from the 1099 threshold for this vendor") instead of a year-end surprise.<br><br>
Guided month-end close checklist ending in a real "Tim package," not a raw data dump.<br><br>
Business-events-as-primary-object — the system models "completed a job," "received inventory," "signed a lease" as first-class events, with ledger entries as a downstream consequence, not the thing the owner directly interacts with.<br><br>
Industry benchmarking against anonymized peers.<br><br>
Vendor timeline view — every purchase/payment/price trend for one vendor, for negotiation leverage.
</div></div>

// Tabbed-layout behavior (copied from Computer Health's showTab — folder-tab
// look, sub-content switching within one panel — no data hooks attached).
function showChTab(panelNum,n){
  const panel=document.getElementById('panel-'+panelNum);
  panel.querySelectorAll('.ch-tab-content').forEach(c=>c.classList.remove('active'));
  panel.querySelectorAll('.ch-tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('ch-tab-'+panelNum+'-'+n).classList.add('active');
  event.target.classList.add('active');
}

function openPanel(n){
  document.querySelectorAll('.tile').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const tile=document.getElementById('tile-'+n);
  const panel=document.getElementById('panel-'+n);
  if(tile)tile.classList.add('active');
  if(panel)panel.classList.add('active');
}

async function abAddAccount(){

async function abLoadDefaultAccounts(){
  const industry=document.getElementById('ab-coa-template-industry').value;

  const existingNumbers=new Set(abAccounts.map(a=>a.account_number));
  const rows=templates.filter(t=>!existingNumbers.has(t.account_number)).map(t=>({
    book_id:abBookId,account_number:t.account_number,account_name:t.account_name,account_type:t.account_type
  }));

  return r.join(', ')||'—';
}
function abRenderContacts(){

async function abAddContact(){

// ── BILLS & INVOICES — the core "clear the pile" screen ──
let abInvoicesBillsCache=[];
async function abLoadInvoicesBills(){
  if(!abBookId){abInvoicesBillsCache=[];return;}
  const{data}=await db.from('invoices_bills').select('*,contacts(name)').eq('book_id',abBookId).order('doc_date',{ascending:false});
  abInvoicesBillsCache=data||[];
  abRenderInvoicesBills();
}
function abRenderInvoicesBills(){
  const el=document.getElementById('ab-invoices-bills'); if(!el)return;
  if(!abBookId){el.innerHTML='<div class="ab-signin-notice">Create a book first (Dashboard tab).</div>';return;}
  const today=new Date().toISOString().slice(0,10);
  el.innerHTML=`<div class="ab-h">Enter a Bill or Invoice</div>
    <div class="ab-form">
      <div class="ab-field"><label>Type</label><select id="ab-ib-direction"><option value="bill_payable">Bill (I owe)</option><option value="invoice_receivable">Invoice (owed to me)</option></select></div>
      <div class="ab-field"><label>Contact</label><select id="ab-ib-contact"><option value="">—</option>${abContacts.map(c=>`<option value="${c.id}">${abEsc(c.name)}</option>`).join('')}</select></div>
      <div class="ab-field"><label>Amount</label><input id="ab-ib-amount" type="number" step="0.01" style="width:100px" placeholder="0.00"></div>
      <div class="ab-field"><label>Date</label><input id="ab-ib-date" type="date" value="${today}"></div>
      <div class="ab-field"><label>Category (optional)</label><select id="ab-ib-account"><option value="">—</option>${abAccounts.map(a=>`<option value="${a.id}">${abEsc(a.account_name)}</option>`).join('')}</select></div>
      <div class="ab-field"><label>Job/Tag (optional)</label><select id="ab-ib-tag"><option value="">—</option>${abTags.map(t=>`<option value="${t.id}">${abEsc(t.name)}</option>`).join('')}</select></div>
      <div class="ab-field"><label>Memo (optional)</label><input id="ab-ib-memo" placeholder="e.g. lumber for Job 114"></div>
      <button class="ab-btn" onclick="abAddInvoiceBill()">Save</button>
    </div>
    <table class="ab-table"><tr><th>Date</th><th>Type</th><th>Contact</th><th>Amount</th><th>Status</th></tr>
    ${abInvoicesBillsCache.map(r=>`<tr><td>${r.doc_date||''}</td><td>${r.direction==='bill_payable'?'Bill':'Invoice'}</td><td>${abEsc(r.contacts?r.contacts.name:'')}</td><td>${abMoney(r.total_amount)}</td><td>${abEsc(r.status)}</td></tr>`).join('')||'<tr><td class="ab-empty" colspan="5">Nothing entered yet — the pile starts here</td></tr>'}
    </table>`;
}
async function abAddInvoiceBill(){
  const direction=document.getElementById('ab-ib-direction').value;
  const contact=document.getElementById('ab-ib-contact').value||null;
  const amount=parseFloat(document.getElementById('ab-ib-amount').value)||0;
  const date=document.getElementById('ab-ib-date').value||null;
  const account=document.getElementById('ab-ib-account').value||null;
  const tag=document.getElementById('ab-ib-tag').value||null;
  const memo=document.getElementById('ab-ib-memo').value.trim();
  if(!amount){alert('Enter an amount.');return;}
  const{data,error}=await db.from('invoices_bills').insert({
    book_id:abBookId,direction,contact_id:contact,doc_date:date,status:'open',
    subtotal:amount,total_amount:amount,memo:memo||null
  }).select().single();
  if(error){alert(error.message);return;}
  await db.from('invoice_bill_lines').insert({invoice_bill_id:data.id,account_id:account,tag_id:tag,description:memo||null,quantity:1,unit_price:amount,amount:amount});
  document.getElementById('ab-ib-amount').value='';
  document.getElementById('ab-ib-memo').value='';
  await abLoadInvoicesBills();
  abRenderDashboard();
  abRenderReports();
}

// ── PAYMENTS ──
async function abRenderPayments(){
  const el=document.getElementById('ab-payments'); if(!el)return;
  if(!abBookId){el.innerHTML='<div class="ab-signin-notice">Create a book first (Dashboard tab).</div>';return;}
  const open=abInvoicesBillsCache.filter(r=>r.status!=='paid'&&r.status!=='void');
  const{data:pays}=await db.from('payments').select('*,invoices_bills(document_code,direction,contacts(name))').eq('book_id',abBookId).order('payment_date',{ascending:false});
  const today=new Date().toISOString().slice(0,10);
  el.innerHTML=`<div class="ab-h">Record a Payment</div>
    <div class="ab-form">
      <div class="ab-field"><label>Against</label><select id="ab-pay-invbill">${open.map(r=>`<option value="${r.id}" data-remaining="${(Number(r.total_amount)-Number(r.paid_amount)).toFixed(2)}">${r.direction==='bill_payable'?'Bill':'Invoice'} — ${abEsc(r.contacts?r.contacts.name:'')} — ${abMoney(Number(r.total_amount)-Number(r.paid_amount))} left</option>`).join('')||'<option value="">No open bills/invoices</option>'}</select></div>
      <div class="ab-field"><label>Amount</label><input id="ab-pay-amount" type="number" step="0.01" style="width:100px" placeholder="0.00"></div>
      <div class="ab-field"><label>Date</label><input id="ab-pay-date" type="date" value="${today}"></div>
      <div class="ab-field"><label>Method</label><select id="ab-pay-method"><option value="ach">ACH</option><option value="check">Check</option><option value="card">Card</option><option value="cash">Cash</option><option value="wire">Wire</option></select></div>
      <button class="ab-btn" onclick="abAddPayment()">Record Payment</button>
    </div>
    <table class="ab-table"><tr><th>Date</th><th>Against</th><th>Amount</th><th>Method</th></tr>
    ${(pays||[]).map(p=>`<tr><td>${p.payment_date||''}</td><td>${abEsc(p.invoices_bills?(p.invoices_bills.direction==='bill_payable'?'Bill':'Invoice')+' — '+(p.invoices_bills.contacts?p.invoices_bills.contacts.name:''):'—')}</td><td>${abMoney(p.amount)}</td><td>${abEsc(p.method||'')}</td></tr>`).join('')||'<tr><td class="ab-empty" colspan="4">No payments recorded yet</td></tr>'}
    </table>`;
}
async function abAddPayment(){
  const invbill=document.getElementById('ab-pay-invbill').value; if(!invbill){alert('Nothing to pay against — enter a bill or invoice first.');return;}
  const amount=parseFloat(document.getElementById('ab-pay-amount').value)||0;
  if(!amount){alert('Enter an amount.');return;}
  const date=document.getElementById('ab-pay-date').value||null;
  const method=document.getElementById('ab-pay-method').value;
  const row=abInvoicesBillsCache.find(r=>r.id===invbill);
  const{error}=await db.from('payments').insert({book_id:abBookId,invoice_bill_id:invbill,contact_id:row?row.contact_id:null,payment_date:date,amount,method});
  if(error){alert(error.message);return;}
  const newPaid=(Number(row.paid_amount)||0)+amount;
  const newStatus=newPaid>=Number(row.total_amount)?'paid':'partial';
  await db.from('invoices_bills').update({paid_amount:newPaid,status:newStatus}).eq('id',invbill);
  document.getElementById('ab-pay-amount').value='';
  await abLoadInvoicesBills();
  abRenderPayments();
  abRenderDashboard();
  abRenderReports();
}

    </table>`;

async function abAddFixedAsset(){
  const name=document.getElementById('ab-fa-name').value.trim(); if(!name)return;
  const cost=document.getElementById('ab-fa-cost').value||null;
  const date=document.getElementById('ab-fa-date').value||null;
  const method=document.getElementById('ab-fa-method').value||null;
  const life=document.getElementById('ab-fa-life').value||null;
  const{error}=await db.from('fixed_assets').insert({book_id:abBookId,asset_name:name,cost_basis:cost,acquisition_date:date,depreciation_method:method,useful_life_months:life});
  if(error){alert(error.message);return;}
  await abLoadFixedAssets();
  abRenderReports();
}

// ── REPORTS — honest about what's real right now: an AR/AP + asset
// summary from the tables that exist. Trial Balance / P&L wait on journal
// auto-posting (next migration), not pretended here. ──
function abRenderReports(){
  const el=document.getElementById('ab-reports'); if(!el)return;
  if(!abBookId){el.innerHTML='<div class="ab-signin-notice">Create a book first (Dashboard tab).</div>';return;}
  const inv=abInvoicesBillsCache.filter(r=>r.direction==='invoice_receivable');
  const bill=abInvoicesBillsCache.filter(r=>r.direction==='bill_payable');
  const openInv=inv.filter(r=>r.status!=='paid'&&r.status!=='void');
  const openBill=bill.filter(r=>r.status!=='paid'&&r.status!=='void');
  const assetTotal=abFixedAssetsCache.reduce((s,a)=>s+(Number(a.cost_basis)||0),0);
  el.innerHTML=`<div class="ab-h">Where things stand</div>
    <div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px">
      <div class="ab-card"><div class="n">${openInv.length}</div><div class="l">Open invoices (${abMoney(openInv.reduce((s,r)=>s+Number(r.total_amount)-Number(r.paid_amount),0))})</div></div>
      <div class="ab-card"><div class="n">${openBill.length}</div><div class="l">Open bills (${abMoney(openBill.reduce((s,r)=>s+Number(r.total_amount)-Number(r.paid_amount),0))})</div></div>
      <div class="ab-card"><div class="n">${abMoney(assetTotal)}</div><div class="l">Fixed assets, cost basis</div></div>
    </div>
    <div class="ab-signin-notice" style="text-align:left">
      Trial Balance, P&L, and Balance Sheet need the general ledger auto-posting piece (journal_entries generated from every bill/invoice/payment) — that's the next migration, not built yet. This page shows the real AR/AP + asset picture from what's actually entered so far, honestly, rather than a report that looks complete and isn't.
    </div>`;
}

function abRefreshDropdownSources(){
  // Cheap re-render of any open screen whose dropdowns (contacts/accounts/
  // tags/items) just changed, so a newly-added vendor shows up immediately
  // without switching tabs and back.
  abRenderInvoicesBills();
  abRenderPayments();
}

// Payments panel loads lazily since it needs invoices_bills already cached;
// call it once on open in case the panel is opened before abLoadBookData
// finishes, and whenever the tile is clicked again.
const _origOpenPanel=openPanel;
openPanel=function(n){
  _origOpenPanel(n);
  if(n===7 && abBookId) abRenderPayments();
};

abInit();
</script>
