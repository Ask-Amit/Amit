<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ══════════════════════════════════════════════
     COPYING THIS TEMPLATE FOR A NEW PROJECT — read this first.

     NAMING: the new project's folder name IS the app's name. If the
     folder is `Disco\`, the app is "Disco" — rename every literal
     occurrence of "Template" below to that exact name:
       - <title>Template</title>            (this line)
       - #pageTitle text, currently "Template" (~line 155)
       - the copied file itself: save as Disco.html, not template.html
       - askAmitLive('TEMPLATE_NOT_CONFIGURED') → askAmitLive('yourRealKey'),
         and write that key's real context into ../Amit_Ask_Live.js's
         PAGE_CONTEXTS — do not skip this, see the comment above that line
     Use the app's real display name consistently in all three spots —
     never a variant spelling, never re-derived per file.

     VERSION: #pageVersion always starts at v1.00 for a brand-new app.
     From here forward it is versioned independently (own +0.01/+1.00
     history, never synced to any other file's number) — see root
     CLAUDE.md's VERSIONING STANDARD.

     INTERCONNECTION: a new project is never standalone — it inherits the
     whole Amit system's conventions. Before/while building it out, the
     new project's own CLAUDE.md (copied from
     Templates\Amit_NewProject_Template.md per root CLAUDE.md's NEW
     PROJECT DIRECTIVE) must carry: the Session Location Check, the
     Pursuit Attribution clause (its own canonical program name for
     hub_entries), Shortcut Activation + Shortcut Awareness, and — if
     it has an "Ask Amit" button — the wiring described above. If the
     project is likely to grow a running state log, add its own
     Sessions.md too (see AmitBooks\Sessions.md for the pattern) so a
     future session can orient fast without re-deriving context.

     NOMENCLATURE: this template uses PAGE (a sidebar item — button + its
     fixed number) and DETAIL (the content area on the right that a page
     opens into). A detail can hold any LAYOUT type — "Tabbed Layout" is
     the one built in below. Full definitions live in the NOMENCLATURE
     comment at the top of the <script> block — read that before touching
     any page/detail/layout code, or answering a question about it.

     PAGE ORDER: sidebar display position is controlled by the PAGE_ORDER
     array in the script below, kept separate from each page's fixed
     number — reorder pages by editing that array, never by renumbering
     pages/details themselves. See Templates\CLAUDE.md for why.

     IMPORTING A SINGLE LAYOUT PIECE (not the whole template) — if you were
     sent here from a DIFFERENT project (e.g. "go to Templates, grab a Row
     View, put it on page 3 of AmitAccounting"), READ Templates\CLAUDE.md
     FIRST, before copying anything. That file defines the canonical
     nomenclature (LAYOUT vs DESTINATION) and names every reusable piece
     that lives in this file. Once you know the name, find its matching
     "CANONICAL LAYOUT:" or "CANONICAL DESTINATION:" comment block in the
     <script> section below and copy that block verbatim — never
     reconstruct a layout's behavior from memory or approximation. Wire it
     into the target page/tab/popup exactly the way the DEMO block near
     the bottom of the Row/Detail View code shows it being done here.
     ══════════════════════════════════════════════ -->
<title>Template</title>
<link rel="icon" type="image/x-icon" href="amit_icon.ico">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../Amit_Ask_Live.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09141f;
  --card-head:#0f2338;
  --border:rgba(201,168,76,0.55);
  --gold:#c9a84c;
  --gold2:#e8c56a;
  --text:#ffffff;
  --text2:#f0e8d0;
  --muted:rgba(240,232,208,0.78);
  --dim:rgba(240,232,208,0.42);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:'Crimson Pro',Georgia,serif;color:var(--text);display:flex;flex-direction:column}

body::before{
  content:'';
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:60vmin;height:60vmin;
  background:url('amit_icon.ico') center/contain no-repeat;
  opacity:.035;
  pointer-events:none;
  z-index:0;
}

/* ── HEADER ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 28px;
  background:var(--card-head);
  border-bottom:2px solid var(--border);
  flex-shrink:0;
  position:relative;
}
.page-title-wrap{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
}
.page-title{
  font-family:Georgia,serif;font-size:26px;font-weight:700;
  letter-spacing:.3px;text-transform:none;color:var(--gold2);
}
.page-version{
  font-family:monospace;font-size:11px;letter-spacing:.05em;
  color:rgba(201,168,76,.55);margin-top:2px;
}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo-link{display:flex;align-items:center;gap:14px;cursor:pointer;text-decoration:none}
.brand-sub{font-style:italic;color:rgba(240,232,208,.55);font-size:12px}
.hdr-right{text-align:right}
.greeting{font-family:'Cinzel',serif;font-size:16px;color:#fff;font-weight:600}
.datetime{font-size:12px;color:var(--muted);margin-top:2px}
.help-btn{width:22px;height:22px;border-radius:50%;border:1px solid rgba(240,232,208,.3);color:rgba(240,232,208,.6);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:all .15s}
.help-btn:hover{border-color:var(--gold);color:var(--gold)}

/* ── HUB LAYOUT ── */
.hub{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  width:230px;flex-shrink:0;
  background:var(--card-head);
  border-right:2px solid var(--border);
  display:flex;flex-direction:column;
  overflow-y:auto;padding:12px 10px;gap:5px;
}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:2px}
.sidebar{transition:width .18s ease}
.sidebar.collapsed{width:60px}
.sidebar.collapsed .page-nav{justify-content:center;padding:10px 0}
.sidebar.collapsed .page-info{display:none}
.page-nav{
  display:flex;align-items:center;gap:10px;
  padding:10px 11px;border-radius:9px;cursor:pointer;
  border:1px solid transparent;
  transition:all .18s;user-select:none;
  position:relative;overflow:hidden;
}
.page-nav:hover{background:rgba(255,255,255,.07);border-color:rgba(201,168,76,.3)}
.page-nav.active{background:rgba(201,168,76,.16);border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,168,76,.25)}
/* Real icon placeholder — a real project swaps ▢ for a real icon per page.
   Sized to match the header's 32px Amit icon (added 2026-08-06, Ryan's
   direct instruction — was 26x18, too small). Not forced square — no
   border-radius/clip-path here, so a round icon (like Amit's own) or any
   other shape renders exactly as its source image is, unaltered. */
.page-icon{width:32px;height:32px;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.page-info{flex:1;min-width:0}
.page-name{font-family:'Cinzel',serif;font-size:11px;color:#fff;letter-spacing:.04em;font-weight:600}
.page-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ── MAIN AREA ── */
.main-area{flex:1;overflow:hidden;position:relative;background:var(--bg)}
.detail{
  position:absolute;inset:0;overflow-y:auto;
  display:none;flex-direction:column;
  animation:pfade .18s ease;
}
.detail.active{display:flex}
@keyframes pfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.detail::-webkit-scrollbar{width:5px}
.detail::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:3px}

/* ── DETAIL HEADER ── */
.detail-head{
  display:flex;align-items:center;gap:16px;
  padding:14px 24px;
  background:var(--card-head);
  border-bottom:2px solid var(--border);
  flex-shrink:0;
}
.detail-heading{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.detail-empty{flex:1;display:flex;align-items:center;justify-content:center;color:rgba(240,232,208,.25);font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* ── TABBED LAYOUT — one of possibly several layout types a detail area can hold (copied structure from Computer Health's folder-tab UI — no data behind it) ──
   Multi-row overflow, Ryan's spec 2026-08-04: as the window narrows (or a
   detail simply grows more tabs than fit) the tab row wraps into
   additional rows behind it rather than scrolling or truncating — flex-
   wrap below handles that automatically, no JS needed just to grow rows.
   Clicking a tab in a back row brings its whole row to the front (the row
   touching the tab content) — that part IS handled in JS, see showChTab. */
.ch-tab-nav{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px;row-gap:0;margin:0 24px;padding:0;background:var(--bg);flex-shrink:0}
.ch-tab-btn{padding:9px 22px;margin-top:10px;border:1px solid rgba(201,168,76,.25);background:rgba(255,255,255,.03);color:var(--muted);border-radius:10px 10px 0 0;cursor:pointer;font-size:13px;font-family:inherit}
.ch-tab-btn.active{padding:12px 26px;margin-top:-2px;margin-bottom:-3px;border-bottom:none;background:var(--card-head);color:var(--gold2);font-weight:600;font-size:14px;position:relative;z-index:2}
.ch-tab-main{flex:1;min-height:0;overflow-y:auto;padding:28px 32px;margin:0 24px 24px;background:var(--card-head);border:1px solid rgba(201,168,76,.25);border-radius:0 12px 12px 12px}
.ch-tab-content{display:none}
.ch-tab-content.active{display:block}

/* ── ROW VIEW — the other layout type a detail area can hold: Excel-style,
   sortable/filterable, expandable child rows. Single-click a header to
   sort (toggle asc/desc), double-click to open an inline "contains" filter
   right in that header cell — no native browser popup, matches the rest
   of the Amit system's no-native-dialog standard. A status strip states
   the active sort/filter with a one-click clear. Rows with children get a
   ▸/▾ toggle, indented beneath the parent. ── */
.rv-wrap{margin:24px;display:flex;flex-direction:column;flex:1;min-height:0}
.rv-status{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);padding:2px 2px 10px;flex-shrink:0}
.rv-status .clear{color:var(--gold2);cursor:pointer;text-decoration:underline}
.rv-table-wrap{flex:1;overflow:auto;border:1px solid rgba(201,168,76,.25);border-radius:8px}
.rv-table{width:100%;border-collapse:collapse;font-size:13px}
.rv-table th{position:sticky;top:0;background:var(--card-head);color:var(--gold2);text-align:left;padding:9px 12px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;user-select:none;border-bottom:2px solid var(--border);white-space:nowrap}
.rv-table th .rv-arrow{margin-left:4px;opacity:.75}
.rv-table th.rv-filtered{color:var(--gold)}
.rv-table td{padding:8px 12px;border-bottom:1px solid rgba(201,168,76,.12)}
.rv-table tr.rv-row:hover td{background:rgba(255,255,255,.04)}
.rv-table tr.rv-child td{background:rgba(255,255,255,.02);color:var(--muted)}
.rv-expand{display:inline-block;width:16px;cursor:pointer;color:var(--gold2)}
.rv-filter-input{width:100%;background:rgba(255,255,255,.1);border:1px solid var(--gold);border-radius:4px;padding:4px 7px;color:#fff;font-size:11px;font-family:inherit;outline:none;text-transform:none;letter-spacing:0}

/* ── DETAIL VIEW — the drill-down endpoint for one single Row View item.
   Double-clicking a row (parent or child) anywhere in Row View lands here,
   populated with that one record's own fields, plus — if it has children —
   a nested Row View of just its own children underneath. ── */
.dv-wrap{margin:24px;flex:1;min-height:0;overflow-y:auto}
.dv-empty{color:rgba(240,232,208,.4);font-family:'Cinzel',serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:30px 4px}
.dv-fields{display:grid;grid-template-columns:140px 1fr;row-gap:10px;column-gap:16px;max-width:520px;margin-bottom:28px}
.dv-label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dv-value{font-size:14px;color:#fff}
.dv-sub-h{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold2);margin-bottom:10px}

/* ── POPUP — canonical DESTINATION, not a layout type. Generic overlay
   that can host any layout instance (Tabbed/Row/Detail View) — content-
   agnostic, same separation as a Page or a Tab slot not caring what's
   mounted inside them. See NOMENCLATURE comment in <script> for the
   LAYOUT vs DESTINATION distinction. ── */
.popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;align-items:center;justify-content:center}
.popup-card{background:var(--card-head);border:1px solid rgba(201,168,76,.5);border-radius:12px;padding:26px 28px;max-width:640px;width:92%;max-height:82vh;overflow-y:auto;box-shadow:0 10px 50px rgba(0,0,0,.55);position:relative}
.popup-close-btn{position:absolute;top:14px;right:16px;color:rgba(240,232,208,.5);cursor:pointer;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em}
.popup-close-btn:hover{color:var(--gold2)}

/* ── RIGHT RAIL — added 2026-08-06, Ryan's direct instruction. Global,
   present on every page regardless of which one is active — not part of
   any page/detail, built once in <script> alongside them. Reserved for
   whatever should be reachable from anywhere: Ask Amit is the first
   occupant (moved down from the old bottom-left sidebar tile, condensed
   to icon-only), and this is the eventual home for Amit's own symbol —
   not placed yet, but the column is sized for it now. Width (64px) is
   sized to comfortably hold one icon plus padding, matching the header's
   32px Amit logo — adjust here, in one place, if a future icon needs
   more room. Every rail icon carries a .rail-tooltip so hovering always
   names the action, never just implies it via a bare icon. ── */
.right-rail{
  width:64px;flex-shrink:0;
  background:var(--card-head);
  border-left:2px solid var(--border);
  display:flex;flex-direction:column;align-items:center;
  padding:16px 0;gap:12px;
}
.rail-icon{
  position:relative;
  width:40px;height:40px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;cursor:pointer;
  border:1px solid transparent;
  transition:all .18s;
}
.rail-icon:hover{background:rgba(201,168,76,.14);border-color:rgba(201,168,76,.4)}
.rail-tooltip{
  position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%) translateX(4px);
  background:#1a3352;border:1px solid rgba(201,168,76,.45);
  color:var(--gold2);font-family:'Cinzel',serif;font-size:10px;letter-spacing:.05em;
  padding:6px 10px;border-radius:6px;white-space:nowrap;
  opacity:0;pointer-events:none;
  transition:all .15s;box-shadow:0 4px 16px rgba(0,0,0,.4);
}
.rail-icon:hover .rail-tooltip{opacity:1;transform:translateY(-50%) translateX(0)}

/* ── PAGE HOVER TOOLTIP — added 2026-08-06, Ryan's direct instruction.
   Hovering a page (its icon when the sidebar is collapsed, or anywhere on
   the row when expanded) shows that page's one-line description — the
   same text as .page-sub, so there's only ever one place to write it,
   never two copies that can drift apart. JS-positioned (fixed, see
   initPageTooltips near openPage) rather than pure CSS, because .sidebar
   scrolls vertically (overflow-y:auto) — per CSS spec, that silently
   forces its other axis's overflow to 'auto' too, which would clip a
   CSS-positioned tooltip trying to extend past the sidebar's right edge
   into the main area. A single fixed-position element sidesteps that
   entirely. ── */
.page-hover-tip{
  position:fixed;z-index:9999;
  background:#1a3352;border:1px solid rgba(201,168,76,.45);
  color:var(--gold2);font-family:'Cinzel',serif;font-size:10px;letter-spacing:.05em;
  padding:6px 10px;border-radius:6px;white-space:nowrap;max-width:260px;
  opacity:0;pointer-events:none;
  transition:opacity .12s;box-shadow:0 4px 16px rgba(0,0,0,.4);
}
.page-hover-tip.show{opacity:1}
</style>
</head>
<body>

<header>
  <!-- Left block matches AmitBooks' actual, improved header pattern -
       icon + app name + version, grouped and vertically centered as one
       unit, linking back to the Hub. Ryan's direct instruction 2026-08-04:
       this template should match AmitBooks, not the older centered-title
       layout this used to have. -->
  <a class="brand brand-logo-link" href="https://ask-amit.github.io/Amit/Hub/amit-hub.html" title="Back to the Amit Hub">
    <img src="amit_icon.ico" alt="Amit" style="height:32px;width:32px">
    <div>
      <div class="page-title" id="pageTitle" style="font-size:19px">Template</div>
      <div class="page-version" id="pageVersion">v1.00</div>
    </div>
  </a>
  <!-- Center block - whichever context this specific app needs to show
       here (AmitBooks shows the active book; a future page shows whatever
       is analogous to that). Placeholder "—" until a real project wires
       its own dynamic value in. -->
  <div class="page-title-wrap">
    <div class="page-title" id="pageContext">—</div>
    <div class="page-version" id="pageContextSub">CONTEXT</div>
  </div>
  <div class="hdr-right" style="display:flex;align-items:center;gap:14px">
    <div style="text-align:right">
      <div class="greeting" id="greeting">Good morning</div>
      <div class="datetime" id="datetime"></div>
      <div style="display:flex;align-items:center;gap:8px;justify-content:flex-end;margin-top:3px">
        <div id="syncIndicator" onclick="openSyncModal()" style="font-size:9px;letter-spacing:.07em;color:rgba(240,232,208,.28);cursor:pointer;font-family:'Cinzel',serif">☁ SYNC</div>
        <div id="signInBtn" onclick="openSyncModal()" title="Sign in to sync your data" style="font-size:9px;letter-spacing:.1em;color:rgba(201,168,76,.8);cursor:pointer;font-family:'Cinzel',serif;border:1px solid rgba(201,168,76,.3);padding:3px 9px;border-radius:4px;background:rgba(201,168,76,.07)">SIGN IN</div>
        <div id="logoutBtn" onclick="signOutAmit()" title="Sign out" style="display:none;font-size:10px;letter-spacing:.08em;color:rgba(201,168,76,.9);cursor:pointer;font-family:'Cinzel',serif;font-weight:600;border-left:1px solid rgba(240,232,208,.2);padding-left:8px">SIGN OUT</div>
      </div>
    </div>
  </div>
</header>

<div class="hub">

  <!-- ── SIDEBAR — PLACEHOLDER PAGES (1-20) ── -->
  <nav class="sidebar" id="sidebarPages" ondblclick="toggleSidebar()"></nav>

  <!-- ── MAIN CONTENT AREA — PLACEHOLDER DETAILS (1-20) ── -->
  <div class="main-area" id="mainArea"></div>

  <!-- ── RIGHT RAIL — global, same on every page, built in <script> ── -->
  <nav class="right-rail" id="rightRail"></nav>

</div>

<!-- Single global page-hover tooltip, JS-positioned — see initPageTooltips -->
<div class="page-hover-tip" id="pageHoverTip"></div>

<!-- SYNC / SIGN-IN MODAL -->
<div id="syncModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;align-items:center;justify-content:center">
  <div class="sync-modal-card" style="background:#1a3352;border:1px solid rgba(201,168,76,.45);border-radius:14px;padding:36px 40px;max-width:340px;width:90%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.5)">
    <div style="color:rgba(201,168,76,.9);font-family:'Cinzel',serif;font-size:16px;letter-spacing:.06em;margin-bottom:6px">Sync Across Devices</div>
    <div style="color:rgba(240,232,208,.5);font-size:11px;line-height:1.7;margin-bottom:22px">Enter your email. A sign-in link will be sent.<br>No password needed.</div>
    <input id="syncEmailInput" type="email" placeholder="your@email.com"
      style="width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.3);border-radius:7px;padding:11px 13px;color:#fff;font-size:13px;outline:none;margin-bottom:12px;font-family:inherit"
      onkeydown="if(event.key==='Enter')submitSyncEmail()"/>
    <button id="syncSubmitBtn" onclick="submitSyncEmail()"
      style="width:100%;background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.45);color:rgba(201,168,76,.9);padding:11px;border-radius:7px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.08em">
      SEND SIGN-IN LINK →
    </button>
    <div onclick="closeSyncModal()" style="margin-top:16px;font-size:9px;color:rgba(240,232,208,.25);cursor:pointer;letter-spacing:.1em">CANCEL</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// NOMENCLATURE — Ryan's own vocabulary for this layout, permanent, always
// applies to this template and to every application deployed from it.
// Read this before touching any of the code below, and before answering
// any question about it — this is the naming any future session (Amit,
// Claude, whoever) should already know cold on sight, not re-derive.
//
//   PAGE   — one item in the left-hand sidebar list (the clickable button
//            AND the number identifying it). Numbered 1..N, in the order
//            Ryan actually wants them read/talked about — internal code
//            calls the button itself `.page-nav` (id `page-N`).
//   DETAIL — the content area on the right that a page opens into (id
//            `detail-N`). Switching pages switches which detail shows.
//   LAYOUT — what kind of content lives inside one detail area. A detail
//            is not locked to one shape — "Tabbed Layout" (built below,
//            using tabs numbered 1..however many exist) is one layout
//            type; more layout types can exist later. A detail's layout
//            is a property of that detail, not of the page system itself.
//   PAGE ORDER vs. PAGE NUMBER — a page's number is its fixed, permanent
//            identity once real project code starts referencing it
//            (openPage(N), detail-N, page-N). Its DISPLAY POSITION in the
//            sidebar is controlled separately, by the PAGE_ORDER list
//            below — reordering the sidebar is always a one-line edit to
//            that list, never a renumbering pass. (Same relationship as a
//            form control's Name vs. its TabIndex.)
//   REFERRING TO A PAGE — always valid either by its name ("Tabbed View")
//            or its number ("page 2"). The page-icon slot itself (▢, or a
//            real icon once a project sets one) is always shown.
//   DESTINATION — separate from LAYOUT (added 2026-08-06, Ryan's direct
//            instruction). A destination is WHERE a layout gets mounted
//            and WHAT triggers it — a whole page, a tab slot inside a
//            Tabbed View, or a Popup opened by an event (double-click,
//            click, etc). Any layout can be mounted at any destination;
//            neither one needs to know about the other. "Popup" is a
//            destination, NOT a fourth layout type — a Popup can host a
//            Tabbed View, a Row View, or a Detail View, exactly the same
//            as a Page can. Find the reusable code for each layout and
//            each destination by its own "CANONICAL LAYOUT:" or
//            "CANONICAL DESTINATION:" comment block further down this
//            script — copy that block verbatim when reusing it, never
//            reconstruct it from memory.
//
// Blank layout shell — no data model, no per-project logic. Placeholder
// pages/details 1-20: rename, re-icon, and build real content into each
// detail when this template is copied for a new project.
// ══════════════════════════════════════════════

const PAGE_COUNT=20;
// PAGE_ORDER — sidebar DISPLAY position only, see NOMENCLATURE above.
// Tabbed View (page 2) is listed first here deliberately — it's the
// live example of the one layout type this template ships with, so it's
// what a person sees first when opening a fresh copy. Introduction (page
// 1) follows it. Edit this array, never the page numbers, to reorder.
const PAGE_ORDER=[1,2,...Array.from({length:PAGE_COUNT-2},(_,idx)=>idx+3)];
(function buildPlaceholders(){
  const nav=document.getElementById('sidebarPages');

  for(let i=1;i<=PAGE_COUNT;i++){

    // Sample icons for the four named layout pages — swap for a real
    // project's real icons; kept as recognizable placeholders (compass for
    // Introduction, folder tabs, a row/list grid, a magnifying glass for
    // drilling into one record) so it's obvious what each looks like
    // before real icons exist. Everything past page 4 stays the generic ▢.
    const icon=i===1?'🧭':i===2?'🗂️':i===3?'📋':i===4?'🔍':'▢';
    const subText='—'; // placeholder — a real project writes its own one-line description here (shown in .page-sub only; the hover tooltip shows just the page title, see data-tip below)
    navHtmlParts[i]=`<div class="page-nav${i===1?' active':''}" id="page-${i}" onclick="openPage(${i})" data-tip="${label}">

    if(i===1||i===2){

        tabNavHtml+=`<button class="ch-tab-btn${t===1?' active':''}" onclick="showChTab(${i},${t})">Tab ${t}</button>`;
        // DEMO — Page 2, Tab 2 hosts a nested Row View instance instead of
        // plain placeholder text, proving a tab slot is a real DESTINATION
        // just like a page or a popup. Wired up after this IIFE runs — see
        // the DEMO block below the Row/Detail/Popup code further down.
        if(i===2&&t===2){
          tabContentHtml+=`<div class="ch-tab-content${t===1?' active':''}" id="ch-tab-${i}-${t}"><div class="rv-wrap" id="ch-tab-2-2-rv-mount" style="margin:0"></div></div>`;
        } else {
          tabContentHtml+=`<div class="ch-tab-content${t===1?' active':''}" id="ch-tab-${i}-${t}">Tab ${t} content goes here</div>`;
        }
      }
      detailHtml+=`<div class="detail${i===1?' active':''}" id="detail-${i}" style="flex-direction:column">
        <div class="detail-head"><span class="detail-heading">${label}</span></div>

        <div class="detail-head"><span class="detail-heading">${label}</span></div>

    } else if(i===4){
      detailHtml+=`<div class="detail${i===1?' active':''}" id="detail-${i}" style="flex-direction:column">

    } else {

  }
  let navHtml=PAGE_ORDER.map(i=>navHtmlParts[i]||'').join('');
  nav.innerHTML=navHtml;
  main.innerHTML=detailHtml;

  // RIGHT RAIL — added 2026-08-06, Ryan's direct instruction. Global,
  // built once here, same on every page — not one of the per-page
  // pages/details above. Ask Amit is the first occupant, moved down from
  // the old bottom-left sidebar tile and condensed to icon-only so it's
  // reachable from anywhere without scrolling the page list. Wired to a
  // sentinel key on purpose: this new project has no real page yet for
  // Amit to have context about, so Amit_Ask_Live.js's askAmitLive() will

  // project, change TEMPLATE_NOT_CONFIGURED below to that project's own
  // real key, and write that key's real context into Amit_Ask_Live.js's

  // 2026-07-25, unchanged by this move.
  const rail=document.getElementById('rightRail');
  if(rail){
    rail.innerHTML=`<div class="rail-icon" id="rail-ask-amit" onclick="askAmitLive('TEMPLATE_NOT_CONFIGURED')">
      💛
      <span class="rail-tooltip">Ask Amit</span>
    </div>`;
  }

  initPageTooltips();
})();

// PAGE HOVER TOOLTIP — see the CSS comment above .page-hover-tip for why
// this is JS-positioned instead of pure CSS. Delegated on the sidebar
// container so it keeps working no matter how many pages exist or
// whether the sidebar is collapsed or expanded — no per-page wiring.
function initPageTooltips(){
  const tip=document.getElementById('pageHoverTip');
  const nav=document.getElementById('sidebarPages');
  if(!tip||!nav)return;
  nav.addEventListener('mouseover',(e)=>{
    const item=e.target.closest('.page-nav');
    if(!item)return;
    tip.textContent=item.dataset.tip||'';
    const r=item.getBoundingClientRect();
    tip.style.left=(r.right+8)+'px';
    tip.style.top=(r.top+r.height/2)+'px';
    tip.style.transform='translateY(-50%)';
    tip.classList.add('show');
  });
  nav.addEventListener('mouseout',(e)=>{
    const item=e.target.closest('.page-nav');
    if(!item)return;
    if(e.relatedTarget&&item.contains(e.relatedTarget))return;
    tip.classList.remove('show');
  });
}

// ══════════════════════════════════════════════
// CANONICAL LAYOUT: ROW VIEW — Excel-style: click a column header to sort
// (toggle asc/desc, arrow shows direction); double-click a header to edit
// an inline "contains" filter right in that cell (Enter/blur commits,
// Escape cancels) — deliberately no native browser prompt(), matching the
// rest of the Amit system's no-native-dialog standard (see AmitBooks/
// CLAUDE.md Interactivity Standard #7). Filters compose with AND. Rows
// may carry a children[] array — a ▸/▾ toggle expands/collapses them,
// indented beneath the parent; children are not independently sortable/
// filterable, only their parent's row is. A status strip above the table
// names whatever's active with a one-click clear.
//
// INSTANCE-BASED (added 2026-08-06, Ryan's direct instruction) — LAYOUT
// and DESTINATION are separate concerns (see NOMENCLATURE above). A Row
// View can be mounted at any destination — a whole page, a tab slot
// inside a Tabbed View, or inside a Popup — and any number of Row View
// instances can be alive on screen at once, each with its own
// independent sort/filter/expand state, keyed by the id of the element
// it mounts into. There is no longer "the" Row View — only Row View
// instances.
//
//   rvCreate(containerId, columns, rows, opts) — the one call that
//     creates and mounts a Row View instance. Copy this call verbatim
//     wherever a Row View is needed; never re-derive its internals.
//     columns: [{key,label}, ...]
//     rows: [{id, ...fields, children:[...]}, ...]
//     opts.onRowOpen(itemId): optional — called when a row is double-
//       clicked. Row View does not know or care what happens next (open
//       a page, open a popup, whatever) — that decision belongs entirely
//       to whoever created this instance, same separation as a Page not
//       needing to know what Layout is mounted inside it. If omitted,
//       falls back to the template's original default: open Detail View
//       on page 4.
//
// Sample data below (RV_SAMPLE_COLUMNS/RV_SAMPLE_ROWS) is placeholder
// only — swap for a real project's real columns/rows when this layout
// gets used for something real.
//
// Genuinely open, not built yet: named/saved sort+filter views
// (localStorage, per-instance, with a "set as default" — see AmitBooks'
// abSmart engine for the fuller pattern this can grow into).
// ══════════════════════════════════════════════
const RV_SAMPLE_COLUMNS=[
  {key:'name',label:'Name'},
  {key:'status',label:'Status'},
  {key:'owner',label:'Owner'},
  {key:'due',label:'Due'}
];
const RV_SAMPLE_ROWS=[
  {id:'r1',name:'Kickoff meeting',status:'Done',owner:'Ryan',due:'2026-07-28'},
  {id:'r2',name:'Design review',status:'In Progress',owner:'Amit',due:'2026-08-02',children:[
    {id:'r2a',name:'Color pass',status:'Done',owner:'Amit',due:'2026-07-30'},
    {id:'r2b',name:'Layout pass',status:'In Progress',owner:'Amit',due:'2026-08-02'}
  ]},
  {id:'r3',name:'Backend wiring',status:'Not Started',owner:'Ryan',due:'2026-08-10'},
  {id:'r4',name:'QA pass',status:'Not Started',owner:'Ryan',due:'2026-08-14',children:[
    {id:'r4a',name:'Desktop',status:'Not Started',owner:'Ryan',due:'2026-08-14'},
    {id:'r4b',name:'Mobile',status:'Not Started',owner:'Ryan',due:'2026-08-14'}
  ]},
  {id:'r5',name:'Launch',status:'Not Started',owner:'Ryan',due:'2026-08-20'}
];

const rvInstances=new Map(); // containerId -> {columns,rows,sort,filters,expanded,editingKey,onRowOpen}

function rvCreate(containerId,columns,rows,opts={}){
  rvInstances.set(containerId,{
    columns,rows,
    sort:null,filters:{},expanded:new Set(),editingKey:null,
    onRowOpen:opts.onRowOpen||null
  });
  rvRenderInstance(containerId);
}

function rvRenderInstance(containerId){
  const wrap=document.getElementById(containerId);
  const inst=rvInstances.get(containerId);
  if(!wrap||!inst)return;
  let rows=inst.rows.slice();
  Object.entries(inst.filters).forEach(([key,val])=>{
    if(!val)return;
    rows=rows.filter(r=>String(r[key]||'').toLowerCase().includes(val.toLowerCase()));
  });
  if(inst.sort){
    const{key,dir}=inst.sort;
    rows=rows.slice().sort((a,b)=>{
      const av=String(a[key]||''),bv=String(b[key]||'');
      return dir==='asc'?av.localeCompare(bv):bv.localeCompare(av);
    });
  }
  const statusParts=[];
  if(inst.sort) statusParts.push(`Sorted by ${inst.columns.find(c=>c.key===inst.sort.key).label} (${inst.sort.dir==='asc'?'A→Z':'Z→A'})`);
  Object.entries(inst.filters).filter(([,v])=>v).forEach(([key,val])=>{
    statusParts.push(`${inst.columns.find(c=>c.key===key).label} contains "${val}"`);
  });
  const statusHtml=statusParts.length
    ? `<div class="rv-status">${statusParts.join(' · ')} <span class="clear" onclick="rvClear('${containerId}')">Clear</span></div>`
    : `<div class="rv-status">No sort or filter active — click a header to sort, double-click to filter</div>`;

  const theadHtml=`<tr>
    <th style="width:24px"></th>
    ${inst.columns.map(c=>{
      if(inst.editingKey===c.key){
        return `<th onclick="event.stopPropagation()"><input class="rv-filter-input" id="rv-filter-input-${containerId}" value="${(inst.filters[c.key]||'').replace(/"/g,'&quot;')}" placeholder="${c.label} contains…"
          onkeydown="if(event.key==='Enter')rvCommitFilter('${containerId}','${c.key}',this.value); if(event.key==='Escape'){rvInstances.get('${containerId}').editingKey=null;rvRenderInstance('${containerId}');}"
          onblur="rvCommitFilter('${containerId}','${c.key}',this.value)"></th>`;
      }
      const isSorted=inst.sort&&inst.sort.key===c.key;
      const arrow=isSorted?(inst.sort.dir==='asc'?'▲':'▼'):'';
      const isFiltered=!!inst.filters[c.key];
      return `<th class="${isFiltered?'rv-filtered':''}" onclick="rvSort('${containerId}','${c.key}')" ondblclick="rvEditFilter(event,'${containerId}','${c.key}')">${c.label}${arrow?`<span class="rv-arrow">${arrow}</span>`:''}${isFiltered?' 🔎':''}</th>`;
    }).join('')}
  </tr>`;

  // Double-click ANYWHERE in a row's own cells (not the expand toggle) hands
  // off to rvHandleRowOpen, which honors this instance's own onRowOpen if it
  // has one, or falls back to the template's original default (Detail View
  // on page 4) if not.
  const rowHtml=(r,isChild)=>{
    const hasKids=r.children&&r.children.length;
    const expanded=inst.expanded.has(r.id);
    let html=`<tr class="${isChild?'rv-child':'rv-row'}" ondblclick="rvHandleRowOpen('${containerId}','${r.id}')">
      <td>${hasKids?`<span class="rv-expand" onclick="event.stopPropagation();rvToggleExpand('${containerId}','${r.id}')">${expanded?'▾':'▸'}</span>`:''}</td>
      ${inst.columns.map((c,idx)=>`<td>${idx===0&&isChild?'— ':''}${r[c.key]||''}</td>`).join('')}
    </tr>`;
    if(hasKids&&expanded) html+=r.children.map(c=>rowHtml(c,true)).join('');
    return html;
  };

  wrap.innerHTML=`${statusHtml}
    <div class="rv-table-wrap"><table class="rv-table">
      <thead>${theadHtml}</thead>
      <tbody>${rows.map(r=>rowHtml(r,false)).join('')}</tbody>
    </table></div>`;

  if(inst.editingKey){
    const input=document.getElementById('rv-filter-input-'+containerId);
    if(input){ input.focus(); input.select(); }
  }
}

function rvHandleRowOpen(containerId,itemId){
  const inst=rvInstances.get(containerId);
  if(inst&&inst.onRowOpen){ inst.onRowOpen(itemId); return; }
  dvOpenFor(itemId); // default fallback, unchanged from the template's original behavior
}

function rvSort(containerId,key){
  const inst=rvInstances.get(containerId);if(!inst)return;
  if(inst.sort&&inst.sort.key===key){
    inst.sort.dir=inst.sort.dir==='asc'?'desc':'asc';
  } else {
    inst.sort={key,dir:'asc'};
  }
  rvRenderInstance(containerId);
}

function rvEditFilter(e,containerId,key){
  e.stopPropagation();
  const inst=rvInstances.get(containerId);if(!inst)return;
  inst.editingKey=key;
  rvRenderInstance(containerId);
}

function rvCommitFilter(containerId,key,val){
  const inst=rvInstances.get(containerId);if(!inst)return;
  const trimmed=(val||'').trim();
  if(trimmed==='') delete inst.filters[key];
  else inst.filters[key]=trimmed;
  inst.editingKey=null;
  rvRenderInstance(containerId);
}

function rvToggleExpand(containerId,id){
  const inst=rvInstances.get(containerId);if(!inst)return;
  if(inst.expanded.has(id)) inst.expanded.delete(id);
  else inst.expanded.add(id);
  rvRenderInstance(containerId);
}

function rvClear(containerId){
  const inst=rvInstances.get(containerId);if(!inst)return;
  inst.sort=null;
  inst.filters={};
  rvRenderInstance(containerId);
}

// ══════════════════════════════════════════════
// CANONICAL LAYOUT: DETAIL VIEW — the drill-down endpoint for one single
// Row View item. Shows every field on that one record as a plain
// label/value list, plus — if the record itself has children (e.g.
// "Design review" has its own sub-tasks) — those children rendered as
// their own small Row View underneath, since a detail's own sub-items are
// themselves a row/column list, just scoped to one parent instead of the
// whole table.
//
// INSTANCE-BASED (added 2026-08-06, same reasoning as Row View above) —
// dvCreate(containerId, columns, rows) creates one instance keyed by the
// id of the element it mounts into. Any number of Detail View instances
// can be alive at once — the standalone page-4 one, plus e.g. one living
// inside a Popup. dvOpenForInstance(containerId, itemId) populates a
// given instance with one specific record and re-renders it.
//
// Genuinely open, not built yet: a child row inside a Detail View's own
// nested list isn't itself double-click-drillable one level deeper — this
// only goes one layer deep (item → its direct children) for now.
// ══════════════════════════════════════════════
const dvInstances=new Map(); // containerId -> {currentId,columns,rows}

function dvCreate(containerId,columns,rows){
  dvInstances.set(containerId,{currentId:null,columns,rows});
  dvRenderInstance(containerId);
}

function dvFindItem(id,rows){
  for(const r of rows){
    if(r.id===id) return r;
    if(r.children){ const found=dvFindItem(id,r.children); if(found) return found; }
  }
  return null;
}

function dvOpenForInstance(containerId,itemId){
  const inst=dvInstances.get(containerId);if(!inst)return;
  inst.currentId=itemId;
  dvRenderInstance(containerId);
}

// Legacy wrapper — kept so the original page-level call, dvOpenFor(id) (the
// page-4 standalone Detail View, and Row View's default fallback), keeps
// working exactly as before.
function dvOpenFor(id){
  dvOpenForInstance('dv-mount',id);
  openPage(4);
}

function dvRenderInstance(containerId){
  const wrap=document.getElementById(containerId);
  const inst=dvInstances.get(containerId);
  if(!wrap||!inst)return;
  const item=inst.currentId?dvFindItem(inst.currentId,inst.rows):null;
  if(!item){
    wrap.innerHTML=`<div class="dv-empty">No item selected yet — double-click any row in Row View to open its detail here.</div>`;
    return;
  }
  const fieldsHtml=inst.columns.map(c=>`
    <div class="dv-label">${c.label}</div>
    <div class="dv-value">${item[c.key]||'—'}</div>`).join('');
  let childrenHtml='';
  if(item.children&&item.children.length){
    childrenHtml=`<div class="dv-sub-h">Items under this one</div>
      <div class="rv-table-wrap" style="max-width:760px"><table class="rv-table">
        <thead><tr><th style="width:24px"></th>${inst.columns.map(c=>`<th style="cursor:default">${c.label}</th>`).join('')}</tr></thead>
        <tbody>${item.children.map(c=>`<tr class="rv-row" ondblclick="dvOpenForInstance('${containerId}','${c.id}')"><td></td>${inst.columns.map(col=>`<td>${c[col.key]||''}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>`;
  }
  wrap.innerHTML=`<div class="dv-fields">${fieldsHtml}</div>${childrenHtml}`;
}

// ══════════════════════════════════════════════
// CANONICAL DESTINATION: POPUP — NOT a layout type. A destination, same
// category as "Page N" or "a tab slot inside a Tabbed View" (see
// NOMENCLATURE above). Popup is content-agnostic — it hosts whatever
// layout instance is mounted inside it and has no opinion about what that
// is. popupOpen(innerHtml) shows the overlay with whatever HTML it's
// given; the caller is responsible for creating any layout instance
// (rvCreate/dvCreate/etc.) mounted inside that HTML afterward, exactly
// the same as buildPlaceholders does for a page or a tab slot.
// ══════════════════════════════════════════════
function popupOpen(innerHtml){
  let modal=document.getElementById('canonicalPopup');
  if(!modal){
    modal=document.createElement('div');
    modal.id='canonicalPopup';
    modal.className='popup-overlay';
    document.body.appendChild(modal);
    modal.addEventListener('click',(e)=>{ if(e.target===modal) popupClose(); });
  }
  modal.innerHTML=`<div class="popup-card" id="canonicalPopupCard">
    <div class="popup-close-btn" onclick="popupClose()">CLOSE ✕</div>
    ${innerHtml}
  </div>`;
  modal.style.display='flex';
}

function popupClose(){
  const modal=document.getElementById('canonicalPopup');
  if(modal) modal.style.display='none';
}

// ══════════════════════════════════════════════
// CANONICAL DATA BINDING: TABLE PICKER — added 2026-08-06, Ryan's direct
// instruction. A third concern, separate from LAYOUT and DESTINATION:
// WHERE THE DATA COMES FROM. Bridges a real Supabase table to a layout
// instance — Row View today; the same pattern generalizes to other
// layouts later without changing this piece. Flow: introspect the
// table's real columns from one live sample row (no service-role key
// needed — this runs off the same public anon key already in this file,
// the same access any signed-in user already has), suggest a sensible
// default subset, show a checklist in a Popup so whoever is building the
// page can add to or subtract from that suggestion, then fetch the real
// rows for exactly the columns confirmed and hand off to rvCreate.
// tableToRowView(containerId, tableName) works against ANY real Supabase
// table — nothing here is specific to one project's schema.
//
// SUGGESTION HEURISTIC (a rule, not a per-table guess — applies the same
// way no matter which table gets bound, so it can never drift table to
// table): a field is suggested (pre-checked) UNLESS it is `id`, ends in
// `_id` or `_at`, is named `is_sample`/`sort_order`, or its live sample
// value is an array or nested object. Everything else defaults on.
// ══════════════════════════════════════════════
async function tableIntrospect(tableName){
  const res=await fetch(`${SB_URL}/rest/v1/${tableName}?select=*&limit=1`,{
    headers:{apikey:SB_KEY,Accept:'application/json'}
  });
  if(!res.ok) throw new Error(`Could not read table "${tableName}" (${res.status})`);
  const sampleRows=await res.json();
  const sample=sampleRows[0]||{};
  return Object.keys(sample).map(key=>({
    key,
    label:key.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),
    suggested:!(key==='id'||key.endsWith('_id')||key.endsWith('_at')||key==='is_sample'||key==='sort_order'||Array.isArray(sample[key])||(sample[key]!==null&&typeof sample[key]==='object'))
  }));
}

function tableToRowView(containerId,tableName,opts={}){
  tableIntrospect(tableName).then(fields=>{
    const suggested=fields.filter(f=>f.suggested);
    const rest=fields.filter(f=>!f.suggested);
    const fieldRowHtml=(f,pre)=>`<label style="display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:13px;cursor:pointer">
      <input type="checkbox" data-key="${f.key}" data-label="${f.label}" ${pre?'checked':''}>
      ${f.label} <span style="color:rgba(240,232,208,.35);font-size:11px">(${f.key})</span>
    </label>`;
    popupOpen(`
      <div class="dv-sub-h">Choose columns for "${tableName}"</div>
      <div style="color:rgba(240,232,208,.6);font-size:12px;margin-bottom:14px">Suggested columns are pre-checked. Add or remove any field below, then confirm.</div>
      <div id="tablePickerSuggested">${suggested.map(f=>fieldRowHtml(f,true)).join('')}</div>
      ${rest.length?`<div class="dv-sub-h" style="margin-top:16px">Other available fields</div><div id="tablePickerRest">${rest.map(f=>fieldRowHtml(f,false)).join('')}</div>`:''}
      <div style="margin-top:20px">
        <button onclick="tableToRowViewConfirm('${containerId}','${tableName}')" style="background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.5);color:var(--gold2);padding:9px 18px;border-radius:7px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.06em">CONFIRM COLUMNS →</button>
      </div>
    `);
    window._tablePickerOpts=opts; // stashed here for the confirm handler below — this popup is single-instance, same as the sync modal
  }).catch(err=>{
    popupOpen(`<div class="dv-empty">Could not load "${tableName}": ${err.message}</div>`);
  });
}

async function tableToRowViewConfirm(containerId,tableName){
  const modal=document.getElementById('canonicalPopupCard');
  const checked=[...modal.querySelectorAll('input[type=checkbox]:checked')];
  if(!checked.length)return;
  const columns=checked.map(cb=>({key:cb.dataset.key,label:cb.dataset.label}));
  const selectKeys=Array.from(new Set(['id',...columns.map(c=>c.key)])); // always fetch id, even if not shown — Row View needs it for row identity
  const res=await fetch(`${SB_URL}/rest/v1/${tableName}?select=${selectKeys.join(',')}&limit=200`,{
    headers:{apikey:SB_KEY,Accept:'application/json'}
  });
  const rows=await res.json();
  popupClose();
  const opts=window._tablePickerOpts||{};
  rvCreate(containerId,columns,rows,opts);
}

// ── DEMO: proves the model end to end ──────────────────────────────────
// Page 3 (standalone Row View) and Page 4 (standalone Detail View) keep
// their original page-level behavior via the default instances below.
// Page 2, Tab 2 (Tabbed View) additionally hosts its OWN nested Row View
// instance — same canonical rvCreate() call, different destination — and
// wires its onRowOpen to open a Detail View inside a Popup instead of
// navigating to page 4. This is the literal example Ryan gave: "Page 3,
// make it a Tab View. Tab 2, make it a Row View. Double-click = popup
// with a Detail View." Nothing here is a special case in the Row/Detail
// View code itself — it's the same two canonical layouts, mounted at two
// different destinations, composed by whoever is wiring the page. Must
// run after the functions/data above are defined, and after
// buildPlaceholders has already created the mount elements — not from

rvCreate('rv-mount',RV_SAMPLE_COLUMNS,RV_SAMPLE_ROWS);
dvCreate('dv-mount',RV_SAMPLE_COLUMNS,RV_SAMPLE_ROWS);

// Tabbed-layout behavior (copied from Computer Health's showTab — folder-tab
// look, sub-content switching within one detail area — no data hooks
// attached). Multi-row overflow, Ryan's spec 2026-08-04: the tab row grows
// as many rows behind itself as it needs (plain CSS flex-wrap, see
// .ch-tab-nav) rather than scrolling or truncating. Selecting a tab that
// isn't in the front row brings its WHOLE row forward — every tab that
// currently shares its wrapped line moves to the end of the row's source
// order, and since flex-wrap always fills top-to-bottom in source order,
// that group becomes the last (front, touching the content) row while the
// previously-front row shifts back. Classic multi-row property-sheet
// behavior — same idea as old Windows tabbed dialogs.
function showChTab(detailNum,n){
  const detail=document.getElementById('detail-'+detailNum);
  const clickedBtn=event.target;
  const tabNav=document.getElementById('ch-tab-nav-'+detailNum);
  if(tabNav){
    const rowTop=clickedBtn.offsetTop;
    Array.from(tabNav.children)
      .filter(b=>b.offsetTop===rowTop)
      .forEach(b=>tabNav.appendChild(b)); // re-append in place → moves this row's tabs to the end of source order
  }
  detail.querySelectorAll('.ch-tab-content').forEach(c=>c.classList.remove('active'));
  detail.querySelectorAll('.ch-tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('ch-tab-'+detailNum+'-'+n).classList.add('active');
  clickedBtn.classList.add('active');
}

function openPage(n){
  document.querySelectorAll('.page-nav').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.detail').forEach(p=>p.classList.remove('active'));
  const page=document.getElementById('page-'+n);
  const detail=document.getElementById('detail-'+n);
  if(page)page.classList.add('active');
  if(detail)detail.classList.add('active');
}
