<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ══════════════════════════════════════════════
     COPYING THIS TEMPLATE FOR A NEW PROJECT — read this first.

     NAMING: the new project's folder name IS the app's name. If the
     folder is `Disco\`, the app is "Disco" — rename every literal
     occurrence of "Template" below to that exact name:
       - <title>Template</title>            (this line)
       - #pageTitle text, currently "Template" (~line 155)
       - the copied file itself: save as Disco.html, not template.html
       - askAmitLive('TEMPLATE_NOT_CONFIGURED') → askAmitLive('yourRealKey'),
         and write that key's real context into ../Amit_Ask_Live.js's
         PAGE_CONTEXTS — do not skip this, see the comment above that line
     Use the app's real display name consistently in all three spots —
     never a variant spelling, never re-derived per file.

     VERSION: #pageVersion always starts at v1.00 for a brand-new app.
     From here forward it is versioned independently (own +0.01/+1.00
     history, never synced to any other file's number) — see root
     CLAUDE.md's VERSIONING STANDARD.

     INTERCONNECTION: a new project is never standalone — it inherits the
     whole Amit system's conventions. Before/while building it out, the
     new project's own CLAUDE.md (copied from
     Templates\Amit_NewProject_Template.md per root CLAUDE.md's NEW
     PROJECT DIRECTIVE) must carry: the Session Location Check, the
     Pursuit Attribution clause (its own canonical program name for
     hub_entries), Shortcut Activation + Shortcut Awareness, and — if
     it has an "Ask Amit" button — the wiring described above. If the
     project is likely to grow a running state log, add its own
     Sessions.md too (see AmitBooks\Sessions.md for the pattern) so a
     future session can orient fast without re-deriving context.

     NOMENCLATURE: this template uses PAGE (a sidebar item — button + its
     fixed number) and DETAIL (the content area on the right that a page
     opens into). A detail can hold any LAYOUT type — "Tabbed Layout" is
     the one built in below. Full definitions live in the NOMENCLATURE
     comment at the top of the <script> block — read that before touching
     any page/detail/layout code, or answering a question about it.

     PAGE ORDER: sidebar display position is controlled by the PAGE_ORDER
     array in the script below, kept separate from each page's fixed
     number — reorder pages by editing that array, never by renumbering
     pages/details themselves. See Templates\CLAUDE.md for why.

     IMPORTING A SINGLE LAYOUT PIECE (not the whole template) — if you were
     sent here from a DIFFERENT project (e.g. "go to Templates, grab a Row
     View, put it on page 3 of AmitAccounting"), READ Templates\CLAUDE.md
     FIRST, before copying anything. That file defines the canonical
     nomenclature (LAYOUT vs DESTINATION) and names every reusable piece
     that lives in this file. Once you know the name, find its matching
     "CANONICAL LAYOUT:" or "CANONICAL DESTINATION:" comment block in the
     <script> section below and copy that block verbatim — never
     reconstruct a layout's behavior from memory or approximation. Wire it
     into the target page/tab/popup exactly the way the DEMO block near
     the bottom of the Row/Detail View code shows it being done here.
     ══════════════════════════════════════════════ -->
<title>Template</title>
<link rel="icon" type="image/x-icon" href="amit_icon.ico">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../Amit_Ask_Live.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09141f;
  --card-head:#0f2338;
  --border:rgba(201,168,76,0.55);
  --gold:#c9a84c;
  --gold2:#e8c56a;
  --text:#ffffff;
  --text2:#f0e8d0;
  --muted:rgba(240,232,208,0.78);
  --dim:rgba(240,232,208,0.42);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:'Crimson Pro',Georgia,serif;color:var(--text);display:flex;flex-direction:column}

body::before{
  content:'';
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:60vmin;height:60vmin;
  background:url('amit_icon.ico') center/contain no-repeat;
  opacity:.035;
  pointer-events:none;
  z-index:0;
}

/* ── HEADER ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 28px;
  background:var(--card-head);
  border-bottom:2px solid var(--border);
  flex-shrink:0;
  position:relative;
}
.page-title-wrap{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
}
.page-title{
  font-family:Georgia,serif;font-size:26px;font-weight:700;
  letter-spacing:.3px;text-transform:none;color:var(--gold2);
}
.page-version{
  font-family:monospace;font-size:11px;letter-spacing:.05em;
  color:rgba(201,168,76,.55);margin-top:2px;
}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo-link{display:flex;align-items:center;gap:14px;cursor:pointer;text-decoration:none}
.brand-sub{font-style:italic;color:rgba(240,232,208,.55);font-size:12px}
.hdr-right{text-align:right}
.greeting{font-family:'Cinzel',serif;font-size:16px;color:#fff;font-weight:600}
.datetime{font-size:12px;color:var(--muted);margin-top:2px}
.help-btn{width:22px;height:22px;border-radius:50%;border:1px solid rgba(240,232,208,.3);color:rgba(240,232,208,.6);display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;transition:all .15s}
.help-btn:hover{border-color:var(--gold);color:var(--gold)}

/* ── HUB LAYOUT ── */
.hub{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  width:max-content;flex-shrink:0; /* was a fixed 230px — added 2026-08-06,
    Ryan's direct instruction: the column should size itself to whatever
    the widest title actually needs, not sit at an arbitrary fixed width
    with dead space after shorter ones. max-content sizes the sidebar to
    its widest row's natural content width, and since .page-nav's own
    left/right padding is already symmetric (4px each), the gap after the
    longest title and the gap before the icon end up equal automatically
    — no separate calculation needed, just removing the artificial fixed
    width that was creating the extra slack. */
  background:var(--card-head);
  border-right:2px solid var(--border);
  display:flex;flex-direction:column;
  overflow-y:auto;padding:12px 10px;gap:0; /* was 5px — added 2026-08-06, Ryan's direct instruction: no space between rows, each tile sits flush against the next */
}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:2px}
.sidebar{transition:width .18s ease}
/* Collapsed width 68px — revised 2026-08-06, Ryan's second correction:
   the first fix (left 11px / right 4px) kept the icon's x position fixed
   across states but left it visibly lopsided within the collapsed view
   itself. Real fix: BOTH sides of .page-nav use the same small padding
   (6px) in BOTH states — that satisfies both requirements at once, an
   equal, tight gap around the icon in collapsed, and the icon's x
   position still never moves when the sidebar toggles, since expanded
   uses the identical left padding. Padding reduced 6px→4px on all four
   sides (added 2026-08-06, Ryan's fourth correction — even the corrected
   square still read as too big) — width dropped from 68→64px to match,
   still the exact zero-slack fit for a 32px icon + 4px padding each side
   + the sidebar/nav borders, no leftover slack. Base .page-nav's left
   padding (below) was reduced 6→4px too, matching this, so the icon's
   x-position still never moves between collapsed/expanded. */
.sidebar.collapsed{width:64px}
/* Uniform 4px padding on ALL FOUR sides (not just left/right) is what
   actually makes this a square. Left padding matches the base rule
   below, so the icon's x-position still never moves between
   collapsed/expanded — this only changes the vertical padding to match. */
.sidebar.collapsed .page-nav{justify-content:flex-start;padding:4px}
.sidebar.collapsed .page-info{display:none}
.page-nav{
  display:flex;align-items:center;gap:10px;
  padding:6px 4px;border-radius:9px;cursor:pointer; /* vertical padding 10px→6px — added 2026-08-06, Ryan's direct instruction: expanded rows still too tall */
  border:1px solid transparent;
  flex-shrink:0; /* added 2026-08-06 — without this, 20 rows in a column
    taller than the viewport get silently compressed by flexbox's default
    shrink behavior instead of scrolling (.sidebar already has
    overflow-y:auto for exactly that) — this was the real bug behind an
    icon tile measuring shorter than its own 32px icon. */
  transition:all .18s;user-select:none;
  position:relative;overflow:hidden;
}
.page-nav:hover{background:rgba(255,255,255,.07);border-color:rgba(201,168,76,.3)}
.page-nav.active{background:rgba(201,168,76,.16);border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,168,76,.25)}
/* Real icon placeholder — a real project swaps ▢ for a real icon per page.
   Sized to match the header's 32px Amit icon (added 2026-08-06, Ryan's
   direct instruction — was 26x18, too small). Not forced square — no
   border-radius/clip-path here, so a round icon (like Amit's own) or any
   other shape renders exactly as its source image is, unaltered. */
.page-icon{width:32px;height:32px;font-size:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.page-info{flex:1;min-width:0}
.page-name{font-family:'Cinzel',serif;font-size:11px;color:#fff;letter-spacing:.04em;font-weight:600}
.page-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ── MAIN AREA ── */
.main-area{flex:1;overflow:hidden;position:relative;background:var(--bg)}
.detail{
  position:absolute;inset:0;overflow-y:auto;
  display:none;flex-direction:column;
  animation:pfade .18s ease;
}
.detail.active{display:flex}
@keyframes pfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.detail::-webkit-scrollbar{width:5px}
.detail::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:3px}

/* ── DETAIL HEADER ── */
.detail-head{
  display:flex;align-items:center;gap:16px;
  padding:14px 24px;
  background:var(--card-head);
  border-bottom:2px solid var(--border);
  flex-shrink:0;
}
.detail-heading{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.detail-empty{flex:1;display:flex;align-items:center;justify-content:center;color:rgba(240,232,208,.25);font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* ── TABBED LAYOUT — one of possibly several layout types a detail area can hold (copied structure from Computer Health's folder-tab UI — no data behind it) ──
   Multi-row overflow, Ryan's spec 2026-08-04: as the window narrows (or a
   detail simply grows more tabs than fit) the tab row wraps into
   additional rows behind it rather than scrolling or truncating — flex-
   wrap below handles that automatically, no JS needed just to grow rows.
   Clicking a tab in a back row brings its whole row to the front (the row
   touching the tab content) — that part IS handled in JS, see showChTab. */
.ch-tab-nav{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px;row-gap:0;margin:0 24px;padding:0;background:var(--bg);flex-shrink:0}
.ch-tab-btn{padding:9px 22px;margin-top:10px;border:1px solid rgba(201,168,76,.25);background:rgba(255,255,255,.03);color:var(--muted);border-radius:10px 10px 0 0;cursor:pointer;font-size:13px;font-family:inherit}
.ch-tab-btn.active{padding:12px 26px;margin-top:-2px;margin-bottom:-3px;border-bottom:none;background:var(--card-head);color:var(--gold2);font-weight:600;font-size:14px;position:relative;z-index:2}
.ch-tab-main{flex:1;min-height:0;overflow-y:auto;padding:28px 32px;margin:0 24px 24px;background:var(--card-head);border:1px solid rgba(201,168,76,.25);border-radius:0 12px 12px 12px}
.ch-tab-content{display:none}
.ch-tab-content.active{display:block}

/* ── ROW VIEW — the other layout type a detail area can hold: Excel-style,
   sortable/filterable, expandable child rows, PLUS per-column inline
   editing. Every column header carries a ▾ menu button (added 2026-08-06,
   Ryan's direct instruction, replacing the older click-to-sort/double-
   click-to-type-a-filter interaction entirely — "we're just gonna use the
   functionality as we would be for an Excel spreadsheet") — opens Sort
   A→Z / Sort Z→A plus a searchable checklist of that column's own
   distinct values, same as Excel's own AutoFilter. Filters on different
   columns stack (AND) exactly the way Excel's own column filters do. A
   status strip states the active sort/filter with a one-click clear.
   Rows with children get a ▸/▾ toggle, indented beneath the parent.
   EDITABLE CELLS — merged in from the former standalone "Grid View" layout
   2026-08-06, Ryan's direct instruction: editability is a property of the
   COLUMN (columns[].editable:true), not a separate layout — a Row View
   instance can have some columns editable and others read-only side by
   side, decided per-project when the columns array is built. Editable
   cells are tinted cream (var(--text2), the same cream tone used on the
   Hub's own Day View) so it's visually obvious which fields can be
   changed, unstyled/plain for anything not editable. Click an editable
   cell to edit it in place (Enter/blur commits, Escape cancels) — this
   does not conflict with double-click-to-open-Detail-View on the row
   itself, since click and double-click are different events.
   KEYBOARD NAVIGATION — added same session, Ryan's direct instruction:
   ↑/↓ move the focused row through the current visible (sorted/filtered/
   expanded) row order, same order a mouse would encounter scrolling
   top-to-bottom; Enter on a focused row opens it exactly like a
   double-click would. ── */
.rv-wrap{margin:24px;display:flex;flex-direction:column;flex:1;min-height:0}
.rv-status{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);padding:2px 2px 10px;flex-shrink:0}
.rv-status .clear{color:var(--gold2);cursor:pointer;text-decoration:underline}
.rv-table-wrap{flex:1;overflow:auto;border:1px solid rgba(201,168,76,.25);border-radius:8px;outline:none}
.rv-table-wrap:focus-visible{box-shadow:inset 0 0 0 2px rgba(201,168,76,.4)}
/* width:auto (NOT 100%) is deliberate — added 2026-08-06, Ryan's direct
   correction. With table-layout:fixed, a table pinned to width:100%
   forces the browser to proportionally rescale EVERY column to still
   fill that 100% on every render, which silently overrides any single
   column's own set width — that's what made dragging one column's border
   visually resize all the others instead of just the one being dragged.
   width:auto lets the table's real width be exactly the sum of its own
   <colgroup> column widths (true Excel behavior — a column keeps the
   width it was set to); .rv-table-wrap's existing overflow:auto handles
   horizontal scrolling once total column width exceeds the visible area. */
.rv-table{width:auto;border-collapse:collapse;font-size:13px;table-layout:fixed}
.rv-table th{position:sticky;top:0;background:var(--card-head);color:var(--gold2);text-align:left;padding:9px 36px 9px 12px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.05em;text-transform:uppercase;user-select:none;border-bottom:2px solid var(--border);white-space:nowrap}
.rv-th-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;max-width:100%;vertical-align:middle}
.rv-table th .rv-arrow{margin-left:4px;opacity:.75}
.rv-table th.rv-filtered{color:var(--gold)}
/* ── COLUMN FILTER MENU BUTTON + DROPDOWN — added 2026-08-06, Ryan's
   direct instruction. The ▾ button lives inside the th (position:relative
   is on the th itself), but the dropdown it opens (#rvColMenu, in the
   HTML body near #pageHoverTip) is a single SHARED fixed-position element
   repositioned via JS on open, not nested inside the th — same reasoning
   as the page-hover-tip: .rv-table-wrap scrolls (overflow:auto), and per
   the CSS spec that silently clips any CSS-absolute descendant trying to
   extend past it. A fixed element sidesteps that entirely. ── */
/* Funnel icon replaces the old plain ▾ text — added 2026-08-06, Ryan's
   direct instruction. Sized to sit inside the th's own reserved right-
   edge space (see .rv-table th's padding-right, above). Active state
   (a filter is currently applied to this column) gets a visible gold
   border + tinted background — Ryan's own words, "put a border around
   it, be creative" — plus the "-N" order badge showing which pass this
   column's filter was applied in (see rvAddToFilterOrder/
   rvRemoveFromFilterOrder). */
.rv-col-menu-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);cursor:pointer;display:inline-flex;align-items:center;gap:1px;color:rgba(240,232,208,.55);opacity:1;padding:4px 5px;border-radius:5px;border:1px solid transparent;user-select:none}
.rv-col-menu-btn:hover{color:var(--gold2);background:rgba(201,168,76,.1)}
.rv-col-menu-btn.active{color:var(--gold);background:rgba(201,168,76,.16);border-color:var(--gold)}
.rv-col-menu-order{font-size:9px;font-weight:700;color:var(--gold2);letter-spacing:0;font-family:'Cinzel',serif}
.rv-col-menu{display:none;background:#132a42;border:1px solid rgba(201,168,76,.5);border-radius:8px;padding:10px;width:220px;box-shadow:0 8px 30px rgba(0,0,0,.5);font-family:'Crimson Pro',Georgia,serif;text-transform:none;letter-spacing:0}
.rv-col-menu-sort{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.rv-col-menu-sort button{background:rgba(255,255,255,.06);border:1px solid rgba(201,168,76,.25);color:#fff;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:12px;text-align:left;font-family:inherit}
.rv-col-menu-sort button:hover{background:rgba(201,168,76,.15)}
.rv-col-menu-divider{height:1px;background:rgba(201,168,76,.2);margin:8px 0}
.rv-col-menu-search{width:100%;box-sizing:border-box;background:rgba(255,255,255,.08);border:1px solid rgba(201,168,76,.3);border-radius:5px;padding:6px 8px;color:#fff;font-size:12px;margin-bottom:6px;outline:none;font-family:inherit}
.rv-col-menu-selectall{font-size:11px;color:var(--gold2);margin-bottom:6px;cursor:pointer}
.rv-col-menu-selectall span:hover{text-decoration:underline}
.rv-col-menu-list{max-height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.rv-col-menu-item{display:flex;align-items:center;gap:7px;font-size:12px;color:#fff;padding:3px 2px;cursor:pointer}
.rv-col-menu-empty{font-size:11px;color:var(--dim);padding:6px 2px}
.rv-col-menu-actions{display:flex;justify-content:space-between;gap:8px;margin-top:4px}
.rv-col-menu-actions button{flex:1;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:11px;font-family:'Cinzel',serif;letter-spacing:.05em}
.rv-col-menu-btn-clear{background:rgba(255,255,255,.05);border:1px solid rgba(240,232,208,.25);color:var(--muted)}
.rv-col-menu-btn-apply{background:rgba(201,168,76,.18);border:1px solid var(--gold);color:var(--gold2)}
/* ── DATE RANGE FILTER — added 2026-08-06, Ryan's direct instruction: a
   column marked {type:'date'} gets these quick-range buttons plus a
   custom from/to picker instead of the plain value checklist above. ── */
.rv-col-menu-datebtns{display:flex;flex-direction:column;gap:4px;margin-bottom:2px}
.rv-col-menu-datebtns button{background:rgba(255,255,255,.06);border:1px solid rgba(201,168,76,.25);color:#fff;padding:6px 8px;border-radius:5px;cursor:pointer;font-size:12px;text-align:left;font-family:inherit}
.rv-col-menu-datebtns button:hover{background:rgba(201,168,76,.15)}
.rv-col-menu-date-custom{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.rv-col-menu-date-custom label{font-size:10px;color:var(--muted);display:block}
.rv-col-menu-date-custom input{width:100%;box-sizing:border-box;background:rgba(255,255,255,.08);border:1px solid rgba(201,168,76,.3);border-radius:5px;padding:6px 8px;color:#fff;font-size:12px;font-family:inherit;margin-top:3px}
.rv-table td{padding:0;border-bottom:1px solid rgba(201,168,76,.12);overflow:hidden}
.rv-table td.rv-td-plain{padding:8px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ── COLUMN SEPARATORS + RESIZE HANDLES — added 2026-08-06, Ryan's direct
   instruction: a faint vertical line between every column (fainter than
   the row's own horizontal divider), draggable Excel-style to resize.
   table-layout:fixed (above) + explicit <col> widths (rendered in JS) is
   what makes the drag actually stick — without fixed layout the browser
   re-flows column widths from content on every render, undoing any resize
   the instant new data or a re-sort redraws the table. ── */
.rv-table th,.rv-table td{border-right:1px solid rgba(201,168,76,.06)}
.rv-table th:last-child,.rv-table td:last-child{border-right:none}
.rv-col-resizer{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:3;user-select:none}
.rv-col-resizer:hover,.rv-col-resizer.resizing{background:rgba(201,168,76,.4)}
.rv-table tr.rv-row:hover td{background:rgba(255,255,255,.04)}
.rv-table tr.rv-child td{background:rgba(255,255,255,.02);color:var(--muted)}
.rv-table tr.rv-row.focused td{background:rgba(201,168,76,.1)}
.rv-table tr.rv-row.focused{box-shadow:inset 3px 0 0 var(--gold)}
.rv-expand{display:inline-block;width:16px;cursor:pointer;color:var(--gold2)}
.rv-cell-editable{display:block;padding:8px 12px;cursor:text;color:var(--text2);min-height:1em}
.rv-cell-editable:hover{background:rgba(201,168,76,.1)}
.rv-cell-input{width:100%;box-sizing:border-box;background:rgba(255,255,255,.1);border:1px solid var(--gold);padding:7px 11px;color:#fff;font-size:13px;font-family:inherit;outline:none}

/* ── BOARD VIEW — Kanban, drag cards between status columns. ── */
.bv-wrap{margin:24px;display:flex;flex-direction:column;flex:1;min-height:0}
.bv-cols{display:flex;gap:14px;flex:1;overflow-x:auto;align-items:flex-start}
.bv-col{background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.2);border-radius:10px;width:230px;flex-shrink:0;display:flex;flex-direction:column;max-height:100%}
.bv-col.dragover{border-color:var(--gold);background:rgba(201,168,76,.08)}
.bv-col-head{padding:10px 12px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold2);border-bottom:1px solid rgba(201,168,76,.2)}
.bv-col-body{padding:10px;display:flex;flex-direction:column;gap:8px;overflow-y:auto}
.bv-card{background:var(--card-head);border:1px solid rgba(201,168,76,.25);border-radius:7px;padding:9px 11px;cursor:grab;font-size:13px}
.bv-card:active{cursor:grabbing}
.bv-card-owner{font-size:11px;color:var(--muted);margin-top:3px}

/* ── GALLERY VIEW — visual card grid. ── */
.glv-wrap{margin:24px;flex:1;overflow-y:auto}
.glv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.glv-card{background:var(--card-head);border:1px solid rgba(201,168,76,.25);border-radius:10px;overflow:hidden;cursor:pointer;transition:border-color .15s}
.glv-card:hover{border-color:var(--gold)}
.glv-thumb{height:110px;display:flex;align-items:center;justify-content:center;font-size:38px;background:rgba(201,168,76,.08)}
.glv-body{padding:10px 12px}
.glv-title{font-size:13px;color:#fff;font-weight:600}
.glv-sub{font-size:11px;color:var(--muted);margin-top:3px}

/* ── DASHBOARD VIEW — stat tiles + simple bar sparkline. ── */
.dbv-wrap{margin:24px;flex:1;overflow-y:auto}
.dbv-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px}
.dbv-tile{background:var(--card-head);border:1px solid rgba(201,168,76,.25);border-radius:10px;padding:16px 18px}
.dbv-tile-label{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dbv-tile-value{font-size:26px;color:var(--gold2);font-weight:700;margin-top:6px}
.dbv-chart{background:var(--card-head);border:1px solid rgba(201,168,76,.25);border-radius:10px;padding:18px}
.dbv-chart-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2);margin-bottom:14px}
.dbv-bars{display:flex;align-items:flex-end;gap:10px;height:120px}
.dbv-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.dbv-bar{width:100%;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:4px 4px 0 0}
.dbv-bar-label{font-size:10px;color:var(--muted);margin-top:6px}

/* ── SPLIT VIEW — master list left, detail pane right, no page nav. ── */
.spv-wrap{margin:24px;display:flex;flex:1;min-height:0;gap:18px}
.spv-list{width:260px;flex-shrink:0;overflow-y:auto;border:1px solid rgba(201,168,76,.25);border-radius:8px}
.spv-item{padding:10px 14px;border-bottom:1px solid rgba(201,168,76,.12);cursor:pointer;font-size:13px}
.spv-item:hover{background:rgba(255,255,255,.04)}
.spv-item.active{background:rgba(201,168,76,.14);color:var(--gold2)}
.spv-detail{flex:1;overflow-y:auto}

/* ── FORM VIEW — dedicated create/edit layout, separate from Detail View. ── */
.fv-wrap{margin:24px;max-width:520px}
.fv-field{margin-bottom:16px}
.fv-label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}
.fv-input,.fv-textarea{width:100%;box-sizing:border-box;background:rgba(255,255,255,.07);border:1px solid rgba(201,168,76,.3);border-radius:7px;padding:9px 11px;color:#fff;font-size:14px;font-family:inherit;outline:none}
.fv-textarea{min-height:80px;resize:vertical}
.fv-save{background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.5);color:var(--gold2);padding:10px 22px;border-radius:7px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.06em}
.fv-status{font-size:12px;color:var(--gold2);margin-top:10px}

/* ── CHART VIEW — added 2026-08-06, per the dataviz skill: one axis only,
   categorical hues assigned in fixed order (never cycled), thin marks,
   legend for 2+ series, recessive gridlines. Reuses the Hub's own already-
   documented calendar-layer categorical order (steel blue / amber /
   teal-cyan / rose — see root CLAUDE.md architecture notes) rather than
   inventing a new palette, so a real project's charts stay consistent
   with color choices already made elsewhere in the Amit system. ── */
.chv-wrap{margin:24px;flex:1;overflow-y:auto}
.chv-section{background:var(--card-head);border:1px solid rgba(201,168,76,.25);border-radius:10px;padding:18px;margin-bottom:20px}
.chv-title{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2);margin-bottom:14px}
.chv-bars{display:flex;align-items:flex-end;gap:12px;height:130px}
.chv-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.chv-bar{width:100%;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:4px 4px 0 0;min-height:6px}
.chv-bar-label{font-size:10px;color:var(--muted);margin-top:6px}
.chv-legend{display:flex;gap:16px;margin-bottom:12px;font-size:11px;color:var(--muted)}
.chv-legend-item{display:flex;align-items:center;gap:6px}
.chv-legend-swatch{width:10px;height:10px;border-radius:50%;display:inline-block}
.chv-line-svg{width:100%;height:150px;overflow:visible}
.chv-gridline{stroke:rgba(240,232,208,.08);stroke-width:1}
.chv-point{cursor:pointer}

/* ── INBOX VIEW — stream/queue with checkbox multi-select + batch
   actions, added 2026-08-06. ── */
.ibv-wrap{margin:24px;display:flex;flex-direction:column;flex:1;min-height:0}
.ibv-toolbar{display:flex;align-items:center;gap:10px;padding:2px 2px 12px;flex-shrink:0;font-size:12px;color:var(--muted)}
.ibv-toolbar button{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.4);color:var(--gold2);padding:6px 14px;border-radius:6px;cursor:pointer;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.05em}
.ibv-toolbar button:disabled{opacity:.35;cursor:default}
.ibv-list{flex:1;overflow-y:auto;border:1px solid rgba(201,168,76,.25);border-radius:8px}
.ibv-item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid rgba(201,168,76,.12);cursor:pointer}
.ibv-item:hover{background:rgba(255,255,255,.03)}
.ibv-item.unread .ibv-item-title{color:#fff;font-weight:700}
.ibv-item.unread{background:rgba(201,168,76,.05)}
.ibv-item-title{font-size:13px;color:var(--muted)}
.ibv-item-sub{font-size:11px;color:var(--dim);margin-top:3px}
.ibv-item-check{margin-top:2px}

/* ── DRAWER VIEW — lightweight overlay detail that slides in from the
   right, doesn't leave the current screen context, added 2026-08-06. ── */
.drv-wrap{margin:24px}
.drv-trigger-list{display:flex;flex-direction:column;gap:8px;max-width:420px}
.drv-trigger-item{background:var(--card-head);border:1px solid rgba(201,168,76,.25);border-radius:8px;padding:12px 14px;cursor:pointer;font-size:13px}
.drv-trigger-item:hover{border-color:var(--gold)}
.drv-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9990;display:none}
.drv-overlay.open{display:block}
.drv-panel{position:fixed;top:0;right:-380px;width:360px;height:100%;background:var(--card-head);border-left:1px solid rgba(201,168,76,.5);box-shadow:-8px 0 30px rgba(0,0,0,.5);z-index:9991;transition:right .22s ease;padding:22px 24px;overflow-y:auto}
.drv-panel.open{right:0}
.drv-close{position:absolute;top:16px;right:18px;color:rgba(240,232,208,.5);cursor:pointer;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em}

/* ── TREE VIEW — hierarchical parent/child, added 2026-08-06. Reuses the
   same {id,...fields,children:[...]} row shape already used by Row View. ── */
.tv-wrap{margin:24px;flex:1;overflow-y:auto}
.tv-node{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.tv-node:hover{background:rgba(255,255,255,.04)}
.tv-node.selected{background:rgba(201,168,76,.14);color:var(--gold2)}
.tv-toggle{width:14px;display:inline-block;color:var(--gold2)}
.tv-leaf-dot{width:5px;height:5px;border-radius:50%;background:var(--dim);display:inline-block;margin:0 5px}

/* ── BREADCRUMB VIEW — chained drill-down navigation with a visible trail
   and an "Open Pages" history rail, added 2026-08-06, per AmitBooks'
   General Journal pattern (summary → records → single record). ── */
.bcv-wrap{margin:24px;display:flex;gap:20px;flex:1;min-height:0}
.bcv-main{flex:1;overflow-y:auto}
.bcv-trail{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:16px;flex-wrap:wrap}
.bcv-trail-item{cursor:pointer;color:var(--gold2)}
.bcv-trail-item:last-child{color:var(--muted);cursor:default}
.bcv-trail-sep{color:var(--dim)}
.bcv-list-item{padding:10px 12px;border:1px solid rgba(201,168,76,.2);border-radius:7px;margin-bottom:8px;cursor:pointer;font-size:13px}
.bcv-list-item:hover{border-color:var(--gold)}
.bcv-rail{width:190px;flex-shrink:0;border-left:1px solid rgba(201,168,76,.2);padding-left:16px}
.bcv-rail-title{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2);margin-bottom:10px}
.bcv-rail-item{font-size:11px;color:var(--muted);padding:5px 0;cursor:pointer;border-bottom:1px solid rgba(201,168,76,.08)}
.bcv-rail-item:hover{color:var(--gold2)}

/* ── DETAIL VIEW — the drill-down endpoint for one single Row View item.
   Double-clicking a row (parent or child) anywhere in Row View lands here,
   populated with that one record's own fields, plus — if it has children —
   a nested Row View of just its own children underneath. ── */
.dv-wrap{margin:24px;flex:1;min-height:0;overflow-y:auto}
.dv-empty{color:rgba(240,232,208,.4);font-family:'Cinzel',serif;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:30px 4px}
.dv-fields{display:grid;grid-template-columns:140px 1fr;row-gap:10px;column-gap:16px;max-width:520px;margin-bottom:28px}
.dv-label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dv-value{font-size:14px;color:#fff}
.dv-sub-h{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold2);margin-bottom:10px}

/* ── CALENDAR VIEW — added 2026-08-06, Ryan's direct instruction. Plain
   month-grid calendar, deliberately stripped down from the Hub's own
   calendar (amit-hub.html): month/year header with prev/next nav, a
   day-of-week row, and a 7-column grid showing every day plus the
   leading/trailing days of the adjacent months (dimmed, clickable — no
   blank cells, same convention as the Hub's). No filters, no overdue
   banner, no Hebrew/sacred calendar duality — Ryan's own words: "leave
   out all of the filtering abilities... and the overdues and stuff."
   Restyled to this template's gold/navy palette rather than the Hub's
   black theme.
   LIVE PURSUITS — added same session, Ryan's second instruction: "these
   are all still gonna be connected together" — real outstanding pursuits
   from the actual hub_entries table now render as chips on their due
   date, mirroring the Hub's own aimsForDay() filter exactly (kind is
   'pursuit', not done, due date matches). Chip styling ported from the
   Hub's real live calChipCls() — which renders every pursuit chip
   identically regardless of priority; the multi-color-by-priority scheme
   described in older Hub documentation isn't what's actually live, so
   this matches the real behavior, not the stale doc. ── */
.cv-wrap{margin:24px;display:flex;flex-direction:column;flex:1;min-height:0}
.cv-nav-row{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:16px;flex-shrink:0}
.cv-nav-btn{width:30px;height:30px;border-radius:6px;border:1px solid rgba(201,168,76,.4);background:rgba(201,168,76,.08);color:var(--gold2);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .15s;user-select:none}
.cv-nav-btn:hover{background:rgba(201,168,76,.2);border-color:var(--gold)}
.cv-month-title{font-family:'Cinzel',serif;font-size:16px;letter-spacing:.08em;color:var(--gold2);min-width:180px;text-align:center;text-transform:uppercase}
.cv-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;flex-shrink:0}
.cv-dow{text-align:center;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:4px 0}
.cv-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(64px,auto);gap:3px;flex:1;min-height:0;overflow-y:auto}
/* Day cells switched to cream (var(--text2)) instead of dark navy —
   added 2026-08-06, Ryan's direct instruction: he liked the cream tone
   specifically, not the dark background. Text switches to a dark brown
   for legibility against the light cell — white text (used everywhere
   else in this dark-theme template) wouldn't read against cream. */
.cv-cell{border:1px solid rgba(0,0,0,.12);border-radius:6px;padding:6px 8px;background:var(--text2);cursor:pointer;transition:all .15s}
.cv-cell:hover{background:#e6d9b8;border-color:rgba(201,168,76,.5)}
.cv-daynum{font-size:13px;color:#2c2416}
.cv-cell.adj{opacity:.4}
.cv-cell.adj .cv-daynum{color:#6b5f47}
.cv-cell.today{border-color:var(--gold);background:#f2dfa0;box-shadow:0 0 0 1px var(--gold)}
.cv-cell.today .cv-daynum{color:#7a4f00;font-weight:700}
/* Pursuit chip — colors ported directly from the Hub's real, live
   .cal-chip-pursuit style (amit-hub.html), not the multi-color-by-
   priority scheme in older Hub docs, which isn't what's actually live. */
.cv-chip{background:rgba(180,140,15,.82);border-left:3px solid rgba(201,168,76,.95);color:#2a1e00;font-weight:600;font-size:10px;padding:2px 6px;border-radius:3px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.cv-chip:hover{opacity:.82}
/* Demo-mode marker — added 2026-08-06, Ryan's direct instruction: Amit's
   own demo pursuits need to read as visually distinct from the signed-in
   user's real data, not blended in indistinguishably. Same accent color
   family as the ✦ prefix, applied consistently to both the chip and the
   Day View pursuit row (.dv-aim-row-demo, see DAY VIEW section). */
.cv-chip-demo{background:rgba(120,90,190,.75);border-left-color:rgba(170,140,230,.95);color:#efe6ff}

/* ── DAY VIEW — rebuilt 2026-08-06, Ryan's direct correction: these are
   the Hub's actual .cal-dv-* class values (amit-hub.html), ported
   directly rather than reinterpreted, per his instruction to "copy that
   format exactly." Hebrew date block, feast/Shabbat chips, Word-for-
   Today devotional content, and the weather widget are not ported (see
   the CANONICAL LAYOUT: DAY VIEW comment in <script> for why); Daily
   Walk and Add Reflection ARE ported for visual fidelity but are inert
   placeholders here, same honesty standard as this template's other
   placeholder pages. ── */
.dvw-wrap{margin:24px;display:flex;flex-direction:column;flex:1;min-height:0}
.cal-dv-zoom-wrap{display:flex;flex:1;overflow:hidden;gap:10px;align-items:stretch}
.cal-dv-adj{width:140px;flex-shrink:0;background:#eee9de;border:1px solid rgba(0,0,0,.1);border-radius:10px;padding:14px 12px;cursor:pointer;opacity:.55;transition:opacity .2s;display:flex;flex-direction:column;overflow:hidden;position:relative}
.cal-dv-adj:hover{opacity:.82}
.cal-dv-adj-arrow{font-family:'Cinzel',serif;font-size:9px;color:rgba(26,21,16,.4);letter-spacing:.14em;margin-bottom:10px;text-transform:uppercase}
.cal-dv-adj-top{display:flex;justify-content:space-between;align-items:flex-start}
.cal-dv-adj-greg{font-family:'Cinzel',serif;font-size:30px;font-weight:700;color:#1a1510;line-height:1}
.cal-dv-adj-dayname{font-family:'Cinzel',serif;font-size:9px;color:#5a4828;letter-spacing:.08em;margin-top:6px}
.cal-dv-adj-aims{font-size:10px;color:#7a6040;font-style:italic;margin-top:auto;padding-top:10px;line-height:1.5}
.cal-dv-main{flex:1;background:#eee9de;border:1px solid rgba(0,0,0,.1);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.cal-dv-main.dv-today{background:#f5eed8;border:2px solid var(--gold);box-shadow:0 0 0 1px rgba(201,168,76,.3);animation:dvTodayPulse 2.4s ease-in-out infinite}
@keyframes dvTodayPulse{0%,100%{box-shadow:0 0 0 2px rgba(201,168,76,.25),0 2px 10px rgba(201,168,76,.12);border-color:rgba(201,168,76,.65)}50%{box-shadow:0 0 0 4px rgba(201,168,76,.65),0 2px 20px rgba(201,168,76,.4);border-color:rgba(220,185,80,1)}}
.cal-dv-main-head{flex-shrink:0;padding:24px 28px 0;background:inherit;border-radius:10px 10px 0 0}
.cal-dv-main-divider{border-top:1px solid rgba(0,0,0,.08);margin:14px 0 0}
.cal-dv-main-scroll{flex:1;overflow-y:auto;padding:16px 28px 24px}
.cal-dv-main-scroll::-webkit-scrollbar{width:4px}
.cal-dv-main-scroll::-webkit-scrollbar-thumb{background:rgba(92,66,0,.2);border-radius:2px}
.cal-dv-top{display:flex;align-items:flex-start;margin-bottom:4px}
.cal-dv-greg{flex:0 0 auto}
.cal-dv-greg-num{font-family:'Cinzel',serif;font-size:64px;font-weight:700;color:#1a1510;line-height:1}
.cal-dv-greg-day{font-family:'Cinzel',serif;font-size:12px;color:#3a3020;letter-spacing:.1em;margin-top:5px;text-transform:uppercase}
.cal-dv-greg-month{font-size:12px;color:#6a5a40;margin-top:3px;font-style:italic}
.daily-walk-btn{display:block;width:100%;margin:8px 0 4px;padding:9px 14px;background:linear-gradient(135deg,rgba(201,168,76,.1),rgba(201,168,76,.05));border:1px solid rgba(201,168,76,.32);border-radius:8px;color:#7a5200;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.1em;cursor:not-allowed;text-align:left;opacity:.6}
.daily-walk-btn-icon{float:right;opacity:.6}
.cal-dv-refl-trigger{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;color:rgba(122,82,0,.4);border-top:1px solid rgba(201,168,76,.15);padding-top:12px;margin-top:14px;display:block}
.dv-section{border-radius:8px;overflow:hidden;margin-bottom:12px}
.dv-sh{padding:7px 14px;font-family:'Cinzel',serif;font-size:9px;letter-spacing:.14em;font-weight:700;text-transform:uppercase}
.dv-sb{padding:8px 12px}
.dv-section-pursuit{border:1.5px solid rgba(160,120,0,.3)}
.dv-section-pursuit .dv-sh{background:rgba(180,140,10,.14);color:rgba(100,65,0,.9);border-bottom:1px solid rgba(160,120,0,.2)}
.dv-aim-row{display:flex;align-items:center;gap:8px;padding:6px 0 6px 8px;border-bottom:1px solid rgba(160,120,0,.1);border-left:3px solid rgba(180,140,10,.65)}
.dv-aim-row:last-child{border-bottom:none}
.dv-aim-title{flex:1;font-size:12px;color:rgba(70,48,0,.9);font-weight:600;cursor:pointer}
.dv-aim-title:hover{color:rgba(120,85,0,.95)}
.dv-aim-empty{font-size:11px;color:rgba(100,75,0,.45);font-style:italic;padding:6px 0}
.dv-aim-row-demo{border-left-color:rgba(140,80,220,.65);background:rgba(150,100,220,.06)}
.dv-aim-row-demo .dv-aim-title{color:rgba(80,40,150,.9)}
.cal-dv-testimony-btn{background:rgba(175,115,245,.06);border:1.5px solid rgba(140,80,220,.3);color:rgba(100,50,180,.5);font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;padding:8px 22px;border-radius:20px;cursor:not-allowed}
.cal-dv-month-return{background:transparent;border:1px solid rgba(0,0,0,.22);color:rgba(60,45,20,.6);font-family:'Cinzel',serif;font-size:9px;letter-spacing:.1em;padding:6px 14px;border-radius:20px;cursor:pointer;transition:all .2s}
.cal-dv-month-return:hover{background:rgba(0,0,0,.07);border-color:rgba(0,0,0,.4);color:rgba(60,45,20,.9)}

/* ── POPUP — canonical DESTINATION, not a layout type. Generic overlay
   that can host any layout instance (Tabbed/Row/Detail View) — content-
   agnostic, same separation as a Page or a Tab slot not caring what's
   mounted inside them. See NOMENCLATURE comment in <script> for the
   LAYOUT vs DESTINATION distinction. ── */
.popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;align-items:center;justify-content:center}
.popup-card{background:var(--card-head);border:1px solid rgba(201,168,76,.5);border-radius:12px;padding:26px 28px;max-width:640px;width:92%;max-height:82vh;overflow-y:auto;box-shadow:0 10px 50px rgba(0,0,0,.55);position:relative}
.popup-close-btn{position:absolute;top:14px;right:16px;color:rgba(240,232,208,.5);cursor:pointer;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em}
.popup-close-btn:hover{color:var(--gold2)}

/* ── RIGHT RAIL — rebuilt 2026-08-06, Ryan's direct instruction: the
   right rail now works exactly like the left sidebar (double-click to
   toggle expanded/collapsed, same .page-nav/.page-icon/.page-info
   markup, matching hover tooltip), with one inverted default: the
   sidebar STARTS expanded and collapses on double-click; the rail
   STARTS collapsed (icon-only) and expands on double-click — global,
   present on every page, not part of any page/detail. Container padding
   (12px 10px) is intentionally identical to .sidebar's, and .page-nav
   padding is overridden per-state below using the exact same values
   .sidebar.collapsed/.sidebar already use — that's what makes the
   resulting tile sizes pixel-identical to the left column, not just
   visually similar. Ask Amit is the first occupant, first in DOM order
   so it's always the top item, moved down from the old bottom-left
   sidebar tile — this is also the eventual home for Amit's own symbol,
   not placed yet. ── */
.right-rail{
  width:64px;flex-shrink:0;
  background:var(--card-head);
  border-left:2px solid var(--border);
  display:flex;flex-direction:column;
  overflow-y:auto;padding:12px 10px;gap:0;
  transition:width .18s ease;
}
.right-rail::-webkit-scrollbar{width:3px}
.right-rail::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:2px}
.right-rail.expanded{width:max-content} /* matches .sidebar's own switch to max-content — sizes to the widest label rather than a fixed 230px */
/* Icon anchored to the RIGHT side of the row, added 2026-08-06, Ryan's
   direct correction — the rail sits at the screen's right edge, so its
   right edge is the fixed reference point (the mirror of the left
   sidebar, whose LEFT edge is fixed). flex-direction:row-reverse keeps
   the icon (first in DOM order) pinned against the row's right padding
   in both states, with the label packing in immediately to its left when
   expanded — never the icon drifting left with the text. Right padding
   (4px) is identical in both states below, same principle as the left
   sidebar's identical LEFT padding, which is what makes the icon's
   on-screen x-position never move. */
.right-rail .page-nav{padding:4px;flex-direction:row-reverse} /* default = collapsed-style square padding, matches .sidebar.collapsed .page-nav */
.right-rail.expanded .page-nav{padding:6px 4px;justify-content:flex-start} /* matches .sidebar's base .page-nav; flex-start packs toward the row-reversed start, i.e. the right */
.right-rail .page-info{display:none}
.right-rail.expanded .page-info{display:block}

/* ── PAGE HOVER TOOLTIP — added 2026-08-06, Ryan's direct instruction.
   Hovering a page (its icon when the sidebar is collapsed, or anywhere on
   the row when expanded) shows that page's one-line description — the
   same text as .page-sub, so there's only ever one place to write it,
   never two copies that can drift apart. JS-positioned (fixed, see
   initPageTooltips near openPage) rather than pure CSS, because .sidebar
   scrolls vertically (overflow-y:auto) — per CSS spec, that silently
   forces its other axis's overflow to 'auto' too, which would clip a
   CSS-positioned tooltip trying to extend past the sidebar's right edge
   into the main area. A single fixed-position element sidesteps that
   entirely. ── */
.page-hover-tip{
  position:fixed;z-index:9999;
  background:#1a3352;border:1px solid rgba(201,168,76,.45);
  color:var(--gold2);font-family:'Cinzel',serif;font-size:10px;letter-spacing:.05em;
  padding:6px 10px;border-radius:6px;white-space:nowrap;max-width:260px;
  opacity:0;pointer-events:none;
  transition:opacity .12s;box-shadow:0 4px 16px rgba(0,0,0,.4);
}
.page-hover-tip.show{opacity:1}
</style>

<script>
// ══════════════════════════════════════════════
// NOMENCLATURE — Ryan's own vocabulary for this layout, permanent, always

//            using tabs numbered 1..however many exist) is one layout
//            type; more layout types can exist later. A detail's layout
//            is a property of that detail, not of the page system itself.
//   PAGE ORDER vs. PAGE NUMBER — a page's number is its fixed, permanent
//            identity once real project code starts referencing it
//            (openPage(N), detail-N, page-N). Its DISPLAY POSITION in the
//            sidebar is controlled separately, by the PAGE_ORDER list
//            below — reordering the sidebar is always a one-line edit to
//            that list, never a renumbering pass. (Same relationship as a
//            form control's Name vs. its TabIndex.)
//   REFERRING TO A PAGE — always valid either by its name ("Tabbed View")
//            or its number ("page 2"). The page-icon slot itself (▢, or a
//            real icon once a project sets one) is always shown.
//   DESTINATION — separate from LAYOUT (added 2026-08-06, Ryan's direct
//            instruction). A destination is WHERE a layout gets mounted
//            and WHAT triggers it — a whole page, a tab slot inside a
//            Tabbed View, or a Popup opened by an event (double-click,
//            click, etc). Any layout can be mounted at any destination;
//            neither one needs to know about the other. "Popup" is a
//            destination, NOT a fourth layout type — a Popup can host a
//            Tabbed View, a Row View, or a Detail View, exactly the same
//            as a Page can. Find the reusable code for each layout and
//            each destination by its own "CANONICAL LAYOUT:" or
//            "CANONICAL DESTINATION:" comment block further down this
//            script — copy that block verbatim when reusing it, never
//            reconstruct it from memory.
//
// Blank layout shell — no data model, no per-project logic. Placeholder
// pages/details 1-20: rename, re-icon, and build real content into each
// detail when this template is copied for a new project.
// ══════════════════════════════════════════════

// currentUser declared here, not down near the rest of the LOGIN
// CONNECTION code — added 2026-08-06, real bug caught during testing.
// cvCreate('cv-mount') runs synchronously at script-load time (see the
// DEMO block), which calls cvLoadEntries, which now checks currentUser
// (added same session, scoping pursuits to whoever's signed in). Since
// that check ran before the `let currentUser` declaration further down
// the file had executed, it threw "Cannot access before initialization"
// — a temporal dead zone crash, the exact same class of bug already
// documented for Row View's initial rvRender() call. Declaring it here,
// early, means it already exists (as null) by the time any synchronous
// script-load code checks it; the LOGIN CONNECTION section further down
// only ASSIGNS to it from here forward, it doesn't redeclare it.
let currentUser=null;
// SB_URL/SB_KEY/db moved up here too, same TDZ reasoning — see the LOGIN
// CONNECTION section further down for the fuller explanation.
const SB_URL='https://hleqtjqojksurvkyqixt.supabase.co';
const SB_KEY='sb_publishable_0pptfPselXI0V9JmnhXgbA_dAGurCiF';
const db=(typeof supabase!=='undefined')?supabase.createClient(SB_URL,SB_KEY):null;
// DEMO MODE — added 2026-08-06, Ryan's direct instruction: every live-
// data view should be able to show Amit's own real history (so a new
// person can see what Amit's actual usage looks like) blended with
// whatever the signed-in user has of their own, with a rail toggle to

// toggleHubDemo) — same account, same localStorage key pattern, same
// default (on). Declared here (not lower, near the rest of LOGIN
// CONNECTION) for the same temporal-dead-zone reason currentUser is
// declared this early — see that declaration's own comment.
const AMIT_DEMO_UID='8b95d057-fd6b-44ec-abe7-658e08872d1a';
let demoMode=localStorage.getItem('amit_demo_mode')!=='off';

// ══════════════════════════════════════════════
// CANONICAL DATA BINDING: DEMO MODE — added 2026-08-06, Ryan's direct
// correction: this connection to Amit's account must be a GENERAL,
// reusable mechanism available to ANY current or future view/form built
// from this template — "some things will have demo, some things may
// not, but it should always have that connection... it goes from
// pursuits to the calendar to... if there's a new form that's created,
// that demo mode will work within that form." Not something re-wired
// per view.
//
// fetchDemoRows(table, queryString) — the one call any view makes to
// pull Amit's own rows for demo mode. Returns [] immediately if demo
// mode is off (the caller doesn't need its own on/off check). Every
// returned row is tagged _isDemo:true.
//
//   table: the Supabase table name (e.g. 'hub_entries')
//   queryString: the rest of the PostgREST query — select/filters/order
//     — everything after the table name, same syntax as a normal fetch
//     to this table, EXCLUDING user_id (fetchDemoRows adds
//     user_id=eq.AMIT_DEMO_UID itself, always, so a caller can never
//     accidentally point this at any account but Amit's own).
//
// REVIEW ONLY — Ryan's direct instruction: "never to adjust. They can
// never have access to anything." Any row this returns is tagged
// _isDemo, and it is the CALLER's responsibility to treat that as
// read-only wherever it renders — Row View already enforces this itself
// (rvEditCell/rvCommitCell refuse to edit an _isDemo row, and its
// editable-column rendering falls back to plain read-only display for
// one), so any layout built on Row View inherits the protection
// automatically. A future layout that isn't Row View-based must
// implement its own _isDemo check the same way.
// ══════════════════════════════════════════════
async function fetchDemoRows(table,queryString){
  if(!demoMode)return[];
  try{
    const res=await fetch(`${SB_URL}/rest/v1/${table}?user_id=eq.${AMIT_DEMO_UID}&${queryString}`,{
      headers:{apikey:SB_KEY,Accept:'application/json'}
    });
    const rows=res.ok?await res.json():[];
    return rows.map(r=>({...r,_isDemo:true}));
  }catch(e){
    return[];
  }
}

    const NEW_VIEW_ICONS={

    } else if(i===15){

    } else if(i===17){

        <div class="detail-head"><span class="detail-heading">${label}</span></div>
        <div class="detail-empty">Detail ${i} content goes here</div>

    }
  }
  let navHtml=PAGE_ORDER.map(i=>navHtmlParts[i]||'').join('');
  nav.innerHTML=navHtml;
  main.innerHTML=detailHtml;

  // RIGHT RAIL — rebuilt 2026-08-06, Ryan's direct instruction: uses the
  // exact same .page-nav/.page-icon/.page-info/.page-name markup as the
  // left sidebar's rows (see the RIGHT RAIL comment in <style> for why —
  // pixel-identical tile sizes by construction, not a lookalike built

  // purpose: this new project has no real page yet for Amit to have
