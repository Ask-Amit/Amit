        <div class="page-name" id="rail-demo-name">Demo On</div>
        <div class="page-sub" id="rail-demo-sub">Amit's Data Shown</div>
      </div>
    </div>`;
    _updateDemoUI();
  }

  initPageTooltips('sidebarPages','right'); // left sidebar — tooltip opens rightward, toward the page
  initPageTooltips('rightRail','left');      // right rail — tooltip opens leftward, or it'd render off-screen
})();

// PAGE HOVER TOOLTIP — see the CSS comment above .page-hover-tip for why
// this is JS-positioned instead of pure CSS. Delegated on the given
// container so it keeps working no matter how many items exist or
// whether that container is collapsed/expanded — no per-item wiring.
// side: 'right' opens the tooltip to the right of the hovered item
// (left sidebar, which sits at the screen's left edge); 'left' opens it
// to the left (right rail, which sits at the screen's right edge —
// opening rightward there would render off-screen).
function initPageTooltips(containerId,side){
  const tip=document.getElementById('pageHoverTip');
  const nav=document.getElementById(containerId);
  if(!tip||!nav)return;
  nav.addEventListener('mouseover',(e)=>{
    const item=e.target.closest('.page-nav');
    if(!item)return;
    tip.textContent=item.dataset.tip||'';
    const r=item.getBoundingClientRect();
    if(side==='left'){
      tip.style.right=(window.innerWidth-r.left+8)+'px';
      tip.style.left='auto';
    } else {
      tip.style.left=(r.right+8)+'px';
      tip.style.right='auto';
    }
    tip.style.top=(r.top+r.height/2)+'px';
    tip.style.transform='translateY(-50%)';
    tip.classList.add('show');
  });
  nav.addEventListener('mouseout',(e)=>{
    const item=e.target.closest('.page-nav');
    if(!item)return;
    if(e.relatedTarget&&item.contains(e.relatedTarget))return;
    tip.classList.remove('show');
  });
}

// Double-click anywhere in the right rail expands it to full width with
// labels, or collapses it back to icon-only — the mirror image of
// toggleSidebar() above: the rail starts collapsed by default (opposite
// of the sidebar, which starts expanded), so this toggles an .expanded
// class ON rather than a .collapsed class off.
function toggleRail(){
  document.getElementById('rightRail').classList.toggle('expanded');
}

// ══════════════════════════════════════════════
// CANONICAL LAYOUT: ROW VIEW — Excel-style: click a column header to sort
// (toggle asc/desc, arrow shows direction); double-click a header to edit
// an inline "contains" filter right in that cell (Enter/blur commits,
// Escape cancels) — deliberately no native browser prompt(), matching the
// rest of the Amit system's no-native-dialog standard (see AmitBooks/
// CLAUDE.md Interactivity Standard #7). Filters compose with AND. Rows
// may carry a children[] array — a ▸/▾ toggle expands/collapses them,
// indented beneath the parent; children are not independently sortable/
// filterable, only their parent's row is. A status strip above the table
// names whatever's active with a one-click clear.
//
// INSTANCE-BASED (added 2026-08-06, Ryan's direct instruction) — LAYOUT
// and DESTINATION are separate concerns (see NOMENCLATURE above). A Row
// View can be mounted at any destination — a whole page, a tab slot
// inside a Tabbed View, or inside a Popup — and any number of Row View
// instances can be alive on screen at once, each with its own
// independent sort/filter/expand state, keyed by the id of the element
// it mounts into. There is no longer "the" Row View — only Row View
// instances.
//
// EDITABLE COLUMNS (merged in from the former standalone Grid View layout,
// 2026-08-06, Ryan's direct instruction: "if it's editable or not editable,
// it's dependent upon what's being shown in that view" — editability is a
// property of a COLUMN, not a separate layout type). A column marked
// {editable:true} renders its cells cream-tinted (var(--text2)) and
// click-to-edit in place; a column without that flag renders exactly as
// before, plain read-only text. One Row View instance can mix both kinds
// of column side by side. This does not conflict with row-level
// double-click-to-open — click (edit a cell) and double-click (open the
// row) are separate events.
//
// KEYBOARD NAVIGATION (added same session, Ryan's direct instruction) —
// ↑/↓ move focus up/down through the CURRENT visible row order (respecting
// active sort, filter, and which parents are expanded — same order a
// mouse would encounter scrolling top-to-bottom). Enter on the focused row
// opens it exactly like a double-click would. Click a row to focus it with
// the mouse; keyboard and mouse focus are the same state, not two
// separate mechanisms.
//
//   rvCreate(containerId, columns, rows, opts) — the one call that
//     creates and mounts a Row View instance. Copy this call verbatim
//     wherever a Row View is needed; never re-derive its internals.
//     columns: [{key,label,editable?}, ...] — editable is optional,
//       defaults to false/read-only.
//     rows: [{id, ...fields, children:[...]}, ...]
//     opts.onRowOpen(itemId): optional — called when a row is double-
//       clicked, or Enter is pressed while it's focused. Row View does not
//       know or care what happens next (open a page, open a popup,
//       whatever) — that decision belongs entirely to whoever created
//       this instance, same separation as a Page not needing to know what
//       Layout is mounted inside it. If omitted, falls back to the
//       template's original default: open Detail View on page 4.
//     opts.onCellCommit(rowId,key,newVal): optional — called after an
//       editable cell's edit commits, so the caller (a real Supabase-bound
//       page, e.g.) can persist the change. If omitted, the edit only
//       updates in-memory state.
//
// Sample data below (RV_SAMPLE_COLUMNS/RV_SAMPLE_ROWS) is placeholder
// only — swap for a real project's real columns/rows when this layout
// gets used for something real. Status and Owner are marked editable here
// to demonstrate the cream-tint styling; Name and Due are not.
//
// Genuinely open, not built yet: named/saved sort+filter views
// (localStorage, per-instance, with a "set as default" — see AmitBooks'
// abSmart engine for the fuller pattern this can grow into); multi-cell/
// range select and copy-paste across cells.
// ══════════════════════════════════════════════
const RV_SAMPLE_COLUMNS=[
  {key:'name',label:'Name'},
  {key:'status',label:'Status',editable:true},
  {key:'owner',label:'Owner',editable:true},
  {key:'due',label:'Due',type:'date'}
];
const RV_SAMPLE_ROWS=[
  {id:'r1',name:'Kickoff meeting',status:'Done',owner:'Ryan',due:'2026-07-28'},
  {id:'r2',name:'Design review',status:'In Progress',owner:'Amit',due:'2026-08-02',children:[
    {id:'r2a',name:'Color pass',status:'Done',owner:'Amit',due:'2026-07-30'},
    {id:'r2b',name:'Layout pass',status:'In Progress',owner:'Amit',due:'2026-08-02'}
  ]},
  {id:'r3',name:'Backend wiring',status:'Not Started',owner:'Ryan',due:'2026-08-10'},
  {id:'r4',name:'QA pass',status:'Not Started',owner:'Ryan',due:'2026-08-14',children:[
    {id:'r4a',name:'Desktop',status:'Not Started',owner:'Ryan',due:'2026-08-14'},
    {id:'r4b',name:'Mobile',status:'Not Started',owner:'Ryan',due:'2026-08-14'}
  ]},
  {id:'r5',name:'Launch',status:'Not Started',owner:'Ryan',due:'2026-08-20'}
];

const rvInstances=new Map(); // containerId -> {columns,rows,sort,colFilters,filterOrder,expanded,editingCell,focusedRowId,colWidths,onRowOpen,onCellCommit}

function rvCreate(containerId,columns,rows,opts={}){
  rvInstances.set(containerId,{
    columns,rows,
    sort:null,colFilters:{},filterOrder:[],expanded:new Set(),editingCell:null,
    focusedRowId:(rows[0]&&rows[0].id)||null,
    colWidths:{}, // key -> px, filled in on first render / user drag (see rvStartResize)
    onRowOpen:opts.onRowOpen||null,
    onCellCommit:opts.onCellCommit||null
  });
  rvRenderInstance(containerId);
}

// Flattens the current visible row order (top-level rows in their sorted/
// filtered order, with each expanded parent's children immediately after
// it) — the single source of truth both rendering and ↑/↓ keyboard
// navigation use, so keyboard order always matches what's on screen.
function rvFlattenVisible(inst,rows){
  const out=[];
  rows.forEach(r=>{
    out.push({item:r,isChild:false});
    if(r.children&&r.children.length&&inst.expanded.has(r.id)){
      r.children.forEach(c=>out.push({item:c,isChild:true}));
    }
  });
  return out;
}

// EXCEL-STYLE COLUMN FILTER MENU — added 2026-08-06, Ryan's direct
// instruction, replacing the old click-header-to-sort/double-click-to-
// type-a-filter interaction entirely ("we're just gonna use the
// functionality as we would be for an Excel spreadsheet"). Each column's
// ▾ button opens Sort A→Z / Sort Z→A buttons plus a searchable checklist
// of that column's own distinct values — check/uncheck to include/exclude
// specific values, same as Excel's own AutoFilter. Filters across
// different columns compose with AND and stack ("stair-step on top of
// each other," Ryan's words) — filtering Name then filtering Owner
// narrows by both together, same as it always has.
//
// rvApplyColFilters(inst, rows, excludeKey) applies every active column
// filter EXCEPT excludeKey — this is what lets a column's own dropdown
// show the distinct values still reachable given every OTHER column's
// current filter (real Excel behavior: opening the Owner dropdown while
// Name is already filtered only lists Owners that actually occur among
// the currently-Name-filtered rows), while still letting that column's
// own prior selection be re-shown/adjusted rather than hidden by itself.
// A column filter value is either a Set (value-checklist filter, the
// original behavior) or a {type:'range',start,end} object (date-range
// filter, added 2026-08-06 — see the DATE RANGE FILTER block below). Both
// shapes are handled the same way here so filters of either kind stack
// together with the same AND logic.
function rvApplyColFilters(inst,rows,excludeKey){
  let out=rows;
  Object.entries(inst.colFilters).forEach(([key,filter])=>{
    if(key===excludeKey||!filter)return;
    if(filter instanceof Set){
      if(!filter.size)return;
      out=out.filter(r=>filter.has(String(r[key]||'')));
    } else if(filter.type==='range'){
      out=out.filter(r=>{
        const v=String(r[key]||'');
        return v>=filter.start&&v<=filter.end;
      });
    }
  });
  return out;
}

// True if a column currently has an active filter of either shape —
// used anywhere the code just needs a yes/no (header highlight, status
// strip), not the filter's actual contents.
function rvColFilterActive(filter){
  if(!filter)return false;
  return filter instanceof Set?filter.size>0:true;
}

// FILTER ORDER (the "-1, -2, -3" sequence badge) — added 2026-08-06,
// Ryan's direct instruction: the funnel icon shows which pass a column's
// filter was applied in, not just whether it's active. inst.filterOrder
// is a plain array of column keys in the order their filters were turned
// on; a column's badge number is just its 1-based position in that array.
// Removing one column's filter (via the Clear Filter button or the
// double-click shortcut) splices it out — every filter applied after it
// automatically shifts down a number, since the number is always just
// "position in the array," never a stored/stale value.
function rvAddToFilterOrder(inst,key){
  if(!inst.filterOrder.includes(key)) inst.filterOrder.push(key);
}
function rvRemoveFromFilterOrder(inst,key){
  const idx=inst.filterOrder.indexOf(key);
  if(idx>-1) inst.filterOrder.splice(idx,1);
}

function rvColumnDistinctValues(inst,key){
  const rows=rvApplyColFilters(inst,inst.rows,key);
  return Array.from(new Set(rows.map(r=>String(r[key]||'')))).sort((a,b)=>a.localeCompare(b));
}

function rvGetVisibleRows(inst){
  let rows=rvApplyColFilters(inst,inst.rows,null);
  if(inst.sort){
    const{key,dir}=inst.sort;
    rows=rows.slice().sort((a,b)=>{
      const av=String(a[key]||''),bv=String(b[key]||'');
      return dir==='asc'?av.localeCompare(bv):bv.localeCompare(av);
    });
  }
  return rows;
}

// A single shared floating menu (#rvColMenu, fixed-position — see the
// HTML near #pageHoverTip) reused across every Row View instance, exactly
// the same reasoning documented on that tooltip: .rv-table-wrap scrolls
// (overflow:auto), and per the CSS spec that silently clips any
// CSS-absolute child trying to extend past it — a single fixed-position
// element positioned via JS sidesteps that entirely, rather than nesting
// the menu inside the scrolling table itself. Only one column menu can
// be open at a time system-wide, matching Excel's own single-active-
// dropdown behavior. rvMenuState holds the in-progress (not yet applied)
// checklist selection so Apply/Cancel/Clear all have something to act on.
let rvMenuState=null; // {containerId,key,checked:Set,search} for a normal column, or {containerId,key,isDate:true,dateStart,dateEnd} for a date column

// DATE RANGE FILTER — added 2026-08-06, Ryan's direct instruction: a
// column marked {type:'date'} gets Today / This Week / This Month /
// This Year / This Fiscal Year / Last Fiscal Year quick-select buttons
// PLUS a Custom "from this date to that date" range picker, instead of
// the plain value checklist — filtering a date column by exact string
// match isn't useful the way it is for Status or Owner. Fiscal year is
// assumed to start October 1 (RV_FISCAL_START_MONTH, 0-indexed = 9) —
// a real project should change that one constant to its own actual
// fiscal calendar; nothing else here is fiscal-year-specific.
const RV_FISCAL_START_MONTH=9;
function rvFmtDate(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function rvComputeDateRange(preset){
  const now=new Date();
  const y=now.getFullYear(),m=now.getMonth(),d=now.getDate();
  if(preset==='today'){ const t=rvFmtDate(now); return{start:t,end:t,label:'Today'}; }
  if(preset==='week'){
    const day=now.getDay();
    return{start:rvFmtDate(new Date(y,m,d-day)),end:rvFmtDate(new Date(y,m,d-day+6)),label:'This Week'};
  }
  if(preset==='month'){
    return{start:rvFmtDate(new Date(y,m,1)),end:rvFmtDate(new Date(y,m+1,0)),label:'This Month'};
  }
  if(preset==='year'){
    return{start:y+'-01-01',end:y+'-12-31',label:'This Year'};
  }
  if(preset==='fy'||preset==='lastfy'){
    let fyStartYear=m>=RV_FISCAL_START_MONTH?y:y-1;
    if(preset==='lastfy') fyStartYear-=1;
    return{
      start:rvFmtDate(new Date(fyStartYear,RV_FISCAL_START_MONTH,1)),
      end:rvFmtDate(new Date(fyStartYear+1,RV_FISCAL_START_MONTH,0)),
      label:preset==='fy'?'This Fiscal Year':'Last Fiscal Year'
    };
  }
  return{start:'0000-01-01',end:'9999-12-31',label:'All'};
}
function rvDatePreset(preset){
  if(!rvMenuState)return;
  const{containerId,key}=rvMenuState;
  const inst=rvInstances.get(containerId);if(!inst)return;
  const range=rvComputeDateRange(preset);
  inst.colFilters[key]={type:'range',start:range.start,end:range.end,label:range.label};
  rvAddToFilterOrder(inst,key);
  rvCloseColMenu();
  rvRenderInstance(containerId);
}
function rvDateCustomApply(){
  if(!rvMenuState)return;
  const{containerId,key}=rvMenuState;
  const inst=rvInstances.get(containerId);if(!inst)return;
  const start=document.getElementById('rvDateFrom').value;
  const end=document.getElementById('rvDateTo').value;
  if(!start&&!end){ delete inst.colFilters[key]; rvRemoveFromFilterOrder(inst,key); }
  else {
    inst.colFilters[key]={type:'range',start:start||'0000-01-01',end:end||'9999-12-31',label:(start||'…')+' → '+(end||'…')};
    rvAddToFilterOrder(inst,key);
  }
  rvCloseColMenu();
  rvRenderInstance(containerId);
}

// Funnel icon (replaces the old plain ▾ text glyph, added 2026-08-06,
// Ryan's direct instruction) — a tiny inline SVG, sized to fit inside the
// header's own reserved right-edge space, fill:currentColor so it
// inherits the button's own color/active-state styling for free.
const RV_FUNNEL_SVG='<svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor" style="vertical-align:middle"><path d="M1 2h14l-5.5 6.5v5L7 15V8.5z"/></svg>';

// SINGLE vs DOUBLE CLICK on the funnel — added 2026-08-06, Ryan's direct
// instruction: single click opens that column's filter menu (unchanged
// behavior); a quick double-click instead removes ONLY that column's own
// filter, leaving every other active filter and re-sequencing the "-N"
// order badges automatically (since the badge is always just "position
// in inst.filterOrder," removing an entry shifts the rest down on its
// own — see rvRemoveFromFilterOrder). Standard browser click/dblclick
// debounce: the first click is held for a short window; if a second
// click lands inside that window it's treated as the double-click and
// the pending single-click action is cancelled instead of both firing.
let rvFunnelClickTimer=null;
function rvFunnelClick(e,containerId,key){
  e.stopPropagation();
  if(rvFunnelClickTimer){
    clearTimeout(rvFunnelClickTimer);
    rvFunnelClickTimer=null;
    rvClearColFilter(containerId,key); // double-click: remove just this column's filter
    return;
  }
  rvFunnelClickTimer=setTimeout(()=>{
    rvFunnelClickTimer=null;
    rvToggleColMenu(e,containerId,key);
  },250);
}

function rvToggleColMenu(e,containerId,key){
  e.stopPropagation();
  if(rvMenuState&&rvMenuState.containerId===containerId&&rvMenuState.key===key){
    rvCloseColMenu();return;
  }
  const inst=rvInstances.get(containerId);if(!inst)return;
  const col=inst.columns.find(c=>c.key===key);
  if(col.type==='date'){
    const existing=inst.colFilters[key];
    rvMenuState={containerId,key,isDate:true,
      dateStart:(existing&&existing.type==='range'&&existing.start!=='0000-01-01')?existing.start:'',
      dateEnd:(existing&&existing.type==='range'&&existing.end!=='9999-12-31')?existing.end:''};
  } else {
    const values=rvColumnDistinctValues(inst,key);
    const existing=inst.colFilters[key];
    rvMenuState={containerId,key,checked:existing instanceof Set&&existing.size?new Set(existing):new Set(values),search:''};
  }
  rvRenderColMenu();
  const btn=e.target.closest('.rv-col-menu-btn');
  const r=btn.getBoundingClientRect();
  const menu=document.getElementById('rvColMenu');
  menu.style.display='block';
  menu.style.top=(r.bottom+4)+'px';
  menu.style.left=Math.min(r.left,window.innerWidth-236)+'px';
  setTimeout(()=>document.addEventListener('click',rvOutsideMenuClick),0);
}

function rvOutsideMenuClick(e){
  const menu=document.getElementById('rvColMenu');
  if(menu&&!menu.contains(e.target)) rvCloseColMenu();
}

function rvCloseColMenu(){
  rvMenuState=null;
  const menu=document.getElementById('rvColMenu');
  if(menu){ menu.style.display='none'; menu.innerHTML=''; }
  document.removeEventListener('click',rvOutsideMenuClick);
}

function rvRenderColMenu(){
  if(!rvMenuState)return;
  const{containerId,key}=rvMenuState;
  const inst=rvInstances.get(containerId);if(!inst)return;
  const col=inst.columns.find(c=>c.key===key);
  const menu=document.getElementById('rvColMenu');

  if(rvMenuState.isDate){
    menu.innerHTML=`
      <div class="rv-col-menu-sort">
        <button onclick="rvSortSet('${containerId}','${key}','asc')">▲ Sort Oldest→Newest</button>
        <button onclick="rvSortSet('${containerId}','${key}','desc')">▼ Sort Newest→Oldest</button>
      </div>
      <div class="rv-col-menu-divider"></div>
      <div class="rv-col-menu-datebtns">
        <button onclick="rvDatePreset('today')">Today</button>
        <button onclick="rvDatePreset('week')">This Week</button>
        <button onclick="rvDatePreset('month')">This Month</button>
        <button onclick="rvDatePreset('year')">This Year</button>
        <button onclick="rvDatePreset('fy')">This Fiscal Year</button>
        <button onclick="rvDatePreset('lastfy')">Last Fiscal Year</button>
      </div>
      <div class="rv-col-menu-divider"></div>
      <div class="rv-col-menu-date-custom">
        <label>Custom — From<input type="date" id="rvDateFrom" value="${rvMenuState.dateStart}"></label>
        <label>To<input type="date" id="rvDateTo" value="${rvMenuState.dateEnd}"></label>
      </div>
      <div class="rv-col-menu-actions">
        <button class="rv-col-menu-btn-clear" onclick="rvClearColFilter('${containerId}','${key}')">Clear Filter</button>
        <button class="rv-col-menu-btn-apply" onclick="rvDateCustomApply()">Apply Range</button>
      </div>`;
    return;
  }

  const{checked,search}=rvMenuState;
  const values=rvColumnDistinctValues(inst,key);
  const shown=search?values.filter(v=>v.toLowerCase().includes(search.toLowerCase())):values;
  menu.innerHTML=`
    <div class="rv-col-menu-sort">
      <button onclick="rvSortSet('${containerId}','${key}','asc')">▲ Sort A→Z</button>
      <button onclick="rvSortSet('${containerId}','${key}','desc')">▼ Sort Z→A</button>
    </div>
    <div class="rv-col-menu-divider"></div>
    <input class="rv-col-menu-search" id="rvColMenuSearch" placeholder="Search ${col.label.toLowerCase()}…" value="${search.replace(/"/g,'&quot;')}" oninput="rvMenuSearchInput(this.value)">
    <div class="rv-col-menu-selectall"><span onclick="rvMenuSelectAll()">Select All</span> · <span onclick="rvMenuClearAll()">Clear</span></div>
    <div class="rv-col-menu-list">
      ${shown.length?shown.map(v=>`<label class="rv-col-menu-item"><input type="checkbox" ${checked.has(v)?'checked':''} onchange="rvMenuToggleValue('${v.replace(/'/g,"\\'")}')">${v||'(blank)'}</label>`).join(''):'<div class="rv-col-menu-empty">No values</div>'}
    </div>
    <div class="rv-col-menu-divider"></div>
    <div class="rv-col-menu-actions">
      <button class="rv-col-menu-btn-clear" onclick="rvClearColFilter('${containerId}','${key}')">Clear Filter</button>
      <button class="rv-col-menu-btn-apply" onclick="rvMenuApply()">Apply</button>
    </div>`;
}

function rvMenuSearchInput(val){
  if(!rvMenuState)return;
  rvMenuState.search=val;
  rvRenderColMenu();
  const input=document.getElementById('rvColMenuSearch');
  if(input){ input.focus(); input.setSelectionRange(val.length,val.length); }
}

function rvMenuToggleValue(val){
  if(!rvMenuState)return;
  if(rvMenuState.checked.has(val)) rvMenuState.checked.delete(val); else rvMenuState.checked.add(val);
  rvRenderColMenu();
}

function rvMenuSelectAll(){
  if(!rvMenuState)return;
  const inst=rvInstances.get(rvMenuState.containerId);
  rvMenuState.checked=new Set(rvColumnDistinctValues(inst,rvMenuState.key));
  rvRenderColMenu();
}

function rvMenuClearAll(){
  if(!rvMenuState)return;
  rvMenuState.checked=new Set();
  rvRenderColMenu();
}

function rvMenuApply(){
  if(!rvMenuState)return;
  const{containerId,key,checked}=rvMenuState;
  const inst=rvInstances.get(containerId);if(!inst)return;
  const values=rvColumnDistinctValues(inst,key);
  if(checked.size>=values.length){ delete inst.colFilters[key]; rvRemoveFromFilterOrder(inst,key); } // everything checked = no filter
  else { inst.colFilters[key]=new Set(checked); rvAddToFilterOrder(inst,key); }
  rvCloseColMenu();
  rvRenderInstance(containerId);
}

function rvClearColFilter(containerId,key){
  const inst=rvInstances.get(containerId);if(!inst)return;
  delete inst.colFilters[key];
  rvRemoveFromFilterOrder(inst,key);
  rvCloseColMenu();
  rvRenderInstance(containerId);
}

function rvSortSet(containerId,key,dir){
  const inst=rvInstances.get(containerId);if(!inst)return;
  inst.sort={key,dir};
  rvCloseColMenu();
  rvRenderInstance(containerId);
}

function rvRenderInstance(containerId){
  const wrap=document.getElementById(containerId);
  const inst=rvInstances.get(containerId);
  if(!wrap||!inst)return;
  const rows=rvGetVisibleRows(inst);
  const statusParts=[];
  if(inst.sort) statusParts.push(`Sorted by ${inst.columns.find(c=>c.key===inst.sort.key).label} (${inst.sort.dir==='asc'?'A→Z':'Z→A'})`);
  Object.entries(inst.colFilters).forEach(([key,filter])=>{
    if(!rvColFilterActive(filter))return;
    const label=inst.columns.find(c=>c.key===key).label;
    if(filter instanceof Set) statusParts.push(`${label}: ${filter.size} selected`);
    else statusParts.push(`${label}: ${filter.label}`);
  });
  const statusHtml=statusParts.length
    ? `<div class="rv-status">${statusParts.join(' · ')} <span class="clear" onclick="rvClear('${containerId}')">Clear</span></div>`
    : `<div class="rv-status">Click the funnel on any column to sort or filter, double-click it to remove that column's filter · ↑/↓ to move, Enter to open</div>`;

  // colgroup drives the actual pixel widths (table-layout:fixed, see CSS) —
  // this is what makes a drag-resize stick across re-renders instead of
  // the browser silently re-flowing widths from content every time.
  const colgroupHtml=`<colgroup>
    <col style="width:24px">
    ${inst.columns.map(c=>`<col data-key="${c.key}" style="width:${inst.colWidths[c.key]||160}px">`).join('')}
  </colgroup>`;

  const theadHtml=`<tr>
    <th style="width:24px"></th>
    ${inst.columns.map(c=>{
      const isSorted=inst.sort&&inst.sort.key===c.key;
      const arrow=isSorted?(inst.sort.dir==='asc'?'▲':'▼'):'';
      const hasFilter=rvColFilterActive(inst.colFilters[c.key]);
      const orderNum=hasFilter?inst.filterOrder.indexOf(c.key)+1:0;
      return `<th class="${hasFilter?'rv-filtered':''}" style="position:relative">
        <span class="rv-th-label">${c.label}${arrow?`<span class="rv-arrow">${arrow}</span>`:''}</span>
        <span class="rv-col-menu-btn${hasFilter?' active':''}" onclick="rvFunnelClick(event,'${containerId}','${c.key}')" title="${hasFilter?'Filter #'+orderNum+' — click to edit, double-click to remove':'Click to sort or filter'}">
          ${RV_FUNNEL_SVG}${hasFilter?`<span class="rv-col-menu-order">-${orderNum}</span>`:''}
        </span>
        <span class="rv-col-resizer" onmousedown="event.stopPropagation();rvStartResize(event,'${containerId}','${c.key}')" ondblclick="event.stopPropagation()"></span>
      </th>`;
    }).join('')}
  </tr>`;

  // A cell in an editable column renders click-to-edit (cream-tinted span,
  // or an input while actively editing); a cell in a non-editable column
  // renders exactly as before, plain text.
  const cellHtml=(r,c,idx,isChild)=>{
    const prefix=idx===0&&isChild?'— ':'';
    // Demo rows never render as editable, even in an editable column —
    // added 2026-08-06, Ryan's direct instruction, same review-only rule
    // as the rvEditCell/rvCommitCell guards. Falls through to the same
    // plain read-only cell a non-editable column would use.
    if(!c.editable||r._isDemo) return `<td class="rv-td-plain">${prefix}${r._isDemo&&idx===0?'✦ ':''}${r[c.key]||''}</td>`;
    const editing=inst.editingCell&&inst.editingCell.rowId===r.id&&inst.editingCell.key===c.key;
    if(editing){
      return `<td><input class="rv-cell-input" id="rv-cell-input-${containerId}" value="${String(r[c.key]||'').replace(/"/g,'&quot;')}"
        onkeydown="event.stopPropagation(); if(event.key==='Enter')rvCommitCell('${containerId}','${r.id}','${c.key}',this.value); if(event.key==='Escape'){rvInstances.get('${containerId}').editingCell=null;rvRenderInstance('${containerId}');}"
        onblur="rvCommitCell('${containerId}','${r.id}','${c.key}',this.value)"></td>`;
    }
    return `<td><span class="rv-cell-editable" onclick="event.stopPropagation();rvEditCell('${containerId}','${r.id}','${c.key}')">${prefix}${r[c.key]||''}</span></td>`;
  };

  // Double-click ANYWHERE in a row's own cells (not the expand toggle, not
  // an editable cell's own click-to-edit) hands off to rvHandleRowOpen,
  // which honors this instance's own onRowOpen if it has one, or falls
  // back to the template's original default (Detail View on page 4).
  const flat=rvFlattenVisible(inst,rows);
  const rowsHtml=flat.map(({item:r,isChild})=>{
    const hasKids=r.children&&r.children.length;
    const expanded=inst.expanded.has(r.id);
    const focused=inst.focusedRowId===r.id;
    return `<tr class="${isChild?'rv-child':'rv-row'}${focused?' focused':''}" onclick="rvSetFocus('${containerId}','${r.id}')" ondblclick="rvHandleRowOpen('${containerId}','${r.id}')">
      <td>${hasKids?`<span class="rv-expand" onclick="event.stopPropagation();rvToggleExpand('${containerId}','${r.id}')">${expanded?'▾':'▸'}</span>`:''}</td>
      ${inst.columns.map((c,idx)=>cellHtml(r,c,idx,isChild)).join('')}
    </tr>`;
  }).join('');

  wrap.innerHTML=`${statusHtml}
    <div class="rv-table-wrap" id="${containerId}-scroll" tabindex="0" onkeydown="rvHandleKeydown(event,'${containerId}')"><table class="rv-table">
      ${colgroupHtml}
      <thead>${theadHtml}</thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>`;

  if(inst.editingCell){
    const input=document.getElementById('rv-cell-input-'+containerId);
    if(input){ input.focus(); input.select(); }
  }
}

function rvHandleRowOpen(containerId,itemId){
  const inst=rvInstances.get(containerId);
  if(inst&&inst.onRowOpen){ inst.onRowOpen(itemId); return; }
  dvOpenFor(itemId); // default fallback, unchanged from the template's original behavior
}

function rvToggleExpand(containerId,id){
  const inst=rvInstances.get(containerId);if(!inst)return;
  if(inst.expanded.has(id)) inst.expanded.delete(id);
  else inst.expanded.add(id);
  rvRenderInstance(containerId);
}

function rvClear(containerId){
  const inst=rvInstances.get(containerId);if(!inst)return;
  inst.sort=null;
  inst.colFilters={};
  inst.filterOrder=[];
  rvRenderInstance(containerId);
}

function rvEditCell(containerId,rowId,key){
  const inst=rvInstances.get(containerId);if(!inst)return;
  // DEMO ROWS ARE REVIEW ONLY — added 2026-08-06, Ryan's direct
  // instruction: "never to adjust. They can never have access to
  // anything." Any row tagged _isDemo (Amit's own account, pulled in via
  // demo mode — see fetchDemoRows) refuses to enter edit mode at all,
  // regardless of whether its column is marked editable. This is
  // enforced here, at the single chokepoint every editable-cell click
  // goes through, not left to each view to remember on its own.
  const row=inst.rows.find(r=>r.id===rowId);
  if(row&&row._isDemo)return;
  inst.editingCell={rowId,key};
  rvRenderInstance(containerId);
}

function rvCommitCell(containerId,rowId,key,val){
  const inst=rvInstances.get(containerId);if(!inst)return;
  const row=dvFindItem?dvFindItem(rowId,inst.rows)||inst.rows.find(r=>r.id===rowId):inst.rows.find(r=>r.id===rowId);
  if(row&&row._isDemo){ inst.editingCell=null; rvRenderInstance(containerId); return; } // belt-and-braces — should never reach here for a demo row given the rvEditCell guard, but never write one back regardless
  if(row) row[key]=val;
  inst.editingCell=null;
  if(inst.onCellCommit) inst.onCellCommit(rowId,key,val);
  rvRenderInstance(containerId);
}

// Excel-style drag-to-resize — added 2026-08-06, Ryan's direct
// instruction. Live-updates just the dragged <col>'s width during the
// drag (smooth, no full re-render per pixel of mouse movement), then
// does one final full re-render on mouseup so inst.colWidths and the DOM
// stay in sync. Global mousemove/mouseup listeners are added on
// mousedown and removed on mouseup — never left dangling.
function rvStartResize(e,containerId,key){
  e.preventDefault();
  const inst=rvInstances.get(containerId);if(!inst)return;
  const th=e.target.closest('th');
  const startX=e.clientX;
  const startWidth=inst.colWidths[key]||th.getBoundingClientRect().width;
  const handle=e.target;
  handle.classList.add('resizing');
  function onMove(ev){
    const newWidth=Math.max(60,Math.round(startWidth+(ev.clientX-startX)));
    inst.colWidths[key]=newWidth;
    const col=document.querySelector(`#${containerId}-scroll col[data-key="${key}"]`);
    if(col) col.style.width=newWidth+'px';
  }
  function onUp(){
    document.removeEventListener('mousemove',onMove);
    document.removeEventListener('mouseup',onUp);
    handle.classList.remove('resizing');
    rvRenderInstance(containerId);
  }
  document.addEventListener('mousemove',onMove);
  document.addEventListener('mouseup',onUp);
}

function rvSetFocus(containerId,rowId){
  const inst=rvInstances.get(containerId);if(!inst)return;
  inst.focusedRowId=rowId;
  rvRenderInstance(containerId);
}

// ↑/↓ move the focused row through the current visible order (matches
// exactly what rvRenderInstance just drew, via the same rvGetVisibleRows/
// rvFlattenVisible helpers); Enter opens the focused row exactly like a
// double-click. Ignored while a cell edit or the column filter menu is
// actively open, so arrow keys there behave normally instead of
// hijacking row focus.
function rvHandleKeydown(e,containerId){
  const inst=rvInstances.get(containerId);if(!inst)return;
  if(inst.editingCell||(rvMenuState&&rvMenuState.containerId===containerId))return;
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp'&&e.key!=='Enter')return;
  e.preventDefault();
  const rows=rvGetVisibleRows(inst);
  const flat=rvFlattenVisible(inst,rows);
  if(!flat.length)return;
  const idx=flat.findIndex(f=>f.item.id===inst.focusedRowId);
  if(e.key==='Enter'){
    if(idx>-1) rvHandleRowOpen(containerId,flat[idx].item.id);
    return;
  }
  let nextIdx=idx;
  if(e.key==='ArrowDown') nextIdx=idx<0?0:Math.min(idx+1,flat.length-1);
  if(e.key==='ArrowUp') nextIdx=idx<0?0:Math.max(idx-1,0);
  inst.focusedRowId=flat[nextIdx].item.id;
  rvRenderInstance(containerId);
  const rowEl=document.getElementById(containerId+'-scroll').querySelector('tr.focused');
  if(rowEl) rowEl.scrollIntoView({block:'nearest'});
}

// ══════════════════════════════════════════════
// CANONICAL LAYOUT: DETAIL VIEW — the drill-down endpoint for one single
// Row View item. Shows every field on that one record as a plain
// label/value list, plus — if the record itself has children (e.g.
// "Design review" has its own sub-tasks) — those children rendered as
// their own small Row View underneath, since a detail's own sub-items are
// themselves a row/column list, just scoped to one parent instead of the
// whole table.
//
// INSTANCE-BASED (added 2026-08-06, same reasoning as Row View above) —
// dvCreate(containerId, columns, rows) creates one instance keyed by the
// id of the element it mounts into. Any number of Detail View instances
// can be alive at once — the standalone page-4 one, plus e.g. one living
// inside a Popup. dvOpenForInstance(containerId, itemId) populates a
// given instance with one specific record and re-renders it.
//
// Genuinely open, not built yet: a child row inside a Detail View's own
// nested list isn't itself double-click-drillable one level deeper — this
// only goes one layer deep (item → its direct children) for now.
// ══════════════════════════════════════════════
const dvInstances=new Map(); // containerId -> {currentId,columns,rows}

function dvCreate(containerId,columns,rows){
  dvInstances.set(containerId,{currentId:null,columns,rows});
  dvRenderInstance(containerId);
}

function dvFindItem(id,rows){
  for(const r of rows){
    if(r.id===id) return r;
    if(r.children){ const found=dvFindItem(id,r.children); if(found) return found; }
  }
  return null;
}

function dvOpenForInstance(containerId,itemId){
  const inst=dvInstances.get(containerId);if(!inst)return;
  inst.currentId=itemId;
  dvRenderInstance(containerId);
}

// Legacy wrapper — kept so the original page-level call, dvOpenFor(id) (the
// page-4 standalone Detail View, and Row View's default fallback), keeps
// working exactly as before.
function dvOpenFor(id){
  dvOpenForInstance('dv-mount',id);
  openPage(4);
}

function dvRenderInstance(containerId){
  const wrap=document.getElementById(containerId);
  const inst=dvInstances.get(containerId);
  if(!wrap||!inst)return;
  const item=inst.currentId?dvFindItem(inst.currentId,inst.rows):null;
  if(!item){
    wrap.innerHTML=`<div class="dv-empty">No item selected yet — double-click any row in Row View to open its detail here.</div>`;
    return;
  }
  const fieldsHtml=inst.columns.map(c=>`
    <div class="dv-label">${c.label}</div>
    <div class="dv-value">${item[c.key]||'—'}</div>`).join('');
  let childrenHtml='';
  if(item.children&&item.children.length){
    childrenHtml=`<div class="dv-sub-h">Items under this one</div>
      <div class="rv-table-wrap" style="max-width:760px"><table class="rv-table">
        <thead><tr><th style="width:24px"></th>${inst.columns.map(c=>`<th style="cursor:default">${c.label}</th>`).join('')}</tr></thead>
        <tbody>${item.children.map(c=>`<tr class="rv-row" ondblclick="dvOpenForInstance('${containerId}','${c.id}')"><td></td>${inst.columns.map(col=>`<td>${c[col.key]||''}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div>`;
  }
  wrap.innerHTML=`<div class="dv-fields">${fieldsHtml}</div>${childrenHtml}`;
}

// ══════════════════════════════════════════════
// CANONICAL DESTINATION: POPUP — NOT a layout type. A destination, same
// category as "Page N" or "a tab slot inside a Tabbed View" (see
// NOMENCLATURE above). Popup is content-agnostic — it hosts whatever
// layout instance is mounted inside it and has no opinion about what that
// is. popupOpen(innerHtml) shows the overlay with whatever HTML it's
// given; the caller is responsible for creating any layout instance
// (rvCreate/dvCreate/etc.) mounted inside that HTML afterward, exactly
// the same as buildPlaceholders does for a page or a tab slot.
// ══════════════════════════════════════════════
function popupOpen(innerHtml){
  let modal=document.getElementById('canonicalPopup');
  if(!modal){
    modal=document.createElement('div');
    modal.id='canonicalPopup';
    modal.className='popup-overlay';
    document.body.appendChild(modal);
    modal.addEventListener('click',(e)=>{ if(e.target===modal) popupClose(); });
  }
  modal.innerHTML=`<div class="popup-card" id="canonicalPopupCard">
    <div class="popup-close-btn" onclick="popupClose()">CLOSE ✕</div>
    ${innerHtml}
  </div>`;
  modal.style.display='flex';
}

function popupClose(){
  const modal=document.getElementById('canonicalPopup');
  if(modal) modal.style.display='none';
}

// ══════════════════════════════════════════════
// CANONICAL DATA BINDING: TABLE PICKER — added 2026-08-06, Ryan's direct
// instruction. A third concern, separate from LAYOUT and DESTINATION:
// WHERE THE DATA COMES FROM. Bridges a real Supabase table to a layout
// instance — Row View today; the same pattern generalizes to other
// layouts later without changing this piece. Flow: introspect the
// table's real columns from one live sample row (no service-role key
// needed — this runs off the same public anon key already in this file,
// the same access any signed-in user already has), suggest a sensible
// default subset, show a checklist in a Popup so whoever is building the
// page can add to or subtract from that suggestion, then fetch the real
// rows for exactly the columns confirmed and hand off to rvCreate.
// tableToRowView(containerId, tableName) works against ANY real Supabase
// table — nothing here is specific to one project's schema.
//
// SUGGESTION HEURISTIC (a rule, not a per-table guess — applies the same
// way no matter which table gets bound, so it can never drift table to
// table): a field is suggested (pre-checked) UNLESS it is `id`, ends in
// `_id` or `_at`, is named `is_sample`/`sort_order`, or its live sample
// value is an array or nested object. Everything else defaults on.
// ══════════════════════════════════════════════
async function tableIntrospect(tableName){
  const res=await fetch(`${SB_URL}/rest/v1/${tableName}?select=*&limit=1`,{
    headers:{apikey:SB_KEY,Accept:'application/json'}
  });
  if(!res.ok) throw new Error(`Could not read table "${tableName}" (${res.status})`);
  const sampleRows=await res.json();
  const sample=sampleRows[0]||{};
  return Object.keys(sample).map(key=>({
    key,
    label:key.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),
    suggested:!(key==='id'||key.endsWith('_id')||key.endsWith('_at')||key==='is_sample'||key==='sort_order'||Array.isArray(sample[key])||(sample[key]!==null&&typeof sample[key]==='object'))
  }));
}

function tableToRowView(containerId,tableName,opts={}){
  tableIntrospect(tableName).then(fields=>{
    const suggested=fields.filter(f=>f.suggested);
    const rest=fields.filter(f=>!f.suggested);
    const fieldRowHtml=(f,pre)=>`<label style="display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:13px;cursor:pointer">
      <input type="checkbox" data-key="${f.key}" data-label="${f.label}" ${pre?'checked':''}>
      ${f.label} <span style="color:rgba(240,232,208,.35);font-size:11px">(${f.key})</span>
    </label>`;
    popupOpen(`
      <div class="dv-sub-h">Choose columns for "${tableName}"</div>
      <div style="color:rgba(240,232,208,.6);font-size:12px;margin-bottom:14px">Suggested columns are pre-checked. Add or remove any field below, then confirm.</div>
      <div id="tablePickerSuggested">${suggested.map(f=>fieldRowHtml(f,true)).join('')}</div>
      ${rest.length?`<div class="dv-sub-h" style="margin-top:16px">Other available fields</div><div id="tablePickerRest">${rest.map(f=>fieldRowHtml(f,false)).join('')}</div>`:''}
      <div style="margin-top:20px">
        <button onclick="tableToRowViewConfirm('${containerId}','${tableName}')" style="background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.5);color:var(--gold2);padding:9px 18px;border-radius:7px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.06em">CONFIRM COLUMNS →</button>
      </div>
    `);
    window._tablePickerOpts=opts; // stashed here for the confirm handler below — this popup is single-instance, same as the sync modal
  }).catch(err=>{
    popupOpen(`<div class="dv-empty">Could not load "${tableName}": ${err.message}</div>`);
  });
}

async function tableToRowViewConfirm(containerId,tableName){
  const modal=document.getElementById('canonicalPopupCard');
  const checked=[...modal.querySelectorAll('input[type=checkbox]:checked')];
  if(!checked.length)return;
  const columns=checked.map(cb=>({key:cb.dataset.key,label:cb.dataset.label}));
  const selectKeys=Array.from(new Set(['id',...columns.map(c=>c.key)])); // always fetch id, even if not shown — Row View needs it for row identity
  const res=await fetch(`${SB_URL}/rest/v1/${tableName}?select=${selectKeys.join(',')}&limit=200`,{
    headers:{apikey:SB_KEY,Accept:'application/json'}
  });
  const rows=await res.json();
  popupClose();
  const opts=window._tablePickerOpts||{};
  rvCreate(containerId,columns,rows,opts);
}

// ══════════════════════════════════════════════
// CANONICAL LAYOUT: CALENDAR VIEW — added 2026-08-06, Ryan's direct
// instruction. A plain month-grid calendar: header with month/year title
// and prev/next navigation, a day-of-week row, and a 7-column grid
// showing every day of the month plus the leading/trailing days of the
// adjacent months (dimmed, clickable — no blank cells, same convention
// the Hub's own calendar uses). Deliberately stripped down from the
// Hub's calendar (amit-hub.html): no task chips, no filters, no overdue
// banner, no Hebrew/sacred calendar layers — Ryan's own words: "leave
// out all of the filtering abilities... and the overdues and stuff. I
// just need that calendar to show up." Restyled to this template's
// gold/navy palette rather than the Hub's black theme.
//
// INSTANCE-BASED, same pattern as Row View/Detail View — cvCreate(
// containerId) creates one instance keyed by its mount element id, with
// its own independent year/month state, so more than one Calendar View
// could exist on screen at once without interfering with another.
//
// Genuinely open, not built yet: no real event data — this is the bare
// grid only. Wiring it to real dates/events (e.g. via the Table Picker
// pattern above, or a plain rows array) is separate future work, the
// same way Row View started with sample data before real binding existed.
// ══════════════════════════════════════════════
const cvInstances=new Map(); // containerId -> {year,month}
// cvActiveContainers — added 2026-08-06, Ryan's direct instruction:
// pursuits must be scoped to whoever is actually signed in, the same way
// they are in the Hub, not shown globally regardless of login. This set
// tracks every live Calendar View instance so the LOGIN CONNECTION code
// further down (db.auth.onAuthStateChange) can re-fetch every one of
// them the moment someone signs in or out — see the call there.
const cvActiveContainers=new Set();
const CV_MONTH_NAMES=['January','February','March','April','May','June','July','August','September','October','November','December'];
const CV_DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function cvCreate(containerId){
  const now=new Date();
  cvInstances.set(containerId,{year:now.getFullYear(),month:now.getMonth(),entries:[]});
  cvActiveContainers.add(containerId);
  cvRenderInstance(containerId);
  cvLoadEntries(containerId);
}

function cvRenderInstance(containerId){
  const wrap=document.getElementById(containerId);
  const inst=cvInstances.get(containerId);
  if(!wrap||!inst)return;
  const{year,month}=inst;
  const firstDow=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const prevDaysInMonth=new Date(year,month,0).getDate();
  const prevM=month===0?11:month-1, prevY=month===0?year-1:year;
  const nextM=month===11?0:month+1, nextY=month===11?year+1:year;
  const today=new Date();
  const isCurrentMonth=today.getFullYear()===year&&today.getMonth()===month;

  let cellsHtml='';
  for(let i=firstDow-1;i>=0;i--){
    const d=prevDaysInMonth-i;
    cellsHtml+=`<div class="cv-cell adj" onclick="cvAdjClick('${containerId}',${prevY},${prevM})"><div class="cv-daynum">${d}</div></div>`;
  }
  for(let d=1;d<=daysInMonth;d++){
    const isToday=isCurrentMonth&&d===today.getDate();
    const ds=`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEntries=(inst.entries||[]).filter(e=>e.due_date===ds);
    const chipsHtml=dayEntries.map(e=>`<div class="cv-chip${e._isDemo?' cv-chip-demo':''}" title="${(e._isDemo?"Amit's demo pursuit — ":'')+(e.title||'').replace(/"/g,'&quot;')}" onclick="event.stopPropagation();cvOpenEntryById('${e.id}')">${e._isDemo?'✦ ':''}${e.title||''}</div>`).join('');
    // Double-click a real day cell opens that exact date in Day View —
    // added 2026-08-06, Ryan's direct instruction: Day View "would
    // definitely link up to the monthly calendar." Both a single click
    // and a double-click open Day View here — added 2026-08-06, Ryan's
    // further instruction: "if they select a day or double click a day
    // like it should be, should open up the day view." The Hub itself
    // treats single-click as "select" (which opens a side detail panel)
    // and double-click as the full zoom; this template has no separate
    // side panel to select into, so both interactions lead straight to
    // Day View. Adjacent-month cells (above/below) keep their existing
    // single-click month-jump behavior and deliberately don't get this —
    // they're not "this month's" days.
    cellsHtml+=`<div class="cv-cell${isToday?' today':''}" onclick="cvOpenDayView('${ds}')" ondblclick="cvOpenDayView('${ds}')"><div class="cv-daynum">${d}</div>${chipsHtml}</div>`;
  }
  // Always fill to a full 6-row (42-cell) grid, same convention as the
  // Hub's own calendar, so the layout never jumps between 5 and 6 rows
  // as the month changes.
  const totalSoFar=firstDow+daysInMonth;
  const trailing=42-totalSoFar;
  for(let d=1;d<=trailing;d++){
    cellsHtml+=`<div class="cv-cell adj" onclick="cvAdjClick('${containerId}',${nextY},${nextM})"><div class="cv-daynum">${d}</div></div>`;
  }

  wrap.innerHTML=`
    <div class="cv-nav-row">
      <div class="cv-nav-btn" onclick="cvPrev('${containerId}')">◄</div>
      <div class="cv-month-title">${CV_MONTH_NAMES[month]} ${year}</div>
      <div class="cv-nav-btn" onclick="cvNext('${containerId}')">►</div>
    </div>
    <div class="cv-dow-row">${CV_DOW.map(d=>`<div class="cv-dow">${d}</div>`).join('')}</div>
    <div class="cv-grid">${cellsHtml}</div>
  `;
}

// LIVE PURSUITS — added 2026-08-06, Ryan's direct instruction: "these are
// all still gonna be connected together." Queries the real hub_entries
// table (same one proven working by the Table Picker above) for
// outstanding pursuits due within the visible month, mirroring the Hub's
// own aimsForDay() filter exactly: kind is 'pursuit', not done, due date
// matches. Runs off the same public anon key already in this file — no
// extra auth needed. Re-fetches on every month change (cvPrev/cvNext/
// cvAdjClick) rather than caching a wide range, kept simple for now.
async function cvLoadEntries(containerId){
  const inst=cvInstances.get(containerId);if(!inst)return;
  const{year,month}=inst;
  // Stamp this call with the month it's for and only apply the result if
  // that's still the visible month when the fetch resolves — guards
  // against a real race: clicking Next twice quickly fires two fetches,
  // and without this check an OLDER request resolving AFTER a newer one
  // would silently overwrite the correct month's chips with stale (often
  // empty) data.
  const requestYear=year,requestMonth=month;
  const startDs=`${year}-${String(month+1).padStart(2,'0')}-01`;
  const lastDay=new Date(year,month+1,0).getDate();
  const endDs=`${year}-${String(month+1).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  let ownEntries=[];
  // Scoped to whoever's actually signed in — added 2026-08-06, Ryan's
  // direct instruction: "linked to the login... just like it operates
  // within the Hub." Without currentUser (nobody signed in), there is no
  // legitimate account whose pursuits these would be, so the user's own
  // side shows none — not an error, just the honest empty state.
  if(currentUser){
    try{
      const res=await fetch(`${SB_URL}/rest/v1/hub_entries?select=id,title,due_date,priority,program&kind=eq.pursuit&done=eq.false&user_id=eq.${currentUser.id}&due_date=gte.${startDs}&due_date=lte.${endDs}&order=due_date.asc`,{
        headers:{apikey:SB_KEY,Accept:'application/json'}
      });
      ownEntries=res.ok?await res.json():[];
    }catch(e){
      ownEntries=[];
    }
  }
  // DEMO MODE — via the shared fetchDemoRows() helper (CANONICAL DATA
  // BINDING: DEMO MODE, near PAGE_COUNT), not a one-off inline fetch —
  // added 2026-08-06, Ryan's direct correction: this connection must work
  // the same way for any current or future view, not be re-wired per
  // view. Returns [] on its own if demo mode is off.
  const demoEntries=await fetchDemoRows('hub_entries',`select=id,title,due_date,priority,program&kind=eq.pursuit&done=eq.false&due_date=gte.${startDs}&due_date=lte.${endDs}&order=due_date.asc`);
  const stillCurrent=inst.year===requestYear&&inst.month===requestMonth;
  if(!stillCurrent)return; // a newer request has already superseded this one
  inst.entries=[...demoEntries,...ownEntries];
  inst.entries.forEach(e=>{window._cvEntries[e.id]=e;});
  cvRenderInstance(containerId);
}

// Chip click opens that pursuit's fields in a Detail View inside a
// Popup — reusing the same canonical DESTINATION/LAYOUT pieces already
// built (see CANONICAL DESTINATION: POPUP and CANONICAL LAYOUT: DETAIL
// VIEW above), not a new mechanism. Looked up by id from a global map
// (window._cvEntries) rather than serializing the whole object into an
// inline onclick string.
window._cvEntries={};
function cvOpenEntryById(id){
  const entry=window._cvEntries[id];
  if(!entry)return;
  popupOpen(`<div class="dv-wrap" id="popup-cv-dv-mount" style="margin:0"></div>`);
  const cols=[{key:'title',label:'Title'},{key:'due_date',label:'Due Date'},{key:'priority',label:'Priority'},{key:'program',label:'Program'}];
  dvCreate('popup-cv-dv-mount',cols,[entry]);
  dvOpenForInstance('popup-cv-dv-mount',entry.id);
}

function cvPrev(containerId){
  const inst=cvInstances.get(containerId);if(!inst)return;
  inst.month--; if(inst.month<0){inst.month=11;inst.year--;}
  cvRenderInstance(containerId);
  cvLoadEntries(containerId);
}
function cvNext(containerId){
  const inst=cvInstances.get(containerId);if(!inst)return;
  inst.month++; if(inst.month>11){inst.month=0;inst.year++;}
  cvRenderInstance(containerId);
  cvLoadEntries(containerId);
}
function cvAdjClick(containerId,year,month){
  const inst=cvInstances.get(containerId);if(!inst)return;
  inst.year=year; inst.month=month;
  cvRenderInstance(containerId);
  cvLoadEntries(containerId);
}

// correction: the first version was a reinterpretation (a Row View table
// under a plain header) instead of an actual copy of the Hub's real
// day-view card. This version ports the Hub's real markup and CSS
// (amit-hub.html's .cal-dv-* classes, buildDvAdjCell/renderDayView)
// directly: a cream card with the day's big number top-left, a
// muted/dimmed preview card for the previous and next day on either
// side (click to jump), a Pursuits section, and Record Testimony /
// Calendar buttons along the bottom.
//
// DELIBERATELY LEFT OUT, per Ryan's earlier instruction to drop Hebrew
// elements: the Hebrew day/month/year block, feast/Shabbat chips, the
// Word-for-Today devotional teaser (Amit's own religious content, not
// generic template material), and the weather widget (needs an API key
// this template doesn't have). The Daily Walk button and Add Reflection
// link ARE ported for visual fidelity to the reference screenshot, but
// are inert placeholders here (disabled/no handler) — same honesty
// standard as every other placeholder page in this template. Pursuits
// and the Calendar return button are real and fully wired.
//
// INSTANCE-BASED, same pattern as every other layout here.
// ══════════════════════════════════════════════
const dayViewInstances=new Map(); // containerId -> {date:'YYYY-MM-DD', entries:[]}

function _todayStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function _dvFmtDs(dt){
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}

function dayViewCreate(containerId,ds){
  dayViewInstances.set(containerId,{date:ds||_todayStr(),entries:[]});
  dayViewRenderInstance(containerId);
  dayViewLoadEntries(containerId);
}

function dayViewRenderInstance(containerId){
  const wrap=document.getElementById(containerId);
  const inst=dayViewInstances.get(containerId);
  if(!wrap||!inst)return;
  const[y,m,d]=inst.date.split('-').map(Number);
  const dt=new Date(y,m-1,d);
  const isToday=inst.date===_todayStr();
  const prevDs=_dvFmtDs(new Date(y,m-1,d-1));
  const nextDs=_dvFmtDs(new Date(y,m-1,d+1));
  const DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  const countFor=(ds)=>(inst.entries||[]).filter(e=>e.due_date===ds).length;
  const adjCardHtml=(ds,direction)=>{
    const[ay,am,ad]=ds.split('-').map(Number);
    const adt=new Date(ay,am-1,ad);
    const cnt=countFor(ds);
    return `<div class="cal-dv-adj" onclick="dayViewGoTo('${containerId}','${ds}')">
      <div class="cal-dv-adj-arrow">${direction<0?'← Previous':'Next →'}</div>
      <div class="cal-dv-adj-top"><div class="cal-dv-adj-greg">${ad}</div></div>
      <div class="cal-dv-adj-dayname">${DAY_NAMES[adt.getDay()].slice(0,3).toUpperCase()} · ${CV_MONTH_NAMES[am-1].slice(0,3).toUpperCase()}</div>
      <div class="cal-dv-adj-aims">${cnt?cnt+' Pursuit'+(cnt>1?'s':''):' '}</div>
    </div>`;
  };

  const dayEntries=(inst.entries||[]).filter(e=>e.due_date===inst.date);
  const pursuitRowsHtml=dayEntries.length
    ? dayEntries.map(e=>`<div class="dv-aim-row${e._isDemo?' dv-aim-row-demo':''}"><div class="dv-aim-title" onclick="cvOpenEntryById('${e.id}')" title="${e._isDemo?"Amit's demo pursuit":''}">${e._isDemo?'✦ ':''}${(e.title||'').replace(/</g,'&lt;')}</div></div>`).join('')
    : `<div class="dv-aim-empty">Nothing set for this day yet.</div>`;

  wrap.innerHTML=`
    <div class="cal-dv-zoom-wrap">
      ${adjCardHtml(prevDs,-1)}
      <div class="cal-dv-main${isToday?' dv-today':''}">
        <div class="cal-dv-main-head">
          <div class="cal-dv-top">
            <div class="cal-dv-greg">
              <div class="cal-dv-greg-num">${d}</div>
              <div class="cal-dv-greg-day">${DAY_NAMES[dt.getDay()].toUpperCase()}</div>
              <div class="cal-dv-greg-month">${CV_MONTH_NAMES[m-1]} ${y}${isToday?' · Today':''}</div>
            </div>
          </div>
          <div class="cal-dv-main-divider"></div>
        </div>
        <div class="cal-dv-main-scroll">
          <button class="daily-walk-btn" disabled title="Not wired in this template — placeholder for visual parity with the Hub">☀ Daily Walk <span class="daily-walk-btn-icon">→</span></button>
          <div class="cal-dv-refl-trigger" style="cursor:default" title="Not wired in this template — placeholder for visual parity with the Hub">Add Your Reflection →</div>
          <div class="dv-section dv-section-pursuit">
            <div class="dv-sh">Pursuits</div>
            <div class="dv-sb">${pursuitRowsHtml}</div>
          </div>
          <div style="margin-top:4px;padding-top:12px;border-top:1px solid rgba(0,0,0,.08);display:flex;align-items:center;justify-content:space-between">
            <button class="cal-dv-testimony-btn" disabled title="Not wired in this template — placeholder for visual parity with the Hub">✦ Record a Testimony</button>
            <button class="cal-dv-month-return" onclick="openPage(6)" title="Return to calendar">← Calendar</button>
          </div>
        </div>
      </div>
      ${adjCardHtml(nextDs,1)}
    </div>
  `;
}

function dayViewGoTo(containerId,ds){
  const inst=dayViewInstances.get(containerId);if(!inst)return;
  inst.date=ds;
  dayViewRenderInstance(containerId);
  dayViewLoadEntries(containerId);
}

function dayViewNav(containerId,delta){
  const inst=dayViewInstances.get(containerId);if(!inst)return;
  const[y,m,d]=inst.date.split('-').map(Number);
  inst.date=_dvFmtDs(new Date(y,m-1,d+delta));
  dayViewRenderInstance(containerId);
  dayViewLoadEntries(containerId);
}

// LIVE PURSUITS for the selected day AND its two neighbors (one query
// covers all three, for the adjacent cards' pursuit-count labels) — same
// live hub_entries connection as Calendar View, scoped to whoever's
// signed in, same honest empty state when nobody is, same stale-request
// guard pattern (navigating days quickly shouldn't let an older request
// overwrite a newer one).
async function dayViewLoadEntries(containerId){
  const inst=dayViewInstances.get(containerId);if(!inst)return;
  const requestDate=inst.date;
  const[y,m,d]=requestDate.split('-').map(Number);
  const prevDs=_dvFmtDs(new Date(y,m-1,d-1));
  const nextDs=_dvFmtDs(new Date(y,m-1,d+1));
  let ownRows=[];
  if(currentUser){
    try{
      const res=await fetch(`${SB_URL}/rest/v1/hub_entries?select=id,title,due_date,priority,program&kind=eq.pursuit&done=eq.false&user_id=eq.${currentUser.id}&due_date=in.(${prevDs},${requestDate},${nextDs})`,{
        headers:{apikey:SB_KEY,Accept:'application/json'}
      });
      ownRows=res.ok?await res.json():[];
    }catch(e){
      ownRows=[];
    }
  }
  // DEMO MODE — via the shared fetchDemoRows() helper, same as Calendar
  // View (see CANONICAL DATA BINDING: DEMO MODE, near PAGE_COUNT).
  const demoRows=await fetchDemoRows('hub_entries',`select=id,title,due_date,priority,program&kind=eq.pursuit&done=eq.false&due_date=in.(${prevDs},${requestDate},${nextDs})`);
  const stillInst=dayViewInstances.get(containerId);
  if(!stillInst||stillInst.date!==requestDate)return; // a newer request has already superseded this one
  inst.entries=[...demoRows,...ownRows];
  inst.entries.forEach(e=>{window._cvEntries[e.id]=e;});
  dayViewRenderInstance(containerId);
}

// Double-clicking a real day cell in Calendar View opens that exact date
// in Day View — the link Ryan asked for between the two. This template
// has one Day View instance (page 17, mount id 'dayview-mount').
function cvOpenDayView(ds){
  if(dayViewInstances.has('dayview-mount')) dayViewGoTo('dayview-mount',ds);
  else dayViewCreate('dayview-mount',ds);
  openPage(17);
}

const BV_DETAIL_COLUMNS=[{key:'title',label:'Title'},{key:'owner',label:'Owner'},{key:'status',label:'Status'}];

const bvInstances=new Map();
function bvCreate(containerId,statuses,rows,opts={}){

function bvRenderInstance(containerId){

      <div class="bv-col-head">${status} (${cards.length})</div>
      <div class="bv-col-body">${cards.map(c=>`<div class="bv-card" draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${c.id}')" ondblclick="bvOpenCard('${containerId}','${c.id}')">${c.title}<div class="bv-card-owner">${c.owner}</div></div>`).join('')||'<div class="bv-card-owner" style="padding:6px 2px">No cards</div>'}</div>
    </div>`;

}
// Double-click a card — the drag/drop mechanic stays exactly as it was
// (that's the "already working" way, per Ryan's own words); this adds
// the second half he asked for: without navigating off the board, see
// what the card actually is. Opens a Detail View inside a Popup, reusing
// the same canonical DESTINATION/LAYOUT pieces already built for Row
// View's own popup demo — not a new mechanism. opts.onCardOpen(itemId)
// overrides this default for a real project that wants something else
// (a different page, a different popup layout, etc).
function bvOpenCard(containerId,itemId){
  const inst=bvInstances.get(containerId);if(!inst)return;
  if(inst.onCardOpen){ inst.onCardOpen(itemId); return; }
  popupOpen(`<div class="dv-wrap" id="popup-bv-dv-mount" style="margin:0"></div>`);
  dvCreate('popup-bv-dv-mount',BV_DETAIL_COLUMNS,inst.rows);
  dvOpenForInstance('popup-bv-dv-mount',itemId);
}
function bvDrop(e,containerId,status){
  e.preventDefault();
  const inst=bvInstances.get(containerId);if(!inst)return;
  document.querySelectorAll(`#${containerId} .bv-col`).forEach(el=>el.classList.remove('dragover'));
  const id=e.dataTransfer.getData('text/plain');
  const row=inst.rows.find(r=>r.id===id);
  if(row&&row.status!==status){
    row.status=status;
    if(inst.onStatusChange) inst.onStatusChange(id,status);
  }
  bvRenderInstance(containerId);
}

  {label:'Spiritual',value:4},{label:'Craft',value:7},{label:'Mission',value:2},{label:'Service',value:3}
]};
const CHV_SAMPLE_LINES={title:'Activity — This Week vs Last Week',series:[
  {name:'This Week',color:'var(--gold2)',points:[{label:'Mon',value:3},{label:'Tue',value:5},{label:'Wed',value:4},{label:'Thu',value:6},{label:'Fri',value:8}]},
  {name:'Last Week',color:'#6fa3c9',points:[{label:'Mon',value:2},{label:'Tue',value:3},{label:'Wed',value:5},{label:'Thu',value:4},{label:'Fri',value:5}]}
]};
function chvCreate(containerId,bars,lines){
  const wrap=document.getElementById(containerId);
  if(!wrap)return;
  const max=Math.max(1,...bars.data.map(d=>d.value));
  const barsHtml=`<div class="chv-section">
    <div class="chv-title">${bars.title}</div>
    <div class="chv-bars">${bars.data.map(d=>`<div class="chv-bar-col"><div class="chv-bar" style="height:${Math.max(6,(d.value/max)*100)}%" title="${d.label}: ${d.value}"></div><div class="chv-bar-label">${d.label}</div></div>`).join('')}</div>
  </div>`;

  // Simple SVG line chart — one shared x/y scale (one axis, per the
  // dataviz skill's #1 rule: never a dual-axis chart), thin 2px lines,
  // 4px rounded data-end dots, recessive gridlines.
  const w=560,h=130,pad=20;
  const allVals=lines.series.flatMap(s=>s.points.map(p=>p.value));
  const lmax=Math.max(1,...allVals);
  const stepX=(w-pad*2)/(lines.series[0].points.length-1);
  const toXY=(i,val)=>[pad+i*stepX,h-pad-(val/lmax)*(h-pad*1.5)];
  const gridHtml=[0,.5,1].map(f=>`<line class="chv-gridline" x1="${pad}" x2="${w-pad}" y1="${h-pad-f*(h-pad*1.5)}" y2="${h-pad-f*(h-pad*1.5)}"></line>`).join('');
  const seriesHtml=lines.series.map(s=>{
    const pts=s.points.map((p,i)=>toXY(i,p.value));
    const path=pts.map((pt,i)=>(i===0?'M':'L')+pt[0]+' '+pt[1]).join(' ');
    const dots=pts.map((pt,i)=>`<circle class="chv-point" cx="${pt[0]}" cy="${pt[1]}" r="4" fill="${s.color}"><title>${s.name} · ${s.points[i].label}: ${s.points[i].value}</title></circle>`).join('');
    return `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round"></path>${dots}`;
  }).join('');
  const labelsHtml=lines.series[0].points.map((p,i)=>{
    const[x]=toXY(i,0);
    return `<text x="${x}" y="${h-2}" font-size="9" fill="rgba(240,232,208,.5)" text-anchor="middle">${p.label}</text>`;
  }).join('');

  const linesHtml=`<div class="chv-section">
    <div class="chv-title">${lines.title}</div>
    <div class="chv-legend">${lines.series.map(s=>`<span class="chv-legend-item"><span class="chv-legend-swatch" style="background:${s.color}"></span>${s.name}</span>`).join('')}</div>
    <svg class="chv-line-svg" viewBox="0 0 ${w} ${h}">${gridHtml}${seriesHtml}${labelsHtml}</svg>
  </div>`;

  wrap.innerHTML=barsHtml+linesHtml;
}

const ibvInstances=new Map();
function ibvCreate(containerId,rows,opts={}){
  ibvInstances.set(containerId,{rows,selected:new Set(),onBatchAction:opts.onBatchAction||null});
  ibvRenderInstance(containerId);
}
function ibvRenderInstance(containerId){
  const wrap=document.getElementById(containerId);
  const inst=ibvInstances.get(containerId);
  if(!wrap||!inst)return;
  const n=inst.selected.size;
  wrap.innerHTML=`
    <div class="ibv-toolbar">
      <span>${n?`${n} selected`:'No items selected'}</span>
      <button ${n?'':'disabled'} onclick="ibvBatch('${containerId}','markRead')">Mark Read</button>
      <button ${n?'':'disabled'} onclick="ibvBatch('${containerId}','delete')">Delete</button>
    </div>
    <div class="ibv-list">${inst.rows.map(r=>`
      <div class="ibv-item${r.read?'':' unread'}" onclick="ibvOpen('${containerId}','${r.id}')">
        <input class="ibv-item-check" type="checkbox" ${inst.selected.has(r.id)?'checked':''} onclick="event.stopPropagation();ibvToggleSelect('${containerId}','${r.id}')">

      </div>`).join('')||'<div class="ibv-item-sub" style="padding:14px">Inbox is empty</div>'}</div>`;
}
function ibvToggleSelect(containerId,id){
  const inst=ibvInstances.get(containerId);if(!inst)return;
  if(inst.selected.has(id)) inst.selected.delete(id); else inst.selected.add(id);
  ibvRenderInstance(containerId);
}
function ibvOpen(containerId,id){
  const inst=ibvInstances.get(containerId);if(!inst)return;
  const row=inst.rows.find(r=>r.id===id);
  if(row) row.read=true;
  ibvRenderInstance(containerId);
}
function ibvBatch(containerId,action){
  const inst=ibvInstances.get(containerId);if(!inst||!inst.selected.size)return;
  const ids=Array.from(inst.selected);
  if(action==='markRead') ids.forEach(id=>{const r=inst.rows.find(x=>x.id===id);if(r)r.read=true;});
  if(action==='delete') inst.rows=inst.rows.filter(r=>!inst.selected.has(r.id));
  if(inst.onBatchAction) inst.onBatchAction(action,ids);
  inst.selected=new Set();
  ibvRenderInstance(containerId);
}

  {id:'t1',name:'📁 Amit System',children:[
    {id:'t1a',name:'📁 Hub',children:[
      {id:'t1a1',name:'📄 amit-hub.html'},

    {id:'t2b',name:'📄 CLAUDE.md'}
  ]},
  {id:'t3',name:'📄 Amit_Testimony.md'}
];
const tvInstances=new Map();
function tvCreate(containerId,rows,opts={}){
  tvInstances.set(containerId,{rows,expanded:new Set(),selectedId:null,onNodeOpen:opts.onNodeOpen||null});
  tvRenderInstance(containerId);
}
function tvRenderInstance(containerId){
  const wrap=document.getElementById(containerId);
  const inst=tvInstances.get(containerId);
  if(!wrap||!inst)return;
  const nodeHtml=(r)=>{
    const hasKids=r.children&&r.children.length;
    const expanded=inst.expanded.has(r.id);
    let html=`<div class="tv-node${inst.selectedId===r.id?' selected':''}" onclick="tvSelect('${containerId}','${r.id}')">
      ${hasKids?`<span class="tv-toggle" onclick="event.stopPropagation();tvToggle('${containerId}','${r.id}')">${expanded?'▾':'▸'}</span>`:`<span class="tv-toggle"><span class="tv-leaf-dot"></span></span>`}
      ${r.name||r.title}
    </div>`;
    if(hasKids&&expanded) html+=`<div style="margin-left:22px">${r.children.map(nodeHtml).join('')}</div>`;
    return html;
  };
  wrap.innerHTML=inst.rows.map(nodeHtml).join('');
}
function tvToggle(containerId,id){
  const inst=tvInstances.get(containerId);if(!inst)return;
  if(inst.expanded.has(id)) inst.expanded.delete(id); else inst.expanded.add(id);
  tvRenderInstance(containerId);
}
// Clicking a row with children expands/collapses it (same as clicking its
// ▸/▾ toggle directly) — it does NOT open Detail View, since a folder-type
// node has no single record to show. Only a LEAF row (no children) opens
// Detail View / onNodeOpen. Fixed 2026-08-06, Ryan's direct correction:
// every row was calling onNodeOpen regardless of hasKids, so clicking a
// folder immediately jumped to Detail View instead of expanding it —
// exactly backwards from how a real file tree behaves.
function tvFindNode(id,rows){
  for(const r of rows){
    if(r.id===id) return r;
    if(r.children){ const found=tvFindNode(id,r.children); if(found) return found; }
  }
  return null;
}
function tvSelect(containerId,id){
  const inst=tvInstances.get(containerId);if(!inst)return;
  const node=tvFindNode(id,inst.rows);
  if(node&&node.children&&node.children.length){
    tvToggle(containerId,id);
    return;
  }
  inst.selectedId=id;
  tvRenderInstance(containerId);
  if(inst.onNodeOpen) inst.onNodeOpen(id); else dvOpenFor(id);
}

// CANONICAL LAYOUT: BREADCRUMB VIEW — chained drill-down navigation
// (summary → records → single record) with a visible breadcrumb trail
// and an "Open Pages" history rail, added 2026-08-06, per AmitBooks'
// General Journal pattern (see Templates\CLAUDE.md reference). Distinct
// from Detail View, which only drills one level from a Row View — this
// tracks an arbitrary-depth path and lets you jump back to any prior
// step, both via the trail and via the rail's full visit history.
// bcvCreate(containerId, rootLabel, rootItems). Each item may itself have
// children[] to drill into further, or fields to show as a final record.
// ══════════════════════════════════════════════
const BCV_SAMPLE_ROOT=[
  {id:'p1',name:'Q3 Pursuits',children:[
    {id:'p1a',name:'Design review',status:'In Progress',owner:'Amit'},
    {id:'p1b',name:'Backend wiring',status:'Not Started',owner:'Ryan'}
  ]},
  {id:'p2',name:'Q4 Pursuits',children:[
    {id:'p2a',name:'Launch',status:'Not Started',owner:'Ryan'}
  ]}
];
const bcvInstances=new Map();
function bcvCreate(containerId,rootLabel,rootItems){
  bcvInstances.set(containerId,{rootLabel,rootItems,path:[{label:rootLabel,items:rootItems}],history:[]});
  bcvRenderInstance(containerId);
}
function bcvRenderInstance(containerId){
  const wrap=document.getElementById(containerId);
  const inst=bcvInstances.get(containerId);
  if(!wrap||!inst)return;
  const current=inst.path[inst.path.length-1];
  const trailHtml=inst.path.map((step,idx)=>{
    const isLast=idx===inst.path.length-1;
    return (idx>0?'<span class="bcv-trail-sep">›</span>':'')+`<span class="bcv-trail-item" ${isLast?'':`onclick="bcvJumpTo('${containerId}',${idx})"`}>${step.label}</span>`;
  }).join('');
  const listHtml=current.items.map(item=>{
    const hasKids=item.children&&item.children.length;
    const fieldsPreview=Object.keys(item).filter(k=>!['id','name','children'].includes(k)).map(k=>`${k}: ${item[k]}`).join(' · ');
    return `<div class="bcv-list-item" onclick="bcvDrill('${containerId}','${item.id}')">${item.name}${hasKids?' →':fieldsPreview?' — '+fieldsPreview:''}</div>`;
  }).join('')||'<div class="bcv-list-item" style="cursor:default">Nothing here</div>';
  const railHtml=inst.history.length
    ? inst.history.slice().reverse().map((h,idx)=>`<div class="bcv-rail-item" onclick="bcvJumpTo('${containerId}',${inst.history.length-1-idx})">${h}</div>`).join('')
    : '<div class="bcv-rail-item" style="cursor:default">No history yet</div>';
  wrap.innerHTML=`<div class="bcv-main"><div class="bcv-trail">${trailHtml}</div><div>${listHtml}</div></div>
    <div class="bcv-rail"><div class="bcv-rail-title">Open Pages</div>${railHtml}</div>`;
}
function bcvDrill(containerId,itemId){
  const inst=bcvInstances.get(containerId);if(!inst)return;
  const current=inst.path[inst.path.length-1];
  const item=current.items.find(i=>i.id===itemId);if(!item)return;
  if(item.children&&item.children.length){
    inst.path.push({label:item.name,items:item.children});
  } else {
    inst.path.push({label:item.name,items:[item]});
  }
  inst.history.push(item.name);
  bcvRenderInstance(containerId);
}
function bcvJumpTo(containerId,pathIdx){
  const inst=bcvInstances.get(containerId);if(!inst)return;
  inst.path=inst.path.slice(0,pathIdx+1);
  bcvRenderInstance(containerId);
}

// Tabbed-layout behavior (copied from Computer Health's showTab — folder-tab
// look, sub-content switching within one detail area — no data hooks
// attached). Multi-row overflow, Ryan's spec 2026-08-04: the tab row grows
// as many rows behind itself as it needs (plain CSS flex-wrap, see
// .ch-tab-nav) rather than scrolling or truncating. Selecting a tab that
// isn't in the front row brings its WHOLE row forward — every tab that
// currently shares its wrapped line moves to the end of the row's source
// order, and since flex-wrap always fills top-to-bottom in source order,
// that group becomes the last (front, touching the content) row while the
// previously-front row shifts back. Classic multi-row property-sheet
// behavior — same idea as old Windows tabbed dialogs.
function showChTab(detailNum,n){
  const detail=document.getElementById('detail-'+detailNum);
  const clickedBtn=event.target;
  const tabNav=document.getElementById('ch-tab-nav-'+detailNum);
  if(tabNav){
    // Two real bugs fixed 2026-08-06, Ryan's direct correction, both
    // stemming from the same row-promotion logic below (intended ONLY
    // for when tabs wrap into multiple rows — see .ch-tab-nav's CSS
    // comment):
    // (1) It ran unconditionally on every click, even with a single row
    //     of tabs that never wraps — reshuffling tabs that had no reason
    //     to move at all.
    // (2) .ch-tab-btn.active has a different margin-top than inactive
    //     tabs (see CSS), which shifts ITS OWN offsetTop just enough
    //     that exact-equality matching (`b.offsetTop===rowTop`) treated
    //     the currently-active tab as being in a "different row" from
    //     its own single-row siblings — silently excluding it from the
    //     reorder while shuffling everything else, which is exactly what
    //     made tab 1 become unreachable and tab 5 land in the wrong slot.
    // Fix: only run the reorder at all when tabs have genuinely wrapped
    // (tabNav is taller than ~1.5 rows), and use a tolerance instead of
    // exact equality when grouping a row, so the active tab's own margin
    // quirk can't misclassify it as a separate row.
    const wrapped=tabNav.scrollHeight>clickedBtn.offsetHeight*1.5;
    if(wrapped){
      const rowTop=clickedBtn.offsetTop;
      Array.from(tabNav.children)
        .filter(b=>Math.abs(b.offsetTop-rowTop)<15)
        .forEach(b=>tabNav.appendChild(b)); // re-append in place → moves this row's tabs to the end of source order
    }
  }
  detail.querySelectorAll('.ch-tab-content').forEach(c=>c.classList.remove('active'));
  detail.querySelectorAll('.ch-tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('ch-tab-'+detailNum+'-'+n).classList.add('active');
  clickedBtn.classList.add('active');
}

function openPage(n){
  document.querySelectorAll('.page-nav').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.detail').forEach(p=>p.classList.remove('active'));
  const page=document.getElementById('page-'+n);
  const detail=document.getElementById('detail-'+n);
  if(page)page.classList.add('active');
  if(detail)detail.classList.add('active');
}

// pattern as the Hub's real toggleHubDemo()/updateHubDemoBtn(). Refreshes
// every live Calendar View and Day View instance so the change is visible
// immediately, not just on next load.
function toggleDemoMode(){
  demoMode=!demoMode;
  localStorage.setItem('amit_demo_mode',demoMode?'on':'off');
  _updateDemoUI();
  cvActiveContainers.forEach(id=>cvLoadEntries(id));
  dayViewInstances.forEach((inst,id)=>dayViewLoadEntries(id));
}

function _updateDemoUI(){
  const icon=document.getElementById('rail-demo-icon');
  const item=document.getElementById('rail-demo');
  const name=document.getElementById('rail-demo-name');
  const sub=document.getElementById('rail-demo-sub');
  if(!item)return;
  if(demoMode){
    icon.style.opacity='1';name.textContent='Demo On';sub.textContent="Amit's Data Shown";
    item.dataset.tip='Demo On';item.title="Showing Amit's demo data — click to use your own";
  } else {
    icon.style.opacity='.4';name.textContent='Demo Off';sub.textContent='Your Data Only';
    item.dataset.tip='Demo Off';item.title='Demo mode off — showing your own data';
  }
}

async function sendMagicLink(email){
  if(!db)return'Database not available';
  const{error}=await db.auth.signInWithOtp({email});
  return error?error.message:null;
}

function openSyncModal(){
  if(currentUser){if(confirm('Signed in as '+currentUser.email+'\n\nSign out?'))signOutAmit();return;}
  const m=document.getElementById('syncModal');if(!m)return;
  m.style.display='flex';
}
function closeSyncModal(){const m=document.getElementById('syncModal');if(m)m.style.display='none';}
async function submitSyncEmail(){
  const email=document.getElementById('syncEmailInput').value.trim();if(!email)return;
  const btn=document.getElementById('syncSubmitBtn');btn.textContent='Sending…';btn.disabled=true;
  const err=await sendMagicLink(email);
  if(err){btn.textContent='Try again';btn.disabled=false;}
  else{
    document.querySelector('#syncModal .sync-modal-card').innerHTML=`
      <div style="color:rgba(201,168,76,.9);font-family:'Cinzel',serif;font-size:17px;margin-bottom:14px">Link sent</div>
      <div style="color:rgba(240,232,208,.7);font-size:13px;line-height:1.7">Check your email.<br>Click the link to sign in.</div>
      <div onclick="closeSyncModal()" style="margin-top:20px;font-size:10px;color:rgba(240,232,208,.35);cursor:pointer;letter-spacing:.08em">CLOSE</div>`;
  }
}

// ══════════════════════════════════════════════
// CLOCK / GREETING — visual only, no data behind it
// ══════════════════════════════════════════════
// Same localStorage key the Hub uses (same origin, shared automatically) -
// this is how any page recognizes who's signed in and greets them by name.
const AMIT_NAME_KEY='amit_user_name';
function getUserName(){return localStorage.getItem(AMIT_NAME_KEY)||'';}

function updateClock(){
  const d=new Date();
  const h=d.getHours();
  const sal=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const name=getUserName();
  const g=document.getElementById('greeting');if(g)g.textContent=name?sal+', '+name:sal;
  const dt=document.getElementById('datetime');
  if(dt)dt.textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
updateClock();
setInterval(updateClock,30000);
</script>
