<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Amit Mobile — Test Capture</title>
<link rel="manifest" href="./MobileTest.manifest.json">
<meta name="theme-color" content="#14171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Amit Test">
<link rel="apple-touch-icon" href="./amit_icon.ico">
<style>
  :root{
    --bg:#14171c; --panel:#1c2027; --border:#2c313a; --text:#e8e8ea;
    --muted:#8b909a; --gold:#c9a24b; --gold2:#e0bd6a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:5}
  h1{font-size:17px;margin:0 0 2px;color:var(--gold2)}
  .sub{font-size:12px;color:var(--muted)}
  .wrap{max-width:720px;margin:0 auto;padding:16px}

  .cap-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:16px;border-radius:10px;border:1px solid var(--border);background:var(--panel);cursor:pointer;font-size:15px;font-weight:600;color:var(--gold2);margin-bottom:10px}
  .cap-btn input{display:none}
  .cap-btn:active{opacity:.7}

  .composer{display:flex;gap:8px;margin-bottom:18px}
  textarea{flex:1;resize:none;min-height:44px;max-height:120px;padding:12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:15px;font-family:inherit}
  .send-btn{padding:0 18px;border-radius:8px;border:none;background:var(--gold);color:#14171c;font-weight:700;font-size:14px;cursor:pointer}
  .send-btn:disabled{opacity:.5}

  .status{font-size:13px;color:var(--gold2);min-height:18px;margin-bottom:10px}
  .owner-line{font-size:12px;color:var(--muted);margin-bottom:14px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
  .owner-line strong{color:var(--gold2)}

  .section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:20px 0 10px;border-top:1px solid var(--border);padding-top:16px;display:flex;justify-content:space-between;align-items:center}
  .refresh-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer}

  .feed{display:flex;flex-direction:column;gap:10px}
  .card{border:1px solid var(--border);background:var(--panel);border-radius:10px;padding:12px;position:relative}
  .card.from-amit{border-color:var(--gold);background:#20241c}
  .card .from-tag{font-size:10px;color:var(--gold2);text-transform:uppercase;letter-spacing:.04em;font-weight:700;margin-bottom:2px}
  .card .del{position:absolute;top:8px;right:8px;background:none;color:var(--muted);border:none;font-size:16px;cursor:pointer}
  .card .when{font-size:11px;color:var(--muted);margin-bottom:6px}
  .card .msg{font-size:15px;line-height:1.4;white-space:pre-wrap;padding-right:20px}
  .card img{width:100%;border-radius:8px;display:block;cursor:pointer}
  .empty{color:var(--muted);font-size:13px;font-style:italic;padding:10px 0}

  .lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:50;align-items:center;justify-content:center;padding:20px}
  .lightbox.open{display:flex}
  .lightbox img{max-width:100%;max-height:100%;border-radius:6px}
  .lightbox-close{position:absolute;top:16px;right:20px;color:#fff;font-size:28px;background:none;border:none;cursor:pointer}

  .install-banner{display:none;background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:14px;margin:0 0 16px;font-size:13px;align-items:center;justify-content:space-between;gap:12px}
  .install-banner.show{display:flex}
  .install-banner button{background:var(--gold);color:#14171c;border:none;border-radius:6px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0}
  .install-banner .txt{color:var(--text)}
  .install-banner .close-x{background:none;color:var(--muted);font-size:16px;border:none;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<header>
  <h1>Amit Mobile — Test Capture</h1>
  <div class="sub">No sign-in. Photo or message, saved instantly. No Claude reply (yet).</div>
</header>

<div class="wrap">
  <div class="install-banner" id="installBanner">
    <span class="txt" id="installText">Add this to your Home Screen for one-tap access.</span>
    <button id="installBtn" onclick="amtDoInstall()">Add</button>
    <button class="close-x" onclick="amtDismissInstall()">&times;</button>
  </div>

  <div class="owner-line" id="ownerLine"></div>

  <label class="cap-btn">📷 Take / Choose Photo
    <input type="file" accept="image/*" capture="environment" onchange="amtCapturePhoto(this)">
  </label>

  <div class="composer">
    <textarea id="msgInput" placeholder="Type a message..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="amtSendMessage()">Send</button>
  </div>

  <div class="status" id="statusLine"></div>

  <div class="section-title">
    <span>Feed</span>
    <button class="refresh-btn" onclick="amtRenderFeed()">Refresh</button>
  </div>
  <div class="feed" id="feedWrap"></div>
</div>

<div class="lightbox" id="lightbox" onclick="amtCloseLightbox(event)">
  <button class="lightbox-close" onclick="amtCloseLightbox(event)">&times;</button>
  <img id="lightboxImg" src="">
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://hleqtjqojksurvkyqixt.supabase.co";
const SUPABASE_KEY = "sb_publishable_0pptfPselXI0V9JmnhXgbA_dAGurCiF";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const BUCKET = "amitmobile-test";
const TABLE = "amitmobile_test_captures";

// Owner tagging — NOT a login. The email comes from a ?u= link param (baked into
// the QR code someone scans) or is typed once and remembered on this device.
// It just stamps every row so a later session can sort a shared bucket by who sent what.
function amtGetOwnerEmail(){
  const params = new URLSearchParams(window.location.search);
  const fromLink = params.get('u');
  if(fromLink){
    localStorage.setItem('amt_owner_email', fromLink);
    return fromLink;
  }
  return localStorage.getItem('amt_owner_email') || null;
}

function amtRenderOwnerLine(){
  const el = document.getElementById('ownerLine');
  const email = amtGetOwnerEmail();
  if(email){
    el.innerHTML = 'Tagged as <strong>' + email.replace(/</g,'&lt;') + '</strong> — <a href="#" onclick="amtChangeOwner();return false;" style="color:var(--muted)">change</a>';
  } else {
    el.innerHTML = '<a href="#" onclick="amtChangeOwner();return false;" style="color:var(--gold2)">Tap to tag captures with your email</a>';
  }
}

function amtChangeOwner(){
  const current = amtGetOwnerEmail() || '';
  const next = prompt('Tag captures on this device with which email?', current);
  if(next === null) return;
  const trimmed = next.trim();
  if(trimmed) localStorage.setItem('amt_owner_email', trimmed);
  else localStorage.removeItem('amt_owner_email');
  amtRenderOwnerLine();
}

function amtSetStatus(t){ document.getElementById('statusLine').textContent = t; }

async function amtCapturePhoto(inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  amtSetStatus('Uploading photo...');
  const ts = Date.now();
  const path = ts + '-' + file.name.replace(/[^a-zA-Z0-9.]/g,'_');
  const {error: upErr} = await db.storage.from(BUCKET).upload(path, file, {contentType: file.type});
  if(upErr){ amtSetStatus('Upload failed: ' + upErr.message); return; }
  const {error: insErr} = await db.from(TABLE).insert({kind:'photo', storage_path: path, owner_email: amtGetOwnerEmail(), sender:'user'});
  if(insErr){ amtSetStatus('Saved photo but failed to record it: ' + insErr.message); return; }
  amtSetStatus('Photo saved.');
  inputEl.value = '';
  amtRenderFeed();
}

async function amtSendMessage(){
  const el = document.getElementById('msgInput');
  const text = el.value.trim();
  if(!text) return;
  amtSetStatus('Sending...');
  const {error} = await db.from(TABLE).insert({kind:'message', message:text, owner_email: amtGetOwnerEmail(), sender:'user'});
  if(error){ amtSetStatus('Failed to send: ' + error.message); return; }
  amtSetStatus('Message saved.');
  el.value = '';
  amtRenderFeed();
}

document.getElementById('msgInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    amtSendMessage();
  }
});

function amtPublicUrl(path){
  return db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

function amtWhen(iso){
  const d = new Date(iso);
  return d.toLocaleString();
}

async function amtRenderFeed(){
  const wrap = document.getElementById('feedWrap');
  const {data, error} = await db.from(TABLE).select('id,kind,message,storage_path,owner_email,sender,created_at').order('created_at',{ascending:false}).limit(100);
  if(error){ wrap.innerHTML = '<div class="empty">Could not load: ' + error.message + '</div>'; return; }
  if(!data || data.length===0){ wrap.innerHTML = '<div class="empty">Nothing yet — take a photo or send a message.</div>'; return; }
  wrap.innerHTML = '';
  data.forEach(r=>{
    const card = document.createElement('div');
    card.className = 'card' + (r.sender === 'amit' ? ' from-amit' : '');
    const whoTag = r.owner_email ? ' &middot; ' + r.owner_email.replace(/</g,'&lt;') : ' &middot; untagged';
    let inner = (r.sender === 'amit' ? '<div class="from-tag">Amit</div>' : '') + '<div class="when">' + amtWhen(r.created_at) + whoTag + '</div>';
    if(r.kind === 'photo' && r.storage_path){
      const url = amtPublicUrl(r.storage_path);
      inner += '<img src="' + url + '" onclick="amtOpenLightbox(\'' + url + '\')">';
    } else {
      inner += '<div class="msg"></div>';
    }
    inner += '<button class="del" onclick="amtDelete(\'' + r.id + '\',' + (r.storage_path ? '\'' + r.storage_path + '\'' : 'null') + ')">&times;</button>';
    card.innerHTML = inner;
    if(r.kind === 'message'){
      card.querySelector('.msg').textContent = r.message || '';
    }
    wrap.appendChild(card);
  });
}

async function amtDelete(id, path){
  if(!confirm('Delete this?')) return;
  if(path) await db.storage.from(BUCKET).remove([path]);
  await db.from(TABLE).delete().eq('id', id);
  amtRenderFeed();
}

function amtOpenLightbox(url){
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('open');
}
function amtCloseLightbox(e){
  if(e.target.id==='lightbox' || e.target.classList.contains('lightbox-close')){
    document.getElementById('lightbox').classList.remove('open');
  }
}

amtRenderOwnerLine();
amtRenderFeed();
// Poll every 8s so a capture made from another device shows up here without a manual refresh.
setInterval(amtRenderFeed, 8000);

// ── Install prompt (Android/Chrome one-tap, iOS guided) ──
let amtDeferredPrompt = null;
const amtIsStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const amtIsIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  amtDeferredPrompt = e;
  amtMaybeShowInstallBanner();
});

function amtMaybeShowInstallBanner(){
  if(amtIsStandalone) return;
  if(localStorage.getItem('amt_install_dismissed')) return;
  if(amtIsIOS){
    document.getElementById('installText').textContent = 'Tap the Share icon below, then "Add to Home Screen".';
    document.getElementById('installBtn').style.display = 'none';
    document.getElementById('installBanner').classList.add('show');
  } else if(amtDeferredPrompt){
    document.getElementById('installBanner').classList.add('show');
  }
}

async function amtDoInstall(){
  if(!amtDeferredPrompt) return;
  amtDeferredPrompt.prompt();
  await amtDeferredPrompt.userChoice;
  amtDeferredPrompt = null;
  document.getElementById('installBanner').classList.remove('show');
  localStorage.setItem('amt_install_dismissed','1');
}

function amtDismissInstall(){
  document.getElementById('installBanner').classList.remove('show');
  localStorage.setItem('amt_install_dismissed','1');
}

if(amtIsIOS) setTimeout(amtMaybeShowInstallBanner, 400);
</script>
</body>
</html>
