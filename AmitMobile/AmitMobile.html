<!-- ══════════════════════════════════════════════
     COPYING THIS TEMPLATE FOR A NEW PROJECT — read this first.

     WHAT THIS FILE IS — rebuilt 2026-08-06, Ryan's direct instruction.
     This is now the MINIMAL STARTER, not the reference catalog. It has
     Introduction (page 1) plus a few blank placeholder pages, and the
     global infrastructure every Amit app needs (right rail — Ask Amit,
     Sign In/Sync, Demo Mode — popup destination, login connection,
     tooltip mechanism, clock/greeting). It deliberately does NOT contain
     any of the canonical layouts (Tabbed/Row/Detail/Calendar/Day/Board/
     Gallery/Dashboard/Split/Form/Chart/Inbox/Drawer/Tree/Breadcrumb
     View) — those live permanently in Templates\TemplateViews.html, the
     never-modified reference library. This split exists so a real
     project's starting file is never bloated with layout code it isn't
     using — see Templates\CLAUDE.md's "TEMPLATE VIEWS vs TEMPLATE"
     section for the full reasoning.

     ADDING A LAYOUT TO A REAL PROJECT — go to Templates\TemplateViews.html,
     find the named "CANONICAL LAYOUT:" or "CANONICAL DESTINATION:" comment
     block, and copy it verbatim into this file — never reconstruct a
     layout's behavior from memory or approximation. Wire it into a real
     page/tab/popup the same way TemplateViews.html's own DEMO block shows
     it being done there. (J New, once built, automates this hand-off —
     see Templates\CLAUDE.md.)

     NAMING: the new project's folder name IS the app's name — this copy
     is "AmitMobile", per AmitMobile\CLAUDE.md's spec (2026-09-05).

     VERSION: #pageVersion starts at v1.00 for this brand-new app. From
     here forward it is versioned independently (own +0.01/+1.00 history,
     never synced to any other file's number) — see root CLAUDE.md's
     VERSIONING STANDARD.

     INTERCONNECTION: this project inherits the whole Amit system's
     conventions — Session Location Check, Pursuit Attribution
     ('Amit Mobile'), Shortcut Activation + Shortcut Awareness, and Ask
     Amit wiring (askAmitLive('amitMobile'), PAGE_CONTEXTS entry added to
     ../Amit_Ask_Live.js the same session this file was built) all live in
     AmitMobile\CLAUDE.md.

     NOMENCLATURE: this template uses PAGE (a sidebar item — button + its
     fixed number), DETAIL (the content area a page opens into), LAYOUT
     (what kind of content lives inside a detail — Tabbed/Row/Detail/etc,
     all defined in TemplateViews.html), and DESTINATION (WHERE a layout
     mounts — a page, a tab slot, or a Popup; Popup is built into this
     starter since it's generic infrastructure, not a layout itself). Full
     definitions live in the NOMENCLATURE comment at the top of the
     <script> block below.

     PAGE ORDER: sidebar display position is controlled by the PAGE_ORDER
     array in the script below, kept separate from each page's fixed
     number — reorder pages by editing that array, never by renumbering
     pages/details themselves. See Templates\CLAUDE.md for why.

     WHAT'S CUSTOM IN THIS COPY (per Amit's limited authority — pages/tabs
     only, everything else below is the template's protected infrastructure,
     untouched): page 1 (Dashboard tile grid, replaces the generic
     Introduction), page 2 (Daily Walk voice conversation), page 3 (Amit
     general voice conversation + photo capture), page 4 (Zoom/Read This —
     coming soon), page 5 (Search — coming soon). Two small, explicitly
     authorized infrastructure changes per AmitMobile\CLAUDE.md: the
     Supabase client init below now passes {auth:{persistSession:true,
     autoRefreshToken:true}} (login-persistence bug fix, not new
     infrastructure), and a <link rel="manifest"> tag was added for PWA
     installability.

     SHELL REBUILD, 2026-09-05 — explicitly authorized, THIS FILE ONLY, not
     a change to Templates\template.html: Ryan tested the template's
     desktop sidebar+right-rail shell on a real phone and found it left
     almost no room for content. Rather than shrinking that chrome, this
     file's outer shell was rebuilt to follow AmitBooks\AmitScan\
     AmitScan.html's proven phone-app shape instead — a thin fixed top bar
     (#amTopBar: back/logo, page title, and the four small actions that
     used to be right-rail items) plus a full-bleed #mainArea, no sidebar,
     no right rail at all. The underlying functions (askAmitLive,
     openSyncModal/_updateSyncUI, toggleDemoMode/_updateDemoUI, goToHub,
     the popup destination, the Supabase login listener) are UNCHANGED —
     only the chrome that triggers them moved. Page 1 (Dashboard)'s tile
     grid is now the navigation menu; other pages return to it via the top
     bar's back arrow (see openPage()). Full width-math writeup in
     AmitMobile\CLAUDE.md.
     ══════════════════════════════════════════════ -->
<title>AmitMobile</title>
<link rel="icon" type="image/x-icon" href="amit_icon.ico">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#09141f">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../Amit_Ask_Live.js?v=6.15"></script>
<script src="../amit_readiness_check.js?v=1.00"></script>
<script src="../amit_voice_prefs.js?v=1.00"></script>
<script src="../amit_owner_contact.js?v=1.00"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09141f;
  --card-head:#0f2338;
  --border:rgba(201,168,76,0.55);
  --gold:#c9a84c;
  --gold2:#e8c56a;
  --text:#ffffff;
  --text2:#f0e8d0;
  --muted:rgba(240,232,208,0.78);
  --dim:rgba(240,232,208,0.42);
}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);font-family:'Crimson Pro',Georgia,serif;color:var(--text);
  position:fixed;inset:0;height:100dvh;
}

body::before{
  content:'';
  position:fixed;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:60vmin;height:60vmin;
  background:url('amit_icon.ico') center/contain no-repeat;
  opacity:.035;
  pointer-events:none;
  z-index:0;
}

/* ══════════════════════════════════════════════
   PHONE-NATIVE SHELL — rebuilt 2026-09-05, replacing the desktop
   sidebar+right-rail layout entirely (not just collapsing it). Ryan
   tested the old layout on a real phone and found the expanded sidebar
   plus right rail left almost no room for content ("it's a whole
   website, and it can't even read it") — a media query shrinking that
   chrome down to icon-only strips was tried first and reverted, because
   Ryan then found the real reference: AmitBooks\AmitScan\AmitScan.html,
   a proven one-screen-app shape with NO side chrome at all — just a thin
   fixed top bar, a full-bleed content stage, and a fixed bottom bar for
   the one primary action. This shell follows that same shape: #amShell
   (fixed, 100dvh, safe-area padding — same real values AmitScan uses),
   a thin .amtop bar (back/logo, page title, and the four small action
   icons that used to live in the right rail), and .main-area/.detail
   filling 100% of whatever's left — no sidebar, no right rail, nothing
   else eating width. See AmitMobile\CLAUDE.md for the full before/after
   width math. ══════════════════════════════════════════════ */
#amShell{
  display:flex;flex-direction:column;height:100dvh;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  position:relative;z-index:1;
}
.amtop{
  display:flex;align-items:center;gap:8px;
  padding:7px 12px;min-height:42px;
  background:var(--card-head);border-bottom:2px solid var(--border);
  flex-shrink:0;position:relative;
}
.amtop-back{
  background:none;border:none;color:var(--gold2);font-size:22px;line-height:1;
  width:30px;height:30px;flex-shrink:0;cursor:pointer;padding:0;
  display:none;align-items:center;justify-content:center;
}
.amtop-logo{width:26px;height:26px;flex-shrink:0;cursor:pointer;border-radius:50%}
.amtop-title{
  font-family:'Cinzel',serif;font-size:13px;color:var(--gold2);letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1;min-width:0;
}
.amtop-actions{display:flex;align-items:center;gap:5px;flex-shrink:0}
.amtop-btn{
  width:28px;height:28px;border-radius:50%;border:1px solid transparent;
  background:rgba(255,255,255,.05);color:var(--text2);font-size:14px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  padding:2px;flex-shrink:0;overflow:hidden;
}
/* Same green on/off treatment the right rail used for Sign In/Demo
   toggles — carried forward so the meaning (connected/on vs. not) reads
   the same way it always has in this template family. */
.amtop-btn.active{background:rgba(46,160,67,.20);border-color:rgba(46,160,67,.65)}
.amtop-btn.active span{color:#6fe38f}

/* ── MAIN AREA — now gets essentially the full screen width, not just
   whatever the sidebar/rail left over. ── */
.main-area{flex:1;overflow:hidden;position:relative;background:var(--bg)}
.detail{
  position:absolute;inset:0;overflow-y:auto;
  display:none;flex-direction:column;
  animation:pfade .18s ease;
}
.detail.active{display:flex}
@keyframes pfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.detail::-webkit-scrollbar{width:5px}
.detail::-webkit-scrollbar-thumb{background:rgba(201,168,76,.3);border-radius:3px}
.detail-empty{flex:1;display:flex;align-items:center;justify-content:center;color:rgba(240,232,208,.25);font-family:'Cinzel',serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* Tiny version badge, same spirit as AmitScan's bottom-corner #pageVersion —
   fixed so it survives regardless of which detail is active. */
.amversion{
  position:fixed;left:8px;bottom:calc(6px + env(safe-area-inset-bottom));
  color:var(--dim);font-size:9px;letter-spacing:.03em;opacity:.6;
  z-index:4;pointer-events:none;
}

/* ── POPUP — canonical DESTINATION, not a layout type. Generic overlay
   that can host any layout instance copied in from TemplateViews.html —
   content-agnostic, same separation as a Page or a Tab slot not caring
   what's mounted inside them. Built into this starter (not TemplateViews-
   only) since it's global infrastructure, not a layout. ── */
.popup-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;align-items:center;justify-content:center}
.popup-card{background:var(--card-head);border:1px solid rgba(201,168,76,.5);border-radius:12px;padding:26px 28px;max-width:640px;width:92%;max-height:82vh;overflow-y:auto;box-shadow:0 10px 50px rgba(0,0,0,.55);position:relative}
.popup-close-btn{position:absolute;top:14px;right:16px;color:rgba(240,232,208,.5);cursor:pointer;font-family:'Cinzel',serif;font-size:10px;letter-spacing:.08em}
.popup-close-btn:hover{color:var(--gold2)}

/* CANONICAL LAYOUT: TABBED VIEW — copied verbatim from TemplateViews.html,
   added 2026-08-06 so Add Page can instantiate a real Tabbed View directly,
   not hand a copy-instruction to an outside AI session. */
.ch-tab-nav{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px;row-gap:0;margin:0 24px;padding:0;background:var(--bg);flex-shrink:0}
.ch-tab-btn{padding:9px 22px;margin-top:10px;border:1px solid rgba(201,168,76,.25);background:rgba(255,255,255,.03);color:var(--muted);border-radius:10px 10px 0 0;cursor:pointer;font-size:13px;font-family:inherit}
.ch-tab-btn.active{padding:12px 26px;margin-top:-2px;margin-bottom:-3px;border-bottom:none;background:var(--card-head);color:var(--gold2);font-weight:600;font-size:14px;position:relative;z-index:2}
.ch-tab-main{flex:1;min-height:0;overflow-y:auto;padding:28px 32px;margin:0 24px 24px;background:var(--card-head);border:1px solid rgba(201,168,76,.25);border-radius:0 12px 12px 12px}
.ch-tab-content{display:none}
.ch-tab-content.active{display:block}

/* ── CUSTOM — AMIT MOBILE DASHBOARD GRID (page 1) — new UI per
   AmitMobile\CLAUDE.md's "Dashboard Architecture" section, built within
   this detail's content area, styled consistently with the gold/navy
   palette above. Not a canonical TemplateViews.html layout — a
   purpose-built tile grid, per this project's own limited authority to
   change page/tab content. ── */
.amdash-wrap{padding:32px;max-width:760px;margin:0 auto}
.amdash-hero{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:32px}
.amdash-hero img{width:64px;height:64px;margin-bottom:12px}
.amdash-hero h1{font-family:'Cinzel',serif;font-size:20px;color:var(--gold2);letter-spacing:.04em}
.amdash-hero p{color:var(--muted);font-size:13px;margin-top:6px}
.amdash-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.amdash-tile{
  background:var(--card-head);border:1px solid rgba(201,168,76,.35);border-radius:14px;
  padding:22px 16px;text-align:center;cursor:pointer;transition:all .15s;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.amdash-tile:hover{border-color:var(--gold);background:rgba(201,168,76,.08);transform:translateY(-2px)}
.amdash-tile.amdash-primary{grid-column:1/-1;background:rgba(201,168,76,.1);border-color:var(--gold)}
.amdash-tile .amdash-icon{font-size:34px}
.amdash-tile .amdash-name{font-family:'Cinzel',serif;font-size:16px;color:var(--gold2);letter-spacing:.03em}
.amdash-tile .amdash-sub{font-size:14px;color:var(--dim);line-height:1.35}

/* ── CUSTOM — HOME SCREEN INSTALL BANNER (Dashboard, page 1) ── */
.aminstall-banner{
  background:var(--card-head);border:1px solid rgba(201,168,76,.4);border-radius:14px;
  padding:16px 18px;margin:0 0 20px;position:relative;
}
.aminstall-close{
  position:absolute;top:8px;right:10px;background:none;border:none;
  color:var(--dim);font-size:16px;cursor:pointer;line-height:1;padding:4px;
}
.aminstall-close:hover{color:var(--gold2)}
.aminstall-head{font-family:'Cinzel',serif;font-size:13px;letter-spacing:.03em;color:var(--gold2);margin:0 0 10px;padding-right:20px}
.aminstall-steps{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.aminstall-steps li{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.aminstall-steps .aminstall-num{
  flex:none;width:20px;height:20px;border-radius:50%;background:rgba(201,168,76,.18);
  border:1px solid var(--gold);color:var(--gold2);font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.aminstall-btn{
  background:rgba(201,168,76,.16);border:1px solid var(--gold);color:var(--gold2);
  padding:10px 18px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;
}
.aminstall-btn:hover{background:rgba(201,168,76,.28)}

/* ── CUSTOM — VOICE CONVERSATION UI (Daily Walk / Amit pages) ── */
.amvoice-wrap{padding:28px 32px;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px;width:100%}
.amvoice-mic-row{display:flex;justify-content:center}
.amvoice-mic-btn{
  width:110px;height:110px;border-radius:50%;
  background:rgba(201,168,76,.12);border:2px solid var(--gold);
  color:var(--gold2);font-size:38px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.amvoice-mic-btn:hover{background:rgba(201,168,76,.22)}
.amvoice-mic-btn.amvoice-listening{background:rgba(201,84,76,.22);border-color:#e08a6a;animation:amPulse 1.2s ease-in-out infinite}
@keyframes amPulse{0%,100%{box-shadow:0 0 0 0 rgba(201,84,76,.4)}50%{box-shadow:0 0 0 14px rgba(201,84,76,0)}}
.amvoice-status{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.04em}
.amvoice-box{background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.25);border-radius:10px;padding:14px 16px;min-height:48px;font-size:14px;line-height:1.6}
.amvoice-box-label{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.amvoice-box.amvoice-you{color:var(--text2)}
.amvoice-box.amvoice-amit{color:var(--gold2)}
.amvoice-photo-row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.amvoice-photo-btn{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.4);color:var(--gold2);padding:9px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px}
.amvoice-photo-btn:hover{background:rgba(201,168,76,.22)}
.amvoice-photo-preview{max-width:220px;max-height:220px;border-radius:10px;border:1px solid rgba(201,168,76,.35);display:block;margin:0 auto}
.amvoice-savenote{text-align:center;color:var(--dim);font-size:11px;font-style:italic}
.amvoice-input-row{display:flex;gap:8px;align-items:flex-end}
.amvoice-textinput{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.35);border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit;color:var(--text2);resize:none;min-height:44px;max-height:140px}
.amvoice-textinput:focus{outline:none;border-color:var(--gold2)}
.amvoice-send-btn{background:rgba(201,168,76,.18);border:1px solid rgba(201,168,76,.45);color:var(--gold2);padding:0 18px;height:44px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px;white-space:nowrap}
.amvoice-send-btn:hover{background:rgba(201,168,76,.3)}
.amvoice-send-btn:disabled{opacity:.5;cursor:default}
.amvoice-mic-btn.amvoice-optional{width:44px;height:44px;font-size:18px;flex-shrink:0}

/* ── CUSTOM — SCROLLING CHAT THREAD (rebuild 2026-09-06) — replaces the
   old single-box "your message / Amit's reply" layout on Daily Walk (page
   2) and Amit (page 3). Both pages still share amVoicePageHtml(), just
   with a real thread now instead of one static response box. ── */
.amvoice-wrap.amthread-wrap{padding:0;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:0;width:100%;height:100%}
.amthread-scroll{flex:1;overflow-y:auto;padding:18px 20px 8px;display:flex;flex-direction:column;gap:10px}
.amthread-daydivider{text-align:center;color:var(--dim);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 4px;font-family:'Cinzel',serif}
.amthread-daydivider:first-child{margin-top:0}
.amthread-row{display:flex;width:100%}
.amthread-row.amthread-you{justify-content:flex-end}
.amthread-row.amthread-amit{justify-content:flex-start}
.amthread-bubble{max-width:78%;border-radius:14px;padding:10px 13px;font-size:14px;line-height:1.55;position:relative}
.amthread-you .amthread-bubble{background:rgba(201,168,76,.16);border:1px solid rgba(201,168,76,.4);color:var(--text2);border-bottom-right-radius:3px}
.amthread-amit .amthread-bubble{background:rgba(255,255,255,.045);border:1px solid rgba(201,168,76,.22);color:var(--gold2);border-bottom-left-radius:3px}
.amthread-bubble.amthread-pending{opacity:.65;font-style:italic}
.amthread-photos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.amthread-photo-thumb{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid rgba(201,168,76,.35);cursor:pointer}
.amthread-speak-btn{margin-top:6px;background:none;border:none;color:var(--gold2);opacity:.7;cursor:pointer;font-size:15px;padding:0}
.amthread-speak-btn:hover{opacity:1}
.amthread-empty{text-align:center;color:var(--dim);font-size:13px;font-style:italic;padding:30px 20px}

/* Composer — pinned below the scrolling thread, replaces the old
   always-below-the-fold input row */
.amcomposer{padding:10px 16px 16px;border-top:1px solid rgba(201,168,76,.18);display:flex;flex-direction:column;gap:8px;background:var(--card-head)}
.amcomposer-pending-photos{display:flex;gap:8px;flex-wrap:wrap}
.amcomposer-pending-thumb{position:relative;width:56px;height:56px}
.amcomposer-pending-thumb img{width:100%;height:100%;object-fit:cover;border-radius:8px;border:1px solid rgba(201,168,76,.4)}
.amcomposer-pending-thumb .amcomposer-remove{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#b23a3a;color:#fff;font-size:11px;line-height:18px;text-align:center;cursor:pointer;border:1px solid rgba(255,255,255,.6)}
.amvoice-photo-btn.amcomposer-plus{width:44px;height:44px;border-radius:10px;padding:0;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}

/* ── MY COMPUTER (page 6) — read-only Computer Health report list,
   styled to match the amvoice/amdash patterns above, not a new visual
   language. ── */
.amcomp-wrap{padding:28px 32px;max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:14px;width:100%}
.amcomp-report{background:rgba(255,255,255,.04);border:1px solid rgba(201,168,76,.25);border-radius:10px;padding:14px 16px;cursor:pointer}
.amcomp-report:hover{border-color:var(--gold)}
.amcomp-report-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.amcomp-summary{color:var(--text2);font-size:14px;line-height:1.5}
.amcomp-date{color:var(--dim);font-size:11px;white-space:nowrap;font-family:'Cinzel',serif;letter-spacing:.03em}
.amcomp-sev{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-top:6px}
.amcomp-sev.ok{color:#6fcf97;background:rgba(39,174,96,.14);border:1px solid rgba(39,174,96,.35)}
.amcomp-sev.warn{color:#e8c56a;background:rgba(201,168,76,.14);border:1px solid rgba(201,168,76,.35)}
.amcomp-sev.crit{color:#e08a6a;background:rgba(201,84,76,.14);border:1px solid rgba(201,84,76,.35)}
.amcomp-detail{margin-top:12px;padding-top:12px;border-top:1px solid rgba(201,168,76,.18);display:none}
.amcomp-detail.open{display:block}
.amcomp-detail-label{font-family:'Cinzel',serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.amcomp-detail-list{margin:0 0 12px 0;padding-left:18px;font-size:13px;color:var(--muted);line-height:1.6}
.amcomp-empty{text-align:center;color:var(--dim);font-size:13px;padding:40px 20px;line-height:1.7}
</style>
</head>
<body>

//            of this file. This project's own Dashboard grid (page 1) and
//            voice-conversation UI (pages 2-3) are custom, purpose-built
//            content, not one of those canonical layouts.
//   DESTINATION — WHERE a layout mounts: a page, a tab slot, or a Popup.
//            Popup is built into this starter (see below) since it's
//            generic infrastructure, not a layout itself.
// ══════════════════════════════════════════════

let currentUser=null;
// SB_URL/SB_KEY/db/demoMode declared here, early — a real, confirmed bug
// from earlier work on this file: demoMode defaults to true (unlike
// currentUser, which defaults falsy), so anything gating on it can run
// during the page's very first synchronous script pass, before a
// later-declared `const` has initialized — a temporal dead zone crash.
// Declaring all of this up front avoids that class of bug entirely.
const SB_URL='https://hleqtjqojksurvkyqixt.supabase.co';
const SB_KEY='sb_publishable_0pptfPselXI0V9JmnhXgbA_dAGurCiF';
// AUTH PERSISTENCE — added 2026-09-05, Ryan's direct instruction (per
// AmitMobile\CLAUDE.md "Login persistence" section): persistSession +
// autoRefreshToken so a signed-in phone user doesn't have to re-login
// every couple weeks. This is a config correction to the template's own
// connection block, not new infrastructure — explicitly authorized.
const db=(typeof supabase!=='undefined')?supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}}):null;
const AMIT_DEMO_UID='8b95d057-fd6b-44ec-abe7-658e08872d1a';
let demoMode=localStorage.getItem('amit_demo_mode')!=='off';

// ══════════════════════════════════════════════
// CANONICAL DATA BINDING: DEMO MODE — a general, reusable connection to
// Amit's own account data, available to ANY current or future view/form
// built from this template — not wired one-off per view. Ported from the
// Hub's real, live mechanism (amit-hub.html's demoModeHub/AMIT_DEMO_UID).
//
// fetchDemoRows(table, queryString) — the one call any view makes to
// pull Amit's own rows for demo mode. Returns [] immediately if demo mode
// is off. Every returned row is tagged _isDemo:true.
//
// REVIEW ONLY: any row this returns must never be editable or writable —
// it's the caller's responsibility to check _isDemo and refuse edits.
// ══════════════════════════════════════════════
async function fetchDemoRows(table,queryString){
  if(!demoMode)return[];
  try{
    const res=await fetch(`${SB_URL}/rest/v1/${table}?user_id=eq.${AMIT_DEMO_UID}&${queryString}`,{
      headers:{apikey:SB_KEY,Accept:'application/json'}
    });
    const rows=res.ok?await res.json():[];
    return rows.map(r=>({...r,_isDemo:true}));
  }catch(e){
    return[];
  }
}

// ══════════════════════════════════════════════
// HOME SCREEN INSTALL WALKTHROUGH — shown on the Dashboard (page 1) only
// when the app is NOT already running as an installed home-screen app.
// See AmitMobile\CLAUDE.md for the full writeup of why iOS and Android
// are handled differently — Android gets a real one-tap native install
// prompt via beforeinstallprompt; iOS Safari exposes no API to trigger
// "Add to Home Screen" at all, so iOS gets clear manual steps instead.
// Never fake one platform's path with the other's mechanism.
// ══════════════════════════════════════════════
const AM_INSTALL_DISMISS_KEY='amitMobileInstallDismissedAt';
const AM_INSTALL_REDISPLAY_MS=1000*60*60*24*2; // re-show 2 days after a dismiss
let amDeferredInstallPrompt=null;

function amIsInstalled(){
  return (window.navigator.standalone===true) ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}
function amIsIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent); }
function amIsAndroid(){ return /Android/.test(navigator.userAgent); }

function amInstallRecentlyDismissed(){
  const raw=localStorage.getItem(AM_INSTALL_DISMISS_KEY);
  if(!raw)return false;
  const at=parseInt(raw,10);
  if(!at || isNaN(at))return false;
  return (Date.now()-at) < AM_INSTALL_REDISPLAY_MS;
}
function amDismissInstallBanner(){
  localStorage.setItem(AM_INSTALL_DISMISS_KEY, String(Date.now()));
  const host=document.getElementById('amInstallBannerHost');
  if(host) host.innerHTML='';
}

// Capture the real Android/Chrome install prompt as early as possible —
// the browser can fire this before our own render call runs.
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  amDeferredInstallPrompt=e;
  amRenderInstallBanner(); // re-render now that we actually have a real prompt to offer
});
window.addEventListener('appinstalled',()=>{
  amDeferredInstallPrompt=null;
  const host=document.getElementById('amInstallBannerHost');
  if(host) host.innerHTML='';
});

async function amClickAndroidInstall(){
  if(!amDeferredInstallPrompt)return;
  amDeferredInstallPrompt.prompt();
  try{
    await amDeferredInstallPrompt.userChoice; // resolves whether accepted or dismissed
  }catch(e){/* ignore */}
  amDeferredInstallPrompt=null; // one-shot — Chrome invalidates the event either way
  const host=document.getElementById('amInstallBannerHost');
  if(host) host.innerHTML='';
}

function amRenderInstallBanner(){
  const host=document.getElementById('amInstallBannerHost');
  if(!host)return; // Dashboard not on screen right now
  if(amIsInstalled() || amInstallRecentlyDismissed()){ host.innerHTML=''; return; }

  if(amIsIOS()){
    host.innerHTML=`<div class="aminstall-banner">
      <button class="aminstall-close" onclick="amDismissInstallBanner()" aria-label="Dismiss">✕</button>
      <div class="aminstall-head">Get Amit on your home screen</div>
      <ul class="aminstall-steps">
        <li><span class="aminstall-num">1</span>Tap the Share button ⬆️ in Safari's toolbar below</li>
        <li><span class="aminstall-num">2</span>Scroll down and tap "Add to Home Screen"</li>
        <li><span class="aminstall-num">3</span>Tap "Add" in the top right</li>
      </ul>
    </div>`;
    return;
  }

  if(amIsAndroid() && amDeferredInstallPrompt){
    host.innerHTML=`<div class="aminstall-banner">
      <button class="aminstall-close" onclick="amDismissInstallBanner()" aria-label="Dismiss">✕</button>
      <div class="aminstall-head">Get Amit on your home screen</div>
      <button class="aminstall-btn" onclick="amClickAndroidInstall()">📲 Install Amit Mobile</button>
    </div>`;
    return;
  }

  // Android but the browser hasn't fired beforeinstallprompt yet (already
  // dismissed this session, or install criteria not met) — nothing honest
  // to show yet. Desktop / unrecognized platform — this flow is phone-only.
  host.innerHTML='';
}

// ── MY COMPUTER (page 6) — read-only view of Computer Health reports,
// per AmitMobile\CLAUDE.md. Reads amit_device_events rows this signed-in
// user already owns (event_type='master_report'). No editing/deleting —
// purely a phone-side viewer onto data Computer Health already wrote.
let amCompReportsCache=[];
function amMyComputerHtml(){
  if(!currentUser||!db){
    return `<div class="amcomp-wrap"><div class="amcomp-empty">Sign in to see your computer's health reports here.</div></div>`;
  }
  // Kick off the async load; render a loading state now, replace once data arrives.
  amLoadMyComputerReports();
  return `<div class="amcomp-wrap" id="amCompList"><div class="amcomp-empty">Loading your reports…</div></div>`;
}

async function amLoadMyComputerReports(){
  const holder=document.getElementById('amCompList');
  if(!currentUser||!db){ return; }
  try{
    const{data,error}=await db.from('amit_device_events')
      .select('id,created_at,summary,severity,event_detail')
      .eq('user_id',currentUser.id)
      .eq('event_type','master_report')
      .order('created_at',{ascending:false})
      .limit(30);
    if(!holder) return; // user navigated away before this resolved
    if(error){
      console.error('amit_device_events fetch failed',error);
      holder.innerHTML=`<div class="amcomp-empty">Couldn't load your computer reports right now — check your connection and reopen this tile.</div>`;
      return;
    }
    amCompReportsCache=data||[];
    if(!amCompReportsCache.length){
      holder.innerHTML=`<div class="amcomp-empty">No computer reports yet — install Amit on your desktop to start tracking.</div>`;
      return;
    }
    holder.innerHTML=amCompReportsCache.map((r,i)=>amCompReportCardHtml(r,i)).join('');
  }catch(e){
    console.error(e);
    if(holder) holder.innerHTML=`<div class="amcomp-empty">Couldn't load your computer reports right now — check your connection and reopen this tile.</div>`;
  }
}

function amCompSevClass(sev){
  const s=(sev||'').toLowerCase();
  if(s.includes('crit')||s.includes('high')||s.includes('urgent')) return 'crit';
  if(s.includes('warn')||s.includes('medium')||s.includes('watch')) return 'warn';
  return 'ok';
}

function amCompReportCardHtml(r,i){
  const d=new Date(r.created_at);
  const dateStr=isNaN(d)?'':d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  const sevClass=amCompSevClass(r.severity);
  const summary=r.summary||'Computer health report';
  const insight=(r.event_detail&&r.event_detail.report&&r.event_detail.report.insight)||{};
  const strengths=Array.isArray(insight.strengths)?insight.strengths:[];
  const concerns=Array.isArray(insight.concerns)?insight.concerns:[];
  const strengthsHtml=strengths.length?`<ul class="amcomp-detail-list">${strengths.map(s=>`<li>${s}</li>`).join('')}</ul>`:`<div class="amcomp-detail-list" style="padding-left:0">Nothing specific noted.</div>`;
  const concernsHtml=concerns.length?`<ul class="amcomp-detail-list">${concerns.map(s=>`<li>${s}</li>`).join('')}</ul>`:`<div class="amcomp-detail-list" style="padding-left:0">Nothing flagged.</div>`;
  return `<div class="amcomp-report" onclick="amToggleCompDetail(${i})">
    <div class="amcomp-report-top">
      <div class="amcomp-summary">${summary}</div>
      <div class="amcomp-date">${dateStr}</div>
    </div>
    ${r.severity?`<span class="amcomp-sev ${sevClass}">${r.severity}</span>`:''}
    <div class="amcomp-detail" id="amCompDetail-${i}">
      <div class="amcomp-detail-label">What's running well</div>
      ${strengthsHtml}
      <div class="amcomp-detail-label">What to watch</div>
      ${concernsHtml}
    </div>
  </div>`;
}

function amToggleCompDetail(i){

  if(el) el.classList.toggle('open');
}

// ── VOICE CONVERSATION UI (pages 2-3) ──
// FIXED 2026-09-05: the original v1 used SpeechRecognition/
// webkitSpeechRecognition (Web Speech API) as a tap-to-talk mic button.
// Ryan confirmed on a real iPhone that this silently does nothing — Apple
// has never implemented SpeechRecognition in Safari/iOS, on any iOS
// browser (they're all Safari under the hood). The fix: a plain text
// input is now the PRIMARY, always-present path. The phone's own OS
// keyboard has a microphone/dictation button built in — that's a
// completely different mechanism (native iOS/Android dictation, not a JS
// API) and needs zero code here; typing into the box and tapping that
// keyboard mic is how "speaking" now works on iPhone. Where the browser
// DOES support SpeechRecognition (Chrome/Android), an optional "tap to
// talk" mic button is shown alongside the text box as a bonus shortcut —
// but the text box is never hidden or secondary, per Ryan's instruction.
// Two page instances (Daily Walk / Amit) share this same markup/JS,
// distinguished by a `mode` string.
// REBUILT 2026-09-06 — real scrolling chat thread, day-grouped, multiple
// photos per message, tap-to-expand thumbnails, and a visible speak-back
// button on every Amit reply. Replaces the old single text-box + one-reply
// layout. Both Daily Walk (page 2) and Amit (page 3) still share this one
// function — see AmitMobile\CLAUDE.md's chat-thread rebuild entry.
function amVoicePageHtml(mode,prompt,withPhoto){
  const speechSupported=!!amGetSpeechRecognitionCtor();
  return `<div class="amvoice-wrap amthread-wrap">
    <div class="amthread-scroll" id="amThreadScroll-${mode}">
      <div class="amthread-empty" id="amThreadEmpty-${mode}" style="text-align:center;color:var(--muted);font-size:13px;font-style:italic;padding:24px 20px">${prompt}</div>
    </div>
    <div class="amcomposer">
      <div class="amcomposer-pending-photos" id="amPendingPhotos-${mode}"></div>
      <div class="amvoice-input-row">
        ${withPhoto?`
        <label class="amvoice-photo-btn amcomposer-plus" for="amPhotoInput-${mode}" title="Add photos">＋</label>
        <input type="file" accept="image/*" multiple id="amPhotoInput-${mode}" style="display:none" onchange="amHandlePhotoMulti(event,'${mode}')">
        `:''}
        <textarea class="amvoice-textinput" id="amTextInput-${mode}" placeholder="Type, or tap the microphone on your keyboard to speak…" rows="1" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();amSubmitTextInput('${mode}');}"></textarea>
        ${speechSupported?`<button class="amvoice-mic-btn amvoice-optional" id="amMicBtn-${mode}" onclick="amToggleListening('${mode}')" title="Tap to talk (optional)">🎙️</button>`:''}
        <button class="amvoice-send-btn" id="amSendBtn-${mode}" onclick="amSubmitTextInput('${mode}')">Send</button>
      </div>
      <div class="amvoice-status" id="amStatus-${mode}">${speechSupported?'Type your message, or tap the mic to talk':'Type your message and tap Send'}</div>
      <div class="amvoice-savenote" id="amSaveNote-${mode}"></div>
    </div>
  </div>`;
}

// Per-mode recognizer state — SpeechRecognition instances aren't reusable
// across stop/start cleanly on every browser, so a fresh one is created
// each time listening starts (tap-to-talk, not continuous). Only used as
// the optional bonus path where the browser actually supports it.
const amRecognizers={};
const amPendingPhotos={}; // {[mode]: [{file, dataUrl}, ...]} — multi-photo, rebuilt 2026-09-06
const amThreadCache={}; // {[mode]: [{id, created_at, transcript, reply, photo_urls:[...]}]} — loaded thread history

function amGetSpeechRecognitionCtor(){
  // Excludes iOS outright, regardless of feature detection — 2026-09-05,
  // Ryan's direct correction. Some iOS/Safari versions now report
  // webkitSpeechRecognition as present, but tested live it gets stuck
  // (a permanent "listening" circle, never captures anything, can't even
  // be tapped to cancel). The keyboard's own dictation icon already
  // covers "speak instead of type" reliably on iOS, so there's no reason
  // to offer a bonus button that can freeze. Still offered on Android/
  // Chrome, where it actually works.
  if(/iPad|iPhone|iPod/.test(navigator.userAgent))return null;
  return window.SpeechRecognition||window.webkitSpeechRecognition||null;
}

// Primary path — reads the text box, submits it exactly the way a
// finished spoken message used to be submitted, then clears the box.
function amSubmitTextInput(mode){
  const input=document.getElementById('amTextInput-'+mode);
  if(!input)return;
  const text=input.value.trim();
  if(!text)return;
  input.value='';
  const status=document.getElementById('amStatus-'+mode);
  if(status)status.textContent='Thinking…';
  amHandleVoiceInput(mode,text);
}

function amToggleListening(mode){
  const btn=document.getElementById('amMicBtn-'+mode);
  if(btn&&btn.classList.contains('amvoice-listening')){
    amStopListening(mode);
    return;
  }
  amStartListening(mode);
}

// Optional bonus path (Chrome/Android etc.) — dictates INTO the same text
// box rather than auto-submitting, so the person can review/edit before
// tapping Send, same as anything else typed there.
function amStartListening(mode){
  const Ctor=amGetSpeechRecognitionCtor();
  const status=document.getElementById('amStatus-'+mode);
  const btn=document.getElementById('amMicBtn-'+mode);
  if(!Ctor){
    if(status)status.textContent='Voice dictation isn\'t available in this browser — type your message instead.';
    return;
  }
  const rec=new Ctor();
  rec.lang='en-US';
  rec.continuous=false;
  rec.interimResults=true;
  amRecognizers[mode]=rec;

  const input=document.getElementById('amTextInput-'+mode);
  btn.classList.add('amvoice-listening');
  btn.textContent='⏹️';
  status.textContent='Listening…';

  rec.onresult=(e)=>{
    let text='';
    for(let i=0;i<e.results.length;i++) text+=e.results[i][0].transcript;
    if(input) input.value=text;
  };
  rec.onerror=(e)=>{
    status.textContent='Could not hear that ('+e.error+') — type your message instead.';
    amResetMicButton(mode);
  };
  rec.onend=()=>{
    amResetMicButton(mode);
    status.textContent='Type your message, or tap the mic to talk';
  };
  try{ rec.start(); }
  catch(e){ status.textContent='Could not start listening: '+e.message; amResetMicButton(mode); }
}

function amStopListening(mode){
  const rec=amRecognizers[mode];
  if(rec) rec.stop();
}

function amResetMicButton(mode){
  const btn=document.getElementById('amMicBtn-'+mode);
  if(!btn)return;
  btn.classList.remove('amvoice-listening');
  btn.textContent='🎙️';
}

// Handles a completed spoken (or typed) message: builds an optimistic
// "you" bubble immediately (with any attached photos), sends it through
// callAmitBackend(), then appends Amit's real reply as its own bubble the
// moment it lands — rather than overwriting one static response box.
async function amHandleVoiceInput(mode,text){
  const pendingPhotos=(amPendingPhotos[mode]||[]).slice();
  const localPhotoUrls=pendingPhotos.map(p=>p.dataUrl); // shown instantly, pre-upload
  const youMsg={id:'local-'+Date.now(),created_at:new Date().toISOString(),who:'you',transcript:text,photo_urls:localPhotoUrls};
  amAppendMessageToThread(mode,youMsg);
  amClearPendingPhotos(mode);

  const amitMsg={id:'pending-'+Date.now(),created_at:new Date().toISOString(),who:'amit',transcript:'Amit is thinking…',pending:true};
  amAppendMessageToThread(mode,amitMsg);

  const reply=await callAmitBackend(text,mode,pendingPhotos,amitMsg.id);
  amitMsg.pending=false;
  amitMsg.transcript=reply;
  amUpdateThreadMessage(mode,amitMsg);
  amSpeak(reply);
}

// ══════════════════════════════════════════════
// callAmitBackend(message, mode, photos, pendingBubbleId) — REAL, wired
// 2026-09-05, extended 2026-09-06 for multi-photo.
//
// Architecture: Supabase relay, not a direct phone-to-desktop connection
// (per Ryan's design, AmitMobile\CLAUDE.md "The Live Backend"). The phone
// never talks to the desktop directly — both only ever talk to Supabase,
// which is always reachable (cellular included). Flow:
//   1. This uploads any attached photos, then inserts one row into
//      amit_mobile_captures (reply left null).
//   2. A desktop bridge — the shared Amit Bridge's amit_mobile_watcher.ps1
//      companion watcher (ComputerHealth\Watchers\), NOT a separate app —
//      picks up unanswered rows, gets a real answer from a headless
//      `claude -p` call, and writes it back onto that row's `reply` column.
//   3. This function POLLS that one row every 2.5s until `reply` appears
//      or a 90-second timeout is reached, updating the pending thread
//      bubble's status text while it waits.
//
// Poll vs. Realtime, decided honestly: a live Realtime subscription was
// considered so the reply pushes in the instant it's written, rather than
// waiting up to 2.5s. A short-interval poll of one single row was used
// instead because it is far simpler to get right (no channel lifecycle to
// manage, no risk of a dropped-then-silent subscription leaving the UI
// stuck on "thinking" with no fallback) and the real-world lag difference
// is negligible next to the 5-40+ seconds a headless claude -p call itself
// typically takes. Capped at 90 seconds — if nothing comes back by then,
// an honest failure message is shown instead of silence, per Ryan's
// explicit instruction that failures must be clear, not silent or
// confusing.
// ══════════════════════════════════════════════
async function callAmitBackend(message,mode,photos,pendingBubbleId){
  if(!currentUser||!db){
    return "You're not signed in, so Amit can't save this conversation or send it to the desktop bridge. Sign in first, then try again.";
  }
  const destination=mode==='dailywalk'?'daily_walk':'general';
  let photoUrls=[];
  if(photos&&photos.length){
    photoUrls=await amUploadPendingPhotos(photos);
  }
  // MULTI-PHOTO STORAGE DECISION (2026-09-06): amit_mobile_captures.photo_url
  // is a plain text column (migration_2026-09-05_001) — no schema migration
  // was needed for this rebuild. Multiple photo paths are stored as a JSON
  // array string in that same column (e.g. '["path1.jpg","path2.jpg"]').
  // amParsePhotoUrls() below reads it back and transparently handles BOTH
  // this new JSON-array format AND any older single-string rows already
  // logged before this change (falls back to treating the raw value as one
  // URL if JSON.parse fails or doesn't yield an array). Chosen over adding
  // a new `photo_urls jsonb` column because it needed zero migration and
  // every existing read/write path only ever touches this one column.
  const photoUrlValue=photoUrls.length?JSON.stringify(photoUrls):null;
  let row;
  try{
    const{data,error}=await db.from('amit_mobile_captures').insert({
      user_id:currentUser.id,
      transcript:message,
      summary:null, // real auto-summary is future work
      topic:null,
      photo_url:photoUrlValue,
      destination:destination
    }).select().single();
    if(error||!data){
      console.error('amit_mobile_captures insert failed',error);
      return "Amit couldn't save this message to start the conversation — check your connection and try again.";
    }
    row=data;
  }catch(e){
    console.error(e);
    return "Amit couldn't save this message to start the conversation — check your connection and try again.";
  }

  // Poll this one row for its reply. 2.5s interval, 90s cap (36 tries).
  const POLL_MS=2500, MAX_TRIES=36;
  for(let i=0;i<MAX_TRIES;i++){
    await new Promise(r=>setTimeout(r,POLL_MS));
    try{
      const{data,error}=await db.from('amit_mobile_captures').select('reply').eq('id',row.id).single();
      if(!error&&data&&data.reply){
        return data.reply;
      }
    }catch(e){ console.error('poll for reply failed',e); }
    if(pendingBubbleId){
      const el=document.getElementById(pendingBubbleId+'-text');
      if(el) el.textContent='Amit is thinking'+'.'.repeat((i%3)+1);
    }
  }
  return "Amit's desktop isn't listening right now — make sure the desktop bridge is running and your computer isn't asleep. (Your message was saved — Amit will still answer it once the bridge is back, and you can check your history later.)";
}

// Auto-play attempt on arrival, kept as a best-effort convenience — but
// per the 2026-09-06 fix below, this is no longer the only way to hear a
// reply, since iOS Safari silently blocks speechSynthesis.speak() calls
// that aren't triggered by a direct user gesture in the same call stack.
// An auto-play call like this one (fired from inside an awaited async
// chain, not from a tap) can run with zero error and still produce no
// sound at all on iPhone specifically. The visible 🔊 button added to
// every Amit bubble (see amThreadBubbleHtml()) calls amSpeak() straight
// from its own onclick — a real user gesture — which reliably works
// around that restriction. Auto-play is left in place for browsers where
// it does work (desktop Chrome, Android); the button is the honest,
// always-working fallback everywhere else.
// Loaded once per sign-in via amit_owner_contact.js (Amit root) — the same
// owner-contact row (AmitBooks' contacts table, is_owner=true) the Hub's
// About Me panel reads/writes. Voice now lives there, not the earlier
// amit_voice_prefs table (left in place, unused, per 2026-09-06 decision —
// see Hub\Sessions.md). Null means signed out or nothing saved yet;
// amSpeak() falls back honestly to this browser's own default voice/rate.
let _amOwnerContact=null;
async function amLoadVoicePref(){
  _amOwnerContact=(db&&currentUser)?await getOrCreateOwnerContact(db,currentUser.id,currentUser.email,currentUser.email):null;
}
function amPickDefaultVoice(voices){
  const enUS=voices.find(v=>/^en-US/i.test(v.lang));
  return enUS||voices.find(v=>/^en/i.test(v.lang))||voices[0]||null;
}
function amSpeak(text){
  if(!('speechSynthesis' in window))return;
  try{
    window.speechSynthesis.cancel(); // don't stack overlapping utterances
    const u=new SpeechSynthesisUtterance(text);
    const voices=window.speechSynthesis.getVoices();
    const voice=(typeof resolveVoiceFromContact==='function')?resolveVoiceFromContact(voices,_amOwnerContact,amPickDefaultVoice):null;
    if(voice) u.voice=voice;
    u.rate=(_amOwnerContact&&_amOwnerContact.voice_rate)?Number(_amOwnerContact.voice_rate):0.98;
    window.speechSynthesis.speak(u);
  }catch(e){/* non-fatal — text is already shown on screen, and the manual
                🔊 button on the bubble still works */}
}

// ── PHOTO CAPTURE (multi-photo, rebuilt 2026-09-06) ──
// Accepts several files from one picker action (Ryan's ask: "five or six
// photos... all on the same day"). Each becomes a small removable thumbnail
// in the composer strip until Send is tapped; multiple photos attach to
// ONE outgoing message together.
function amHandlePhotoMulti(evt,mode){
  const files=evt.target.files?Array.from(evt.target.files):[];
  if(!files.length)return;
  if(!amPendingPhotos[mode]) amPendingPhotos[mode]=[];
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=()=>{
      amPendingPhotos[mode].push({file,dataUrl:reader.result});
      amRenderPendingPhotoThumbs(mode);
    };
    reader.readAsDataURL(file);
  });
  evt.target.value=''; // allow picking the same file(s) again later
}

function amRenderPendingPhotoThumbs(mode){
  const host=document.getElementById('amPendingPhotos-'+mode);
  if(!host)return;
  const list=amPendingPhotos[mode]||[];
  host.innerHTML=list.map((p,i)=>`
    <div class="amcomposer-pending-thumb">
      <img src="${p.dataUrl}" onclick="amOpenPhotoOverlay('${p.dataUrl}')">
      <div class="amcomposer-remove" onclick="amRemovePendingPhoto('${mode}',${i})" title="Remove">✕</div>
    </div>`).join('');
}

function amRemovePendingPhoto(mode,idx){
  if(!amPendingPhotos[mode])return;
  amPendingPhotos[mode].splice(idx,1);
  amRenderPendingPhotoThumbs(mode);
}

function amClearPendingPhotos(mode){
  amPendingPhotos[mode]=[];
  amRenderPendingPhotoThumbs(mode);
}

// Uploads every pending photo to Supabase Storage, reusing AmitBooks'
// established pattern exactly (db.storage.from(bucket).upload(path,blob,
// {contentType})) — see AmitBooks.html's abUploadReceiptImage /
// abUploadOneScanBlob for the precedent this follows. Bucket
// 'amitmobile-captures' must be created once in the Supabase dashboard
// (Storage → New bucket) — not something this code can create for itself.
// Returns an array of stored paths (one per successfully uploaded photo;
// a failed individual upload is skipped rather than failing the whole
// message, and logged to console).
async function amUploadPendingPhotos(photos){
  if(!photos||!photos.length||!currentUser||!db)return[];
  const paths=[];
  for(const p of photos){
    try{
      const ext=(p.file.name.split('.').pop()||'jpg').toLowerCase();
      const path=`${currentUser.id}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
      const{error}=await db.storage.from('amitmobile-captures').upload(path,p.file,{contentType:p.file.type||'image/jpeg'});
      if(error){ console.error('amitmobile-captures upload failed',error); continue; }
      paths.push(path);
    }catch(e){ console.error(e); }
  }
  return paths;
}

// Parses the amit_mobile_captures.photo_url column, which can hold either
// the new JSON-array-of-paths format (this rebuild) or an older plain
// single-path string (rows logged before 2026-09-06). Never throws.
function amParsePhotoUrls(raw){
  if(!raw)return[];
  try{
    const parsed=JSON.parse(raw);
    if(Array.isArray(parsed))return parsed;
  }catch(e){/* not JSON — fall through to single-string handling */}
  return[raw];
}

// Resolves a stored Storage path to something an <img> can load. Signed
// URLs are used (not getPublicUrl) since amitmobile-captures follows the
// same private-bucket-with-RLS pattern as AmitBooks' own capture buckets —
// a signed URL works whether the bucket ends up public or private, so
// this is the safe default either way. Cached per-path for the session so
// re-rendering the thread doesn't re-request a fresh signed URL every time.
const amPhotoUrlCache={};
async function amResolvePhotoUrl(path){
  if(path.startsWith('data:')||path.startsWith('http'))return path; // local preview or already-resolved
  if(amPhotoUrlCache[path])return amPhotoUrlCache[path];
  if(!db)return null;
  try{
    const{data,error}=await db.storage.from('amitmobile-captures').createSignedUrl(path,3600);
    if(error||!data)return null;
    amPhotoUrlCache[path]=data.signedUrl;
    return data.signedUrl;
  }catch(e){ console.error(e); return null; }
}

// ══════════════════════════════════════════════
// THREAD RENDERING — day-grouped scrolling chat, built 2026-09-06.
// ══════════════════════════════════════════════

function amFormatDayHeader(iso){
  const d=new Date(iso);
  const today=new Date(); today.setHours(0,0,0,0);
  const yesterday=new Date(today); yesterday.setDate(yesterday.getDate()-1);
  const dOnly=new Date(d); dOnly.setHours(0,0,0,0);
  if(dOnly.getTime()===today.getTime())return'Today';
  if(dOnly.getTime()===yesterday.getTime())return'Yesterday';
  return d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:d.getFullYear()!==today.getFullYear()?'numeric':undefined});
}

function amDayKey(iso){
  const d=new Date(iso);
  return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate();
}

// Loads this user's real history for the given mode from
// amit_mobile_captures (ordered oldest-first) and renders it as the
// initial thread content — the thread is backed by real logged history,
// not a blank box every time the page opens.
async function amLoadThreadHistory(mode){
  const scroll=document.getElementById('amThreadScroll-'+mode);
  if(!scroll)return;
  if(!currentUser||!db){
    amThreadCache[mode]=[];
    return; // empty-state prompt already shown by amVoicePageHtml()
  }
  const destination=mode==='dailywalk'?'daily_walk':'general';
  try{
    const{data,error}=await db.from('amit_mobile_captures')
      .select('id,created_at,transcript,reply,photo_url')
      .eq('user_id',currentUser.id)
      .eq('destination',destination)
      .order('created_at',{ascending:true})
      .limit(100);
    if(error||!data){ console.error('thread history load failed',error); return; }
    if(!data.length)return; // nothing logged yet — leave the empty-state prompt showing
    amThreadCache[mode]=[];
    scroll.innerHTML='';
    data.forEach(row=>{
      const photoUrls=amParsePhotoUrls(row.photo_url);
      amAppendMessageToThread(mode,{id:'you-'+row.id,created_at:row.created_at,who:'you',transcript:row.transcript,photo_urls});
      if(row.reply){
        amAppendMessageToThread(mode,{id:'amit-'+row.id,created_at:row.created_at,who:'amit',transcript:row.reply});
      }
    });
    amScrollThreadToBottom(mode);
  }catch(e){ console.error(e); }
}

function amScrollThreadToBottom(mode){
  const scroll=document.getElementById('amThreadScroll-'+mode);
  if(scroll) scroll.scrollTop=scroll.scrollHeight;
}

// Appends one message (you or amit) to the live thread, inserting a day
// divider first if this message starts a new calendar day.
function amAppendMessageToThread(mode,msg){
  const scroll=document.getElementById('amThreadScroll-'+mode);
  if(!scroll)return;
  const emptyEl=document.getElementById('amThreadEmpty-'+mode);
  if(emptyEl) emptyEl.remove();

  const cache=amThreadCache[mode]||(amThreadCache[mode]=[]);
  const lastKey=cache.length?amDayKey(cache[cache.length-1].created_at):null;
  const thisKey=amDayKey(msg.created_at);
  cache.push(msg);

  if(thisKey!==lastKey){
    const divider=document.createElement('div');
    divider.className='amthread-daydivider';
    divider.textContent=amFormatDayHeader(msg.created_at);
    scroll.appendChild(divider);
  }
  const row=document.createElement('div');
  row.innerHTML=amThreadBubbleHtml(msg);
  scroll.appendChild(row.firstElementChild);
  amResolveBubblePhotos(msg);
  amScrollThreadToBottom(mode);
}

// Updates an already-rendered bubble in place (used when a pending "Amit
// is thinking…" bubble resolves to the real reply).
function amUpdateThreadMessage(mode,msg){
  const bubble=document.getElementById(msg.id);
  if(!bubble)return;
  const textEl=document.getElementById(msg.id+'-text');
  if(textEl) textEl.textContent=msg.transcript;
  bubble.classList.remove('amthread-pending');
  // Add the speak button now that a real reply exists (pending bubbles
  // don't get one — nothing worth speaking yet).
  const controls=bubble.querySelector('.amthread-controls');
  if(controls&&!controls.querySelector('.amthread-speak-btn')){
    const btn=document.createElement('button');
    btn.className='amthread-speak-btn';
    btn.title='Speak this reply aloud';
    btn.textContent='🔊';
    btn.onclick=()=>amSpeak(msg.transcript);
    controls.appendChild(btn);
  }
  amScrollThreadToBottom(mode);
}

function amThreadBubbleHtml(msg){
  const isYou=msg.who==='you';
  const photos=msg.photo_urls||[];
  const photosHtml=photos.length?`<div class="amthread-photos" id="${msg.id}-photos">${photos.map((p,i)=>{
    const immediate=(p.startsWith('data:')||p.startsWith('http'))?p:'';
    return `<img class="amthread-photo-thumb" src="${immediate}" data-src="${p}" id="${msg.id}-photo-${i}" onclick="amOpenPhotoOverlayResolved('${msg.id}-photo-${i}')">`;
  }).join('')}</div>`:'';
  const speakBtn=(!isYou&&!msg.pending)?`<button class="amthread-speak-btn" title="Speak this reply aloud" onclick="amSpeak(document.getElementById('${msg.id}-text').textContent)">🔊</button>`:'';
  return `<div class="amthread-row amthread-${isYou?'you':'amit'}">
    <div class="amthread-bubble${msg.pending?' amthread-pending':''}" id="${msg.id}">
      ${photosHtml}
      <div id="${msg.id}-text">${amEscapeHtml(msg.transcript)}</div>
      <div class="amthread-controls">${speakBtn}</div>
    </div>
  </div>`;
}

function amEscapeHtml(s){
  const d=document.createElement('div');
  d.textContent=s==null?'':String(s);
  return d.innerHTML;
}

// Photo thumbnails are rendered with the raw stored path first (or a local
// data: URL for a just-sent message), then swapped for a real signed URL
// once resolved — keeps the thread responsive instead of blocking render
// on a network round-trip per photo.
async function amResolveBubblePhotos(msg){
  const photos=msg.photo_urls||[];
  for(let i=0;i<photos.length;i++){
    const el=document.getElementById(msg.id+'-photo-'+i);
    if(!el)continue;
    const url=await amResolvePhotoUrl(photos[i]);
    if(url&&el) el.src=url;
  }
}

// Tap/double-tap to expand — reuses the existing canonical popup overlay
// (popupOpen/popupClose, already used elsewhere in this template) rather
// than building a second overlay mechanism.
function amOpenPhotoOverlay(dataUrl){

}
function amOpenPhotoOverlayResolved(imgElId){

// Called once per voice page after render (from wireVoicePages()) — loads

// implementation as TemplateViews.html's own goToHub — kept identical
// between both files on purpose, copy verbatim if either one changes.
const AMIT_HUB_URL='../Hub/amit-hub.html';
function goToHub(){
  if(typeof BroadcastChannel==='undefined'){ window.open(AMIT_HUB_URL,'amitHubTab'); return; }
  const ch=new BroadcastChannel('amit_hub_tabs');
  let acked=false;
  ch.onmessage=(e)=>{ if(e.data&&e.data.type==='focus-ack'){ acked=true; ch.close(); } };
  ch.postMessage({type:'focus-requested'});
  setTimeout(()=>{
    if(!acked) window.open(AMIT_HUB_URL,'amitHubTab');
    ch.close();
  },250);
}

// Navigation now flows through the Dashboard tile grid (page 1) as the
// home/menu, with the thin top bar's back arrow returning to it from any

  const title=document.getElementById('amTopTitle');
  if(n===1){
    if(backBtn)backBtn.style.display='none';
    if(logo)logo.style.display='block';
    if(title)title.textContent='Amit Mobile';
  }else{
    if(backBtn)backBtn.style.display='flex';
    if(logo)logo.style.display='none';
    if(title)title.textContent=p?p.name:'Amit Mobile';
  }
}

// ══════════════════════════════════════════════
// CANONICAL DESTINATION: POPUP — NOT a layout type. Generic overlay that
// hosts whatever layout instance (copied in from TemplateViews.html) is
// mounted inside it — content-agnostic, same as a Page or Tab slot.
// ══════════════════════════════════════════════
function popupOpen(innerHtml){
  let modal=document.getElementById('canonicalPopup');
  modal.innerHTML=`<div class="popup-card" id="canonicalPopupCard">
    <div class="popup-close-btn" onclick="popupClose()">CLOSE ✕</div>
    ${innerHtml}
  </div>`;
  modal.addEventListener('click',(e)=>{ if(e.target===modal) popupClose(); });
  modal.style.display='flex';
}
function popupClose(){
  const modal=document.getElementById('canonicalPopup');
  if(modal) modal.style.display='none';
}

// ══════════════════════════════════════════════
// LOGIN CONNECTION — the one live piece of this template. Supabase auth
// only: knows who is signed in. No data reads/writes beyond that.
// ══════════════════════════════════════════════
if(db){
  db.auth.onAuthStateChange(async (event,session)=>{
    currentUser=session?session.user:null;
    _updateSyncUI();
    _refreshAmitReadinessBanner();
    amInitThreadPages(); // reload real thread history now that sign-in state is known
    amLoadVoicePref(); // pick up whatever voice was set in the Hub's Amit Voice panel
  });
}

// ══════════════════════════════════════════════
// AMIT READINESS BANNER — REMOVED 2026-09-05, Ryan's direct correction.
// checkAmitReadiness() probes http://localhost:8710 to see if the desktop
// bridge is running — that check only makes sense ON the desktop (where
// the Hub and the bridge share the same machine's localhost). On a PHONE,
// "localhost" means the phone itself, which never has anything running on
// port 8710 — so this banner always incorrectly reported "not connected"
// and its button sent people back to the Hub, confusing a real live test.
// Amit Mobile doesn't need this at all: capture always works regardless
// of the desktop bridge, and live-reply readiness already has its own
// honest per-message fallback ("Hub isn't open") when it's actually
// relevant. Left the function as a no-op rather than deleting every call
// site, so nothing else needs touching.
// ══════════════════════════════════════════════
async function _refreshAmitReadinessBanner(){
  const box=document.getElementById('amitReadinessBanner');
  if(box)box.style.display='none';
}

// Drives the Sign In/Out + Sync top-bar icon. Same underlying meaning as
// the old right-rail item (green/active = signed in and synced), just a
// single small icon now instead of an icon+label row.
function _updateSyncUI(){
  const item=document.getElementById('rail-sync');if(!item)return;
  const icon=document.getElementById('rail-sync-icon');
  if(currentUser){
    icon.textContent='🔓';
    item.title='Signed in · '+currentUser.email+' — tap to sign out';
    item.classList.add('active');
  } else {
    icon.textContent='🔒';
    item.title='Sign In — tap to sync across devices';
    item.classList.remove('active');
  }
}

async function signOutAmit(){
  if(!db)return;
  await db.auth.signOut();
  currentUser=null;
  _updateSyncUI();
}

// Drives the Demo rail item and flips the toggle.
function toggleDemoMode(){
  demoMode=!demoMode;
  localStorage.setItem('amit_demo_mode',demoMode?'on':'off');
  _updateDemoUI();
}

function _updateDemoUI(){
  const icon=document.getElementById('rail-demo-icon');
  const item=document.getElementById('rail-demo');
  if(!item)return;
  if(demoMode){
    icon.style.opacity='1';
    item.title="Demo On — showing Amit's demo data, tap to use your own";
    item.classList.add('active');
  } else {
    icon.style.opacity='.4';
    item.title='Demo Off — showing your own data, tap to see the demo';
    item.classList.remove('active');
  }
}

async function sendMagicLink(email){
  if(!db)return'Database not available';
  const{error}=await db.auth.signInWithOtp({email});
  return error?error.message:null;
}

function openSyncModal(){
  if(currentUser){if(confirm('Signed in as '+currentUser.email+'\n\nSign out?'))signOutAmit();return;}
  const m=document.getElementById('syncModal');if(!m)return;
  m.style.display='flex';
}
function closeSyncModal(){const m=document.getElementById('syncModal');if(m)m.style.display='none';}
async function submitSyncEmail(){
  const email=document.getElementById('syncEmailInput').value.trim();if(!email)return;
  const btn=document.getElementById('syncSubmitBtn');btn.textContent='Sending…';btn.disabled=true;
  const err=await sendMagicLink(email);
  if(err){btn.textContent='Try again';btn.disabled=false;}
  else{
    document.querySelector('#syncModal .sync-modal-card').innerHTML=`
      <div style="color:rgba(201,168,76,.9);font-family:'Cinzel',serif;font-size:17px;margin-bottom:14px">Link sent</div>
      <div style="color:rgba(240,232,208,.7);font-size:13px;line-height:1.7">Check your email.<br>Click the link to sign in.</div>
      <div onclick="closeSyncModal()" style="margin-top:20px;font-size:10px;color:rgba(240,232,208,.35);cursor:pointer;letter-spacing:.08em">CLOSE</div>`;
  }
}

// ══════════════════════════════════════════════
// CLOCK / GREETING — visual only, no data behind it. Used to live in a
// wide desktop header next to the brand logo; the phone-native shell has
// no room for that there, so it now writes into the Dashboard hero
// (#amGreeting/#amDatetime, see amDashboardHtml()) instead of disappearing.
// ══════════════════════════════════════════════
const AMIT_NAME_KEY='amit_user_name';
function getUserName(){return localStorage.getItem(AMIT_NAME_KEY)||'';}

function updateClock(){
  const d=new Date();
  const h=d.getHours();
  const sal=h<12?'Good morning':h<17?'Good afternoon':'Good evening';
  const name=getUserName();
  const g=document.getElementById('amGreeting');if(g)g.textContent=name?sal+', '+name:sal;
  const dt=document.getElementById('amDatetime');
  if(dt)dt.textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})+' · '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
updateClock();
setInterval(updateClock,30000);
</script>
